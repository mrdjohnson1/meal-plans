cipe uses: 1 box or bag<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p8-20-frozen-diced-onion\"><span class=\"tx\"><span class=\"it\">Frozen diced onion<\/span><span class=\"am\">Buy: 1 bag · Recipe uses: 1 cup<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p8-20-garlic\"><span class=\"tx\"><span class=\"it\">Garlic<\/span><span class=\"am\">Buy: 1 head · Recipe uses: 2 cloves<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p8-20-low-sodium-chicken-broth\"><span class=\"tx\"><span class=\"it\">Low-sodium chicken broth<\/span><span class=\"am\">Buy: 2 cartons (32 oz) · Recipe uses: 6 cups<\/span><\/span><\/label><\/li><\/ul>\n<p><b>From the pantry:<\/b> thyme, rosemary, black pepper.<\/p>\n<h2 id=\"p8-21\">Pantry Staples (buy once)<\/h2>\n<ul class=\"check\"><li><label><input type=\"checkbox\" data-k=\"p8-21-olive-oil\"><span class=\"tx\"><span class=\"it\">Olive oil<\/span><span class=\"am\">Buy: 1 bottle · Used in: Jambalaya, spicy shrimp, soup, Spanish rice<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p8-21-nonstick-cooking-spray\"><span class=\"tx\"><span class=\"it\">Nonstick cooking spray<\/span><span class=\"am\">Buy: 1 can · Used in: Egg breakfasts, pancake, fajitas<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p8-21-salt-free-cajun-seasoning\"><span class=\"tx\"><span class=\"it\">Salt-free Cajun seasoning<\/span><span class=\"am\">Buy: 1 jar · Used in: Fajitas<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p8-21-chili-powder-and-cumin\"><span class=\"tx\"><span class=\"it\">Chili powder and cumin<\/span><span class=\"am\">Buy: 1 jar each · Used in: Chili<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p8-21-thyme-basil-sage-rosemary-tarragon\"><span class=\"tx\"><span class=\"it\">Thyme, basil, sage, rosemary, tarragon<\/span><span class=\"am\">Buy: 1 jar each · Used in: Soup, jambalaya, Spanish rice, stew, fajitas<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p8-21-coriander-ground-red-pepper-or-cayenne-g\"><span class=\"tx\"><span class=\"it\">Coriander, ground red pepper or cayenne, ground ginger, dry mustard<\/span><span class=\"am\">Buy: 1 jar each · Used in: Spicy shrimp, jambalaya, stir-fry<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p8-21-cinnamon-and-vanilla\"><span class=\"tx\"><span class=\"it\">Cinnamon and vanilla<\/span><span class=\"am\">Buy: 1 each · Used in: Pancake, overnight oats<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p8-21-bay-leaves\"><span class=\"tx\"><span class=\"it\">Bay leaves<\/span><span class=\"am\">Buy: 1 jar · Used in: Jambalaya, spicy shrimp<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p8-21-vinegar-white-or-cider-\"><span class=\"tx\"><span class=\"it\">Vinegar (white or cider)<\/span><span class=\"am\">Buy: 1 bottle · Used in: Spicy shrimp<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p8-21-black-pepper\"><span class=\"tx\"><span class=\"it\">Black pepper<\/span><span class=\"am\">Buy: 1 jar · Used in: Most recipes<\/span><\/span><\/label><\/li><\/ul>\n<p><b>Left off this list from your packet:<\/b> fat-free cheese singles, fat-free mayo, Smart Balance, soup mix packets, bouillon, lean turkey sausage, imitation crab, fat-free dressings, butter-flavored sprinkles and Nesquick. See \"Left Out and Why\" in the meal plan.<\/p>", "heads": [{"id": "p8-1", "t": "How to Use This List", "l": 2}, {"id": "p8-2", "t": "Breakfasts", "l": 2}, {"id": "p8-3", "t": "Egg Whites with Potato and Salsa", "l": 3}, {"id": "p8-4", "t": "Egg White Breakfast Tacos", "l": 3}, {"id": "p8-5", "t": "Spinach Marinara Eggs with Toast", "l": 3}, {"id": "p8-6", "t": "Banana Oat Protein Pancake", "l": 3}, {"id": "p8-7", "t": "Overnight Yogurt Oats and Raisins", "l": 3}, {"id": "p8-8", "t": "Lunches", "l": 2}, {"id": "p8-9", "t": "Salmon or Tuna Salad Sandwich", "l": 3}, {"id": "p8-10", "t": "Walnut Chicken Salad", "l": 3}, {"id": "p8-11", "t": "Dinners", "l": 2}, {"id": "p8-12", "t": "Chicken and Portobello Fajitas", "l": 3}, {"id": "p8-13", "t": "Shrimp Jambalaya", "l": 3}, {"id": "p8-14", "t": "Ginger Scallop Stir-Fry", "l": 3}, {"id": "p8-15", "t": "Spicy Shrimp and Green Beans", "l": 3}, {"id": "p8-16", "t": "Beef and Bean Chili", "l": 3}, {"id": "p8-17", "t": "Chicken Vegetable Soup", "l": 3}, {"id": "p8-18", "t": "Spanish Rice Skillet", "l": 3}, {"id": "p8-19", "t": "Crockpot", "l": 2}, {"id": "p8-20", "t": "Chicken and Brown Rice Stew (5 portions)", "l": 3}, {"id": "p8-21", "t": "Pantry Staples (buy once)", "l": 2}]}, {"id": "p9", "kicker": "Plan 5 · Meal Plan", "title": "40-40-20 Burritos: Cooked and No-Cook", "sub": "Fish, chicken, beef and lamb · quick and easy · about 700 calories each · 13 to 21 g fiber · key nutrients · November 19, 2026", "kind": "plan", "html": "<h2 id=\"p9-1\">How It Works<\/h2>\n<p>Every burrito follows the same formula: a whole wheat tortilla, a lean protein, beans, vegetables, salsa or tomatoes, a Greek yogurt sauce and a little avocado. Each one is a full meal of about 700 calories with roughly 40% protein, 40% carbs and 20 to 24% fat.<\/p>\n<ul><li><b>No-cook versions<\/b> take about 5 minutes and use pouches or leftovers from your crockpot.<\/li><li><b>Cooked versions<\/b> take 15 to 20 minutes in one skillet. Meat is cooked whole and sliced or shredded after.<\/li><li><b>The tortilla matters.<\/b> Brands vary a lot. Pick a large (10-inch) whole wheat tortilla with about 200 calories, 35 g carbs and at least 4 g fiber, and check the sodium.<\/li><li><b>Low sodium:<\/b> use no-salt-added beans, the lowest-sodium salsa you can find, 25% less sodium chicken pouches and salt-free seasonings.<\/li><li><b>No pork<\/b> in any recipe.<\/li><li><b>Numbers<\/b> are estimates from pouch labels and standard USDA values.<\/li><\/ul>\n<h2 id=\"p9-2\">Burritos at a Glance<\/h2>\n<div class=\"scroll\"><table class=\"\"><thead><tr><th>Protein<\/th><th>Version<\/th><th>Cal<\/th><th>Protein (g)<\/th><th>Carbs (g)<\/th><th>Fat (g)<\/th><th>Fiber (g)<\/th><th>Time<\/th><\/tr><\/thead><tbody><tr><td>Fish<\/td><td>No-cook: Salmon and Black Bean<\/td><td class=n>698<\/td><td class=n>68<\/td><td class=n>74<\/td><td class=n>16<\/td><td class=n>21<\/td><td>5 min<\/td><\/tr><tr><td>Fish<\/td><td>Cooked: Baja Salmon with Mango Slaw<\/td><td class=n>708<\/td><td class=n>67<\/td><td class=n>68<\/td><td class=n>18<\/td><td class=n>16<\/td><td>15 min<\/td><\/tr><tr><td>Chicken<\/td><td>No-cook: Southwest Chicken<\/td><td class=n>736<\/td><td class=n>72<\/td><td class=n>68<\/td><td class=n>18<\/td><td class=n>15<\/td><td>5 min<\/td><\/tr><tr><td>Chicken<\/td><td>Cooked: Chicken Thigh Fajita<\/td><td class=n>759<\/td><td class=n>70<\/td><td class=n>73<\/td><td class=n>20<\/td><td class=n>16<\/td><td>20 min<\/td><\/tr><tr><td>Beef<\/td><td>No-cook: Shredded Beef and Black Bean<\/td><td class=n>713<\/td><td class=n>70<\/td><td class=n>65<\/td><td class=n>19<\/td><td class=n>16<\/td><td>5 min<\/td><\/tr><tr><td>Beef<\/td><td>Cooked: Tex-Mex Ground Beef<\/td><td class=n>723<\/td><td class=n>70<\/td><td class=n>69<\/td><td class=n>17<\/td><td class=n>16<\/td><td>15 min<\/td><\/tr><tr><td>Lamb<\/td><td>No-cook: Greek Lamb and Chickpea<\/td><td class=n>735<\/td><td class=n>71<\/td><td class=n>66<\/td><td class=n>20<\/td><td class=n>13<\/td><td>5 min<\/td><\/tr><tr><td>Lamb<\/td><td>Cooked: Seared Lamb Gyro<\/td><td class=n>747<\/td><td class=n>71<\/td><td class=n>69<\/td><td class=n>20<\/td><td class=n>13<\/td><td>15 min<\/td><\/tr><\/tbody><\/table><\/div>\n<h2 id=\"p9-3\">Sauces<\/h2>\n<p>Each sauce uses Greek yogurt as its base, which adds protein without much fat.<\/p>\n<table class=\"stack\"><thead><tr><th>Sauce<\/th><th>Mix<\/th><th>Used in<\/th><\/tr><\/thead><tbody><tr><td>Chipotle-lime crema<\/td><td>Nonfat plain Greek yogurt, lime juice, chipotle powder, pinch of cumin<\/td><td>Salmon and black bean, Southwest chicken, Tex-Mex beef<\/td><\/tr><tr><td>Lime crema<\/td><td>Nonfat plain Greek yogurt, lime juice and zest, pinch of chili powder<\/td><td>Baja salmon<\/td><\/tr><tr><td>Taco crema<\/td><td>Nonfat plain Greek yogurt, salt-free taco seasoning, lime juice<\/td><td>Chicken thigh fajita, shredded beef<\/td><\/tr><tr><td>Tzatziki<\/td><td>Nonfat plain Greek yogurt, lemon juice, garlic, dried dill, a little grated cucumber<\/td><td>Both lamb burritos<\/td><\/tr><\/tbody><\/table>\n<h2 id=\"p9-4\">How to Roll a Burrito That Holds<\/h2>\n<ol><li>Warm the tortilla for 10 to 15 seconds in the microwave or a dry skillet so it does not crack.<\/li><li>Lay the greens down first. They keep the tortilla from getting soggy.<\/li><li>Pile the filling in a line across the lower third, leaving 2 inches at each side.<\/li><li>Fold the sides in, fold the bottom edge over the filling, and roll tightly.<\/li><li>Wrap it in foil for the road. Keep no-cook burritos cold and eat them within 1 day.<\/li><\/ol>\n<h2 id=\"p9-5\">Fish<\/h2>\n<h3 id=\"p9-6\">No-Cook: Salmon and Black Bean Burrito<\/h3>\n<div class=\"macro\">698 calories · 68 g protein · 74 g carbs · 16 g fat · 21 g fiber · about 0.9 g EPA and DHA<\/div>\n<p><b>Nutrient highlights:<\/b> omega-3 EPA and DHA (salmon), folate (beans, spinach, avocado), vitamin C (red pepper), selenium (salmon, whole wheat)<\/p>\n<ul><li>1 large whole wheat tortilla<\/li><li>3 pouches (2.6 oz) pink salmon in water<\/li><li>1/2 cup no-salt-added black beans, rinsed<\/li><li>1 cup baby spinach and 1/2 cup sliced red bell pepper<\/li><li>1/4 cup salsa<\/li><li>1/4 cup chipotle-lime crema<\/li><li>1/4 avocado, sliced<\/li><\/ul>\n<ol><li>Flake the salmon and toss it with the beans, salsa and a squeeze of lime.<\/li><li>Layer spinach, salmon mix, pepper and avocado on the tortilla. Top with crema and roll.<\/li><\/ol>\n<h3 id=\"p9-7\">Cooked: Baja Salmon Burrito with Mango Slaw<\/h3>\n<div class=\"macro\">708 calories · 67 g protein · 68 g carbs · 18 g fat · 16 g fiber · about 2 g EPA and DHA<\/div>\n<p><b>Nutrient highlights:<\/b> the most omega-3s of any burrito; vitamin C (mango, slaw); selenium (salmon); folate (beans)<\/p>\n<ul><li>1 large whole wheat tortilla<\/li><li>8 to 9 oz raw skinless salmon fillet (wild coho or sockeye is leanest), about 7 oz cooked<\/li><li>Salt-free chili-lime or Cajun seasoning<\/li><li>1/2 cup no-salt-added black beans, rinsed<\/li><li>1/2 cup coleslaw mix and 1/4 cup diced mango (fresh or thawed frozen)<\/li><li>1/4 cup lime crema<\/li><li>1/8 avocado<\/li><\/ul>\n<ol><li>Season the salmon. Cook it in a nonstick skillet with cooking spray over medium-high heat, 3 to 4 minutes per side, until it flakes. Flake with a fork.<\/li><li>Toss the slaw and mango with a squeeze of lime.<\/li><li>Fill the tortilla with beans, salmon, slaw and avocado. Top with crema and roll.<\/li><\/ol>\n<h2 id=\"p9-8\">Chicken<\/h2>\n<h3 id=\"p9-9\">No-Cook: Southwest Chicken Burrito<\/h3>\n<div class=\"macro\">736 calories · 72 g protein · 68 g carbs · 18 g fat · 15 g fiber<\/div>\n<p><b>Nutrient highlights:<\/b> folate (pinto beans, spinach, avocado), vitamin C (red pepper), selenium (chicken)<\/p>\n<ul><li>1 large whole wheat tortilla<\/li><li>4 pouches (2.6 oz) white chicken, 25% less sodium<\/li><li>1/3 cup no-salt-added pinto beans, rinsed<\/li><li>1 cup baby spinach and 1/2 cup sliced red bell pepper<\/li><li>1/4 cup salsa<\/li><li>1/4 cup chipotle-lime crema<\/li><li>1/8 avocado<\/li><\/ul>\n<ol><li>Toss the chicken with the beans, half the salsa and a pinch of cumin.<\/li><li>Layer spinach, chicken mix, pepper and avocado on the tortilla. Top with crema and the rest of the salsa, then roll.<\/li><\/ol>\n<h3 id=\"p9-10\">Cooked: Chicken Thigh Fajita Burrito<\/h3>\n<div class=\"macro\">759 calories · 70 g protein · 73 g carbs · 20 g fat · 16 g fiber<\/div>\n<p><b>Nutrient highlights:<\/b> zinc and selenium (chicken thighs), vitamin C (peppers), folate (pinto beans)<\/p>\n<ul><li>1 large whole wheat tortilla<\/li><li>8 oz raw boneless skinless chicken thighs, left whole (about 6 oz cooked)<\/li><li>Salt-free fajita or taco seasoning<\/li><li>1/2 cup no-salt-added pinto beans, rinsed<\/li><li>1/2 cup sliced bell pepper and 1/4 cup sliced onion<\/li><li>1/4 cup salsa<\/li><li>1/2 cup taco crema<\/li><\/ul>\n<ol><li>Season the thighs and cook them whole in a nonstick skillet with cooking spray over medium heat, 5 to 6 minutes per side, until they reach 165°F. Rest 2 minutes, then slice.<\/li><li>Cook the pepper and onion in the same pan for 3 to 4 minutes.<\/li><li>Fill the tortilla with beans, chicken, peppers and onions, salsa and crema, then roll.<\/li><\/ol>\n<p><b>Lighter option:<\/b> Use 5 oz cooked thighs to bring it to about 710 calories.<\/p>\n<h2 id=\"p9-11\">Beef<\/h2>\n<h3 id=\"p9-12\">No-Cook: Shredded Beef and Black Bean Burrito<\/h3>\n<div class=\"macro\">713 calories · 70 g protein · 65 g carbs · 19 g fat · 16 g fiber<\/div>\n<p><b>Nutrient highlights:<\/b> zinc (beef, the best source here), selenium (beef, whole wheat), folate (beans, spinach)<\/p>\n<ul><li>1 large whole wheat tortilla<\/li><li>5 1/2 oz shredded beef from your crockpot pot roast (bottom round), cold or warmed<\/li><li>1/2 cup no-salt-added black beans, rinsed<\/li><li>1 cup baby spinach<\/li><li>1/4 cup salsa<\/li><li>1/4 cup taco crema<\/li><li>1/8 avocado<\/li><\/ul>\n<ol><li>Toss the beef and beans with the salsa.<\/li><li>Layer spinach, beef mix and avocado on the tortilla. Top with crema and roll.<\/li><\/ol>\n<p><b>Tip:<\/b> Set aside one pot roast portion after a cook day for 2 of these burritos (save the potatoes for another meal).<\/p>\n<h3 id=\"p9-13\">Cooked: Tex-Mex Ground Beef Burrito<\/h3>\n<div class=\"macro\">723 calories · 70 g protein · 69 g carbs · 17 g fat · 16 g fiber<\/div>\n<p><b>Nutrient highlights:<\/b> zinc (beef), selenium (beef), vitamin C (peppers), folate (beans), lycopene (salsa)<\/p>\n<ul><li>1 large whole wheat tortilla<\/li><li>8 oz raw 95% lean ground beef<\/li><li>1 tsp chili powder, 1/2 tsp cumin, 1/2 tsp garlic powder<\/li><li>1/2 cup no-salt-added black beans, rinsed<\/li><li>1/4 cup diced onion and 1/2 cup diced red bell pepper<\/li><li>1/4 cup salsa<\/li><li>1/4 cup chipotle-lime crema<\/li><\/ul>\n<ol><li>Brown the beef with the onion and pepper over medium-high heat for 6 to 8 minutes, breaking it up.<\/li><li>Stir in the spices, beans and salsa and heat 2 minutes.<\/li><li>Fill the tortilla, top with crema and roll.<\/li><\/ol>\n<p><b>Batch it:<\/b> Cook 2 lb of beef with 4 times the vegetables and spices, and portion into 4 containers.<\/p>\n<h2 id=\"p9-14\">Lamb<\/h2>\n<h3 id=\"p9-15\">No-Cook: Greek Lamb and Chickpea Burrito<\/h3>\n<div class=\"macro\">735 calories · 71 g protein · 66 g carbs · 20 g fat · 13 g fiber<\/div>\n<p><b>Nutrient highlights:<\/b> zinc (lamb), lycopene (cherry tomatoes), folate (chickpeas, spinach)<\/p>\n<ul><li>1 large whole wheat tortilla<\/li><li>5 1/2 oz shredded lamb from your crockpot Moroccan lamb (meat only), cold or warmed<\/li><li>1/2 cup no-salt-added chickpeas, rinsed<\/li><li>1 cup baby spinach<\/li><li>1/4 cup diced cucumber and 1/2 cup halved cherry tomatoes<\/li><li>1/2 cup tzatziki<\/li><li>Dried oregano and a squeeze of lemon<\/li><\/ul>\n<ol><li>Toss the lamb with the chickpeas, oregano and lemon.<\/li><li>Layer spinach, lamb mix, cucumber and tomatoes on the tortilla. Top with tzatziki and roll.<\/li><\/ol>\n<h3 id=\"p9-16\">Cooked: Seared Lamb Gyro Burrito<\/h3>\n<div class=\"macro\">747 calories · 71 g protein · 69 g carbs · 20 g fat · 13 g fiber<\/div>\n<p><b>Nutrient highlights:<\/b> zinc (lamb), lycopene (tomatoes), folate (chickpeas, spinach)<\/p>\n<ul><li>1 large whole wheat tortilla<\/li><li>7 to 8 oz raw boneless leg of lamb steak, trimmed (about 5 1/2 oz cooked)<\/li><li>Garlic, oregano, cumin and black pepper<\/li><li>1/2 cup no-salt-added chickpeas, rinsed<\/li><li>1 cup baby spinach, 1/4 cup diced cucumber, 1/2 cup cherry tomatoes, 1/4 cup sliced red onion<\/li><li>1/2 cup tzatziki<\/li><\/ul>\n<ol><li>Season the lamb and sear it whole in a hot nonstick skillet with cooking spray, 3 to 4 minutes per side for medium. Rest 5 minutes, then slice thin.<\/li><li>Warm the chickpeas in the same pan for 1 minute.<\/li><li>Fill the tortilla with spinach, lamb, chickpeas and vegetables. Top with tzatziki and roll.<\/li><\/ol>\n<p><b>Swap:<\/b> Lean beef sirloin steak works the same way.<\/p>\n<h2 id=\"p9-17\">Make-Ahead and Food Safety<\/h2>\n<ul><li><b>Cooked fillings<\/b> (beef, chicken, salmon, lamb) keep 3 to 4 days in the fridge. Store them apart from the greens, avocado and sauce, and roll the burrito when you eat it.<\/li><li><b>Freezer burritos:<\/b> the beef and chicken fillings with beans freeze well rolled in a tortilla without the spinach, avocado or yogurt. Wrap in foil, freeze up to 2 months, and microwave unwrapped from frozen for 2 to 3 minutes, turning once.<\/li><li><b>On the road:<\/b> pack tortillas, pouches, beans and spices from home. Buy yogurt cups, guacamole cups and fresh vegetables as you go. Keep built burritos at 40°F or below.<\/li><li><b>Pouches:<\/b> never microwave them in the pouch.<\/li><\/ul>\n<h2 id=\"p9-18\">Key Nutrients<\/h2>\n<table class=\"stack\"><thead><tr><th>Nutrient<\/th><th>Best burritos for it<\/th><th>Notes<\/th><\/tr><\/thead><tbody><tr><td>Zinc (11 mg a day)<\/td><td>Beef and lamb<\/td><td>Beef and lamb are the richest zinc sources in your plans<\/td><\/tr><tr><td>Selenium (55 mcg a day)<\/td><td>Salmon, beef, chicken<\/td><td>Whole wheat tortillas add more; no need for Brazil nuts or supplements<\/td><\/tr><tr><td>Folate (400 mcg a day)<\/td><td>All, from beans, spinach and avocado<\/td><td>Chickpeas, pinto and black beans are all strong sources<\/td><\/tr><tr><td>Vitamin C (90 mg a day)<\/td><td>Red pepper and mango versions<\/td><td>1/2 cup red bell pepper covers most of a day<\/td><\/tr><tr><td>Vitamin E (15 mg a day)<\/td><td>Avocado and spinach versions<\/td><td>Add 1 tbsp sunflower seeds inside for about 2.3 mg more (adds about 50 calories)<\/td><\/tr><tr><td>Lycopene<\/td><td>Lamb (cherry tomatoes), any with salsa<\/td><td>Add 1/4 cup more salsa or tomatoes to any burrito<\/td><\/tr><tr><td>Omega-3 EPA and DHA<\/td><td>Both salmon burritos<\/td><td>Count either one as a fish meal; aim for 2 a week<\/td><\/tr><tr><td>Omega-3 ALA (1.6 g a day)<\/td><td>Not a strong source<\/td><td>Keep chia or flaxseed at breakfast<\/td><\/tr><tr><td>L-arginine and amino acids<\/td><td>All<\/td><td>67 to 72 g complete protein per burrito<\/td><\/tr><\/tbody><\/table>\n<p><b>Supplement notes:<\/b> talk with your doctor before adding fish oil, vitamin E, zinc, selenium or L-arginine supplements. Keep total zinc under 40 mg and selenium under 400 mcg a day.<\/p>\n<h2 id=\"p9-19\">Sources<\/h2>\n<ul><li>Pink salmon pouch nutrition and EPA and DHA: <a href=\"https://starkist.com/?p=9738\" target=\"_blank\" rel=\"noopener\">StarKist<\/a><\/li><li>Chicken pouch nutrition, 25% less sodium: <a href=\"https://business.albertsons.com/shop/product-details.970071215.html\" target=\"_blank\" rel=\"noopener\">Albertsons<\/a><\/li><li>Nutrient targets and upper limits: NIH Office of Dietary Supplements fact sheets for <a href=\"https://ods.od.nih.gov/factsheets/Zinc-HealthProfessional/\" target=\"_blank\" rel=\"noopener\">zinc<\/a> and <a href=\"https://ods.od.nih.gov/factsheets/Selenium-HealthProfessional/\" target=\"_blank\" rel=\"noopener\">selenium<\/a><\/li><li>Salmon fillet, chicken thighs, beef, lamb, beans, vegetables and yogurt: standard USDA values<\/li><\/ul>", "heads": [{"id": "p9-1", "t": "How It Works", "l": 2}, {"id": "p9-2", "t": "Burritos at a Glance", "l": 2}, {"id": "p9-3", "t": "Sauces", "l": 2}, {"id": "p9-4", "t": "How to Roll a Burrito That Holds", "l": 2}, {"id": "p9-5", "t": "Fish", "l": 2}, {"id": "p9-6", "t": "No-Cook: Salmon and Black Bean Burrito", "l": 3}, {"id": "p9-7", "t": "Cooked: Baja Salmon Burrito with Mango Slaw", "l": 3}, {"id": "p9-8", "t": "Chicken", "l": 2}, {"id": "p9-9", "t": "No-Cook: Southwest Chicken Burrito", "l": 3}, {"id": "p9-10", "t": "Cooked: Chicken Thigh Fajita Burrito", "l": 3}, {"id": "p9-11", "t": "Beef", "l": 2}, {"id": "p9-12", "t": "No-Cook: Shredded Beef and Black Bean Burrito", "l": 3}, {"id": "p9-13", "t": "Cooked: Tex-Mex Ground Beef Burrito", "l": 3}, {"id": "p9-14", "t": "Lamb", "l": 2}, {"id": "p9-15", "t": "No-Cook: Greek Lamb and Chickpea Burrito", "l": 3}, {"id": "p9-16", "t": "Cooked: Seared Lamb Gyro Burrito", "l": 3}, {"id": "p9-17", "t": "Make-Ahead and Food Safety", "l": 2}, {"id": "p9-18", "t": "Key Nutrients", "l": 2}, {"id": "p9-19", "t": "Sources", "l": 2}]}, {"id": "p10", "kicker": "Plan 5 · Grocery List", "title": "40-40-20 Burritos Grocery List", "sub": "One list per burrito · 1 burrito each · November 20, 2026", "kind": "grocery", "html": "<h2 id=\"p10-1\">How to Use This List<\/h2>\n<ul><li><b>Shop by meal.<\/b> Each burrito has its own complete list, sauce included. Making more than one? Multiply the \"Recipe uses\" amounts.<\/li><li><b>\"Buy\" is the package size. \"Recipe uses\" is how much goes in one burrito.<\/b> Opened tortillas, cans, yogurt and salsa carry over to the next burrito.<\/li><li><b>The no-cook beef and lamb burritos use crockpot leftovers<\/b> from the Crockpot Meal Plan. If you have none, use the cooked beef or lamb version instead.<\/li><li><b>Spices and cooking spray<\/b> are in Pantry Staples at the end.<\/li><\/ul>\n<h2 id=\"p10-2\">Fish<\/h2>\n<h3 id=\"p10-3\">No-Cook Salmon and Black Bean Burrito<\/h3>\n<ul class=\"check\"><li><label><input type=\"checkbox\" data-k=\"p10-3-large-10-inch-whole-wheat-tortillas\"><span class=\"tx\"><span class=\"it\">Large (10-inch) whole wheat tortillas<\/span><span class=\"am\">Buy: 1 pack · Recipe uses: 1<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p10-3-pink-salmon-in-water-pouches-2-6-oz-\"><span class=\"tx\"><span class=\"it\">Pink salmon in water, pouches (2.6 oz)<\/span><span class=\"am\">Buy: 3 pouches · Recipe uses: 3 pouches<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p10-3-no-salt-added-black-beans\"><span class=\"tx\"><span class=\"it\">No-salt-added black beans<\/span><span class=\"am\">Buy: 1 can (15 oz) · Recipe uses: 1/2 cup<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p10-3-baby-spinach\"><span class=\"tx\"><span class=\"it\">Baby spinach<\/span><span class=\"am\">Buy: 1 bag (5 oz) · Recipe uses: 1 cup<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p10-3-red-bell-pepper\"><span class=\"tx\"><span class=\"it\">Red bell pepper<\/span><span class=\"am\">Buy: 1 · Recipe uses: 1/2 cup sliced<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p10-3-salsa-lowest-sodium\"><span class=\"tx\"><span class=\"it\">Salsa, lowest sodium<\/span><span class=\"am\">Buy: 1 jar (16 oz) · Recipe uses: 1/4 cup<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p10-3-nonfat-plain-greek-yogurt\"><span class=\"tx\"><span class=\"it\">Nonfat plain Greek yogurt<\/span><span class=\"am\">Buy: 1 tub (32 oz) · Recipe uses: 1/4 cup, for chipotle-lime crema<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p10-3-lime\"><span class=\"tx\"><span class=\"it\">Lime<\/span><span class=\"am\">Buy: 1 · Recipe uses: Juice for crema and salmon<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p10-3-avocado\"><span class=\"tx\"><span class=\"it\">Avocado<\/span><span class=\"am\">Buy: 1 · Recipe uses: 1/4<\/span><\/span><\/label><\/li><\/ul>\n<p><b>From the pantry:<\/b> chipotle powder, cumin.<\/p>\n<h3 id=\"p10-4\">Cooked Baja Salmon Burrito with Mango Slaw<\/h3>\n<ul class=\"check\"><li><label><input type=\"checkbox\" data-k=\"p10-4-large-10-inch-whole-wheat-tortillas\"><span class=\"tx\"><span class=\"it\">Large (10-inch) whole wheat tortillas<\/span><span class=\"am\">Buy: 1 pack · Recipe uses: 1<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p10-4-skinless-salmon-fillet-wild-coho-or-sock\"><span class=\"tx\"><span class=\"it\">Skinless salmon fillet, wild coho or sockeye<\/span><span class=\"am\">Buy: 8 to 9 oz · Recipe uses: 8 to 9 oz raw<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p10-4-no-salt-added-black-beans\"><span class=\"tx\"><span class=\"it\">No-salt-added black beans<\/span><span class=\"am\">Buy: 1 can (15 oz) · Recipe uses: 1/2 cup<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p10-4-coleslaw-mix\"><span class=\"tx\"><span class=\"it\">Coleslaw mix<\/span><span class=\"am\">Buy: 1 small bag · Recipe uses: 1/2 cup<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p10-4-mango-fresh-or-frozen-chunks-\"><span class=\"tx\"><span class=\"it\">Mango (fresh or frozen chunks)<\/span><span class=\"am\">Buy: 1 mango or 1 bag · Recipe uses: 1/4 cup diced<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p10-4-nonfat-plain-greek-yogurt\"><span class=\"tx\"><span class=\"it\">Nonfat plain Greek yogurt<\/span><span class=\"am\">Buy: 1 tub (32 oz) · Recipe uses: 1/4 cup, for lime crema<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p10-4-lime\"><span class=\"tx\"><span class=\"it\">Lime<\/span><span class=\"am\">Buy: 1 · Recipe uses: Juice and zest for crema and slaw<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p10-4-avocado\"><span class=\"tx\"><span class=\"it\">Avocado<\/span><span class=\"am\">Buy: 1 · Recipe uses: 1/8<\/span><\/span><\/label><\/li><\/ul>\n<p><b>From the pantry:<\/b> salt-free chili-lime or Cajun seasoning, chili powder, cooking spray.<\/p>\n<h2 id=\"p10-5\">Chicken<\/h2>\n<h3 id=\"p10-6\">No-Cook Southwest Chicken Burrito<\/h3>\n<ul class=\"check\"><li><label><input type=\"checkbox\" data-k=\"p10-6-large-10-inch-whole-wheat-tortillas\"><span class=\"tx\"><span class=\"it\">Large (10-inch) whole wheat tortillas<\/span><span class=\"am\">Buy: 1 pack · Recipe uses: 1<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p10-6-white-chicken-pouches-2-6-oz-25-less-sod\"><span class=\"tx\"><span class=\"it\">White chicken pouches (2.6 oz), 25% less sodium<\/span><span class=\"am\">Buy: 4 pouches · Recipe uses: 4 pouches<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p10-6-no-salt-added-pinto-beans\"><span class=\"tx\"><span class=\"it\">No-salt-added pinto beans<\/span><span class=\"am\">Buy: 1 can (15 oz) · Recipe uses: 1/3 cup<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p10-6-baby-spinach\"><span class=\"tx\"><span class=\"it\">Baby spinach<\/span><span class=\"am\">Buy: 1 bag (5 oz) · Recipe uses: 1 cup<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p10-6-red-bell-pepper\"><span class=\"tx\"><span class=\"it\">Red bell pepper<\/span><span class=\"am\">Buy: 1 · Recipe uses: 1/2 cup sliced<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p10-6-salsa-lowest-sodium\"><span class=\"tx\"><span class=\"it\">Salsa, lowest sodium<\/span><span class=\"am\">Buy: 1 jar (16 oz) · Recipe uses: 1/4 cup<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p10-6-nonfat-plain-greek-yogurt\"><span class=\"tx\"><span class=\"it\">Nonfat plain Greek yogurt<\/span><span class=\"am\">Buy: 1 tub (32 oz) · Recipe uses: 1/4 cup, for chipotle-lime crema<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p10-6-lime\"><span class=\"tx\"><span class=\"it\">Lime<\/span><span class=\"am\">Buy: 1 · Recipe uses: Juice for crema<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p10-6-avocado\"><span class=\"tx\"><span class=\"it\">Avocado<\/span><span class=\"am\">Buy: 1 · Recipe uses: 1/8<\/span><\/span><\/label><\/li><\/ul>\n<p><b>From the pantry:<\/b> chipotle powder, cumin.<\/p>\n<h3 id=\"p10-7\">Cooked Chicken Thigh Fajita Burrito<\/h3>\n<ul class=\"check\"><li><label><input type=\"checkbox\" data-k=\"p10-7-large-10-inch-whole-wheat-tortillas\"><span class=\"tx\"><span class=\"it\">Large (10-inch) whole wheat tortillas<\/span><span class=\"am\">Buy: 1 pack · Recipe uses: 1<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p10-7-boneless-skinless-chicken-thighs\"><span class=\"tx\"><span class=\"it\">Boneless skinless chicken thighs<\/span><span class=\"am\">Buy: 1 pack · Recipe uses: 8 oz raw (5 oz cooked for the lighter option)<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p10-7-no-salt-added-pinto-beans\"><span class=\"tx\"><span class=\"it\">No-salt-added pinto beans<\/span><span class=\"am\">Buy: 1 can (15 oz) · Recipe uses: 1/2 cup<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p10-7-bell-pepper\"><span class=\"tx\"><span class=\"it\">Bell pepper<\/span><span class=\"am\">Buy: 1 · Recipe uses: 1/2 cup sliced<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p10-7-onion\"><span class=\"tx\"><span class=\"it\">Onion<\/span><span class=\"am\">Buy: 1 · Recipe uses: 1/4 cup sliced<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p10-7-salsa-lowest-sodium\"><span class=\"tx\"><span class=\"it\">Salsa, lowest sodium<\/span><span class=\"am\">Buy: 1 jar (16 oz) · Recipe uses: 1/4 cup<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p10-7-nonfat-plain-greek-yogurt\"><span class=\"tx\"><span class=\"it\">Nonfat plain Greek yogurt<\/span><span class=\"am\">Buy: 1 tub (32 oz) · Recipe uses: 1/2 cup, for taco crema<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p10-7-lime\"><span class=\"tx\"><span class=\"it\">Lime<\/span><span class=\"am\">Buy: 1 · Recipe uses: Juice for crema<\/span><\/span><\/label><\/li><\/ul>\n<p><b>From the pantry:<\/b> salt-free fajita or taco seasoning, cooking spray.<\/p>\n<h2 id=\"p10-8\">Beef<\/h2>\n<h3 id=\"p10-9\">No-Cook Shredded Beef and Black Bean Burrito<\/h3>\n<ul class=\"check\"><li><label><input type=\"checkbox\" data-k=\"p10-9-large-10-inch-whole-wheat-tortillas\"><span class=\"tx\"><span class=\"it\">Large (10-inch) whole wheat tortillas<\/span><span class=\"am\">Buy: 1 pack · Recipe uses: 1<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p10-9-shredded-beef-from-the-crockpot-pot-roas\"><span class=\"tx\"><span class=\"it\">Shredded beef from the crockpot pot roast<\/span><span class=\"am\">Buy: Leftover (no purchase) · Recipe uses: 5 1/2 oz<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p10-9-no-salt-added-black-beans\"><span class=\"tx\"><span class=\"it\">No-salt-added black beans<\/span><span class=\"am\">Buy: 1 can (15 oz) · Recipe uses: 1/2 cup<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p10-9-baby-spinach\"><span class=\"tx\"><span class=\"it\">Baby spinach<\/span><span class=\"am\">Buy: 1 bag (5 oz) · Recipe uses: 1 cup<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p10-9-salsa-lowest-sodium\"><span class=\"tx\"><span class=\"it\">Salsa, lowest sodium<\/span><span class=\"am\">Buy: 1 jar (16 oz) · Recipe uses: 1/4 cup<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p10-9-nonfat-plain-greek-yogurt\"><span class=\"tx\"><span class=\"it\">Nonfat plain Greek yogurt<\/span><span class=\"am\">Buy: 1 tub (32 oz) · Recipe uses: 1/4 cup, for taco crema<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p10-9-lime\"><span class=\"tx\"><span class=\"it\">Lime<\/span><span class=\"am\">Buy: 1 · Recipe uses: Juice for crema<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p10-9-avocado\"><span class=\"tx\"><span class=\"it\">Avocado<\/span><span class=\"am\">Buy: 1 · Recipe uses: 1/8<\/span><\/span><\/label><\/li><\/ul>\n<p><b>From the pantry:<\/b> salt-free taco seasoning.<\/p>\n<h3 id=\"p10-10\">Cooked Tex-Mex Ground Beef Burrito<\/h3>\n<ul class=\"check\"><li><label><input type=\"checkbox\" data-k=\"p10-10-large-10-inch-whole-wheat-tortillas\"><span class=\"tx\"><span class=\"it\">Large (10-inch) whole wheat tortillas<\/span><span class=\"am\">Buy: 1 pack · Recipe uses: 1<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p10-10-95-lean-ground-beef\"><span class=\"tx\"><span class=\"it\">95% lean ground beef<\/span><span class=\"am\">Buy: 1 lb · Recipe uses: 8 oz raw<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p10-10-no-salt-added-black-beans\"><span class=\"tx\"><span class=\"it\">No-salt-added black beans<\/span><span class=\"am\">Buy: 1 can (15 oz) · Recipe uses: 1/2 cup<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p10-10-onion\"><span class=\"tx\"><span class=\"it\">Onion<\/span><span class=\"am\">Buy: 1 · Recipe uses: 1/4 cup diced<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p10-10-red-bell-pepper\"><span class=\"tx\"><span class=\"it\">Red bell pepper<\/span><span class=\"am\">Buy: 1 · Recipe uses: 1/2 cup diced<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p10-10-salsa-lowest-sodium\"><span class=\"tx\"><span class=\"it\">Salsa, lowest sodium<\/span><span class=\"am\">Buy: 1 jar (16 oz) · Recipe uses: 1/4 cup<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p10-10-nonfat-plain-greek-yogurt\"><span class=\"tx\"><span class=\"it\">Nonfat plain Greek yogurt<\/span><span class=\"am\">Buy: 1 tub (32 oz) · Recipe uses: 1/4 cup, for chipotle-lime crema<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p10-10-lime\"><span class=\"tx\"><span class=\"it\">Lime<\/span><span class=\"am\">Buy: 1 · Recipe uses: Juice for crema<\/span><\/span><\/label><\/li><\/ul>\n<p><b>From the pantry:<\/b> chili powder, cumin, garlic powder, chipotle powder.<\/p>\n<h2 id=\"p10-11\">Lamb<\/h2>\n<h3 id=\"p10-12\">No-Cook Greek Lamb and Chickpea Burrito<\/h3>\n<ul class=\"check\"><li><label><input type=\"checkbox\" data-k=\"p10-12-large-10-inch-whole-wheat-tortillas\"><span class=\"tx\"><span class=\"it\">Large (10-inch) whole wheat tortillas<\/span><span class=\"am\">Buy: 1 pack · Recipe uses: 1<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p10-12-shredded-lamb-from-the-crockpot-moroccan\"><span class=\"tx\"><span class=\"it\">Shredded lamb from the crockpot Moroccan lamb (meat only)<\/span><span class=\"am\">Buy: Leftover (no purchase) · Recipe uses: 5 1/2 oz<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p10-12-no-salt-added-chickpeas\"><span class=\"tx\"><span class=\"it\">No-salt-added chickpeas<\/span><span class=\"am\">Buy: 1 can (15 oz) · Recipe uses: 1/2 cup<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p10-12-baby-spinach\"><span class=\"tx\"><span class=\"it\">Baby spinach<\/span><span class=\"am\">Buy: 1 bag (5 oz) · Recipe uses: 1 cup<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p10-12-cucumber\"><span class=\"tx\"><span class=\"it\">Cucumber<\/span><span class=\"am\">Buy: 1 · Recipe uses: 1/4 cup diced, plus a little grated for tzatziki<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p10-12-cherry-tomatoes\"><span class=\"tx\"><span class=\"it\">Cherry tomatoes<\/span><span class=\"am\">Buy: 1 pint · Recipe uses: 1/2 cup halved<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p10-12-nonfat-plain-greek-yogurt\"><span class=\"tx\"><span class=\"it\">Nonfat plain Greek yogurt<\/span><span class=\"am\">Buy: 1 tub (32 oz) · Recipe uses: 1/2 cup, for tzatziki<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p10-12-lemon\"><span class=\"tx\"><span class=\"it\">Lemon<\/span><span class=\"am\">Buy: 1 · Recipe uses: Juice for tzatziki and lamb<\/span><\/span><\/label><\/li><\/ul>\n<p><b>From the pantry:<\/b> garlic, dried dill, dried oregano.<\/p>\n<h3 id=\"p10-13\">Cooked Seared Lamb Gyro Burrito<\/h3>\n<ul class=\"check\"><li><label><input type=\"checkbox\" data-k=\"p10-13-large-10-inch-whole-wheat-tortillas\"><span class=\"tx\"><span class=\"it\">Large (10-inch) whole wheat tortillas<\/span><span class=\"am\">Buy: 1 pack · Recipe uses: 1<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p10-13-boneless-leg-of-lamb-steak-or-lean-beef-\"><span class=\"tx\"><span class=\"it\">Boneless leg of lamb steak (or lean beef sirloin steak)<\/span><span class=\"am\">Buy: 8 oz · Recipe uses: 7 to 8 oz raw, trimmed<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p10-13-no-salt-added-chickpeas\"><span class=\"tx\"><span class=\"it\">No-salt-added chickpeas<\/span><span class=\"am\">Buy: 1 can (15 oz) · Recipe uses: 1/2 cup<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p10-13-baby-spinach\"><span class=\"tx\"><span class=\"it\">Baby spinach<\/span><span class=\"am\">Buy: 1 bag (5 oz) · Recipe uses: 1 cup<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p10-13-cucumber\"><span class=\"tx\"><span class=\"it\">Cucumber<\/span><span class=\"am\">Buy: 1 · Recipe uses: 1/4 cup diced, plus a little grated for tzatziki<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p10-13-cherry-tomatoes\"><span class=\"tx\"><span class=\"it\">Cherry tomatoes<\/span><span class=\"am\">Buy: 1 pint · Recipe uses: 1/2 cup<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p10-13-red-onion\"><span class=\"tx\"><span class=\"it\">Red onion<\/span><span class=\"am\">Buy: 1 · Recipe uses: 1/4 cup sliced<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p10-13-nonfat-plain-greek-yogurt\"><span class=\"tx\"><span class=\"it\">Nonfat plain Greek yogurt<\/span><span class=\"am\">Buy: 1 tub (32 oz) · Recipe uses: 1/2 cup, for tzatziki<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p10-13-lemon\"><span class=\"tx\"><span class=\"it\">Lemon<\/span><span class=\"am\">Buy: 1 · Recipe uses: Juice for tzatziki<\/span><\/span><\/label><\/li><\/ul>\n<p><b>From the pantry:<\/b> garlic, dried oregano, cumin, black pepper, dried dill, cooking spray.<\/p>\n<h2 id=\"p10-14\">Pantry Staples (buy once)<\/h2>\n<ul class=\"check\"><li><label><input type=\"checkbox\" data-k=\"p10-14-chipotle-powder\"><span class=\"tx\"><span class=\"it\">Chipotle powder<\/span><span class=\"am\">Buy: 1 jar · Used in: Salmon, Southwest chicken and Tex-Mex beef burritos<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p10-14-chili-powder-cumin-garlic-powder\"><span class=\"tx\"><span class=\"it\">Chili powder, cumin, garlic powder<\/span><span class=\"am\">Buy: 1 jar each · Used in: Baja salmon, Tex-Mex beef, lamb burritos<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p10-14-salt-free-taco-or-fajita-seasoning\"><span class=\"tx\"><span class=\"it\">Salt-free taco or fajita seasoning<\/span><span class=\"am\">Buy: 1 jar · Used in: Chicken fajita and shredded beef burritos<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p10-14-salt-free-chili-lime-or-cajun-seasoning\"><span class=\"tx\"><span class=\"it\">Salt-free chili-lime or Cajun seasoning<\/span><span class=\"am\">Buy: 1 jar · Used in: Baja salmon<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p10-14-dried-oregano-and-dried-dill\"><span class=\"tx\"><span class=\"it\">Dried oregano and dried dill<\/span><span class=\"am\">Buy: 1 jar each · Used in: Both lamb burritos<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p10-14-fresh-garlic-or-jarred-minced-garlic\"><span class=\"tx\"><span class=\"it\">Fresh garlic or jarred minced garlic<\/span><span class=\"am\">Buy: 1 · Used in: Tzatziki<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p10-14-nonstick-cooking-spray\"><span class=\"tx\"><span class=\"it\">Nonstick cooking spray<\/span><span class=\"am\">Buy: 1 can · Used in: All cooked burritos<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p10-14-foil\"><span class=\"tx\"><span class=\"it\">Foil<\/span><span class=\"am\">Buy: 1 roll · Used in: Wrapping burritos for the road<\/span><\/span><\/label><\/li><\/ul>\n<p><b>Tortilla tip:<\/b> pick a large (10-inch) whole wheat tortilla with about 200 calories, 35 g carbs and at least 4 g fiber, and check the sodium.<\/p>", "heads": [{"id": "p10-1", "t": "How to Use This List", "l": 2}, {"id": "p10-2", "t": "Fish", "l": 2}, {"id": "p10-3", "t": "No-Cook Salmon and Black Bean Burrito", "l": 3}, {"id": "p10-4", "t": "Cooked Baja Salmon Burrito with Mango Slaw", "l": 3}, {"id": "p10-5", "t": "Chicken", "l": 2}, {"id": "p10-6", "t": "No-Cook Southwest Chicken Burrito", "l": 3}, {"id": "p10-7", "t": "Cooked Chicken Thigh Fajita Burrito", "l": 3}, {"id": "p10-8", "t": "Beef", "l": 2}, {"id": "p10-9", "t": "No-Cook Shredded Beef and Black Bean Burrito", "l": 3}, {"id": "p10-10", "t": "Cooked Tex-Mex Ground Beef Burrito", "l": 3}, {"id": "p10-11", "t": "Lamb", "l": 2}, {"id": "p10-12", "t": "No-Cook Greek Lamb and Chickpea Burrito", "l": 3}, {"id": "p10-13", "t": "Cooked Seared Lamb Gyro Burrito", "l": 3}, {"id": "p10-14", "t": "Pantry Staples (buy once)", "l": 2}]}, {"id": "p11", "kicker": "Plan 6 · Meal Plan", "title": "40-40-20 Fish Crockpot Meals", "sub": "Salmon, white fish, shrimp and canned fish · fresh or packaged · about 700 calories per bowl · 10 to 16 g fiber · key nutrients · November 19, 2026", "kind": "plan", "html": "<h2 id=\"p11-1\">How It Works<\/h2>\n<p>Fish cooks in minutes and dries out over hours, so every recipe works the same way. The grains, beans and vegetables cook first. The fish goes on top for the last 15 to 60 minutes.<\/p>\n<ul><li><b>Step 1:<\/b> Load the base (grain or potato, beans, vegetables, broth and spices). Cook on LOW 5 to 6 hours or HIGH 2 1/2 to 4 hours.<\/li><li><b>Step 2:<\/b> Switch to HIGH. Lay the fish on top, cover and cook until done (see the times below).<\/li><li><b>Step 3:<\/b> Flake or stir, add the finishing toppings and portion into 4 bowls.<\/li><li><b>Each recipe makes 4 servings<\/b> in a 6-quart crockpot. Each bowl is a full meal of about 660 to 715 calories, 67 to 73 g protein, 68 to 76 g carbs and 13 to 18 g fat.<\/li><li><b>Fiber:<\/b> every bowl has beans or lentils, a whole grain or potato, and vegetables or greens. Get your berries at breakfast or as a snack to round out the day.<\/li><li><b>Low sodium:<\/b> use low-sodium broth, no-salt-added canned beans and tomatoes, and salt-free seasoning blends.<\/li><li><b>No pork<\/b> in any recipe.<\/li><li><b>Numbers<\/b> are estimates from standard USDA values and package labels.<\/li><\/ul>\n<h2 id=\"p11-2\">Fresh or Packaged: Fish Timing<\/h2>\n<p>Add fish only after the base is hot and the crockpot is on HIGH. Fish is done at 145°F, when it turns opaque and flakes easily with a fork. Shrimp is done when it is pink and curled.<\/p>\n<table class=\"stack\"><thead><tr><th>Fish<\/th><th>Fresh or thawed<\/th><th>Frozen<\/th><\/tr><\/thead><tbody><tr><td>Salmon fillets (1 inch thick)<\/td><td>20 to 30 min<\/td><td>45 to 60 min<\/td><\/tr><tr><td>Cod, tilapia or pollock fillets<\/td><td>15 to 25 min<\/td><td>40 to 50 min<\/td><\/tr><tr><td>Raw shrimp, peeled<\/td><td>15 to 20 min<\/td><td>30 to 40 min<\/td><\/tr><tr><td>Canned or pouch tuna or salmon<\/td><td>Stir in for the last 10 to 15 min to heat through<\/td><td>Not needed<\/td><\/tr><\/tbody><\/table>\n<p><b>Quick thaw:<\/b> to cut the time, put frozen fillets or shrimp in a sealed bag in cold water for 15 to 30 minutes while the base finishes.<\/p>\n<h2 id=\"p11-3\">Buying Fish<\/h2>\n<p class=\"lead\"><b>From the seafood counter<\/b><\/p>\n<ul><li>Ask for skinless fillets, or ask the counter to remove the skin. Ask for shrimp peeled and deveined.<\/li><li>Look for firm flesh and a clean, mild smell.<\/li><li>Ask whether the fish was previously frozen. Either way, keep it cold and cook it within 1 to 2 days.<\/li><li>Bring your cooler on the way home in warm weather.<\/li><\/ul>\n<p class=\"lead\"><b>Packaged<\/b><\/p>\n<ul><li><b>Frozen fillets:<\/b> store-brand bags of individually wrapped skinless salmon, cod, tilapia or pollock are the cheapest option. Wild sockeye, coho or pink salmon is leaner than farmed Atlantic.<\/li><li><b>Frozen shrimp:<\/b> buy raw, peeled and deveined, tail-off. Check the sodium. Some bags have added salt or sodium-based additives, so pick the lowest-sodium bag you can find.<\/li><li><b>Canned and pouch fish:<\/b> pink salmon pouches and canned light tuna in water. Choose lower-sodium versions when your store has them.<\/li><\/ul>\n<p><b>Where:<\/b> Kroger, Publix and Whole Foods usually have a full seafood counter. Aldi and Walmart are best for low-cost frozen bags, cans and pouches.<\/p>\n<h2 id=\"p11-4\">Meals at a Glance<\/h2>\n<div class=\"scroll\"><table class=\"\"><thead><tr><th>Recipe<\/th><th>Fish<\/th><th>Cal<\/th><th>Protein (g)<\/th><th>Carbs (g)<\/th><th>Fat (g)<\/th><th>Fiber (g)<\/th><th>Prep<\/th><\/tr><\/thead><tbody><tr><td>Lemon-Dill Salmon with Barley and White Beans<\/td><td>Salmon<\/td><td class=n>684<\/td><td class=n>72<\/td><td class=n>68<\/td><td class=n>16<\/td><td class=n>15<\/td><td>10 min<\/td><\/tr><tr><td>Moroccan Salmon with Sweet Potatoes and Chickpeas<\/td><td>Salmon<\/td><td class=n>708<\/td><td class=n>70<\/td><td class=n>72<\/td><td class=n>17<\/td><td class=n>14<\/td><td>15 min<\/td><\/tr><tr><td>Cajun Shrimp and Brown Rice with Red Beans<\/td><td>Shrimp<\/td><td class=n>693<\/td><td class=n>71<\/td><td class=n>69<\/td><td class=n>16<\/td><td class=n>14<\/td><td>10 min<\/td><\/tr><tr><td>Shrimp and Red Lentil Curry<\/td><td>Shrimp<\/td><td class=n>683<\/td><td class=n>73<\/td><td class=n>70<\/td><td class=n>15<\/td><td class=n>13<\/td><td>15 min<\/td><\/tr><tr><td>Mediterranean Cod with Potatoes and Chickpeas<\/td><td>Cod<\/td><td class=n>714<\/td><td class=n>67<\/td><td class=n>76<\/td><td class=n>16<\/td><td class=n>15<\/td><td>10 min<\/td><\/tr><tr><td>Salsa Verde Tilapia Burrito Bowls<\/td><td>Tilapia<\/td><td class=n>685<\/td><td class=n>70<\/td><td class=n>71<\/td><td class=n>15<\/td><td class=n>16<\/td><td>10 min<\/td><\/tr><tr><td>Creamy Salmon and Potato Chowder<\/td><td>Canned salmon<\/td><td class=n>690<\/td><td class=n>70<\/td><td class=n>76<\/td><td class=n>15<\/td><td class=n>12<\/td><td>15 min<\/td><\/tr><tr><td>Tuna and Brown Rice Casserole<\/td><td>Canned tuna<\/td><td class=n>697<\/td><td class=n>70<\/td><td class=n>72<\/td><td class=n>16<\/td><td class=n>10<\/td><td>10 min<\/td><\/tr><\/tbody><\/table><\/div>\n<h2 id=\"p11-5\">Salmon<\/h2>\n<h3 id=\"p11-6\">Lemon-Dill Salmon with Barley and White Beans<\/h3>\n<div class=\"macro\">Per bowl: 684 calories · 72 g protein · 68 g carbs · 16 g fat · 15 g fiber · LOW 5 to 6 hr or HIGH 3 hr<\/div>\n<p><b>Nutrient highlights:<\/b> omega-3 EPA and DHA and selenium (salmon), folate (white beans, spinach), lycopene (tomatoes), very high fiber (barley)<\/p>\n<p><b>Fish:<\/b> 2 lb skinless salmon fillets, fresh from the counter or frozen<\/p>\n<ul><li>1 cup pearled barley<\/li><li>2 cans (15 oz) no-salt-added cannellini beans, drained and rinsed (use about 2 cups)<\/li><li>1 can (14.5 oz) no-salt-added diced tomatoes<\/li><li>1 onion, diced, and 3 cloves garlic (or 1 tsp garlic powder)<\/li><li>3 cups low-sodium chicken or vegetable broth<\/li><li>1 tbsp olive oil, 1 tsp dried dill, zest and juice of 1 lemon, black pepper<\/li><li>1 bag (7 oz) baby spinach, or 2 cups frozen spinach<\/li><li>1 cup nonfat plain Greek yogurt mixed with 1 tsp dill and a squeeze of lemon (sauce)<\/li><\/ul>\n<ol><li>Add the barley, beans, tomatoes, onion, garlic, broth, oil, dill, lemon zest and pepper. Stir.<\/li><li>Cook on LOW 5 to 6 hours or HIGH 3 hours, until the barley is tender.<\/li><li>Switch to HIGH. Stir in the spinach. Lay the salmon on top and sprinkle with dill and pepper. Cover and cook until it flakes (see the timing table).<\/li><li>Squeeze the lemon over it, break the salmon into chunks and portion into 4 bowls. Top each with 1/4 cup dill yogurt sauce.<\/li><\/ol>\n<h3 id=\"p11-7\">Moroccan Salmon with Sweet Potatoes and Chickpeas<\/h3>\n<div class=\"macro\">Per bowl: 708 calories · 70 g protein · 72 g carbs · 17 g fat · 14 g fiber · LOW 6 hr or HIGH 3 to 4 hr<\/div>\n<p><b>Nutrient highlights:<\/b> omega-3s (salmon), vitamin E (almonds), vitamin C (sweet potatoes, tomatoes), lycopene (tomato paste), folate (chickpeas)<\/p>\n<p><b>Fish:<\/b> 2 lb skinless salmon fillets, fresh or frozen<\/p>\n<ul><li>2 medium sweet potatoes (about 1 1/4 lb), cut into 1-inch cubes<\/li><li>1 can (15 oz) no-salt-added chickpeas, drained and rinsed<\/li><li>1 can (14.5 oz) no-salt-added diced tomatoes and 2 tbsp tomato paste<\/li><li>1 onion, diced<\/li><li>3 tbsp raisins<\/li><li>1 cup low-sodium broth<\/li><li>2 tsp cumin, 1 tsp paprika, 1 tsp ground ginger, 1/2 tsp cinnamon, 1 tsp garlic powder<\/li><li>1 cup nonfat plain Greek yogurt with lemon juice (sauce)<\/li><li>1/3 cup sliced almonds<\/li><\/ul>\n<ol><li>Add the sweet potatoes, chickpeas, tomatoes, tomato paste, onion, raisins, broth and spices. Stir.<\/li><li>Cook on LOW 6 hours or HIGH 3 to 4 hours, until the sweet potatoes are tender.<\/li><li>Switch to HIGH. Season the salmon with a pinch of cumin and paprika and lay it on top. Cook until it flakes.<\/li><li>Portion into 4 bowls. Top each with 1/4 cup lemon yogurt and a sprinkle of almonds.<\/li><\/ol>\n<h2 id=\"p11-8\">Shrimp<\/h2>\n<h3 id=\"p11-9\">Cajun Shrimp and Brown Rice with Red Beans<\/h3>\n<div class=\"macro\">Per bowl: 693 calories · 71 g protein · 69 g carbs · 16 g fat · 14 g fiber · HIGH 2 1/2 to 3 hr<\/div>\n<p><b>Nutrient highlights:<\/b> selenium and zinc (shrimp), vitamin C (bell peppers), vitamin E (avocado), folate (kidney beans), lycopene (tomatoes)<\/p>\n<p><b>Fish:<\/b> 2 1/2 lb raw peeled and deveined shrimp, fresh or frozen<\/p>\n<ul><li>1 cup uncooked brown rice<\/li><li>1 can (15 oz) no-salt-added red kidney beans, drained and rinsed<\/li><li>1 can (14.5 oz) no-salt-added diced tomatoes<\/li><li>2 bell peppers, 1 onion and 2 celery stalks, diced (or 3 cups frozen pepper and onion strips)<\/li><li>2 1/2 cups low-sodium chicken broth<\/li><li>2 tbsp olive oil (1 tbsp to grease the crock, 1 tbsp in the pot)<\/li><li>1 tbsp salt-free Cajun or Creole seasoning, 1 tsp garlic powder, 1 bay leaf<\/li><li>1 1/2 avocados, diced, and hot sauce to serve<\/li><\/ul>\n<ol><li>Rub the crock with 1 tbsp oil. Add the rice, beans, tomatoes, vegetables, broth, the rest of the oil and the seasoning. Stir.<\/li><li>Cook on HIGH 2 1/2 to 3 hours, until the rice is tender and most of the liquid is absorbed. Crockpots vary, so check at 2 hours.<\/li><li>Stir the shrimp into the top of the rice. Cover and cook until pink (see the timing table).<\/li><li>Remove the bay leaf. Portion into 4 bowls and top with avocado and hot sauce.<\/li><\/ol>\n<h3 id=\"p11-10\">Shrimp and Red Lentil Curry<\/h3>\n<div class=\"macro\">Per bowl: 683 calories · 73 g protein · 70 g carbs · 15 g fat · 13 g fiber · LOW 6 hr or HIGH 3 hr<\/div>\n<p><b>Nutrient highlights:<\/b> folate and L-arginine (lentils), vitamin E and zinc (sunflower seeds), selenium (shrimp), vitamin C (sweet potato, tomatoes)<\/p>\n<p><b>Fish:<\/b> 2 lb raw peeled and deveined shrimp, fresh or frozen<\/p>\n<ul><li>1 cup red lentils, rinsed<\/li><li>1 large sweet potato (about 1 lb), cut into 1-inch cubes<\/li><li>1 can (14.5 oz) no-salt-added diced tomatoes<\/li><li>1 onion, diced<\/li><li>3 cups low-sodium broth<\/li><li>1 tbsp olive oil, 2 tbsp curry powder, 1 tsp ground ginger, 1 tsp garlic powder<\/li><li>1 bag (10 oz) frozen chopped spinach<\/li><li>1 cup nonfat plain Greek yogurt<\/li><li>1/2 cup unsalted sunflower seeds and lime wedges to serve<\/li><\/ul>\n<ol><li>Add the lentils, sweet potato, tomatoes, onion, broth, oil and spices. Stir.<\/li><li>Cook on LOW 6 hours or HIGH 3 hours, until the lentils break down and thicken.<\/li><li>Switch to HIGH. Stir in the frozen spinach and shrimp. Cover and cook until the shrimp is pink.<\/li><li>Turn off the heat and stir in the yogurt (adding it off the heat keeps it from curdling). Portion into 4 bowls and top with sunflower seeds and lime.<\/li><\/ol>\n<h2 id=\"p11-11\">White Fish<\/h2>\n<h3 id=\"p11-12\">Mediterranean Cod with Potatoes and Chickpeas<\/h3>\n<div class=\"macro\">Per bowl: 714 calories · 67 g protein · 76 g carbs · 16 g fat · 15 g fiber · LOW 6 hr or HIGH 3 to 4 hr<\/div>\n<p><b>Nutrient highlights:<\/b> selenium (cod), vitamin C (potatoes, tomatoes, green beans), vitamin E (olive oil), lycopene (tomatoes), folate (chickpeas, green beans)<\/p>\n<p><b>Fish:<\/b> 2 1/2 lb cod fillets, fresh or frozen (pollock, haddock or tilapia also work)<\/p>\n<ul><li>2 lb baby potatoes, whole (halve any larger than a golf ball)<\/li><li>1 can (15 oz) no-salt-added chickpeas, drained and rinsed<\/li><li>1 can (14.5 oz) no-salt-added diced tomatoes<\/li><li>1 onion, sliced, and 4 cloves garlic (or 1 tsp garlic powder)<\/li><li>1 bag (12 oz) frozen cut green beans<\/li><li>3 tbsp olive oil<\/li><li>2 tsp dried oregano, 1 tsp paprika, black pepper and 1 lemon<\/li><li>1/4 cup grated Parmesan<\/li><\/ul>\n<ol><li>Add the potatoes, chickpeas, tomatoes, onion, garlic, green beans, 2 tbsp of the oil, the oregano and pepper. Stir.<\/li><li>Cook on LOW 6 hours or HIGH 3 to 4 hours, until the potatoes are fork-tender.<\/li><li>Switch to HIGH. Lay the cod on top, brush with the last 1 tbsp oil, and sprinkle with paprika and pepper. Cook until it flakes.<\/li><li>Squeeze the lemon over it. Portion into 4 bowls and top with Parmesan.<\/li><\/ol>\n<h3 id=\"p11-13\">Salsa Verde Tilapia Burrito Bowls<\/h3>\n<div class=\"macro\">Per bowl: 685 calories · 70 g protein · 71 g carbs · 15 g fat · 16 g fiber · HIGH 2 1/2 to 3 hr<\/div>\n<p><b>Nutrient highlights:<\/b> selenium (tilapia), folate (black beans, avocado), vitamin C (peppers, salsa verde), vitamin E (avocado)<\/p>\n<p><b>Fish:<\/b> 2 1/4 lb tilapia fillets, fresh or frozen (cod or pollock also work)<\/p>\n<ul><li>3/4 cup uncooked brown rice<\/li><li>1 can (15 oz) no-salt-added black beans, drained and rinsed<\/li><li>1 cup frozen corn<\/li><li>1 cup salsa verde (lowest sodium you can find)<\/li><li>2 bell peppers and 1 onion, diced (or 3 cups frozen pepper and onion strips)<\/li><li>2 cups low-sodium broth<\/li><li>2 tsp cumin, 1 tsp chili powder, 1 tsp garlic powder<\/li><li>1 1/2 avocados, diced<\/li><li>2/3 cup nonfat plain Greek yogurt mixed with lime juice (crema)<\/li><\/ul>\n<ol><li>Lightly spray the crock with cooking spray. Add the rice, beans, corn, salsa verde, vegetables, broth and spices. Stir.<\/li><li>Cook on HIGH 2 1/2 to 3 hours, until the rice is tender. Check at 2 hours.<\/li><li>Lay the tilapia on top and sprinkle with cumin and chili powder. Cook until it flakes, then break it into chunks.<\/li><li>Portion into 4 bowls. Top with avocado and lime crema.<\/li><\/ol>\n<h2 id=\"p11-14\">Canned and Pouch Fish<\/h2>\n<h3 id=\"p11-15\">Creamy Salmon and Potato Chowder<\/h3>\n<div class=\"macro\">Per bowl: 690 calories · 70 g protein · 76 g carbs · 15 g fat · 12 g fiber · about 0.9 g EPA and DHA · LOW 6 hr or HIGH 3 to 4 hr<\/div>\n<p><b>Nutrient highlights:<\/b> omega-3 EPA and DHA (salmon), vitamin E (sunflower seeds), vitamin A and C (carrots, potatoes), folate (white beans)<\/p>\n<p><b>Fish:<\/b> 12 pouches (2.6 oz) pink salmon<\/p>\n<ul><li>1 1/2 lb potatoes, cut into 1-inch cubes<\/li><li>2 carrots and 3 celery stalks, sliced<\/li><li>1 onion, diced<\/li><li>1 cup frozen corn<\/li><li>2 cans (15 oz) no-salt-added cannellini beans, drained and rinsed (use about 2 cups)<\/li><li>3 cups low-sodium broth<\/li><li>1 tbsp olive oil, 1 tsp dried thyme, 1 tsp garlic powder, 1 bay leaf, black pepper<\/li><li>2 cups 2% milk<\/li><li>1 cup nonfat plain Greek yogurt<\/li><li>1/4 cup unsalted sunflower seeds<\/li><\/ul>\n<ol><li>Add the potatoes, carrots, celery, onion, corn, beans, broth, oil and seasonings. Stir.<\/li><li>Cook on LOW 6 hours or HIGH 3 to 4 hours, until the potatoes are tender.<\/li><li>Remove the bay leaf. Mash about a third of the potatoes and beans against the side of the crock to thicken it.<\/li><li>Switch to HIGH. Stir in the milk and the salmon from the pouches. Heat for 10 to 15 minutes.<\/li><li>Turn off the heat and stir in the yogurt. Portion into 4 bowls and top with sunflower seeds.<\/li><\/ol>\n<p><b>Fresh swap:<\/b> lay 1 3/4 lb fresh or frozen skinless salmon on top at step 4 instead of the pouches. Cook it until it flakes, then break it into the chowder. This adds about 6 g fat per bowl. You could also use 2 lb cod, which gives about 5 g less protein per bowl.<\/p>\n<h3 id=\"p11-16\">Tuna and Brown Rice Casserole<\/h3>\n<div class=\"macro\">Per bowl: 697 calories · 70 g protein · 72 g carbs · 16 g fat · 10 g fiber · HIGH 2 1/2 to 3 hr<\/div>\n<p><b>Nutrient highlights:<\/b> selenium (tuna, very high), folate (broccoli, peas), vitamin C (broccoli), L-arginine (tuna, peas)<\/p>\n<p><b>Fish:<\/b> 8 cans (5 oz) light tuna in water, drained<\/p>\n<ul><li>1 1/4 cups uncooked brown rice<\/li><li>8 oz sliced mushrooms<\/li><li>1 onion, diced<\/li><li>3 cups low-sodium broth<\/li><li>2 tbsp olive oil (1 tbsp to grease the crock, 1 tbsp in the pot)<\/li><li>1 tsp garlic powder, 1 tsp dried thyme, 1 tbsp Dijon mustard, black pepper<\/li><li>2 bags (12 oz) frozen broccoli florets and 2 cups frozen peas<\/li><li>1 cup 2% milk<\/li><li>1 cup nonfat plain Greek yogurt<\/li><li>1/2 cup grated Parmesan<\/li><\/ul>\n<ol><li>Rub the crock with 1 tbsp oil. Add the rice, mushrooms, onion, broth, the rest of the oil and the seasonings. Stir.<\/li><li>Cook on HIGH 2 hours.<\/li><li>Stir in the frozen broccoli and peas. Cook 30 to 45 minutes more, until the rice is tender.<\/li><li>Stir in the tuna and milk and heat for 10 to 15 minutes.<\/li><li>Turn off the heat and stir in the yogurt and Parmesan. Portion into 4 bowls.<\/li><\/ol>\n<p><b>Fresh swap:<\/b> use 2 lb fresh or frozen cod or pollock. Lay it on top at step 4, cook until it flakes, and break it in. This gives about 4 g less protein per bowl.<\/p>\n<h2 id=\"p11-17\">Storing Leftovers<\/h2>\n<ul><li><b>Fridge:<\/b> cooked fish bowls keep 3 to 4 days in sealed containers. Reheat until steaming hot, or eat the cold-friendly ones (the burrito bowls and the Moroccan salmon) as they are.<\/li><li><b>Freezer:<\/b> the shrimp curry, Cajun shrimp and rice, and burrito bowls freeze well for up to 2 months. The chowder and casserole get grainy when frozen because of the milk and yogurt, so eat those within 4 days.<\/li><li><b>On the road:<\/b> pack bowls in your cooler at 40°F or below and reheat in the hotel microwave.<\/li><li><b>Mix it up:<\/b> a batch is 4 bowls of one fish. Freeze 2 bowls and rotate with other meals so you are not eating the same fish all week.<\/li><\/ul>\n<h2 id=\"p11-18\">Key Nutrients<\/h2>\n<table class=\"stack\"><thead><tr><th>Nutrient<\/th><th>Best recipes for it<\/th><th>Notes<\/th><\/tr><\/thead><tbody><tr><td>Omega-3 EPA and DHA<\/td><td>All three salmon recipes<\/td><td>Count any of them as a fish meal; aim for 2 a week<\/td><\/tr><tr><td>Selenium (55 mcg a day)<\/td><td>All, especially tuna and shrimp<\/td><td>The tuna casserole is very high in selenium, so skip any selenium supplement that day<\/td><\/tr><tr><td>Zinc (11 mg a day)<\/td><td>Shrimp curry and Cajun shrimp<\/td><td>Lentils, beans and sunflower seeds add more; beef and lamb meals are still your best zinc sources<\/td><\/tr><tr><td>Folate (400 mcg a day)<\/td><td>All, from beans, lentils, spinach and broccoli<\/td><td>Lentil curry and white bean recipes are the strongest<\/td><\/tr><tr><td>Vitamin C (90 mg a day)<\/td><td>Cajun shrimp, tilapia bowls, Moroccan salmon, tuna casserole<\/td><td>Peppers, broccoli, tomatoes and sweet potatoes<\/td><\/tr><tr><td>Vitamin E (15 mg a day)<\/td><td>Shrimp curry, chowder, Moroccan salmon<\/td><td>Sunflower seeds and almonds are the main sources<\/td><\/tr><tr><td>Lycopene<\/td><td>All tomato-based recipes<\/td><td>Add 1 to 2 tbsp more tomato paste to any of them<\/td><\/tr><tr><td>Omega-3 ALA (1.6 g a day)<\/td><td>Not a strong source<\/td><td>Keep chia or flaxseed at breakfast<\/td><\/tr><tr><td>L-arginine and amino acids<\/td><td>All<\/td><td>67 to 73 g complete protein per bowl<\/td><\/tr><\/tbody><\/table>\n<p><b>Supplement notes:<\/b> talk with your doctor before adding fish oil, vitamin E, zinc, selenium or L-arginine supplements. Fish oil can interact with blood thinners. Keep total zinc under 40 mg and selenium under 400 mcg a day. No Brazil nuts.<\/p>\n<h2 id=\"p11-19\">Sources<\/h2>\n<ul><li>Pink salmon pouch nutrition and EPA and DHA: <a href=\"https://starkist.com/?p=9738\" target=\"_blank\" rel=\"noopener\">StarKist<\/a><\/li><li>Safe cooking temperature for fish (145°F): <a href=\"https://www.foodsafety.gov/food-safety-charts/safe-minimum-internal-temperatures\" target=\"_blank\" rel=\"noopener\">FoodSafety.gov<\/a><\/li><li>Nutrient targets and upper limits: NIH Office of Dietary Supplements fact sheets for <a href=\"https://ods.od.nih.gov/factsheets/Zinc-HealthProfessional/\" target=\"_blank\" rel=\"noopener\">zinc<\/a> and <a href=\"https://ods.od.nih.gov/factsheets/Selenium-HealthProfessional/\" target=\"_blank\" rel=\"noopener\">selenium<\/a><\/li><li>Fish fillets, shrimp, canned tuna, grains, beans, vegetables, dairy and nuts: standard USDA values<\/li><\/ul>", "heads": [{"id": "p11-1", "t": "How It Works", "l": 2}, {"id": "p11-2", "t": "Fresh or Packaged: Fish Timing", "l": 2}, {"id": "p11-3", "t": "Buying Fish", "l": 2}, {"id": "p11-4", "t": "Meals at a Glance", "l": 2}, {"id": "p11-5", "t": "Salmon", "l": 2}, {"id": "p11-6", "t": "Lemon-Dill Salmon with Barley and White Beans", "l": 3}, {"id": "p11-7", "t": "Moroccan Salmon with Sweet Potatoes and Chickpeas", "l": 3}, {"id": "p11-8", "t": "Shrimp", "l": 2}, {"id": "p11-9", "t": "Cajun Shrimp and Brown Rice with Red Beans", "l": 3}, {"id": "p11-10", "t": "Shrimp and Red Lentil Curry", "l": 3}, {"id": "p11-11", "t": "White Fish", "l": 2}, {"id": "p11-12", "t": "Mediterranean Cod with Potatoes and Chickpeas", "l": 3}, {"id": "p11-13", "t": "Salsa Verde Tilapia Burrito Bowls", "l": 3}, {"id": "p11-14", "t": "Canned and Pouch Fish", "l": 2}, {"id": "p11-15", "t": "Creamy Salmon and Potato Chowder", "l": 3}, {"id": "p11-16", "t": "Tuna and Brown Rice Casserole", "l": 3}, {"id": "p11-17", "t": "Storing Leftovers", "l": 2}, {"id": "p11-18", "t": "Key Nutrients", "l": 2}, {"id": "p11-19", "t": "Sources", "l": 2}]}, {"id": "p12", "kicker": "Plan 6 · Grocery List", "title": "40-40-20 Fish Crockpot Meals Grocery List", "sub": "One list per recipe · 4 bowls each · fresh or packaged fish · November 20, 2026", "kind": "grocery", "html": "<h2 id=\"p12-1\">How to Use This List<\/h2>\n<ul><li><b>Shop by meal.<\/b> Each recipe has its own complete list for a 4-bowl batch.<\/li><li><b>Pick fresh or packaged fish.<\/b> The first row of each list gives both options. Use the seafood counter where your store has one, or frozen bags, cans and pouches.<\/li><li><b>\"Buy\" is the package size. \"Recipe uses\" is how much goes in the batch.<\/b> Opened cartons and bags carry over to the next recipe.<\/li><li><b>Some items repeat across recipes,<\/b> like broth, diced tomatoes, Greek yogurt and onions. Check your pantry before buying them again.<\/li><li><b>Spices and olive oil<\/b> are in Pantry Staples at the end.<\/li><\/ul>\n<h2 id=\"p12-2\">Salmon<\/h2>\n<h3 id=\"p12-3\">Lemon-Dill Salmon with Barley and White Beans<\/h3>\n<ul class=\"check\"><li><label><input type=\"checkbox\" data-k=\"p12-3-skinless-salmon-fillets\"><span class=\"tx\"><span class=\"it\">Skinless salmon fillets<\/span><span class=\"am\">Buy: 2 lb fresh from the counter, or 2 lb frozen · Recipe uses: 2 lb<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p12-3-pearled-barley\"><span class=\"tx\"><span class=\"it\">Pearled barley<\/span><span class=\"am\">Buy: 1 bag · Recipe uses: 1 cup<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p12-3-no-salt-added-cannellini-beans\"><span class=\"tx\"><span class=\"it\">No-salt-added cannellini beans<\/span><span class=\"am\">Buy: 2 cans (15 oz) · Recipe uses: About 2 cups<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p12-3-no-salt-added-diced-tomatoes\"><span class=\"tx\"><span class=\"it\">No-salt-added diced tomatoes<\/span><span class=\"am\">Buy: 1 can (14.5 oz) · Recipe uses: 1 can<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p12-3-onion\"><span class=\"tx\"><span class=\"it\">Onion<\/span><span class=\"am\">Buy: 1 · Recipe uses: 1, diced<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p12-3-garlic-or-garlic-powder-\"><span class=\"tx\"><span class=\"it\">Garlic (or garlic powder)<\/span><span class=\"am\">Buy: 1 head · Recipe uses: 3 cloves<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p12-3-low-sodium-chicken-or-vegetable-broth\"><span class=\"tx\"><span class=\"it\">Low-sodium chicken or vegetable broth<\/span><span class=\"am\">Buy: 1 carton (32 oz) · Recipe uses: 3 cups<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p12-3-baby-spinach-or-frozen-spinach-\"><span class=\"tx\"><span class=\"it\">Baby spinach (or frozen spinach)<\/span><span class=\"am\">Buy: 1 bag (7 oz) · Recipe uses: 1 bag (or 2 cups frozen)<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p12-3-lemon\"><span class=\"tx\"><span class=\"it\">Lemon<\/span><span class=\"am\">Buy: 1 · Recipe uses: Zest and juice<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p12-3-nonfat-plain-greek-yogurt\"><span class=\"tx\"><span class=\"it\">Nonfat plain Greek yogurt<\/span><span class=\"am\">Buy: 1 tub (32 oz) · Recipe uses: 1 cup, for dill sauce<\/span><\/span><\/label><\/li><\/ul>\n<p><b>From the pantry:<\/b> olive oil, dried dill, black pepper.<\/p>\n<h3 id=\"p12-4\">Moroccan Salmon with Sweet Potatoes and Chickpeas<\/h3>\n<ul class=\"check\"><li><label><input type=\"checkbox\" data-k=\"p12-4-skinless-salmon-fillets\"><span class=\"tx\"><span class=\"it\">Skinless salmon fillets<\/span><span class=\"am\">Buy: 2 lb fresh from the counter, or 2 lb frozen · Recipe uses: 2 lb<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p12-4-sweet-potatoes\"><span class=\"tx\"><span class=\"it\">Sweet potatoes<\/span><span class=\"am\">Buy: 2 medium (about 1 1/4 lb) · Recipe uses: 2, cubed<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p12-4-no-salt-added-chickpeas\"><span class=\"tx\"><span class=\"it\">No-salt-added chickpeas<\/span><span class=\"am\">Buy: 1 can (15 oz) · Recipe uses: 1 can<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p12-4-no-salt-added-diced-tomatoes\"><span class=\"tx\"><span class=\"it\">No-salt-added diced tomatoes<\/span><span class=\"am\">Buy: 1 can (14.5 oz) · Recipe uses: 1 can<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p12-4-tomato-paste\"><span class=\"tx\"><span class=\"it\">Tomato paste<\/span><span class=\"am\">Buy: 1 small can (6 oz) · Recipe uses: 2 tbsp<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p12-4-onion\"><span class=\"tx\"><span class=\"it\">Onion<\/span><span class=\"am\">Buy: 1 · Recipe uses: 1, diced<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p12-4-raisins\"><span class=\"tx\"><span class=\"it\">Raisins<\/span><span class=\"am\">Buy: 1 small box · Recipe uses: 3 tbsp<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p12-4-low-sodium-broth\"><span class=\"tx\"><span class=\"it\">Low-sodium broth<\/span><span class=\"am\">Buy: 1 carton (32 oz) · Recipe uses: 1 cup<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p12-4-nonfat-plain-greek-yogurt\"><span class=\"tx\"><span class=\"it\">Nonfat plain Greek yogurt<\/span><span class=\"am\">Buy: 1 tub (32 oz) · Recipe uses: 1 cup, for lemon yogurt<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p12-4-lemon\"><span class=\"tx\"><span class=\"it\">Lemon<\/span><span class=\"am\">Buy: 1 · Recipe uses: Juice for yogurt<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p12-4-sliced-almonds\"><span class=\"tx\"><span class=\"it\">Sliced almonds<\/span><span class=\"am\">Buy: 1 bag · Recipe uses: 1/3 cup<\/span><\/span><\/label><\/li><\/ul>\n<p><b>From the pantry:<\/b> cumin, paprika, ground ginger, cinnamon, garlic powder.<\/p>\n<h2 id=\"p12-5\">Shrimp<\/h2>\n<h3 id=\"p12-6\">Cajun Shrimp and Brown Rice with Red Beans<\/h3>\n<ul class=\"check\"><li><label><input type=\"checkbox\" data-k=\"p12-6-raw-shrimp-peeled-and-deveined\"><span class=\"tx\"><span class=\"it\">Raw shrimp, peeled and deveined<\/span><span class=\"am\">Buy: 2 1/2 lb fresh from the counter, or 2 1/2 lb frozen · Recipe uses: 2 1/2 lb<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p12-6-brown-rice\"><span class=\"tx\"><span class=\"it\">Brown rice<\/span><span class=\"am\">Buy: 1 bag (2 lb) · Recipe uses: 1 cup uncooked<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p12-6-no-salt-added-red-kidney-beans\"><span class=\"tx\"><span class=\"it\">No-salt-added red kidney beans<\/span><span class=\"am\">Buy: 1 can (15 oz) · Recipe uses: 1 can<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p12-6-no-salt-added-diced-tomatoes\"><span class=\"tx\"><span class=\"it\">No-salt-added diced tomatoes<\/span><span class=\"am\">Buy: 1 can (14.5 oz) · Recipe uses: 1 can<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p12-6-bell-peppers-onion-and-celery-or-frozen-\"><span class=\"tx\"><span class=\"it\">Bell peppers, onion and celery (or frozen pepper and onion strips)<\/span><span class=\"am\">Buy: 2 peppers, 1 onion, 2 stalks celery (or 1 bag) · Recipe uses: About 3 cups, diced<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p12-6-low-sodium-chicken-broth\"><span class=\"tx\"><span class=\"it\">Low-sodium chicken broth<\/span><span class=\"am\">Buy: 1 carton (32 oz) · Recipe uses: 2 1/2 cups<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p12-6-avocados\"><span class=\"tx\"><span class=\"it\">Avocados<\/span><span class=\"am\">Buy: 2 · Recipe uses: 1 1/2<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p12-6-hot-sauce-optional-\"><span class=\"tx\"><span class=\"it\">Hot sauce (optional)<\/span><span class=\"am\">Buy: 1 bottle · Recipe uses: To serve<\/span><\/span><\/label><\/li><\/ul>\n<p><b>From the pantry:<\/b> olive oil (2 tbsp), salt-free Cajun or Creole seasoning, garlic powder, bay leaf.<\/p>\n<h3 id=\"p12-7\">Shrimp and Red Lentil Curry<\/h3>\n<ul class=\"check\"><li><label><input type=\"checkbox\" data-k=\"p12-7-raw-shrimp-peeled-and-deveined\"><span class=\"tx\"><span class=\"it\">Raw shrimp, peeled and deveined<\/span><span class=\"am\">Buy: 2 lb fresh from the counte
