p class=\"lead\"><b>Fastest: Instant Pot (about 50 minutes)<\/b><\/p>\n<ol class=\"steps\"><li>Add 1 1/4 cups broth (not 2 1/2), the rice, beans, vegetables, oil and seasoning. Spoon the tomatoes on top and do not stir.<\/li><li>Pressure cook on HIGH 22 minutes, then let the pressure release naturally for 10 minutes.<\/li><li>Switch to Sauté. Stir in the shrimp and cook 3 to 5 minutes for fresh or thawed, or 6 to 8 minutes for frozen, until pink. Top with avocado and hot sauce.<\/li><\/ol>\n<p class=\"lead\"><b>Fast: stovetop Dutch oven (about 55 minutes)<\/b><\/p>\n<ol class=\"steps\"><li>Bring 2 1/2 cups broth, the tomatoes, beans, vegetables, oil and seasoning to a boil. Stir in the rice, cover and simmer on low 40 to 45 minutes, until tender.<\/li><li>Stir in the shrimp, cover and cook 3 to 5 minutes for fresh or thawed, or 6 to 8 minutes for frozen, until pink.<\/li><li>Top with avocado and hot sauce.<\/li><\/ol>\n<h3 id=\"ft-1\">Fish Timing<\/h3>\n<p>Add fish only after the base is hot and the crockpot is on HIGH. Fish is done at 145°F, when it turns opaque and flakes easily with a fork. Shrimp is done when it is pink and curled.<\/p>\n<table class=\"stack\"><thead><tr><th>Fish<\/th><th>Fresh or thawed<\/th><th>Frozen<\/th><\/tr><\/thead><tbody><tr><td>Salmon fillets (1 inch thick)<\/td><td>20 to 30 min<\/td><td>45 to 60 min<\/td><\/tr><tr><td>Cod, tilapia or pollock fillets<\/td><td>15 to 25 min<\/td><td>40 to 50 min<\/td><\/tr><tr><td>Raw shrimp, peeled<\/td><td>15 to 20 min<\/td><td>30 to 40 min<\/td><\/tr><tr><td>Canned or pouch tuna or salmon<\/td><td>Stir in for the last 10 to 15 min to heat through<\/td><td>Not needed<\/td><\/tr><\/tbody><\/table>\n<p><b>Quick thaw:<\/b> to cut the time, put frozen fillets or shrimp in a sealed bag in cold water for 15 to 30 minutes while the base finishes.<\/p>", "gro": "p12-6", "groT": "cajun shrimp and brown rice with red beans", "src": "p11-10", "macro": "Per bowl: 693 calories · 71 g protein · 69 g carbs · 16 g fat · 14 g fiber · HIGH 2 1/2 to 3 hr"}, {"id": "m-p11-4", "plan": "p11", "cat": "Shrimp", "title": "Shrimp and Red Lentil Curry", "html": "<div class=\"macro\">Per bowl: 683 calories · 73 g protein · 70 g carbs · 15 g fat · 13 g fiber · LOW 6 hr or HIGH 3 hr<\/div>\n<p><b>Nutrient highlights:<\/b> folate and L-arginine (lentils), vitamin E and zinc (sunflower seeds), selenium (shrimp), vitamin C (sweet potato, tomatoes)<\/p>\n<p><b>Fish:<\/b> 2 lb raw peeled and deveined shrimp, fresh or frozen<\/p>\n<ul><li>1 cup red lentils, rinsed<\/li><li>1 large sweet potato (about 1 lb), cut into 1-inch cubes<\/li><li>1 can (14.5 oz) no-salt-added diced tomatoes<\/li><li>1 onion, diced<\/li><li>3 cups low-sodium broth<\/li><li>1 tbsp olive oil, 2 tbsp curry powder, 1 tsp ground ginger, 1 tsp garlic powder<\/li><li>1 bag (10 oz) frozen chopped spinach<\/li><li>1 cup nonfat plain Greek yogurt<\/li><li>1/2 cup unsalted sunflower seeds and lime wedges to serve<\/li><\/ul>\n<p class=\"lead\"><b>Standard: crockpot on LOW (about 6 1/2 hours)<\/b><\/p>\n<ol class=\"steps\"><li>Add the lentils, sweet potato, tomatoes, onion, broth, oil and spices. Stir.<\/li><li>Cook on LOW 6 hours or HIGH 3 hours, until the lentils break down and thicken.<\/li><li>Switch to HIGH. Stir in the frozen spinach and shrimp. Cover and cook until the shrimp is pink.<\/li><li>Turn off the heat and stir in the yogurt (adding it off the heat keeps it from curdling). Portion into 4 bowls and top with sunflower seeds and lime.<\/li><\/ol>\n<p class=\"lead\"><b>Faster: crockpot, all on HIGH (about 3 1/2 hours)<\/b><\/p>\n<ol class=\"steps\"><li>Load the base the same way as the standard steps.<\/li><li>Cook on HIGH 3 hours, until the lentils break down.<\/li><li>Stir in the spinach and shrimp and cook on HIGH until pink. Turn off the heat and stir in the yogurt.<\/li><\/ol>\n<p class=\"lead\"><b>Fastest: Instant Pot (about 35 minutes)<\/b><\/p>\n<ol class=\"steps\"><li>Add the broth, lentils, sweet potato, onion, oil and spices. Spoon the tomatoes on top and do not stir.<\/li><li>Pressure cook on HIGH 6 minutes, then let the pressure release naturally for 10 minutes.<\/li><li>Stir in the frozen spinach. Switch to Sauté. Stir in the shrimp and cook 3 to 5 minutes for fresh or thawed, or 6 to 8 minutes for frozen, until pink. Turn off the heat and stir in the yogurt.<\/li><\/ol>\n<p class=\"lead\"><b>Fast: stovetop Dutch oven (about 35 minutes)<\/b><\/p>\n<ol class=\"steps\"><li>Bring the broth, lentils, sweet potato, tomatoes, onion, oil and spices to a boil. Cover and simmer 20 to 25 minutes, until the lentils break down.<\/li><li>Stir in the spinach. Stir in the shrimp, cover and cook 3 to 5 minutes for fresh or thawed, or 6 to 8 minutes for frozen, until pink.<\/li><li>Turn off the heat and stir in the yogurt.<\/li><\/ol>\n<h3 id=\"ft-1\">Fish Timing<\/h3>\n<p>Add fish only after the base is hot and the crockpot is on HIGH. Fish is done at 145°F, when it turns opaque and flakes easily with a fork. Shrimp is done when it is pink and curled.<\/p>\n<table class=\"stack\"><thead><tr><th>Fish<\/th><th>Fresh or thawed<\/th><th>Frozen<\/th><\/tr><\/thead><tbody><tr><td>Salmon fillets (1 inch thick)<\/td><td>20 to 30 min<\/td><td>45 to 60 min<\/td><\/tr><tr><td>Cod, tilapia or pollock fillets<\/td><td>15 to 25 min<\/td><td>40 to 50 min<\/td><\/tr><tr><td>Raw shrimp, peeled<\/td><td>15 to 20 min<\/td><td>30 to 40 min<\/td><\/tr><tr><td>Canned or pouch tuna or salmon<\/td><td>Stir in for the last 10 to 15 min to heat through<\/td><td>Not needed<\/td><\/tr><\/tbody><\/table>\n<p><b>Quick thaw:<\/b> to cut the time, put frozen fillets or shrimp in a sealed bag in cold water for 15 to 30 minutes while the base finishes.<\/p>", "gro": "p12-7", "groT": "shrimp and red lentil curry", "src": "p11-11", "macro": "Per bowl: 683 calories · 73 g protein · 70 g carbs · 15 g fat · 13 g fiber · LOW 6 hr or HIGH 3 hr"}, {"id": "m-p11-5", "plan": "p11", "cat": "White Fish", "title": "Mediterranean Cod with Potatoes and Chickpeas", "html": "<div class=\"macro\">Per bowl: 714 calories · 67 g protein · 76 g carbs · 16 g fat · 15 g fiber · LOW 6 hr or HIGH 3 to 4 hr<\/div>\n<p><b>Nutrient highlights:<\/b> selenium (cod), vitamin C (potatoes, tomatoes, green beans), vitamin E (olive oil), lycopene (tomatoes), folate (chickpeas, green beans)<\/p>\n<p><b>Fish:<\/b> 2 1/2 lb cod fillets, fresh or frozen (pollock, haddock or tilapia also work)<\/p>\n<ul><li>2 lb baby potatoes, whole (halve any larger than a golf ball)<\/li><li>1 can (15 oz) no-salt-added chickpeas, drained and rinsed<\/li><li>1 can (14.5 oz) no-salt-added diced tomatoes<\/li><li>1 onion, sliced, and 4 cloves garlic (or 1 tsp garlic powder)<\/li><li>1 bag (12 oz) frozen cut green beans<\/li><li>3 tbsp olive oil<\/li><li>2 tsp dried oregano, 1 tsp paprika, black pepper and 1 lemon<\/li><li>1/4 cup grated Parmesan<\/li><\/ul>\n<p class=\"lead\"><b>Standard: crockpot on LOW (about 6 1/2 hours)<\/b><\/p>\n<ol class=\"steps\"><li>Add the potatoes, chickpeas, tomatoes, onion, garlic, green beans, 2 tbsp of the oil, the oregano and pepper. Stir.<\/li><li>Cook on LOW 6 hours or HIGH 3 to 4 hours, until the potatoes are fork-tender.<\/li><li>Switch to HIGH. Lay the cod on top, brush with the last 1 tbsp oil, and sprinkle with paprika and pepper. Cook until it flakes.<\/li><li>Squeeze the lemon over it. Portion into 4 bowls and top with Parmesan.<\/li><\/ol>\n<p class=\"lead\"><b>Faster: crockpot, all on HIGH (about 3 1/2 to 4 1/2 hours)<\/b><\/p>\n<ol class=\"steps\"><li>Load the base the same way as the standard steps.<\/li><li>Cook on HIGH 3 to 4 hours, until the potatoes are tender.<\/li><li>Add the cod and cook on HIGH until it flakes (see the timing table). Finish with lemon and Parmesan.<\/li><\/ol>\n<p class=\"lead\"><b>Fastest: Instant Pot (about 35 minutes)<\/b><\/p>\n<ol class=\"steps\"><li>Add 1/2 cup water, the potatoes, chickpeas, onion, garlic, green beans, 2 tbsp oil and seasonings. Spoon the tomatoes on top and do not stir.<\/li><li>Pressure cook on HIGH 8 minutes and quick release.<\/li><li>Switch to Sauté on Low. Lay the fish on top, cover with the lid set to Venting, and cook 6 to 10 minutes for fresh or thawed, or 12 to 15 minutes for frozen, until it flakes at 145°F. Finish with lemon and Parmesan.<\/li><\/ol>\n<p class=\"lead\"><b>Fast: stovetop Dutch oven (about 40 minutes)<\/b><\/p>\n<ol class=\"steps\"><li>Bring the potatoes, chickpeas, tomatoes, onion, garlic, 2 tbsp oil, seasonings and 1/2 cup water to a boil. Cover and simmer 20 to 25 minutes, until the potatoes are tender. Add the green beans for the last 8 minutes.<\/li><li>Lay the fish on top, cover and simmer 6 to 10 minutes for fresh or thawed, or 12 to 15 minutes for frozen, until it flakes at 145°F.<\/li><li>Finish with lemon and Parmesan.<\/li><\/ol>\n<h3 id=\"ft-1\">Fish Timing<\/h3>\n<p>Add fish only after the base is hot and the crockpot is on HIGH. Fish is done at 145°F, when it turns opaque and flakes easily with a fork. Shrimp is done when it is pink and curled.<\/p>\n<table class=\"stack\"><thead><tr><th>Fish<\/th><th>Fresh or thawed<\/th><th>Frozen<\/th><\/tr><\/thead><tbody><tr><td>Salmon fillets (1 inch thick)<\/td><td>20 to 30 min<\/td><td>45 to 60 min<\/td><\/tr><tr><td>Cod, tilapia or pollock fillets<\/td><td>15 to 25 min<\/td><td>40 to 50 min<\/td><\/tr><tr><td>Raw shrimp, peeled<\/td><td>15 to 20 min<\/td><td>30 to 40 min<\/td><\/tr><tr><td>Canned or pouch tuna or salmon<\/td><td>Stir in for the last 10 to 15 min to heat through<\/td><td>Not needed<\/td><\/tr><\/tbody><\/table>\n<p><b>Quick thaw:<\/b> to cut the time, put frozen fillets or shrimp in a sealed bag in cold water for 15 to 30 minutes while the base finishes.<\/p>", "gro": "p12-9", "groT": "mediterranean cod with potatoes and chickpeas", "src": "p11-13", "macro": "Per bowl: 714 calories · 67 g protein · 76 g carbs · 16 g fat · 15 g fiber · LOW 6 hr or HIGH 3 to 4 hr"}, {"id": "m-p11-6", "plan": "p11", "cat": "White Fish", "title": "Salsa Verde Tilapia Burrito Bowls", "html": "<div class=\"macro\">Per bowl: 685 calories · 70 g protein · 71 g carbs · 15 g fat · 16 g fiber · HIGH 2 1/2 to 3 hr<\/div>\n<p><b>Nutrient highlights:<\/b> selenium (tilapia), folate (black beans, avocado), vitamin C (peppers, salsa verde), vitamin E (avocado)<\/p>\n<p><b>Fish:<\/b> 2 1/4 lb tilapia fillets, fresh or frozen (cod or pollock also work)<\/p>\n<ul><li>3/4 cup uncooked brown rice<\/li><li>1 can (15 oz) no-salt-added black beans, drained and rinsed<\/li><li>1 cup frozen corn<\/li><li>1 cup salsa verde (lowest sodium you can find)<\/li><li>2 bell peppers and 1 onion, diced (or 3 cups frozen pepper and onion strips)<\/li><li>2 cups low-sodium broth<\/li><li>2 tsp cumin, 1 tsp chili powder, 1 tsp garlic powder<\/li><li>1 1/2 avocados, diced<\/li><li>2/3 cup nonfat plain Greek yogurt mixed with lime juice (crema)<\/li><\/ul>\n<p class=\"lead\"><b>Standard: crockpot on HIGH (about 3 to 3 1/2 hours; this recipe already uses HIGH)<\/b><\/p>\n<ol class=\"steps\"><li>Lightly spray the crock with cooking spray. Add the rice, beans, corn, salsa verde, vegetables, broth and spices. Stir.<\/li><li>Cook on HIGH 2 1/2 to 3 hours, until the rice is tender. Check at 2 hours.<\/li><li>Lay the tilapia on top and sprinkle with cumin and chili powder. Cook until it flakes, then break it into chunks.<\/li><li>Portion into 4 bowls. Top with avocado and lime crema.<\/li><\/ol>\n<p class=\"lead\"><b>Fastest: Instant Pot (about 50 minutes)<\/b><\/p>\n<ol class=\"steps\"><li>Add 1 1/4 cups broth (not 2), the rice, beans, corn, vegetables and spices. Pour the salsa verde on top and do not stir.<\/li><li>Pressure cook on HIGH 22 minutes, then let the pressure release naturally for 10 minutes.<\/li><li>Switch to Sauté on Low. Lay the fish on top, cover with the lid set to Venting, and cook 6 to 10 minutes for fresh or thawed, or 12 to 15 minutes for frozen, until it flakes at 145°F. Top with avocado and lime crema.<\/li><\/ol>\n<p class=\"lead\"><b>Fast: stovetop Dutch oven (about 55 minutes)<\/b><\/p>\n<ol class=\"steps\"><li>Bring 2 cups broth, the salsa verde, beans, corn, vegetables and spices to a boil. Stir in the rice, cover and simmer on low 40 to 45 minutes, until tender.<\/li><li>Lay the fish on top, cover and simmer 6 to 10 minutes for fresh or thawed, or 12 to 15 minutes for frozen, until it flakes at 145°F.<\/li><li>Top with avocado and lime crema.<\/li><\/ol>\n<h3 id=\"ft-1\">Fish Timing<\/h3>\n<p>Add fish only after the base is hot and the crockpot is on HIGH. Fish is done at 145°F, when it turns opaque and flakes easily with a fork. Shrimp is done when it is pink and curled.<\/p>\n<table class=\"stack\"><thead><tr><th>Fish<\/th><th>Fresh or thawed<\/th><th>Frozen<\/th><\/tr><\/thead><tbody><tr><td>Salmon fillets (1 inch thick)<\/td><td>20 to 30 min<\/td><td>45 to 60 min<\/td><\/tr><tr><td>Cod, tilapia or pollock fillets<\/td><td>15 to 25 min<\/td><td>40 to 50 min<\/td><\/tr><tr><td>Raw shrimp, peeled<\/td><td>15 to 20 min<\/td><td>30 to 40 min<\/td><\/tr><tr><td>Canned or pouch tuna or salmon<\/td><td>Stir in for the last 10 to 15 min to heat through<\/td><td>Not needed<\/td><\/tr><\/tbody><\/table>\n<p><b>Quick thaw:<\/b> to cut the time, put frozen fillets or shrimp in a sealed bag in cold water for 15 to 30 minutes while the base finishes.<\/p>", "gro": "p12-10", "groT": "salsa verde tilapia burrito bowls", "src": "p11-14", "macro": "Per bowl: 685 calories · 70 g protein · 71 g carbs · 15 g fat · 16 g fiber · HIGH 2 1/2 to 3 hr"}, {"id": "m-p11-7", "plan": "p11", "cat": "Canned and Pouch Fish", "title": "Creamy Salmon and Potato Chowder", "html": "<div class=\"macro\">Per bowl: 690 calories · 70 g protein · 76 g carbs · 15 g fat · 12 g fiber · about 0.9 g EPA and DHA · LOW 6 hr or HIGH 3 to 4 hr<\/div>\n<p><b>Nutrient highlights:<\/b> omega-3 EPA and DHA (salmon), vitamin E (sunflower seeds), vitamin A and C (carrots, potatoes), folate (white beans)<\/p>\n<p><b>Fish:<\/b> 12 pouches (2.6 oz) pink salmon<\/p>\n<ul><li>1 1/2 lb potatoes, cut into 1-inch cubes<\/li><li>2 carrots and 3 celery stalks, sliced<\/li><li>1 onion, diced<\/li><li>1 cup frozen corn<\/li><li>2 cans (15 oz) no-salt-added cannellini beans, drained and rinsed (use about 2 cups)<\/li><li>3 cups low-sodium broth<\/li><li>1 tbsp olive oil, 1 tsp dried thyme, 1 tsp garlic powder, 1 bay leaf, black pepper<\/li><li>2 cups 2% milk<\/li><li>1 cup nonfat plain Greek yogurt<\/li><li>1/4 cup unsalted sunflower seeds<\/li><\/ul>\n<p class=\"lead\"><b>Standard: crockpot on LOW (about 6 1/2 hours)<\/b><\/p>\n<ol class=\"steps\"><li>Add the potatoes, carrots, celery, onion, corn, beans, broth, oil and seasonings. Stir.<\/li><li>Cook on LOW 6 hours or HIGH 3 to 4 hours, until the potatoes are tender.<\/li><li>Remove the bay leaf. Mash about a third of the potatoes and beans against the side of the crock to thicken it.<\/li><li>Switch to HIGH. Stir in the milk and the salmon from the pouches. Heat for 10 to 15 minutes.<\/li><li>Turn off the heat and stir in the yogurt. Portion into 4 bowls and top with sunflower seeds.<\/li><\/ol>\n<p class=\"lead\"><b>Faster: crockpot, all on HIGH (about 3 1/2 to 4 1/2 hours)<\/b><\/p>\n<ol class=\"steps\"><li>Load the base the same way as the standard steps.<\/li><li>Cook on HIGH 3 to 4 hours, until the potatoes are tender.<\/li><li>Mash some of the potatoes and beans, stir in the milk and salmon, and heat 10 to 15 minutes. Turn off the heat and stir in the yogurt.<\/li><\/ol>\n<p class=\"lead\"><b>Fastest: Instant Pot (about 25 minutes)<\/b><\/p>\n<ol class=\"steps\"><li>Add the broth, potatoes, carrots, celery, onion, corn, beans, oil and seasonings.<\/li><li>Pressure cook on HIGH 5 minutes and quick release. Remove the bay leaf and mash some of the potatoes and beans.<\/li><li>Switch to Sauté on Low. Stir in the milk and salmon and heat 3 to 5 minutes without boiling. Turn off the heat and stir in the yogurt.<\/li><\/ol>\n<p class=\"lead\"><b>Fast: stovetop soup pot (about 30 minutes)<\/b><\/p>\n<ol class=\"steps\"><li>Bring the broth, potatoes, carrots, celery, onion, corn, beans, oil and seasonings to a boil. Cover and simmer 15 to 20 minutes, until the potatoes are tender.<\/li><li>Mash some of the potatoes and beans. Stir in the milk and salmon and heat 3 to 5 minutes without boiling.<\/li><li>Turn off the heat and stir in the yogurt. Top with sunflower seeds.<\/li><\/ol>\n<p><b>Fresh swap:<\/b> lay 1 3/4 lb fresh or frozen skinless salmon on top at step 4 of the standard steps instead of the pouches. Cook it until it flakes, then break it into the chowder. This adds about 6 g fat per bowl. You could also use 2 lb cod, which gives about 5 g less protein per bowl.<\/p>\n<h3 id=\"ft-1\">Fish Timing<\/h3>\n<p>Add fish only after the base is hot and the crockpot is on HIGH. Fish is done at 145°F, when it turns opaque and flakes easily with a fork. Shrimp is done when it is pink and curled.<\/p>\n<table class=\"stack\"><thead><tr><th>Fish<\/th><th>Fresh or thawed<\/th><th>Frozen<\/th><\/tr><\/thead><tbody><tr><td>Salmon fillets (1 inch thick)<\/td><td>20 to 30 min<\/td><td>45 to 60 min<\/td><\/tr><tr><td>Cod, tilapia or pollock fillets<\/td><td>15 to 25 min<\/td><td>40 to 50 min<\/td><\/tr><tr><td>Raw shrimp, peeled<\/td><td>15 to 20 min<\/td><td>30 to 40 min<\/td><\/tr><tr><td>Canned or pouch tuna or salmon<\/td><td>Stir in for the last 10 to 15 min to heat through<\/td><td>Not needed<\/td><\/tr><\/tbody><\/table>\n<p><b>Quick thaw:<\/b> to cut the time, put frozen fillets or shrimp in a sealed bag in cold water for 15 to 30 minutes while the base finishes.<\/p>", "gro": "p12-12", "groT": "creamy salmon and potato chowder", "src": "p11-16", "macro": "Per bowl: 690 calories · 70 g protein · 76 g carbs · 15 g fat · 12 g fiber · about 0.9 g EPA and DHA · LOW 6 hr or HIGH 3 to 4 hr"}, {"id": "m-p11-8", "plan": "p11", "cat": "Canned and Pouch Fish", "title": "Tuna and Brown Rice Casserole", "html": "<div class=\"macro\">Per bowl: 697 calories · 70 g protein · 72 g carbs · 16 g fat · 10 g fiber · HIGH 2 1/2 to 3 hr<\/div>\n<p><b>Nutrient highlights:<\/b> selenium (tuna, very high), folate (broccoli, peas), vitamin C (broccoli), L-arginine (tuna, peas)<\/p>\n<p><b>Fish:<\/b> 8 cans (5 oz) light tuna in water, drained<\/p>\n<ul><li>1 1/4 cups uncooked brown rice<\/li><li>8 oz sliced mushrooms<\/li><li>1 onion, diced<\/li><li>3 cups low-sodium broth<\/li><li>2 tbsp olive oil (1 tbsp to grease the crock, 1 tbsp in the pot)<\/li><li>1 tsp garlic powder, 1 tsp dried thyme, 1 tbsp Dijon mustard, black pepper<\/li><li>2 bags (12 oz) frozen broccoli florets and 2 cups frozen peas<\/li><li>1 cup 2% milk<\/li><li>1 cup nonfat plain Greek yogurt<\/li><li>1/2 cup grated Parmesan<\/li><\/ul>\n<p class=\"lead\"><b>Standard: crockpot on HIGH (about 3 hours; this recipe already uses HIGH)<\/b><\/p>\n<ol class=\"steps\"><li>Rub the crock with 1 tbsp oil. Add the rice, mushrooms, onion, broth, the rest of the oil and the seasonings. Stir.<\/li><li>Cook on HIGH 2 hours.<\/li><li>Stir in the frozen broccoli and peas. Cook 30 to 45 minutes more, until the rice is tender.<\/li><li>Stir in the tuna and milk and heat for 10 to 15 minutes.<\/li><li>Turn off the heat and stir in the yogurt and Parmesan. Portion into 4 bowls.<\/li><\/ol>\n<p class=\"lead\"><b>Fastest: Instant Pot (about 50 minutes)<\/b><\/p>\n<ol class=\"steps\"><li>Add 1 1/2 cups broth (not 3), the rice, mushrooms, onion, oil and seasonings.<\/li><li>Pressure cook on HIGH 22 minutes, then let the pressure release naturally for 10 minutes.<\/li><li>Switch to Sauté. Stir in the frozen broccoli and peas and cook 4 to 5 minutes. Stir in the tuna and milk and heat 2 to 3 minutes. Turn off the heat and stir in the yogurt and Parmesan.<\/li><\/ol>\n<p class=\"lead\"><b>Fast: stovetop Dutch oven (about 55 minutes)<\/b><\/p>\n<ol class=\"steps\"><li>Bring 3 cups broth, the mushrooms, onion, oil and seasonings to a boil. Stir in the rice, cover and simmer on low 30 minutes.<\/li><li>Stir in the broccoli and peas, cover and cook 10 to 15 minutes more, until the rice is tender.<\/li><li>Stir in the tuna and milk and heat through. Turn off the heat and stir in the yogurt and Parmesan.<\/li><\/ol>\n<p><b>Fresh swap:<\/b> use 2 lb fresh or frozen cod or pollock. Lay it on top at step 4 of the standard steps, cook until it flakes, and break it in. This gives about 4 g less protein per bowl.<\/p>\n<h3 id=\"ft-1\">Fish Timing<\/h3>\n<p>Add fish only after the base is hot and the crockpot is on HIGH. Fish is done at 145°F, when it turns opaque and flakes easily with a fork. Shrimp is done when it is pink and curled.<\/p>\n<table class=\"stack\"><thead><tr><th>Fish<\/th><th>Fresh or thawed<\/th><th>Frozen<\/th><\/tr><\/thead><tbody><tr><td>Salmon fillets (1 inch thick)<\/td><td>20 to 30 min<\/td><td>45 to 60 min<\/td><\/tr><tr><td>Cod, tilapia or pollock fillets<\/td><td>15 to 25 min<\/td><td>40 to 50 min<\/td><\/tr><tr><td>Raw shrimp, peeled<\/td><td>15 to 20 min<\/td><td>30 to 40 min<\/td><\/tr><tr><td>Canned or pouch tuna or salmon<\/td><td>Stir in for the last 10 to 15 min to heat through<\/td><td>Not needed<\/td><\/tr><\/tbody><\/table>\n<p><b>Quick thaw:<\/b> to cut the time, put frozen fillets or shrimp in a sealed bag in cold water for 15 to 30 minutes while the base finishes.<\/p>", "gro": "p12-13", "groT": "tuna and brown rice casserole", "src": "p11-17", "macro": "Per bowl: 697 calories · 70 g protein · 72 g carbs · 16 g fat · 10 g fiber · HIGH 2 1/2 to 3 hr"}, {"id": "m-p13-1", "plan": "p13", "cat": "Asian Stir-Fry", "title": "Chicken and Broccoli Stir-Fry", "html": "<div class=\"macro\">731 calories · 71 g protein · 72 g carbs · 18 g fat · 12 g fiber · 20 minutes<\/div>\n<p><b>Nutrient highlights:<\/b> vitamin C and folate (broccoli), selenium (chicken), ALA and folate (edamame)<\/p>\n<ul><li>8 oz boneless skinless chicken breast (or pre-cut stir-fry strips)<\/li><li>3/4 cup cooked brown rice (a microwave cup works)<\/li><li>2 cups broccoli florets, fresh or frozen<\/li><li>1/2 cup shelled edamame<\/li><li>Sauce: 1 tbsp low-sodium soy sauce, 1 tsp honey, 1 tsp cornstarch, 2 tbsp water, 1/2 tsp garlic, 1/2 tsp ginger<\/li><li>1 tsp toasted sesame oil and 1 tsp sesame seeds<\/li><\/ul>\n<ol class=\"steps\"><li>Whisk the sauce in a small bowl.<\/li><li>Slice the chicken into thin strips, or buy pre-cut strips to skip the cutting.<\/li><li>Heat the sesame oil in a large nonstick skillet over medium-high. Cook the chicken 5 to 6 minutes, until it reaches 165°F. Move it to a plate.<\/li><li>Add the broccoli, edamame and 2 tbsp water. Cover and steam 3 to 4 minutes.<\/li><li>Return the chicken, pour in the sauce and stir 1 minute until glossy. Serve over the rice with sesame seeds.<\/li><\/ol>", "gro": "p14-3", "groT": "chicken and broccoli stirfry", "src": "p13-4", "macro": "731 calories · 71 g protein · 72 g carbs · 18 g fat · 12 g fiber · 20 minutes"}, {"id": "m-p13-2", "plan": "p13", "cat": "Asian Stir-Fry", "title": "Korean Beef Rice Bowl", "html": "<div class=\"macro\">758 calories · 75 g protein · 70 g carbs · 20 g fat · 11 g fiber · 15 minutes<\/div>\n<p><b>Nutrient highlights:<\/b> zinc (beef), folate (spinach, edamame), vitamin A (carrots)<\/p>\n<ul><li>8 oz 95% lean ground beef<\/li><li>3/4 cup cooked brown rice<\/li><li>2/3 cup shelled edamame<\/li><li>1/2 cup shredded carrots and 1/2 cup sliced cucumber<\/li><li>2 cups baby spinach<\/li><li>Sauce: 1 tbsp low-sodium soy sauce, 1 1/2 tsp honey, 1/2 tsp garlic, 1/2 tsp ginger, pinch of red pepper flakes<\/li><li>1/4 cup nonfat plain Greek yogurt with a squeeze of sriracha<\/li><li>1 tsp sesame seeds<\/li><\/ul>\n<ol class=\"steps\"><li>Brown the beef in a nonstick skillet over medium-high for 6 to 8 minutes, breaking it up, until it reaches 160°F.<\/li><li>Stir in the sauce and cook 1 minute.<\/li><li>Add the spinach and stir until it wilts. Warm the edamame in the microwave.<\/li><li>Build the bowl: rice, beef and spinach, edamame, carrots and cucumber. Top with the sriracha yogurt and sesame seeds.<\/li><\/ol>", "gro": "p14-4", "groT": "korean beef rice bowl", "src": "p13-5", "macro": "758 calories · 75 g protein · 70 g carbs · 20 g fat · 11 g fiber · 15 minutes"}, {"id": "m-p13-3", "plan": "p13", "cat": "Asian Stir-Fry", "title": "Shrimp Fried Rice", "html": "<div class=\"macro\">726 calories · 76 g protein · 71 g carbs · 15 g fat · 11 g fiber · 15 minutes<\/div>\n<p><b>Nutrient highlights:<\/b> selenium (shrimp, eggs), folate (peas, edamame), vitamin A (carrots)<\/p>\n<ul><li>7 oz raw shrimp, peeled and deveined<\/li><li>3/4 cup plus 2 tbsp cooked brown rice, cold (day-old or microwave cups)<\/li><li>1/2 cup liquid egg whites and 1 whole egg<\/li><li>1/2 cup frozen peas and 1/2 cup diced carrots (or 1 cup frozen peas and carrots)<\/li><li>1/3 cup shelled edamame<\/li><li>1/4 cup diced onion and sliced green onions<\/li><li>1 tbsp low-sodium soy sauce, 1/2 tsp garlic<\/li><li>1 tsp oil<\/li><\/ul>\n<ol class=\"steps\"><li>Heat the oil in a large nonstick skillet over medium-high. Cook the shrimp 2 to 3 minutes until pink. Move them to a plate.<\/li><li>Add the onion, peas, carrots and edamame. Cook 3 minutes.<\/li><li>Push the vegetables aside, pour in the egg whites and egg, and scramble 1 to 2 minutes.<\/li><li>Add the cold rice, soy sauce and garlic. Stir-fry 2 to 3 minutes, pressing the rice against the pan so it crisps.<\/li><li>Stir the shrimp back in and top with green onions.<\/li><\/ol>", "gro": "p14-5", "groT": "shrimp fried rice", "src": "p13-6", "macro": "726 calories · 76 g protein · 71 g carbs · 15 g fat · 11 g fiber · 15 minutes"}, {"id": "m-p13-4", "plan": "p13", "cat": "Italian", "title": "Spaghetti Bolognese with White Beans", "html": "<div class=\"macro\">718 calories · 69 g protein · 71 g carbs · 18 g fat · 13 g fiber · 20 minutes<\/div>\n<p><b>Nutrient highlights:<\/b> zinc (beef), lycopene (marinara), folate (white beans, spinach)<\/p>\n<ul><li>1 3/4 oz dry whole wheat spaghetti (about 3/4 cup cooked)<\/li><li>8 oz 95% lean ground beef<\/li><li>3/4 cup low-sodium marinara sauce<\/li><li>1/3 cup no-salt-added cannellini beans, rinsed<\/li><li>2 cups baby spinach<\/li><li>1/4 cup diced onion, 1/2 tsp garlic, Italian seasoning<\/li><li>1 1/2 tbsp grated Parmesan<\/li><\/ul>\n<ol class=\"steps\"><li>Cook the spaghetti following the package directions.<\/li><li>Brown the beef and onion in a nonstick skillet for 6 to 8 minutes, until the beef reaches 160°F.<\/li><li>Add the marinara, beans, garlic and Italian seasoning. Mash a few beans to thicken the sauce. Simmer 5 minutes.<\/li><li>Stir in the spinach until it wilts. Serve over the spaghetti with Parmesan.<\/li><\/ol>", "gro": "p14-7", "groT": "spaghetti bolognese with white beans", "src": "p13-8", "macro": "718 calories · 69 g protein · 71 g carbs · 18 g fat · 13 g fiber · 20 minutes"}, {"id": "m-p13-5", "plan": "p13", "cat": "Italian", "title": "Baked Chicken Parmesan", "html": "<div class=\"macro\">701 calories · 72 g protein · 72 g carbs · 15 g fat · 13 g fiber · 30 minutes<\/div>\n<p><b>Nutrient highlights:<\/b> selenium (chicken), lycopene (marinara), vitamin C (broccoli)<\/p>\n<ul><li>7 oz boneless skinless chicken breast (1 breast)<\/li><li>1/4 cup whole wheat panko and 2 tbsp liquid egg whites<\/li><li>1/2 cup low-sodium marinara sauce<\/li><li>3 tbsp shredded part-skim mozzarella<\/li><li>1 1/2 oz dry whole wheat spaghetti (about 3/4 cup cooked)<\/li><li>1 1/2 cups broccoli florets<\/li><li>3 tbsp no-salt-added cannellini beans, mashed into the marinara<\/li><li>1 tbsp grated Parmesan, Italian seasoning, cooking spray<\/li><\/ul>\n<ol class=\"steps\"><li>Heat the oven to 425°F. Dip the whole chicken breast in the egg whites, then press it into the panko mixed with Italian seasoning.<\/li><li>Bake on a sprayed sheet pan for 18 to 20 minutes, with the broccoli on the same pan for the last 12 minutes.<\/li><li>Top the chicken with 1/4 cup marinara and the mozzarella. Bake 3 to 5 minutes more, until the cheese melts and the chicken reaches 165°F.<\/li><li>Cook the spaghetti. Warm the rest of the marinara with the mashed beans and toss it with the pasta. Serve with the chicken, broccoli and Parmesan.<\/li><\/ol>", "gro": "p14-8", "groT": "baked chicken parmesan", "src": "p13-9", "macro": "701 calories · 72 g protein · 72 g carbs · 15 g fat · 13 g fiber · 30 minutes"}, {"id": "m-p13-6", "plan": "p13", "cat": "Italian", "title": "Tuscan Shrimp and White Bean Pasta", "html": "<div class=\"macro\">704 calories · 72 g protein · 76 g carbs · 16 g fat · 15 g fiber · 20 minutes<\/div>\n<p><b>Nutrient highlights:<\/b> selenium (shrimp), lycopene (tomatoes), folate (white beans, spinach), vitamin E (olive oil)<\/p>\n<ul><li>8 to 9 oz raw shrimp, peeled and deveined<\/li><li>2 oz dry whole wheat penne (about 1 cup cooked)<\/li><li>1/2 cup no-salt-added cannellini beans, rinsed<\/li><li>1 cup cherry tomatoes, halved<\/li><li>2 cups baby spinach<\/li><li>2 tsp olive oil, 1/2 tsp garlic, pinch of red pepper flakes, Italian seasoning, juice of 1/2 lemon<\/li><li>1 1/2 tbsp grated Parmesan<\/li><\/ul>\n<ol class=\"steps\"><li>Cook the penne. Save 1/4 cup of the pasta water.<\/li><li>Heat the oil in a skillet over medium-high. Cook the tomatoes and garlic 3 minutes, until the tomatoes burst.<\/li><li>Add the shrimp and seasonings and cook 2 to 3 minutes, until pink.<\/li><li>Stir in the beans, spinach, pasta and a splash of pasta water. Toss 1 minute. Finish with lemon and Parmesan.<\/li><\/ol>", "gro": "p14-9", "groT": "tuscan shrimp and white bean pasta", "src": "p13-10", "macro": "704 calories · 72 g protein · 76 g carbs · 16 g fat · 15 g fiber · 20 minutes"}, {"id": "m-p13-7", "plan": "p13", "cat": "Sheet-Pan Meals (4 servings each)", "title": "Lemon Herb Chicken, Potatoes and Chickpeas", "html": "<div class=\"macro\">Per serving: 743 calories · 74 g protein · 75 g carbs · 17 g fat · 16 g fiber · 10 minutes hands-on, 35 minutes in the oven<\/div>\n<p><b>Nutrient highlights:<\/b> selenium (chicken), folate (chickpeas, green beans), vitamin C (potatoes, lemon), vitamin E (olive oil)<\/p>\n<ul><li>2 lb boneless skinless chicken breasts, whole<\/li><li>1 1/2 lb baby potatoes, halved<\/li><li>1 lb green beans, fresh or frozen<\/li><li>2 cans (15 oz) no-salt-added chickpeas, drained, rinsed and patted dry<\/li><li>2 tbsp olive oil, juice and zest of 1 lemon, 1 tsp garlic powder, 1 tsp oregano, 1 tsp thyme, black pepper<\/li><li>Sauce: 1 cup nonfat plain Greek yogurt, lemon juice, dill and garlic<\/li><\/ul>\n<ol class=\"steps\"><li>Heat the oven to 425°F. Toss the potatoes and chickpeas with 1 tbsp oil and half the seasoning on a large sheet pan. Roast 15 minutes.<\/li><li>Rub the chicken with the rest of the oil, seasoning and lemon zest. Push the potatoes aside and add the chicken and green beans.<\/li><li>Roast 20 to 25 minutes more, until the chicken reaches 165°F.<\/li><li>Rest the chicken 5 minutes, then slice it. Squeeze the lemon over the pan and divide into 4 containers with 1/4 cup sauce each.<\/li><\/ol>", "gro": "p14-11", "groT": "lemon herb chicken potatoes and chickpeas", "src": "p13-12", "macro": "Per serving: 743 calories · 74 g protein · 75 g carbs · 17 g fat · 16 g fiber · 10 minutes hands-on, 35 minutes in the oven"}, {"id": "m-p13-8", "plan": "p13", "cat": "Sheet-Pan Meals (4 servings each)", "title": "Salmon, Sweet Potatoes and Broccoli", "html": "<div class=\"macro\">Per serving: 700 calories · 68 g protein · 74 g carbs · 17 g fat · 16 g fiber · 10 minutes hands-on, 35 minutes in the oven · counts as a fish meal<\/div>\n<p><b>Nutrient highlights:<\/b> omega-3 EPA and DHA (salmon), vitamin A and C (sweet potatoes, broccoli), folate (chickpeas)<\/p>\n<ul><li>2 lb skinless salmon fillets, fresh or thawed (wild sockeye or coho is leanest)<\/li><li>2 lb sweet potatoes, cut into 1-inch cubes (or frozen cubed)<\/li><li>1 1/4 lb broccoli florets (or 2 bags, 12 oz, frozen)<\/li><li>1 can (15 oz) no-salt-added chickpeas, drained and patted dry<\/li><li>1 tbsp olive oil, 1 tsp smoked paprika, 1 tsp garlic powder, black pepper<\/li><li>Sauce: 2/3 cup nonfat plain Greek yogurt, 1 tbsp Dijon mustard, lemon juice<\/li><\/ul>\n<ol class=\"steps\"><li>Heat the oven to 425°F. Toss the sweet potatoes and chickpeas with half the oil and seasoning. Roast 20 minutes.<\/li><li>Add the broccoli to the pan and lay the salmon on top. Brush the salmon with the rest of the oil and seasoning.<\/li><li>Roast 12 to 15 minutes more, until the salmon flakes and reaches 145°F.<\/li><li>Divide into 4 containers. Serve each with about 2 1/2 tbsp sauce.<\/li><\/ol>", "gro": "p14-12", "groT": "salmon sweet potatoes and broccoli", "src": "p13-13", "macro": "Per serving: 700 calories · 68 g protein · 74 g carbs · 17 g fat · 16 g fiber · 10 minutes hands-on, 35 minutes in the oven · counts as a fish meal"}, {"id": "m-p13-9", "plan": "p13", "cat": "Sheet-Pan Meals (4 servings each)", "title": "Cajun Shrimp Bake", "html": "<div class=\"macro\">Per serving: 668 calories · 71 g protein · 70 g carbs · 15 g fat · 13 g fiber · 10 minutes hands-on, 30 minutes in the oven<\/div>\n<p><b>Nutrient highlights:<\/b> selenium (shrimp), folate (kidney beans, green beans), vitamin C (potatoes)<\/p>\n<ul><li>2 1/2 lb raw shrimp, peeled and deveined (thawed if frozen)<\/li><li>1 1/2 lb baby potatoes, halved<\/li><li>2 1/2 cups frozen corn (or 4 small ears, cut into rounds)<\/li><li>1 lb green beans<\/li><li>1 can (15 oz) no-salt-added kidney beans, drained and patted dry<\/li><li>3 tbsp olive oil, 2 tbsp salt-free Cajun seasoning, 1 tsp garlic powder, 1 lemon<\/li><\/ul>\n<ol class=\"steps\"><li>Heat the oven to 425°F. Toss the potatoes with 1 tbsp oil and some seasoning. Roast 15 minutes.<\/li><li>Add the corn, green beans and kidney beans with 1 tbsp oil and more seasoning. Roast 8 minutes.<\/li><li>Toss the shrimp with the last 1 tbsp oil and seasoning and spread it over the pan. Roast 6 to 8 minutes, until pink.<\/li><li>Squeeze the lemon over everything and divide into 4 containers.<\/li><\/ol>", "gro": "p14-13", "groT": "cajun shrimp bake", "src": "p13-14", "macro": "Per serving: 668 calories · 71 g protein · 70 g carbs · 15 g fat · 13 g fiber · 10 minutes hands-on, 30 minutes in the oven"}, {"id": "m-p13-10", "plan": "p13", "cat": "American", "title": "Burger and Sweet Potato Fries", "html": "<div class=\"macro\">730 calories · 73 g protein · 75 g carbs · 14 g fat · 11 g fiber · 30 minutes<\/div>\n<p><b>Nutrient highlights:<\/b> zinc and selenium (beef), vitamin A (sweet potato), lycopene (tomato)<\/p>\n<ul><li>8 oz 95% lean ground beef<\/li><li>1 100% whole wheat bun (or 2 slices whole wheat bread)<\/li><li>1 medium sweet potato, cut into fries<\/li><li>Lettuce and tomato slices<\/li><li>1/2 cup nonfat plain Greek yogurt mixed with mustard and dill relish (burger sauce and fry dip)<\/li><li>Salt-free burger seasoning or garlic and onion powder, cooking spray<\/li><\/ul>\n<ol class=\"steps\"><li>Heat the oven to 425°F. Spray the fries, sprinkle with paprika and bake 25 minutes, flipping once.<\/li><li>Shape the beef into a patty and season it. Cook in a skillet or on a grill 4 to 5 minutes per side, until it reaches 160°F.<\/li><li>Build the burger with lettuce, tomato and 2 tbsp sauce. Use the rest as a fry dip.<\/li><\/ol>", "gro": "p14-15", "groT": "burger and sweet potato fries", "src": "p13-16", "macro": "730 calories · 73 g protein · 75 g carbs · 14 g fat · 11 g fiber · 30 minutes"}, {"id": "m-p13-11", "plan": "p13", "cat": "American", "title": "BBQ Chicken Plate with Black-Eyed Peas and Greens", "html": "<div class=\"macro\">705 calories · 73 g protein · 76 g carbs · 12 g fat · 16 g fiber · 30 minutes<\/div>\n<p><b>Nutrient highlights:<\/b> folate (black-eyed peas, collards), vitamin C (potato, collards), selenium (chicken)<\/p>\n<ul><li>8 oz boneless skinless chicken breast<\/li><li>2 tbsp BBQ sauce (lowest sugar and sodium you can find)<\/li><li>1 medium potato (about 7 oz)<\/li><li>1/2 cup no-salt-added black-eyed peas, rinsed<\/li><li>1 cup frozen chopped collard greens<\/li><li>1/4 cup nonfat plain Greek yogurt (for the potato)<\/li><li>1 tsp olive oil, 1 tsp vinegar, garlic powder, red pepper flakes, black pepper<\/li><\/ul>\n<ol class=\"steps\"><li>Pierce the potato and microwave it 6 to 8 minutes, until soft.<\/li><li>Season the whole chicken breast and cook it on a grill or grill pan 6 to 7 minutes per side. Brush with BBQ sauce for the last 2 minutes. Cook to 165°F.<\/li><li>Cook the collards in the oil with garlic and red pepper flakes for 5 minutes. Stir in the black-eyed peas and vinegar and heat through.<\/li><li>Split the potato and top it with the yogurt. Slice the chicken and serve with the greens and peas.<\/li><\/ol>", "gro": "p14-16", "groT": "bbq chicken plate with blackeyed peas and greens", "src": "p13-17", "macro": "705 calories · 73 g protein · 76 g carbs · 12 g fat · 16 g fiber · 30 minutes"}, {"id": "m-p13-12", "plan": "p13", "cat": "American", "title": "Lentil Sloppy Joe", "html": "<div class=\"macro\">702 calories · 70 g protein · 76 g carbs · 14 g fat · 19 g fiber · 20 minutes<\/div>\n<p><b>Nutrient highlights:<\/b> zinc (beef), folate and L-arginine (lentils), lycopene (tomato sauce), vitamin A (carrots)<\/p>\n<ul><li>7 oz 95% lean ground beef<\/li><li>1/2 cup cooked lentils (canned, rinsed)<\/li><li>1/2 cup no-salt-added tomato sauce and 1 tbsp tomato paste<\/li><li>1/4 cup diced onion and 1/2 cup diced bell pepper<\/li><li>1 100% whole wheat bun<\/li><li>3/4 cup baby carrots<\/li><li>1/4 cup nonfat plain Greek yogurt with dill and garlic powder (dip)<\/li><li>1 tsp Dijon mustard, 1 tsp vinegar, 1/2 tsp chili powder, garlic powder<\/li><\/ul>\n<ol class=\"steps\"><li>Brown the beef with the onion and pepper for 6 to 8 minutes, until the beef reaches 160°F.<\/li><li>Stir in the lentils, tomato sauce, paste, mustard, vinegar and spices. Simmer 5 minutes.<\/li><li>Spoon onto the bun. Serve with the carrots and yogurt dip.<\/li><\/ol>", "gro": "p14-17", "groT": "lentil sloppy joe", "src": "p13-18", "macro": "702 calories · 70 g protein · 76 g carbs · 14 g fat · 19 g fiber · 20 minutes"}, {"id": "m-p13-13", "plan": "p13", "cat": "Mexican", "title": "Chicken Enchilada Skillet", "html": "<div class=\"macro\">710 calories · 76 g protein · 74 g carbs · 12 g fat · 17 g fiber · 25 minutes<\/div>\n<p><b>Nutrient highlights:<\/b> folate (black beans), vitamin C (peppers), lycopene (tomato sauce), selenium (chicken)<\/p>\n<ul><li>8 oz boneless skinless chicken breast<\/li><li>3 corn tortillas, torn into strips<\/li><li>1/2 cup no-salt-added black beans, rinsed<\/li><li>1/2 cup no-salt-added tomato sauce + 1 tsp chili powder, 1/2 tsp cumin, 1/2 tsp garlic powder (enchilada sauce)<\/li><li>1/4 cup diced onion and 1/2 cup diced bell pepper<\/li><li>2 tbsp shredded reduced-fat cheddar<\/li><li>1/4 cup nonfat plain Greek yogurt and 2 tbsp salsa<\/li><\/ul>\n<ol class=\"steps\"><li>Cook the whole chicken breast in a covered nonstick skillet with a splash of water for 6 to 7 minutes per side, until it reaches 165°F. Shred it with two forks.<\/li><li>Add the onion and pepper to the pan and cook 3 minutes.<\/li><li>Stir in the sauce, beans, chicken and tortilla strips. Simmer 5 minutes.<\/li><li>Sprinkle the cheese, cover 1 minute to melt, and top with yogurt and salsa.<\/li><\/ol>", "gro": "p14-19", "groT": "chicken enchilada skillet", "src": "p13-20", "macro": "710 calories · 76 g protein · 74 g carbs · 12 g fat · 17 g fiber · 25 minutes"}, {"id": "m-p13-14", "plan": "p13", "cat": "Mexican", "title": "Shrimp Tacos with Mango Slaw", "html": "<div class=\"macro\">710 calories · 71 g protein · 76 g carbs · 16 g fat · 18 g fiber · 15 minutes<\/div>\n<p><b>Nutrient highlights:<\/b> selenium (shrimp), vitamin C (mango, cabbage), folate (pinto beans, avocado)<\/p>\n<ul><li>9 oz raw shrimp, peeled and deveined<\/li><li>3 corn tortillas<\/li><li>1/3 cup no-salt-added pinto beans, warmed<\/li><li>1 cup coleslaw mix and 1/3 cup diced mango (fresh or thawed frozen)<\/li><li>1/3 avocado, sliced<\/li><li>1/4 cup nonfat plain Greek yogurt with lime juice (crema)<\/li><li>1 tsp oil, salt-free chili-lime or taco seasoning, 1 lime<\/li><\/ul>\n<ol class=\"steps\"><li>Toss the slaw and mango with a squeeze of lime.<\/li><li>Season the shrimp. Cook in the oil over medium-high 2 to 3 minutes, until pink.<\/li><li>Warm the tortillas in a dry skillet. Fill with shrimp, slaw and avocado, and top with crema.<\/li><li>Serve the pinto beans on the side.<\/li><\/ol>", "gro": "p14-20", "groT": "shrimp tacos with mango slaw", "src": "p13-21", "macro": "710 calories · 71 g protein · 76 g carbs · 16 g fat · 18 g fiber · 15 minutes"}, {"id": "m-p13-15", "plan": "p13", "cat": "Mexican", "title": "Beef Taco Salad", "html": "<div class=\"macro\">724 calories · 70 g protein · 73 g carbs · 18 g fat · 18 g fiber · 20 minutes<\/div>\n<p><b>Nutrient highlights:<\/b> zinc (beef), folate (black beans, romaine), lycopene (tomatoes, salsa), vitamin E (avocado)<\/p>\n<ul><li>7 to 8 oz 95% lean ground beef<\/li><li>2 cups chopped romaine<\/li><li>1/2 cup no-salt-added black beans, rinsed<\/li><li>1/2 cup corn and 1/2 cup cherry tomatoes<\/li><li>2 corn tortillas, cut into strips and baked<\/li><li>1/4 cup salsa<\/li><li>1/3 cup nonfat plain Greek yogurt<\/li><li>2 tbsp mashed avocado or guacamole<\/li><li>Salt-free taco seasoning, cooking spray<\/li><\/ul>\n<ol class=\"steps\"><li>Heat the oven to 400°F. Spray the tortilla strips and bake 8 to 10 minutes until crisp.<\/li><li>Brown the beef with taco seasoning and a splash of water for 6 to 8 minutes, until it reaches 160°F.<\/li><li>Warm the beans and corn.<\/li><li>Top the romaine with beef, beans, corn, tomatoes and tortilla strips. Mix the yogurt with half the salsa for dressing and add the avocado.<\/li><\/ol>", "gro": "p14-21", "groT": "beef taco salad", "src": "p13-22", "macro": "724 calories · 70 g protein · 73 g carbs · 18 g fat · 18 g fiber · 20 minutes"}, {"id": "m-p13-16", "plan": "p13", "cat": "Crockpot (5 portions each)", "title": "Chicken Tikka Masala with Chickpeas", "html": "<div class=\"macro\">Per portion: 731 calories · 75 g protein · 72 g carbs · 16 g fat · 13 g fiber · LOW 5 to 6 hr, then HIGH 2 to 2 1/2 hr<\/div>\n<p><b>Nutrient highlights:<\/b> lycopene (tomatoes, paste), folate (chickpeas, spinach), selenium (chicken thighs)<\/p>\n<ul><li>3 lb boneless skinless chicken thighs, whole<\/li><li>2 cans (15 oz) no-salt-added chickpeas, rinsed<\/li><li>2 cans (14.5 oz) no-salt-added diced tomatoes<\/li><li>2 tbsp tomato paste<\/li><li>1 cup frozen diced onion<\/li><li>1 cup uncooked brown rice and 2 1/2 cups low-sodium chicken broth<\/li><li>1 box or bag (10 oz) frozen chopped spinach<\/li><li>1 1/4 cups nonfat plain Greek yogurt<\/li><li>2 tbsp garam masala, 1 tsp cumin, 1 tsp paprika, 1 tsp ginger, 1 tbsp jarred garlic<\/li><\/ul>\n<p class=\"lead\"><b>Standard: crockpot, LOW then HIGH (about 7 to 8 1/2 hours)<\/b><\/p>\n<ol class=\"steps\"><li>Add the tomatoes, paste, onion, chickpeas, garlic and spices to the crockpot. Stir, then lay the thighs on top.<\/li><li>Cook on LOW 5 to 6 hours. Shred the chicken in the pot.<\/li><li>Stir in the rice, broth and frozen spinach. Switch to HIGH and cook 2 to 2 1/2 hours, until the rice is tender. Stir once halfway.<\/li><li>Turn off the heat and stir in the yogurt. Divide into 5 containers.<\/li><\/ol>\n<p class=\"lead\"><b>Faster: crockpot, all on HIGH (about 4 1/2 to 5 1/2 hours)<\/b><\/p>\n<ol class=\"steps\"><li>Load the pot the same way as the standard steps.<\/li><li>Cook on HIGH 2 1/2 to 3 hours. Shred the chicken.<\/li><li>Stir in the rice, broth and spinach. Cook on HIGH 2 to 2 1/2 hours more, stirring once halfway. Turn off the heat and stir in the yogurt.<\/li><\/ol>\n<p class=\"lead\"><b>Fastest: Instant Pot (about 50 minutes)<\/b><\/p>\n<ol class=\"steps\"><li>Add 1 1/4 cups broth, the rice, chickpeas, onion, garlic and spices. Lay the thighs on top. Spoon the tomatoes and tomato paste over the chicken and do not stir.<\/li><li>Pressure cook on HIGH 22 minutes, then let the pressure release naturally for 10 minutes.<\/li><li>Shred the chicken and stir in the frozen spinach on Sauté for 3 to 4 minutes. Turn off the heat and stir in the yogurt.<\/li><\/ol>\n<p class=\"lead\"><b>Fast: stovetop Dutch oven (about 1 hour)<\/b><\/p>\n<ol class=\"steps\"><li>Bring 2 1/2 cups broth, the tomatoes, paste, chickpeas, onion, garlic and spices to a boil. Stir in the rice, cover and simmer on low 20 minutes.<\/li><li>Nestle the thighs into the rice. Cover and simmer 20 to 25 minutes more, until the rice is tender and the chicken reaches 165°F.<\/li><li>Shred the chicken and stir in the spinach. Turn off the heat and stir in the yogurt.<\/li><\/ol>", "gro": "p14-23", "groT": "chicken tikka masala with chickpeas", "src": "p13-24", "macro": "Per portion: 731 calories · 75 g protein · 72 g carbs · 16 g fat · 13 g fiber · LOW 5 to 6 hr, then HIGH 2 to 2 1/2 hr"}, {"id": "m-p13-17", "plan": "p13", "cat": "Crockpot (5 portions each)", "title": "Beef and Barley Stew", "html": "<div class=\"macro\">Per portion: 688 calories · 73 g protein · 69 g carbs · 13 g fat · 14 g fiber · LOW 8 to 9 hr, then HIGH 1 1/2 to 2 hr<\/div>\n<p><b>Nutrient highlights:<\/b> zinc and selenium (beef), very high fiber (barley), vitamin A (carrots)<\/p>\n<ul><li>3 lb bottom round roast, whole<\/li><li>1 cup pearled barley<\/li><li>1 lb baby carrots and 1 lb potatoes, cut into chunks<\/li><li>8 oz sliced mushrooms<\/li><li>1 cup frozen diced onion<\/li><li>2 cups frozen peas<\/li><li>3 tbsp tomato paste<\/li><li>6 cups low-sodium beef broth<\/li><li>1 tbsp jarred garlic, 1 tsp thyme, 1 tsp rosemary, 2 bay leaves, black pepper<\/li><\/ul>\n<p class=\"lead\"><b>Standard: crockpot, LOW then HIGH (about 9 1/2 to 11 hours)<\/b><\/p>\n<ol class=\"steps\"><li>Put the potatoes, carrots, mushrooms and onion in the crockpot. Set the roast on top.<\/li><li>Whisk the tomato paste into 3 cups of broth with the garlic and herbs and pour it over. Cook on LOW 8 to 9 hours, until the roast pulls apart.<\/li><li>Lift out the roast, shred it and return it. Stir in the barley and the last 3 cups of broth.<\/li><li>Switch to HIGH and cook 1 1/2 to 2 hours, until the barley is tender. Stir in the peas for the last 15 minutes. Remove the bay leaves and divide into 5 containers.<\/li><\/ol>\n<p class=\"lead\"><b>Faster: crockpot, all on HIGH (about 6 1/2 to 8 hours)<\/b><\/p>\n<ol class=\"steps\"><li>Load the pot the same way as the standard steps.<\/li><li>Cook on HIGH 5 to 6 hours, until the roast pulls apart. Shred it.<\/li><li>Stir in the barley and the last 3 cups of broth. Cook on HIGH 1 1/2 to 2 hours more. Add the peas for the last 15 minutes.<\/li><\/ol>\n<p class=\"lead\"><b>Fastest: Instant Pot (about 2 1/2 hours)<\/b><\/p>\n<ol class=\"steps\"><li>Pour in 3 cups broth whisked with the tomato paste, garlic and herbs. Set the roast in the pot.<\/li><li>Pressure cook on HIGH 70 minutes, then let the pressure release naturally for 15 minutes. Lift out the roast and shred it.<\/li><li>Add the barley, potatoes, carrots, mushrooms, onion and the last 3 cups of broth. Pressure cook 25 minutes, then release naturally for 10 minutes.<\/li><li>Stir in the beef and peas on Sauté for 3 to 4 minutes. Remove the bay leaves.<\/li><\/ol>\n<p class=\"lead\"><b>Fast: stovetop Dutch oven or oven (about 3 1/2 hours)<\/b><\/p>\n<ol class=\"steps\"><li>Set the roast in a Dutch oven with 3 cups broth, the tomato paste, garlic and herbs. Cover and simmer on low, or bake at 325°F, for 2 1/2 to 3 hours.<\/li><li>Shred the roast. Add the barley, potatoes, carrots, mushrooms, onion and the last 3 cups of broth. Cover and simmer 40 to 45 minutes, until the barley is tender.<\/li><li>Stir in the peas for the last 5 minutes and remove the bay leaves.<\/li><\/ol>", "gro": "p14-24", "groT": "beef and barley stew", "src": "p13-25", "macro": "Per portion: 688 calories · 73 g protein · 69 g carbs · 13 g fat · 14 g fiber · LOW 8 to 9 hr, then HIGH 1 1/2 to 2 hr"}, {"id": "m-p13-18", "plan": "p13", "cat": "Crockpot (5 portions each)", "title": "Teriyaki Chicken with Brown Rice and Broccoli", "html": "<div class=\"macro\">Per portion: 693 calories · 69 g protein · 68 g carbs · 16 g fat · 10 g fiber · LOW 4 to 5 hr, then HIGH 2 to 2 1/2 hr<\/div>\n<p><b>Nutrient highlights:<\/b> folate and ALA (edamame), vitamin C (broccoli, pineapple), selenium (chicken thighs)<\/p>\n<ul><li>3 lb boneless skinless chicken thighs, whole<\/li><li>1 1/4 cups uncooked brown rice and 2 1/2 cups low-sodium chicken broth<\/li><li>2 bags (12 oz) frozen broccoli florets<\/li><li>2 cups frozen shelled edamame<\/li><li>1 can (20 oz) pineapple tidbits in juice, drained (about 1 1/2 cups)<\/li><li>2 cups shredded carrots<\/li><li>Sauce: 1/4 cup low-sodium soy sauce, 2 tbsp honey, 2 tbsp cornstarch, 1 tbsp jarred garlic, 1 tsp ginger<\/li><\/ul>\n<p class=\"lead\"><b>Standard: crockpot, LOW then HIGH (about 6 to 7 1/2 hours)<\/b><\/p>\n<ol class=\"steps\"><li>Whisk the sauce. Lay the thighs in the crockpot, add the carrots and pour the sauce over.<\/li><li>Cook on LOW 4 to 5 hours. Shred the chicken in the pot.<\/li><li>Stir in the rice, broth and edamame. Switch to HIGH and cook 2 to 2 1/2 hours, until the rice is tender. Stir once halfway.<\/li><li>Add the frozen broccoli and pineapple for the last 30 to 45 minutes. Divide into 5 containers.<\/li><\/ol>\n<p class=\"lead\"><b>Faster: crockpot, all on HIGH (about 4 to 5 hours)<\/b><\/p>\n<ol class=\"steps\"><li>Load the pot the same way as the standard steps.<\/li><li>Cook on HIGH 2 to 2 1/2 hours. Shred the chicken.<\/li><li>Stir in the rice, broth and edamame. Cook on HIGH 2 to 2 1/2 hours more, stirring once halfway. Add the broccoli and pineapple for the last 30 to 45 minutes.<\/li><\/ol>\n<p class=\"lead\"><b>Fastest: Instant Pot (about 55 minutes)<\/b><\/p>\n<ol class=\"steps\"><li>Add 1 1/4 cups broth, the rice, edamame and carrots. Lay the thighs on top and pour the soy sauce, honey, garlic and ginger over them. Leave out the cornstarch for now.<\/li><li>Pressure cook on HIGH 22 minutes, then let the pressure release naturally for 10 minutes. Shred the chicken.<\/li><li>Switch to Sauté. Add the broccoli and pineapple and cook 4 to 5 minutes. Stir in the cornstarch mixed with 2 tbsp cold water and cook 1 minute until glossy.<\/li><\/ol>\n<p class=\"lead\"><b>Fast: stovetop Dutch oven (about 1 hour)<\/b><\/p>\n<ol class=\"steps\"><li>Bring 2 1/2 cups broth, the soy sauce, honey, garlic, ginger and carrots to a boil. Stir in the rice and edamame, cover and simmer on low 20 minutes.<\/li><li>Nestle the thighs into the rice. Cover and simmer 20 to 25 minutes more, until the rice is tender and the chicken reaches 165°F.<\/li><li>Shred the chicken. Add the broccoli and pineapple for 5 minutes, then stir in the cornstarch mixed with 2 tbsp cold water until glossy.<\/li><\/ol>", "gro": "p14-25", "groT": "teriyaki chicken with brown rice and broccoli", "src": "p13-26", "macro": "Per portion: 693 calories · 69 g protein · 68 g carbs · 16 g fat · 10 g fiber · LOW 4 to 5 hr, then HIGH 2 to 2 1/2 hr"}], "builder": {"slots": [{"id": "protein", "label": "Protein", "hint": "Pick one. About 40 to 50 g protein.", "opts": [{"n": "Chicken breast, 8 oz raw", "v": [272, 51.0, 0.0, 5.9, 0.0], "note": ""}, {"n": "Chicken thighs, 7 oz raw", "v": [240, 39.1, 0.0, 8.1, 0.0], "note": ""}, {"n": "Rotisserie chicken breast, 6 oz, no skin", "v": [281, 52.7, 0.0, 6.1, 0.0], "note": ""}, {"n": "Chicken pouches, 4 (2.6 oz)", "v": [320, 52.1, 4.1, 8.0, 0.0], "note": ""}, {"n": "95% lean ground beef, 8 oz raw", "v": [311, 48.5, 0.0, 11.3, 0.0], "note": ""}, {"n": "Bottom round roast, 7 oz raw", "v": [270, 45.0, 0.0, 8.7, 0.0], "note": ""}, {"n": "Lamb leg, 5 1/2 oz cooked", "v": [298, 44.1, 0.0, 12.0, 0.0], "note": ""}, {"n": "Salmon <main id="app"><p style="padding:40px 0">Loading your meal plans…</p></main>
<script>
{
const app=document.getElementById('app'),nav=document.getElementById('nav'),drawer=document.getElementById('drawer');
let D=[],M=[],B=null,Q='';
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}};
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const plans=()=>{const g=[];D.forEach((p,i)=>{if(p.kind==='plan')g.push({n:p.kicker.split(' · ')[0],plan:p,gro:D[i+1]})});return g};

function buildNav(cur){
  nav.innerHTML='<a href="#home"'+(cur==='home'?' class="on"':'')+'>Home</a><a href="#builder"'+(cur==='builder'?' class="on"':'')+'>Build your own meal</a><a href="#search">Search everything</a>'+
  plans().map(g=>`<h4>${g.n} · ${esc(g.plan.title)}</h4><a href="#meals-${g.plan.id}"${cur==='meals-'+g.plan.id?' class="on"':''}>Meals, one at a time<span class="tag">Meals</span></a><a href="#${g.plan.id}"${cur===g.plan.id?' class="on"':''}>Full plan<span class="tag">Plan</span></a><a href="#${g.gro.id}"${cur===g.gro.id?' class="on"':''}>Grocery list<span class="tag">List</span></a>`).join('')+
  `<h4>Reference</h4>`+D.filter(p=>p.kind==='ref').map(p=>`<a href="#${p.id}"${cur===p.id?' class="on"':''}>${esc(p.title)}</a>`).join('');
}
const openNav=o=>{drawer.classList.toggle('open',o)};
document.getElementById('menuBtn').addEventListener('click',()=>openNav(true));
document.getElementById('shade').addEventListener('click',()=>openNav(false));
nav.addEventListener('click',e=>{if(e.target.closest('a'))openNav(false)});

function home(){
  app.innerHTML=`<section class="hero">
    <h1>Your 40-40-20 plans, in one place</h1>
    <p>2,100 calories a day across 3 meals. Each plan has its grocery list right behind it, and the checklists remember what you've already bought on this device.</p>
    <div class="plate" role="img" aria-label="Calories split 40% protein, 40% carbs, 20% fat">
      <div class="pp">40%<small>Protein</small></div><div class="pc">40%<small>Carbs</small></div><div class="pf">20%<small>Fat</small></div></div>
    <div class="stats"><div class="stat"><b>700</b><span>calories per meal</span></div><div class="stat"><b>70 g</b><span>protein per meal</span></div><div class="stat"><b>70 g</b><span>carbs per meal</span></div><div class="stat"><b>16 g</b><span>fat per meal</span></div><div class="stat"><b>35 g+</b><span>fiber per day</span></div></div>
  </section>
  <form class="search" id="hs"><input id="hq" type="search" placeholder="Search recipes, foods or nutrients (try salmon, zinc, Sheetz)" aria-label="Search"></form>
  <a class="bcta" href="#builder"><b>Build your own meal</b><span>Pick a protein, carb, beans, vegetables and extras. See calories, macros and fiber add up live.</span></a>
  <div class="grid">${plans().map(g=>`<article class="card"><div class="k">${g.n}</div><h3>${esc(g.plan.title)}</h3>
    <p class="cnt">${M.filter(m=>m.plan===g.plan.id).length} meals</p><div class="row"><a class="btn p" href="#meals-${g.plan.id}">Meals</a><a class="btn s" href="#${g.gro.id}">Grocery list${count(g.gro)}</a><a class="btn s" href="#${g.plan.id}">Full plan</a></div></article>`).join('')}
    ${D.filter(p=>p.kind==='ref').map(p=>`<article class="card"><div class="k">Reference</div><h3>${esc(p.title)}</h3><div class="row"><a class="btn p" href="#${p.id}">Open</a></div></article>`).join('')}
  </div>
  <p class="note"><a href="downloads/40-40-20-Complete-Meal-Plan-Collection.docx">Download the full collection as a Word file</a>. Checked grocery items are saved in this browser only. Talk with your doctor before adding supplements.</p>`;
  document.getElementById('hs').addEventListener('submit',e=>{e.preventDefault();Q=document.getElementById('hq').value;location.hash='search';if(location.hash==='#search')route()});
}
function count(g){const n=(g.html.match(/data-k="/g)||[]).length;if(!n)return'';const done=[...g.html.matchAll(/data-k="([^"]+)"/g)].filter(m=>store.get('ck:'+m[1])).length;return done?` (${done}/${n})`:''}

function section(id,anchor){
  const i=D.findIndex(p=>p.id===id),p=D[i];
  const prev=D[i-1],next=D[i+1];
  const h2=p.kind==='grocery'?p.heads.filter(h=>h.l===3||!/How to Use|Store Brands/.test(h.t)).filter((h,i,a)=>h.l===3||!a.some((x,j)=>j>i&&x.l===3&&a.slice(i+1,j).every(y=>y.l===3))):p.heads.filter(h=>h.l===2);
  app.innerHTML=`<article class="sec"><div class="kick">${esc(p.kicker)}</div><h1>${esc(p.title)}</h1>${p.sub?`<p class="sub">${esc(p.sub)}</p>`:'<div class="sub"></div>'}
   ${h2.length>2?`<nav class="jump" aria-label="Jump to">${h2.map(h=>`<a href="#${h.id}">${esc(h.t)}</a>`).join('')}</nav>`:''}
   ${p.kind==='plan'?`<div class="row" style="margin-bottom:12px"><a class="btn p" href="#meals-${p.id}">See each meal on its own page</a></div>`:''}
   ${p.kind==='grocery'?`<div class="prog"><span id="pc"></span><div class="bar"><i id="pb"></i></div><button class="btn s" id="clr">Clear</button></div>`:''}
   <div class="body">${p.html}</div>
   <div class="pager">${prev?`<a class="btn s" href="#${prev.id}">← ${esc(prev.kind==='grocery'?prev.kicker:prev.title)}</a>`:'<span></span>'}${next?`<a class="btn p" href="#${next.id}">${esc(next.kind==='grocery'?'Grocery list':next.title)} →</a>`:''}</div></article>`;
  if(p.kind==='grocery'){
    const boxes=[...app.querySelectorAll('input[data-k]')];
    const upd=()=>{const d=boxes.filter(b=>b.checked).length;document.getElementById('pc').textContent=`${d} of ${boxes.length}`;document.getElementById('pb').style.width=(boxes.length?d/boxes.length*100:0)+'%'};
    boxes.forEach(b=>{b.checked=!!store.get('ck:'+b.dataset.k);b.addEventListener('change',()=>{store.set('ck:'+b.dataset.k,b.checked?'1':null);upd()})});
    const clr=document.getElementById('clr');let armed=false;
    clr.addEventListener('click',()=>{if(!armed){armed=true;clr.textContent='Tap again to clear';setTimeout(()=>{armed=false;clr.textContent='Clear'},3000);return}
      boxes.forEach(b=>{b.checked=false;store.set('ck:'+b.dataset.k,null)});armed=false;clr.textContent='Clear';upd()});
    upd();
  }
  if(anchor){const el=document.getElementById(anchor);if(el){el.scrollIntoView();el.classList.add('flash')}}else window.scrollTo(0,0);
}

function mealList(pid){
  const p=D.find(x=>x.id===pid),g=D[D.indexOf(p)+1],ms=M.filter(m=>m.plan===pid);
  const cats=[...new Set(ms.map(m=>m.cat))];
  app.innerHTML=`<article class="sec"><div class="kick">${esc(p.kicker.split(' · ')[0])} · Meals</div><h1>${esc(p.title)}</h1><p class="sub">Tap a meal for its ingredients, steps and grocery list.</p>
   <div class="row" style="margin-bottom:8px"><a class="btn s" href="#${g.id}">Grocery list</a><a class="btn s" href="#${p.id}">Full plan</a></div>
   ${cats.map(c=>`<h2 class="mcat">${esc(c)}</h2><div class="mlist">${ms.filter(m=>m.cat===c).map(m=>`<a class="mcard" href="#${m.id}"><b>${esc(m.title)}</b>${m.macro?`<span>${esc(m.macro)}</span>`:''}</a>`).join('')}</div>`).join('')}
  </article>`;window.scrollTo(0,0);
}
function meal(id){
  const m=M.find(x=>x.id===id),ms=M.filter(x=>x.plan===m.plan),i=ms.indexOf(m),p=D.find(x=>x.id===m.plan);
  const prev=ms[i-1],next=ms[i+1];
  app.innerHTML=`<article class="sec meal"><div class="kick">${esc(p.kicker.split(' · ')[0])} · ${esc(m.cat||'')}</div><h1>${esc(m.title)}</h1>
   <div class="row" style="margin:10px 0 4px"><a class="btn p" href="#${m.gro}">Grocery list for this meal</a><a class="btn s" href="#meals-${m.plan}">All meals</a></div>
   <div class="body">${m.html}</div>
   <div class="pager">${prev?`<a class="btn s" href="#${prev.id}">← ${esc(prev.title)}</a>`:'<span></span>'}${next?`<a class="btn p" href="#${next.id}">${esc(next.title)} →</a>`:''}</div></article>`;
  window.scrollTo(0,0);
}
const FR=[0.5,0.75,1,1.5,2],FL=['½','¾','1','1½','2'];
let bsel=null;
function bload(){if(bsel)return;try{bsel=JSON.parse(store.get('builder')||'null')}catch(e){bsel=null}if(!bsel||typeof bsel!=='object')bsel={}}
function bsave(){store.set('builder',JSON.stringify(bsel))}
function btot(){const t=[0,0,0,0,0];const notes=[];B.slots.forEach(sl=>{const c=bsel[sl.id];if(!c)return;const o=sl.opts[c.i];if(!o)return;o.v.forEach((x,k)=>t[k]+=x*c.m);if(o.note)notes.push(o.note)});return{t,notes}}
function builder(){
  bload();
  app.innerHTML=`<article class="sec"><div class="kick">Build Your Own Meal</div><h1>Build a 40-40-20 meal</h1>
   <p class="sub">Pick one item per row and adjust the portion. Target per meal: about 700 calories, 70 g protein, 70 g carbs, 16 g fat and 10 g or more fiber.</p>
   <label class="dess"><input type="checkbox" id="dess"><span><b>Save room for coffee and cookies</b><small>Lowers this meal's target by about 130 calories, from carbs and fat. Protein stays at 70 g.</small></span></label>
   <div class="tot" id="tot" aria-live="polite"></div>
   <div class="row pre"><span class="lbl">Start from:</span>${B.presets.map((p,i)=>`<button class="btn s" data-pre="${i}">${esc(p.n)}</button>`).join('')}<button class="btn s" id="bclr">Clear all</button></div>
   <div id="slots">${B.slots.map(sl=>`<section class="slot"><label for="sel-${sl.id}"><b>${esc(sl.label)}</b><span>${esc(sl.hint)}</span></label>
     <select id="sel-${sl.id}" data-s="${sl.id}"><option value="">None</option>${sl.opts.map((o,i)=>`<option value="${i}">${esc(o.n)}</option>`).join('')}</select>
     <div class="por" role="group" aria-label="${esc(sl.label)} portion">${FR.map((f,k)=>`<button data-s="${sl.id}" data-m="${f}">${FL[k]}×</button>`).join('')}</div>
     <div class="om" id="om-${sl.id}"></div></section>`).join('')}</div>
   <div class="row" style="margin-top:16px"><button class="btn p" id="bcopy">Copy this meal</button><span class="note" id="bmsg" style="margin:0;align-self:center"></span></div>
   <p class="note">Planning coffee and cookies tonight? See <a href="#${(D.find(p=>p.title==='Coffee and Dessert')||{}).id||'home'}">Coffee and Dessert</a> for portions and trims. Numbers are estimates from standard USDA values and package labels. Brands vary, so anything from about 650 to 760 calories is on plan.</p></article>
   <div class="mini" id="mini" aria-hidden="true"></div>`;
  {const mini=document.getElementById('mini');const io=new IntersectionObserver(es=>{mini.classList.toggle('show',!es[0].isIntersecting)});io.observe(document.getElementById('tot'))}
  const upd=()=>{
    B.slots.forEach(sl=>{const c=bsel[sl.id],sel=document.getElementById('sel-'+sl.id);sel.value=c?String(c.i):'';
      document.querySelectorAll(`.por button[data-s="${sl.id}"]`).forEach(b=>{b.classList.toggle('on',!!c&&+b.dataset.m===c.m);b.disabled=!c});
      const om=document.getElementById('om-'+sl.id);if(c){const v=sl.opts[c.i].v.map(x=>x*c.m);om.textContent=`${Math.round(v[0])} cal · ${Math.round(v[1])} g protein · ${Math.round(v[2])} g carbs · ${Math.round(v[3])} g fat · ${Math.round(v[4])} g fiber`}else om.textContent=''});
    const {t,notes}=btot(),[cal,p,c,f,fb]=t.map(x=>Math.round(x));
    const dz=!!bsel.__d;document.getElementById('dess').checked=dz;
    const T=dz?{cal:570,p:70,c:55,f:12}:{cal:700,p:70,c:70,f:16};
    const calLo=T.cal-60,calHi=T.cal+70,cLo=T.c-12,cHi=T.c+15,fHi=T.f+6,fLo=T.f-6;
    const pc=cal?Math.round(p*4/cal*100):0,cc=cal?Math.round(c*4/cal*100):0,fc=cal?Math.round(f*9/cal*100):0;
    const tips=[];
    if(!cal)tips.push('Pick a protein to start, or tap a starting meal above.');
    else{
      if(p<60)tips.push('Protein is low: use a bigger protein portion or add Greek yogurt.');
      if(p>85)tips.push('Protein is high: try a smaller protein portion.');
      if(c<cLo)tips.push('Carbs are low: add beans, fruit or a bigger carb portion.');
      if(c>cHi)tips.push('Carbs are high: use a smaller carb portion or skip the fruit.');
      if(f>fHi)tips.push('Fat is high: skip the fat item or pick a leaner protein.');
      if(f<fLo)tips.push('Fat is low: add avocado, olive oil or seeds.');
      if(fb<10)tips.push('Fiber is low: add beans or more vegetables.');
      if(cal<calLo)tips.push('Calories are under target: add to a portion or pick a fruit.');
      if(cal>calHi)tips.push('Calories are over target: shrink a portion.');
      if(!tips.length)tips.push(dz?'On target, with room for coffee and cookies tonight.':'On target. This meal fits 40-40-20.');
    }
    notes.forEach(n=>tips.push(n+'.'));
    const ok=cal>=calLo&&cal<=calHi&&p>=60&&c>=cLo&&c<=cHi&&f<=fHi&&fb>=10;
    const bar=(v,tg,u,hi=true)=>`<div class="mt"><div class="mh"><span>${u}</span><b>${v} g <small>/ ${tg} g</small></b></div><div class="mb"><i style="width:${Math.min(100,v/tg*100)}%;${hi&&v>tg*1.2?'background:var(--red)':''}"></i></div></div>`;
    document.getElementById('tot').innerHTML=`<div class="tcal"><b class="${ok?'good':''}">${cal}</b><span>calories<br><small>target ${T.cal}</small></span></div>
     <div class="split" aria-label="Calories from protein ${pc}%, carbs ${cc}%, fat ${fc}%"><i class="pp" style="flex:${pc||1}">P ${pc}%</i><i class="pc" style="flex:${cc||1}">C ${cc}%</i><i class="pf" style="flex:${fc||1}">F ${fc}%</i></div>
     <div class="mts">${bar(p,T.p,'Protein')}${bar(c,T.c,'Carbs')}${bar(f,T.f,'Fat')}${bar(fb,10,'Fiber',false)}</div>
     <ul class="tips">${tips.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;
    document.getElementById('mini').innerHTML=`<b class="${ok?'good':''}">${cal} cal</b><span>P ${p} · C ${c} · F ${f} · Fiber ${fb}</span><span class="mst">${ok?'On target':'Adjust'}</span>`;
    bsave();
  };
  app.querySelectorAll('select[data-s]').forEach(sel=>sel.addEventListener('change',()=>{const id=sel.dataset.s;if(sel.value==='')delete bsel[id];else bsel[id]={i:+sel.value,m:(bsel[id]&&bsel[id].m)||1};upd()}));
  app.querySelectorAll('.por button').forEach(b=>b.addEventListener('click',()=>{const id=b.dataset.s;if(bsel[id]){bsel[id].m=+b.dataset.m;upd()}}));
  app.querySelectorAll('[data-pre]').forEach(b=>b.addEventListener('click',()=>{const d=bsel.__d;bsel={};if(d)bsel.__d=true;B.presets[+b.dataset.pre].s.forEach(([sl,i,m])=>bsel[sl]={i,m});upd()}));
  document.getElementById('bclr').addEventListener('click',()=>{const d=bsel.__d;bsel={};if(d)bsel.__d=true;upd()});
  document.getElementById('dess').addEventListener('change',e=>{if(e.target.checked)bsel.__d=true;else delete bsel.__d;upd()});
  document.getElementById('bcopy').addEventListener('click',()=>{
    const {t}=btot();const lines=B.slots.filter(sl=>bsel[sl.id]).map(sl=>{const c=bsel[sl.id];return `- ${sl.opts[c.i].n}${c.m!==1?' ×'+FL[FR.indexOf(c.m)]:''}`});
    const txt=`My 40-40-20 meal\n${lines.join('\n')}\nTotal: ${Math.round(t[0])} calories, ${Math.round(t[1])} g protein, ${Math.round(t[2])} g carbs, ${Math.round(t[3])} g fat, ${Math.round(t[4])} g fiber`;
    const msg=document.getElementById('bmsg');
    try{navigator.clipboard.writeText(txt).then(()=>msg.textContent='Copied.',()=>msg.textContent='Copy is blocked here; select the totals and copy by hand.')}catch(e){msg.textContent='Copy is blocked here.'}
  });
  upd();window.scrollTo(0,0);
}
let chunks=null;
function buildChunks(){chunks=[];const tmp=document.createElement('div');
  const srcs=new Set(M.map(m=>m.src).filter(Boolean));
  M.forEach(m=>{tmp.innerHTML=m.html;const p=D.find(x=>x.id===m.plan);chunks.push({p:{kicker:p.kicker.split(' · ')[0]+' · Meal',title:p.title},id:m.id,t:m.title,txt:' '+tmp.textContent})});
  D.forEach(p=>{tmp.innerHTML=p.html;let cur={p,id:p.id,t:p.title,txt:''};chunks.push(cur);
    for(const n of tmp.children){if(/^H[23]$/.test(n.tagName)){cur={p,id:n.id,t:n.textContent,txt:''};if(!srcs.has(n.id))chunks.push(cur)}else cur.txt+=' '+n.innerHTML.replace(/<[^>]+>/g,' ').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>')}})}
function search(){
  if(!chunks)buildChunks();
  app.innerHTML=`<form class="search" id="sf"><input id="q" type="search" placeholder="Search recipes, foods or nutrients" aria-label="Search" value="${esc(Q)}"></form><div id="out"></div>`;
  const q=document.getElementById('q'),out=document.getElementById('out');
  const run=()=>{Q=q.value.trim();const w=Q.toLowerCase();if(w.length<2){out.innerHTML='<p class="note">Type at least 2 letters. Results come from every plan, grocery list and the Fiber Takeaway.</p>';return}
    const re=new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'ig');
    const hits=chunks.filter(c=>(c.t+' '+c.txt).toLowerCase().includes(w)).sort((a,b)=>b.t.toLowerCase().includes(w)-a.t.toLowerCase().includes(w)).slice(0,60);
    out.innerHTML=`<p class="note">${hits.length} result${hits.length===1?'':'s'}${hits.length===60?' (showing the first 60)':''}</p>`+hits.map(c=>{
      const s=c.txt.replace(/\s+/g,' '),k=s.toLowerCase().indexOf(w),snip=k<0?s.slice(0,120):(k>50?'…':'')+s.slice(Math.max(0,k-50),k+90)+'…';
      return `<a class="res" href="#${c.id}"><small>${esc(c.p.kicker)} · ${esc(c.p.title)}</small><b>${esc(c.t).replace(re,m=>`<mark>${m}</mark>`)}</b><span>${esc(snip).replace(re,m=>`<mark>${m}</mark>`)}</span></a>`}).join('')};
  q.addEventListener('input',run);document.getElementById('sf').addEventListener('submit',e=>{e.preventDefault();q.blur()});
  run();q.focus();window.scrollTo(0,0);
}

function route(){
  const h=location.hash.slice(1)||'home';
  const m=h.match(/^(p\d+)(?:-\d+)?$/);
  if(m&&D.some(p=>p.id===m[1])){buildNav(m[1]);section(m[1],h.includes('-')?h:null);document.title=D.find(p=>p.id===m[1]).title+' · 40-40-20'}
  else if(/^meals-p\d+$/.test(h)&&D.some(p=>p.id===h.slice(6))){buildNav(h);mealList(h.slice(6));document.title='Meals · 40-40-20'}
  else if(/^m-p\d+-\d+$/.test(h)&&M.some(m=>m.id===h)){const m=M.find(x=>x.id===h);buildNav('meals-'+m.plan);meal(h);document.title=m.title+' · 40-40-20'}
  else if(h==='builder'){buildNav('builder');builder();document.title='Build a meal · 40-40-20'}
  else if(h==='search'){buildNav('search');search();document.title='Search · 40-40-20'}
  else{buildNav('home');home();document.title='40-40-20 Meal Plans';window.scrollTo(0,0)}
}
window.addEventListener('hashchange',route);
{const d=JSON.parse(document.getElementById('data').textContent);D=d.parts;M=d.meals;B=d.builder;route();}
}
</script>
<script>if('serviceWorker' in navigator){addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}</script>
</body>
