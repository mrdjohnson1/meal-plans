><\/ul>\n<ol class=\"steps\"><li>Pour the almond milk into the blender first so the blades move freely.<\/li><li>Add the yogurt, whey, banana, oats, sunflower seeds, chia seeds and spinach.<\/li><li>Add a handful of ice and blend 45 to 60 seconds, until smooth.<\/li><\/ol>", "gro": "p2-13", "groT": "green protein smoothie", "src": null, "macro": "753 calories · 73 g protein · 72 g carbs · 19 g fat · 14.5 g fiber · 3 minutes"}, {"id": "m-p1-5", "plan": "p1", "cat": "Breakfasts", "title": "Veggie Omelet and Oatmeal", "html": "<div class=\"macro\">About 700 calories · 72 g protein · 69 g carbs · 18 g fat · 15 g fiber · 10 minutes<\/div>\n<ul><li>2 whole eggs and 1 1/3 cups liquid egg whites<\/li><li>1 cup spinach and 1/3 cup diced red bell pepper<\/li><li>3/4 cup rolled oats<\/li><li>1/2 cup nonfat plain Greek yogurt<\/li><li>1 tbsp ground flaxseed<\/li><li>1 cup strawberries or mixed berries<\/li><li>Nonstick cooking spray<\/li><\/ul>\n<ol class=\"steps\"><li>Microwave the oats with about 1 1/2 cups water in a large bowl for 2 to 3 minutes, stirring halfway.<\/li><li>Stir the yogurt and flaxseed into the oats and top with the berries.<\/li><li>Whisk the eggs and egg whites. Spray a nonstick skillet over medium heat and cook the spinach and pepper for 1 to 2 minutes.<\/li><li>Pour in the eggs. Cook without stirring until almost set, about 3 minutes, then fold the omelet in half and cook 1 minute more.<\/li><\/ol>", "gro": "p2-14", "groT": "veggie omelet and oatmeal", "src": null, "macro": "About 700 calories · 72 g protein · 69 g carbs · 18 g fat · 15 g fiber · 10 minutes"}, {"id": "m-p1-6", "plan": "p1", "cat": "Cook Day A", "title": "Chicken Thigh Burrito Bowl with Brown Rice and Spinach", "html": "<div class=\"macro\">Per portion: 71 g protein · 71 g carbs · 20 g fat · 13 g fiber · about 750 calories<\/div>\n<p class=\"lead\"><b>Ingredients<\/b><\/p>\n<ul><li>3 lb boneless skinless chicken thighs, whole<\/li><li>2 cans (15 oz) no-salt-added black beans, drained and rinsed<\/li><li>1.5 cups frozen corn<\/li><li>1 can (14.5 oz) no-salt-added diced tomatoes with their juice<\/li><li>1 bag (10 oz) frozen pepper and onion blend (one with red peppers has the most vitamin C)<\/li><li>2 tbsp tomato paste (no salt added)<\/li><li>3/4 cup plus 2 tbsp uncooked long-grain brown rice<\/li><li>1 box or bag (10 oz) frozen chopped spinach<\/li><li>2 cups low-sodium chicken broth<\/li><li>2 tbsp salt-free taco seasoning, 1 tsp cumin, 1 tbsp jarred minced garlic<\/li><li>Juice of 2 limes (or 3 tbsp bottled lime juice)<\/li><li>Topping, split across 5 portions: 3/4 cup nonfat plain Greek yogurt<\/li><\/ul>\n<p class=\"lead\"><b>Standard: crockpot, LOW then HIGH (about 7 to 8 1/2 hours)<\/b><\/p>\n<ol class=\"steps\"><li>Dump the beans, corn, tomatoes, tomato paste, pepper and onion blend, garlic and seasoning into the crockpot. Stir, then lay the thighs on top.<\/li><li>Cook on LOW 5 to 6 hours.<\/li><li>Shred the chicken in the pot with two forks.<\/li><li>Stir in the brown rice, broth and frozen spinach (no need to thaw). Switch to HIGH and cook 2 to 2.5 hours, until the rice is tender. Stir once halfway.<\/li><li>Stir in lime juice. Divide into 5 containers and top each with about 2.5 tbsp Greek yogurt when serving.<\/li><\/ol>\n<p class=\"lead\"><b>Faster: crockpot, all on HIGH (about 4 1/2 to 5 1/2 hours)<\/b><\/p>\n<ol class=\"steps\"><li>Load the beans, corn, tomatoes, tomato paste, pepper and onion blend, garlic and seasoning. Lay the thighs on top.<\/li><li>Cook on HIGH 2 1/2 to 3 hours.<\/li><li>Shred the chicken. Stir in the rice, broth and frozen spinach. Cook on HIGH 2 to 2 1/2 hours more, stirring once halfway, until the rice is tender.<\/li><li>Stir in the lime juice and divide into 5 containers. To cut the total to about 3 hours, cook the rice on the stove or in a rice cooker during the first stage and stir it in after shredding.<\/li><\/ol>\n<p class=\"lead\"><b>Fastest: Instant Pot (about 50 minutes)<\/b><\/p>\n<ol class=\"steps\"><li>Add 1 cup broth (not 2), the rice, beans, corn and pepper blend. Lay the seasoned thighs on top. Spoon the tomatoes and tomato paste over the chicken and do not stir.<\/li><li>Pressure cook on HIGH 22 minutes, then let the pressure release naturally for 10 minutes.<\/li><li>Shred the chicken, stir in the frozen spinach and lime juice, and let it sit on Keep Warm for 5 minutes.<\/li><\/ol>\n<p class=\"lead\"><b>Fast: stovetop Dutch oven (about 1 hour)<\/b><\/p>\n<ol class=\"steps\"><li>Bring 2 cups broth, the tomatoes, paste, beans, corn, pepper blend and seasoning to a boil. Stir in the rice, cover and simmer on low 20 minutes.<\/li><li>Nestle the thighs into the rice. Cover and simmer 20 to 25 minutes more, until the rice is tender and the chicken reaches 165°F.<\/li><li>Shred the chicken and stir in the spinach and lime juice.<\/li><\/ol>", "gro": "p2-4", "groT": "chicken thigh burrito bowl with brown rice and spinach", "src": "p1-7", "macro": "Per portion: 71 g protein · 71 g carbs · 20 g fat · 13 g fiber · about 750 calories"}, {"id": "m-p1-7", "plan": "p1", "cat": "Cook Day A", "title": "Shredded Beef Pot Roast with Potatoes, Carrots and Broccoli", "html": "<div class=\"macro\">Per portion: 72 g protein · 69 g carbs · 18 g fat · 12.5 g fiber · about 730 calories<\/div>\n<p class=\"lead\"><b>Ingredients<\/b><\/p>\n<ul><li>3.25 lb bottom round or rump roast, whole<\/li><li>3.5 lb baby gold potatoes, whole (leave the skins on for fiber)<\/li><li>1 lb baby carrots<\/li><li>1 cup frozen diced onion<\/li><li>1 bag (16 oz) frozen broccoli florets<\/li><li>3 tbsp tomato paste (no salt added)<\/li><li>1 cup low-sodium beef broth<\/li><li>1 tbsp jarred minced garlic, 1 tsp dried thyme, 1 tsp rosemary, 1 tsp onion powder, black pepper<\/li><li>1 tbsp balsamic vinegar or Worcestershire (Worcestershire adds some sodium)<\/li><\/ul>\n<p class=\"lead\"><b>Standard: crockpot on LOW (about 9 to 10 hours)<\/b><\/p>\n<ol class=\"steps\"><li>Put the potatoes, carrots and onion in the bottom of the crockpot.<\/li><li>Rub the roast with the garlic, herbs and pepper. Set it on the vegetables. Whisk the tomato paste into the broth and vinegar and pour it around the roast.<\/li><li>Cook on LOW 9 to 10 hours, until the roast pulls apart easily. Round roasts need the full time to get tender.<\/li><li>For the last 45 to 60 minutes, add the frozen broccoli on top.<\/li><li>Lift out the roast, shred it with two forks, and return it to the pot. Skim fat off the top if you see any. Divide into 5 containers by weight.<\/li><\/ol>\n<p class=\"lead\"><b>Faster: crockpot, all on HIGH (about 5 to 6 hours)<\/b><\/p>\n<ol class=\"steps\"><li>Load the pot the same way as the standard steps.<\/li><li>Cook on HIGH 5 to 6 hours, until the roast pulls apart. Add the frozen broccoli for the last 45 minutes.<\/li><li>Shred the roast and divide into 5 containers.<\/li><\/ol>\n<p class=\"lead\"><b>Fastest: Instant Pot (about 2 hours)<\/b><\/p>\n<ol class=\"steps\"><li>Pour in the broth mixed with the tomato paste and vinegar. Rub the roast with the garlic and herbs and set it in the pot.<\/li><li>Pressure cook on HIGH 70 to 75 minutes, then let the pressure release naturally for 15 minutes.<\/li><li>Lift out the roast and shred it. Add the potatoes, carrots and onion to the liquid. Pressure cook 8 minutes and quick release.<\/li><li>Switch to Sauté, add the broccoli, cover and cook 3 to 4 minutes. Return the beef and divide into 5 containers.<\/li><\/ol>\n<p class=\"lead\"><b>Fast: stovetop Dutch oven or oven (about 3 hours)<\/b><\/p>\n<ol class=\"steps\"><li>Rub the roast with the garlic and herbs. Set it in a Dutch oven with the broth, tomato paste and vinegar.<\/li><li>Cover and simmer on low, or bake at 325°F, for 2 1/2 to 3 hours. Add the potatoes, carrots and onion for the last 45 to 60 minutes.<\/li><li>Add the broccoli for the last 8 to 10 minutes. Shred the roast and divide into 5 containers.<\/li><\/ol>", "gro": "p2-5", "groT": "shredded beef pot roast with potatoes carrots and broccoli", "src": "p1-8", "macro": "Per portion: 72 g protein · 69 g carbs · 18 g fat · 12.5 g fiber · about 730 calories"}, {"id": "m-p1-8", "plan": "p1", "cat": "Cook Day B", "title": "Moroccan Shredded Lamb with Chickpeas, Sweet Potatoes and Spinach", "html": "<div class=\"macro\">Per portion: 70 g protein · 71 g carbs · 25 g fat · 16 g fiber · about 790 calories<\/div>\n<p>This is the highest-fat meal in the plan. Skimming the fat after cooking brings it down.<\/p>\n<p class=\"lead\"><b>Ingredients<\/b><\/p>\n<ul><li>2.75 lb boneless leg of lamb, whole (remove the netting, leave it in one piece)<\/li><li>3 cans (15 oz) no-salt-added chickpeas, drained and rinsed<\/li><li>1.5 lb sweet potatoes, peeled and cut into large chunks (or frozen cubed sweet potatoes)<\/li><li>1 can (14.5 oz) no-salt-added diced tomatoes with their juice<\/li><li>2 tbsp tomato paste (no salt added)<\/li><li>1 cup frozen diced onion<\/li><li>1 box or bag (10 oz) frozen chopped spinach<\/li><li>1 cup low-sodium chicken broth<\/li><li>1 tbsp jarred minced garlic, 2 tsp cumin, 1 tsp cinnamon, 1 tsp smoked paprika, 1 tsp ground ginger, black pepper<\/li><li>Juice of 1 lemon<\/li><li>Topping, split across 5 portions: 1 cup nonfat plain Greek yogurt<\/li><\/ul>\n<p class=\"lead\"><b>Standard: crockpot on LOW (about 8 1/2 to 9 1/2 hours)<\/b><\/p>\n<ol class=\"steps\"><li>Put the sweet potatoes, chickpeas, tomatoes, tomato paste and onion in the crockpot and stir.<\/li><li>Rub the lamb with the garlic and spices. Set it on top and pour the broth around it.<\/li><li>Cook on LOW 8 to 9 hours, until the lamb pulls apart.<\/li><li>Lift out the lamb, shred it, and return it to the pot. Spoon off the fat that pools on top.<\/li><li>Stir in the frozen spinach and lemon juice and cook 20 to 30 minutes more. Divide into 5 containers and top each with about 3 tbsp Greek yogurt when serving.<\/li><\/ol>\n<p class=\"lead\"><b>Faster: crockpot, all on HIGH (about 5 1/2 to 6 1/2 hours)<\/b><\/p>\n<ol class=\"steps\"><li>Load the pot the same way as the standard steps.<\/li><li>Cook on HIGH 5 to 6 hours, until the lamb pulls apart.<\/li><li>Shred the lamb, spoon off the fat, and stir in the spinach and lemon juice. Cook 20 to 30 minutes more.<\/li><\/ol>\n<p class=\"lead\"><b>Fastest: Instant Pot (about 1 3/4 hours)<\/b><\/p>\n<ol class=\"steps\"><li>Pour in the broth. Rub the lamb with the garlic and spices and set it in the pot. Spoon the tomatoes and tomato paste over the top and do not stir.<\/li><li>Pressure cook on HIGH 60 to 65 minutes, then let the pressure release naturally for 15 minutes.<\/li><li>Lift out the lamb, shred it and spoon the fat off the liquid. Add the sweet potatoes, chickpeas and onion. Pressure cook 4 minutes and quick release.<\/li><li>Stir in the lamb, spinach and lemon juice on Sauté for 2 to 3 minutes.<\/li><\/ol>\n<p class=\"lead\"><b>Fast: stovetop Dutch oven or oven (about 3 hours)<\/b><\/p>\n<ol class=\"steps\"><li>Rub the lamb with the garlic and spices. Set it in a Dutch oven with the broth, tomatoes, paste and onion.<\/li><li>Cover and simmer on low, or bake at 325°F, for 2 1/2 to 3 hours. Add the sweet potatoes and chickpeas for the last 30 to 40 minutes.<\/li><li>Shred the lamb, spoon off the fat, and stir in the spinach and lemon juice for the last 5 minutes.<\/li><\/ol>", "gro": "p2-6", "groT": "moroccan shredded lamb with chickpeas sweet potatoes and spinach", "src": "p1-10", "macro": "Per portion: 70 g protein · 71 g carbs · 25 g fat · 16 g fiber · about 790 calories"}, {"id": "m-p1-9", "plan": "p1", "cat": "Cook Day B", "title": "Lemon Garlic Chicken with White Beans, Tomatoes and Brown Rice", "html": "<div class=\"macro\">Per portion: 70 g protein · 71 g carbs · 20 g fat · 15 g fiber · about 740 calories<\/div>\n<p class=\"lead\"><b>Ingredients<\/b><\/p>\n<ul><li>3 lb boneless skinless chicken thighs, whole<\/li><li>2 cans (15 oz) no-salt-added white beans (cannellini or great northern), drained and rinsed<\/li><li>3/4 cup plus 2 tbsp uncooked long-grain brown rice<\/li><li>1 can (14.5 oz) no-salt-added diced tomatoes with their juice<\/li><li>1 bag (10 oz) frozen pepper and onion blend<\/li><li>3 cups low-sodium chicken broth<\/li><li>1 bag (16 oz) frozen peas<\/li><li>1 box or bag (10 oz) frozen chopped spinach<\/li><li>1 cup frozen diced onion<\/li><li>2 tbsp jarred minced garlic, zest and juice of 2 lemons (or 1/4 cup bottled lemon juice)<\/li><li>2 tsp salt-free lemon pepper or Italian seasoning, 1 tsp paprika, black pepper<\/li><\/ul>\n<p class=\"lead\"><b>Standard: crockpot, LOW then HIGH (about 6 to 7 1/2 hours)<\/b><\/p>\n<ol class=\"steps\"><li>Put the onion, white beans, tomatoes and pepper blend in the crockpot. Rub the thighs with the garlic and seasonings and lay them on top. Add 1/2 cup of the broth.<\/li><li>Cook on LOW 4 to 5 hours.<\/li><li>Shred the chicken in the pot with two forks.<\/li><li>Stir in the brown rice, frozen spinach and the remaining 2.5 cups of broth. Switch to HIGH and cook 2 to 2.5 hours, until the rice is tender. Stir once halfway.<\/li><li>Stir in the frozen peas and lemon juice for the last 15 minutes. Divide into 5 containers.<\/li><\/ol>\n<p class=\"lead\"><b>Faster: crockpot, all on HIGH (about 4 to 5 hours)<\/b><\/p>\n<ol class=\"steps\"><li>Load the pot the same way as the standard steps.<\/li><li>Cook on HIGH 2 to 2 1/2 hours. Shred the chicken.<\/li><li>Stir in the rice, spinach and the remaining 2 1/2 cups broth. Cook on HIGH 2 to 2 1/2 hours more, stirring once halfway. Add the peas and lemon juice for the last 15 minutes.<\/li><\/ol>\n<p class=\"lead\"><b>Fastest: Instant Pot (about 50 minutes)<\/b><\/p>\n<ol class=\"steps\"><li>Add 1 1/4 cups broth, the rice, beans, onion and pepper blend. Lay the seasoned thighs on top. Spoon the tomatoes over the chicken and do not stir.<\/li><li>Pressure cook on HIGH 22 minutes, then let the pressure release naturally for 10 minutes.<\/li><li>Shred the chicken. Stir in the peas, spinach and lemon juice on Sauté for 3 to 4 minutes.<\/li><\/ol>\n<p class=\"lead\"><b>Fast: stovetop Dutch oven (about 1 hour)<\/b><\/p>\n<ol class=\"steps\"><li>Bring 3 cups broth, the tomatoes, beans, onion, pepper blend, garlic and seasoning to a boil. Stir in the rice, cover and simmer on low 20 minutes.<\/li><li>Nestle the thighs into the rice. Cover and simmer 20 to 25 minutes more, until the rice is tender and the chicken reaches 165°F.<\/li><li>Shred the chicken and stir in the peas, spinach and lemon juice for the last 5 minutes.<\/li><\/ol>", "gro": "p2-7", "groT": "lemon garlic chicken with white beans tomatoes and brown rice", "src": "p1-11", "macro": "Per portion: 70 g protein · 71 g carbs · 20 g fat · 15 g fiber · about 740 calories"}, {"id": "m-p1-10", "plan": "p1", "cat": "Twice a Week", "title": "Omega-3 Salmon Bowl", "html": "<div class=\"macro\">Per bowl: 74 g protein · 69 g carbs · 18 g fat · 19 g fiber · about 700 calories · 1.2 g EPA and DHA<\/div>\n<p>Swap this in for one crockpot lunch or dinner twice a week. Freeze the crockpot portion it replaces.<\/p>\n<p class=\"lead\"><b>Ingredients<\/b><\/p>\n<ul><li>4 pouches (2.6 oz each) pink salmon in water, skinless and boneless<\/li><li>1/2 cup cooked brown rice (a microwave cup, or rice saved from a crockpot batch)<\/li><li>1/2 cup no-salt-added chickpeas, drained and rinsed<\/li><li>1/3 avocado, sliced<\/li><li>2 cups salad greens or baby spinach<\/li><li>1/2 cup cherry tomatoes and 1/2 cup sliced red bell pepper<\/li><li>Juice of 1/2 lemon, black pepper, dried dill or salt-free seasoning<\/li><\/ul>\n<p class=\"lead\"><b>Steps<\/b><\/p>\n<ol class=\"steps\"><li>Warm the rice if you like. Do not microwave the salmon in its pouch.<\/li><li>Layer the greens, rice, chickpeas, tomatoes and pepper in a bowl.<\/li><li>Top with the salmon and avocado, then squeeze the lemon over everything.<\/li><\/ol>", "gro": "p2-8", "groT": "omega salmon bowl", "src": "p1-12", "macro": "Per bowl: 74 g protein · 69 g carbs · 18 g fat · 19 g fiber · about 700 calories · 1.2 g EPA and DHA"}, {"id": "m-p3-1", "plan": "p3", "cat": "Breakfasts", "title": "Chick-fil-A Breakfast", "html": "<div class=\"macro\">670 calories · 71 g protein · 69 g carbs · 12 g fat · 5 g fiber<\/div>\n<ul><li>Egg White Grill<\/li><li>2 medium fruit cups<\/li><li>1 Core Power 42g protein shake (from a gas station)<\/li><\/ul>\n<ol class=\"steps\"><li>Grab the Core Power shake at a gas station before you stop, or carry one in the cooler.<\/li><li>Order the Egg White Grill and 2 medium fruit cups.<\/li><li>Drink the shake with the meal.<\/li><\/ol>", "gro": "p4-3", "groT": "chickfila breakfast", "src": null, "macro": "670 calories · 71 g protein · 69 g carbs · 12 g fat · 5 g fiber"}, {"id": "m-p3-2", "plan": "p3", "cat": "Breakfasts", "title": "McDonald's Oatmeal Breakfast", "html": "<div class=\"macro\">680 calories · 68 g protein · 78 g carbs · 11 g fat · 4 g fiber<\/div>\n<ul><li>Fruit and Maple Oatmeal<\/li><li>1 Core Power 42g protein shake (gas station)<\/li><li>1 Oikos Pro yogurt cup (gas station; needs a cooler or eat right away)<\/li><\/ul>\n<ol class=\"steps\"><li>Pick up the Core Power shake and Oikos Pro cup at a gas station.<\/li><li>Order the Fruit and Maple Oatmeal.<\/li><li>Eat the yogurt cup and drink the shake with the oatmeal.<\/li><\/ol>", "gro": "p4-4", "groT": "mcdonalds oatmeal breakfast", "src": null, "macro": "680 calories · 68 g protein · 78 g carbs · 11 g fat · 4 g fiber"}, {"id": "m-p3-3", "plan": "p3", "cat": "Breakfasts", "title": "Hotel or Gas Station Oatmeal", "html": "<div class=\"macro\">690 calories · 64 g protein · 74 g carbs · 19 g fat · 9 g fiber<\/div>\n<ul><li>2 packets Quaker Original instant oatmeal<\/li><li>1 banana<\/li><li>1 Core Power 42g protein shake<\/li><li>2 hard-boiled eggs<\/li><\/ul>\n<ol class=\"steps\"><li>Empty both oatmeal packets into a bowl or cup. Add hot water to the line on the packet, or microwave with water following the packet directions.<\/li><li>Let it sit 1 to 2 minutes, then slice the banana on top.<\/li><li>Peel the eggs and drink the shake with the oatmeal.<\/li><\/ol>", "gro": "p4-5", "groT": "hotel or gas station oatmeal", "src": null, "macro": "690 calories · 64 g protein · 74 g carbs · 19 g fat · 9 g fiber"}, {"id": "m-p3-4", "plan": "p3", "cat": "Breakfasts", "title": "Nothing-Needed Breakfast", "html": "<div class=\"macro\">695 calories · 69 g protein · 68 g carbs · 21 g fat · 12 g fiber · no cooler, fridge or microwave<\/div>\n<ul><li>2 Premier Protein shakes<\/li><li>2 bananas<\/li><li>1 oz almonds<\/li><\/ul>\n<ol class=\"steps\"><li>Shake the protein shakes well.<\/li><li>Eat the bananas and almonds with the shakes.<\/li><\/ol>", "gro": "p4-6", "groT": "nothingneeded breakfast", "src": null, "macro": "695 calories · 69 g protein · 68 g carbs · 21 g fat · 12 g fiber · no cooler, fridge or microwave"}, {"id": "m-p3-5", "plan": "p3", "cat": "Breakfasts", "title": "Yogurt Bowl", "html": "<div class=\"macro\">665 calories · 69 g protein · 72 g carbs · 15 g fat · 8 g fiber · grocery store, no cooking<\/div>\n<ul><li>2 Oikos Pro cups<\/li><li>1 cup plain nonfat Greek yogurt<\/li><li>1 cup blueberries<\/li><li>1 banana<\/li><li>1/2 oz almonds<\/li><\/ul>\n<ol class=\"steps\"><li>Stir both Oikos Pro cups and the Greek yogurt together in a bowl.<\/li><li>Top with the blueberries, sliced banana and almonds.<\/li><\/ol>", "gro": "p4-18", "groT": "yogurt bowl", "src": null, "macro": "665 calories · 69 g protein · 72 g carbs · 15 g fat · 8 g fiber · grocery store, no cooking"}, {"id": "m-p3-6", "plan": "p3", "cat": "Fast Food Lunches and Dinners", "title": "Chipotle Bowl", "html": "<div class=\"macro\">745 calories · 77 g protein · 67 g carbs · 22 g fat · 11 g fiber<\/div>\n<ul><li>Double chicken<\/li><li>Brown rice and black beans<\/li><li>Fajita veggies, fresh tomato salsa and romaine<\/li><\/ul>\n<ol class=\"steps\"><li>Order a bowl with double chicken, brown rice and black beans.<\/li><li>Add fajita veggies, fresh tomato salsa and romaine.<\/li><li>Skip cheese, sour cream, queso and guacamole.<\/li><\/ol>", "gro": "p4-8", "groT": "chipotle bowl", "src": null, "macro": "745 calories · 77 g protein · 67 g carbs · 22 g fat · 11 g fiber"}, {"id": "m-p3-7", "plan": "p3", "cat": "Fast Food Lunches and Dinners", "title": "Chick-fil-A Lunch", "html": "<div class=\"macro\">660 calories · 67 g protein · 62 g carbs · 17 g fat · 5 g fiber<\/div>\n<ul><li>Grilled Chicken Sandwich<\/li><li>12 ct Grilled Nuggets<\/li><li>Medium fruit cup<\/li><\/ul>\n<ol class=\"steps\"><li>Order the Grilled Chicken Sandwich, 12 ct Grilled Nuggets and a medium fruit cup.<\/li><li>If you want a sauce, use Zesty Buffalo (25 calories).<\/li><\/ol>", "gro": "p4-9", "groT": "chickfila lunch", "src": null, "macro": "660 calories · 67 g protein · 62 g carbs · 17 g fat · 5 g fiber"}, {"id": "m-p3-8", "plan": "p3", "cat": "Fast Food Lunches and Dinners", "title": "Subway", "html": "<div class=\"macro\">605 calories · 62 g protein · 76 g carbs · 9 g fat · 10 g fiber<\/div>\n<ul><li>6-inch Fresh Fit Grilled Chicken on multigrain<\/li><li>Grilled Chicken Protein Bowl<\/li><li>1 banana (gas station)<\/li><\/ul>\n<ol class=\"steps\"><li>Order the 6-inch Fresh Fit Grilled Chicken on multigrain with all the veggies. Make sure you get spinach, tomatoes and green peppers.<\/li><li>Order the Grilled Chicken Protein Bowl.<\/li><li>Skip cheese and mayo. Mustard or vinegar is fine.<\/li><li>Eat the banana with the meal. Ask for smashed avocado on the bowl if you want a little more fat.<\/li><\/ol>", "gro": "p4-10", "groT": "subway", "src": null, "macro": "605 calories · 62 g protein · 76 g carbs · 9 g fat · 10 g fiber"}, {"id": "m-p3-9", "plan": "p3", "cat": "Fast Food Lunches and Dinners", "title": "McDonald's Lunch", "html": "<div class=\"macro\">730 calories · 66 g protein · 70 g carbs · 22 g fat · 2 g fiber<\/div>\n<ul><li>2 plain Hamburgers<\/li><li>1 Core Power 42g protein shake (gas station)<\/li><\/ul>\n<ol class=\"steps\"><li>Grab the Core Power shake at a gas station.<\/li><li>Order 2 plain Hamburgers.<\/li><li>This is the lowest-fiber meal. Pair it with the oatmeal breakfast or the Wendy's or Chipotle meal on the same day.<\/li><\/ol>", "gro": "p4-11", "groT": "mcdonalds lunch", "src": null, "macro": "730 calories · 66 g protein · 70 g carbs · 22 g fat · 2 g fiber"}, {"id": "m-p3-10", "plan": "p3", "cat": "Fast Food Lunches and Dinners", "title": "Wendy's Chili", "html": "<div class=\"macro\">675 calories · 65 g protein · 66 g carbs · 19 g fat · 11 g fiber<\/div>\n<ul><li>Large Chili<\/li><li>1 Core Power 42g protein shake (gas station)<\/li><li>1 banana (gas station)<\/li><\/ul>\n<ol class=\"steps\"><li>Pick up the Core Power shake and banana at a gas station.<\/li><li>Order a Large Chili with no cheese or crackers.<\/li><\/ol>", "gro": "p4-12", "groT": "wendys chili", "src": null, "macro": "675 calories · 65 g protein · 66 g carbs · 19 g fat · 11 g fiber"}, {"id": "m-p3-11", "plan": "p3", "cat": "Fast Food Lunches and Dinners", "title": "Gas Station Meal, With Cooler", "html": "<div class=\"macro\">735 calories · 71 g protein · 74 g carbs · 21 g fat · 10 g fiber<\/div>\n<ul><li>1 Core Power 42g protein shake<\/li><li>1 Oikos Pro yogurt cup<\/li><li>2 bananas<\/li><li>1 oz almonds<\/li><\/ul>\n<ol class=\"steps\"><li>Buy the shake, yogurt cup and bananas. Keep the yogurt in the cooler until you eat.<\/li><li>Eat everything together.<\/li><\/ol>", "gro": "p4-13", "groT": "gas station meal with cooler", "src": null, "macro": "735 calories · 71 g protein · 74 g carbs · 21 g fat · 10 g fiber"}, {"id": "m-p3-12", "plan": "p3", "cat": "Fast Food Lunches and Dinners", "title": "Gas Station Meal, No Cooler", "html": "<div class=\"macro\">695 calories · 69 g protein · 68 g carbs · 21 g fat · 12 g fiber<\/div>\n<ul><li>2 Premier Protein shakes<\/li><li>2 bananas<\/li><li>1 oz almonds<\/li><\/ul>\n<ol class=\"steps\"><li>Shake the protein shakes well.<\/li><li>Eat the bananas and almonds with the shakes.<\/li><\/ol>", "gro": "p4-14", "groT": "gas station meal no cooler", "src": null, "macro": "695 calories · 69 g protein · 68 g carbs · 21 g fat · 12 g fiber"}, {"id": "m-p3-13", "plan": "p3", "cat": "Grocery Store Ready-to-Eat Meals", "title": "Rotisserie Chicken Bowl", "html": "<div class=\"macro\">685 calories · 67 g protein · 69 g carbs · 16 g fat · 16 g fiber<\/div>\n<ul><li>6 oz rotisserie chicken breast meat, skin removed<\/li><li>3/4 cup microwave brown rice<\/li><li>1/2 cup no-salt-added black beans, rinsed<\/li><li>1/4 avocado<\/li><li>2 tbsp salsa<\/li><li>2 cups bagged salad greens<\/li><\/ul>\n<ol class=\"steps\"><li>Pull 6 oz of breast meat off the chicken and discard the skin.<\/li><li>Heat the rice in the hotel or store microwave following the label.<\/li><li>Rinse the beans in a sink or with a bottle of water.<\/li><li>Layer the greens, rice and beans in a bowl. Top with the chicken, avocado and salsa.<\/li><li>Eat within 2 hours or keep the leftover chicken in the cooler.<\/li><\/ol>", "gro": "p4-16", "groT": "rotisserie chicken bowl", "src": null, "macro": "685 calories · 67 g protein · 69 g carbs · 16 g fat · 16 g fiber"}, {"id": "m-p3-14", "plan": "p3", "cat": "Grocery Store Ready-to-Eat Meals", "title": "Salmon Rice Bowl", "html": "<div class=\"macro\">640 calories · 68 g protein · 66 g carbs · 14 g fat · 12 g fiber · eat 2 a week<\/div>\n<ul><li>4 pouches (2.6 oz) pink salmon in water<\/li><li>1 cup microwave brown rice<\/li><li>1/4 avocado<\/li><li>2 cups bagged salad greens<\/li><li>1/2 cup cherry tomatoes<\/li><\/ul>\n<ol class=\"steps\"><li>Heat the rice in a microwave following the label. Do not microwave the salmon in its pouch.<\/li><li>Layer the greens and rice in a bowl.<\/li><li>Top with the salmon, avocado and cherry tomatoes.<\/li><\/ol>", "gro": "p4-17", "groT": "salmon rice bowl", "src": null, "macro": "640 calories · 68 g protein · 66 g carbs · 14 g fat · 12 g fiber · eat 2 a week"}, {"id": "m-p3-15", "plan": "p3", "cat": "Grocery Store Ready-to-Eat Meals", "title": "No-Heat Chicken Plate", "html": "<div class=\"macro\">705 calories · 67 g protein · 69 g carbs · 21 g fat · 17 g fiber<\/div>\n<ul><li>5 oz rotisserie chicken breast meat, skin removed<\/li><li>1 cup shelled edamame (refrigerated, ready to eat)<\/li><li>1 banana and 1 apple<\/li><li>1/2 oz almonds<\/li><\/ul>\n<ol class=\"steps\"><li>Pull 5 oz of breast meat off the chicken and discard the skin.<\/li><li>Check that the edamame bag says \"ready to eat.\"<\/li><li>Eat the chicken and edamame with the fruit and almonds.<\/li><\/ol>", "gro": "p4-19", "groT": "noheat chicken plate", "src": null, "macro": "705 calories · 67 g protein · 69 g carbs · 21 g fat · 17 g fiber"}, {"id": "m-p5-1", "plan": "p5", "cat": "No-Cook Breakfasts", "title": "Protein Overnight Oats", "html": "<div class=\"macro\">713 calories · 67 g protein · 71 g carbs · 18 g fat · 15.5 g fiber · mix at night<\/div>\n<ul><li>3/4 cup rolled oats<\/li><li>1.5 scoops whey protein<\/li><li>3/4 cup nonfat plain Greek yogurt<\/li><li>1 tbsp chia seeds<\/li><li>1.5 tbsp unsalted sunflower seeds<\/li><li>3/4 cup strawberries or mixed berries (frozen is fine)<\/li><li>Water or unsweetened almond milk to thin<\/li><\/ul>\n<ol class=\"steps\"><li>Stir the oats, whey, yogurt, chia and sunflower seeds together in a jar or container.<\/li><li>Add water or almond milk a splash at a time until it is as thick as you like.<\/li><li>Top with the berries, cover and refrigerate overnight, or at least 4 hours.<\/li><li>Eat it cold.<\/li><\/ol>", "gro": "p6-12", "groT": "protein overnight oats", "src": null, "macro": "713 calories · 67 g protein · 71 g carbs · 18 g fat · 15.5 g fiber · mix at night"}, {"id": "m-p5-2", "plan": "p5", "cat": "No-Cook Breakfasts", "title": "Greek Yogurt Parfait", "html": "<div class=\"macro\">741 calories · 71 g protein · 72 g carbs · 19 g fat · 16 g fiber · 2 minutes<\/div>\n<ul><li>2.5 cups nonfat plain Greek yogurt<\/li><li>1/2 cup rolled oats<\/li><li>1 cup strawberries or mixed berries<\/li><li>17 almonds<\/li><li>1 tbsp chia seeds<\/li><\/ul>\n<ol class=\"steps\"><li>If the berries are frozen, thaw them in the fridge overnight.<\/li><li>Layer half the yogurt, half the oats and half the berries in a bowl or jar. Repeat.<\/li><li>Top with the almonds and chia seeds.<\/li><\/ol>", "gro": "p6-13", "groT": "greek yogurt parfait", "src": null, "macro": "741 calories · 71 g protein · 72 g carbs · 19 g fat · 16 g fiber · 2 minutes"}, {"id": "m-p5-3", "plan": "p5", "cat": "No-Cook Breakfasts", "title": "Green Protein Smoothie", "html": "<div class=\"macro\">753 calories · 73 g protein · 72 g carbs · 19 g fat · 14.5 g fiber · 3 minutes<\/div>\n<ul><li>1 cup unsweetened almond milk with added vitamin E<\/li><li>1 cup nonfat plain Greek yogurt<\/li><li>1.5 scoops whey protein<\/li><li>1 medium banana<\/li><li>1/3 cup rolled oats<\/li><li>1.5 tbsp unsalted sunflower seeds<\/li><li>1 tbsp chia seeds<\/li><li>1/2 cup frozen spinach<\/li><li>Ice<\/li><\/ul>\n<ol class=\"steps\"><li>Pour the almond milk into the blender first so the blades move freely.<\/li><li>Add the yogurt, whey, banana, oats, sunflower seeds, chia seeds and spinach.<\/li><li>Add a handful of ice and blend 45 to 60 seconds, until smooth.<\/li><\/ol>", "gro": "p6-14", "groT": "green protein smoothie", "src": null, "macro": "753 calories · 73 g protein · 72 g carbs · 19 g fat · 14.5 g fiber · 3 minutes"}, {"id": "m-p5-4", "plan": "p5", "cat": "The Bowls", "title": "Mediterranean Salmon Bowl", "html": "<div class=\"macro\">697 calories · 74 g protein · 69 g carbs · 18 g fat · 19 g fiber · about 1.2 g EPA and DHA<\/div>\n<p>The original: bright, lemony and loaded with color.<\/p>\n<ul><li>4 pouches (2.6 oz) pink salmon in water<\/li><li>1/2 cup cooked brown rice (microwave cup)<\/li><li>1/2 cup no-salt-added chickpeas, rinsed<\/li><li>1/3 avocado, sliced<\/li><li>2 cups salad greens<\/li><li>1/2 cup cherry tomatoes, 1/2 cup sliced red bell pepper<\/li><li>Juice of 1/2 lemon, black pepper, dried dill<\/li><\/ul>\n<p><b>Build:<\/b> Greens on the bottom, then rice, chickpeas and vegetables. Top with salmon and avocado and squeeze the lemon over everything.<\/p>", "gro": "p6-3", "groT": "mediterranean salmon bowl", "src": "p5-4", "macro": "697 calories · 74 g protein · 69 g carbs · 18 g fat · 19 g fiber · about 1.2 g EPA and DHA"}, {"id": "m-p5-5", "plan": "p5", "cat": "The Bowls", "title": "Greek Chicken Gyro Bowl", "html": "<div class=\"macro\">704 calories · 69 g protein · 70 g carbs · 16 g fat · 14 g fiber<\/div>\n<p>Everything you love about a gyro, minus the pita and fryer.<\/p>\n<ul><li>3 pouches (2.6 oz) white chicken, 25% less sodium<\/li><li>3/4 cup cooked quinoa (microwave cup)<\/li><li>1/2 cup no-salt-added chickpeas, rinsed<\/li><li>2 cups baby spinach<\/li><li>1/2 cup diced cucumber, 1/2 cup cherry tomatoes, 2 tbsp diced red onion<\/li><li>Tzatziki: 1/2 cup nonfat plain Greek yogurt + lemon juice + garlic + dried dill + a little grated cucumber<\/li><li>1 tbsp unsalted sunflower seeds<\/li><li>Dried oregano<\/li><\/ul>\n<p><b>Build:<\/b> Toss the chicken with oregano and a squeeze of lemon. Layer spinach, quinoa, chickpeas and vegetables, then top with chicken, a big spoonful of tzatziki and the sunflower seeds.<\/p>", "gro": "p6-4", "groT": "greek chicken gyro bowl", "src": "p5-5", "macro": "704 calories · 69 g protein · 70 g carbs · 16 g fat · 14 g fiber"}, {"id": "m-p5-6", "plan": "p5", "cat": "The Bowls", "title": "Southwest Chicken Burrito Bowl", "html": "<div class=\"macro\">706 calories · 67 g protein · 65 g carbs · 20 g fat · 18 g fiber<\/div>\n<p>Chipotle at home for a fraction of the price.<\/p>\n<ul><li>3 pouches (2.6 oz) white chicken, 25% less sodium<\/li><li>1/3 cup cooked brown rice (microwave cup)<\/li><li>1/2 cup no-salt-added black beans, rinsed<\/li><li>2 cups salad greens<\/li><li>1/2 cup sliced red bell pepper, 1/2 cup cherry tomatoes<\/li><li>1/4 cup salsa (lowest sodium you can find)<\/li><li>Chipotle-lime crema: 1/2 cup nonfat plain Greek yogurt + lime juice + chipotle powder + cumin<\/li><li>1/4 avocado, 1 tbsp pumpkin seeds<\/li><\/ul>\n<p><b>Build:<\/b> Toss the chicken with half the salsa and a pinch of cumin. Layer greens, rice, beans and peppers, then top with chicken, tomatoes, the rest of the salsa, crema, avocado and pumpkin seeds.<\/p>", "gro": "p6-5", "groT": "southwest chicken burrito bowl", "src": "p5-6", "macro": "706 calories · 67 g protein · 65 g carbs · 20 g fat · 18 g fiber"}, {"id": "m-p5-7", "plan": "p5", "cat": "The Bowls", "title": "Baja Salmon and Mango Bowl", "html": "<div class=\"macro\">679 calories · 71 g protein · 69 g carbs · 17 g fat · 17 g fiber · about 0.9 g EPA and DHA<\/div>\n<p>Fish taco flavor: sweet mango, crunchy slaw and cool lime crema.<\/p>\n<ul><li>3 pouches (2.6 oz) pink salmon in water<\/li><li>1/3 cup cooked brown rice (microwave cup)<\/li><li>1/2 cup no-salt-added black beans, rinsed<\/li><li>1 cup coleslaw mix (no dressing)<\/li><li>1/2 cup diced mango (fresh or thawed frozen), 2 tbsp diced red onion, cilantro<\/li><li>Lime crema: 1/2 cup nonfat plain Greek yogurt + lime juice and zest + pinch of chili powder<\/li><li>1/4 avocado, 1 tbsp pumpkin seeds<\/li><\/ul>\n<p><b>Build:<\/b> Mix the mango, onion, cilantro and a squeeze of lime for a quick salsa. Layer slaw, rice and beans, then top with salmon, mango salsa, crema, avocado and pumpkin seeds.<\/p>", "gro": "p6-6", "groT": "baja salmon and mango bowl", "src": "p5-7", "macro": "679 calories · 71 g protein · 69 g carbs · 17 g fat · 17 g fiber · about 0.9 g EPA and DHA"}, {"id": "m-p5-8", "plan": "p5", "cat": "The Bowls", "title": "Sesame Ginger Tuna Poke Bowl", "html": "<div class=\"macro\">662 calories · 68 g protein · 68 g carbs · 16 g fat · 14 g fiber · about 0.5 g EPA and DHA<\/div>\n<p>Poke-shop flavor with zero raw fish.<\/p>\n<ul><li>3 pouches (2.6 oz) light tuna in water<\/li><li>3/4 cup cooked brown rice (microwave cup)<\/li><li>1/2 cup shelled edamame (microwave if frozen)<\/li><li>1 cup coleslaw mix, 1/2 cup shredded carrots, 1/2 cup sliced cucumber<\/li><li>1/4 avocado<\/li><li>Sesame-ginger dressing: 2 tsp low-sodium soy sauce + 1 tbsp rice vinegar + 1 tsp honey + 1/2 tsp ginger paste<\/li><li>1 tsp sesame seeds, sliced green onion if you have it<\/li><\/ul>\n<p><b>Build:<\/b> Whisk the dressing and toss half of it with the tuna. Layer rice, slaw, carrots, cucumber and edamame, then top with tuna, avocado, the rest of the dressing and sesame seeds.<\/p>\n<p><b>Swap:<\/b> Use 3 salmon pouches instead of tuna for more omega-3s (about 62 g protein).<\/p>", "gro": "p6-7", "groT": "sesame ginger tuna poke bowl", "src": "p5-8", "macro": "662 calories · 68 g protein · 68 g carbs · 16 g fat · 14 g fiber · about 0.5 g EPA and DHA"}, {"id": "m-p5-9", "plan": "p5", "cat": "The Bowls", "title": "Thai Peanut Chicken Crunch Bowl", "html": "<div class=\"macro\">717 calories · 70 g protein · 65 g carbs · 20 g fat · 12 g fiber<\/div>\n<p>Creamy, crunchy and a little spicy.<\/p>\n<ul><li>3 pouches (2.6 oz) white chicken, 25% less sodium<\/li><li>1/2 cup cooked brown rice (microwave cup)<\/li><li>1/2 cup shelled edamame (microwave if frozen)<\/li><li>1 cup coleslaw mix, 1/2 cup sliced red bell pepper, 1/2 cup shredded carrots, 1/2 cup sliced cucumber<\/li><li>Peanut-lime sauce: 1 tbsp natural peanut butter + 1/2 cup nonfat plain Greek yogurt + 2 tsp low-sodium soy sauce + 1 tsp honey + lime juice + pinch of red pepper flakes<\/li><li>Cilantro and a lime wedge<\/li><\/ul>\n<p><b>Build:<\/b> Stir the sauce until smooth, adding a splash of water if needed. Toss the chicken in a third of it. Layer rice and vegetables, then top with chicken, edamame, the rest of the sauce and cilantro.<\/p>", "gro": "p6-8", "groT": "thai peanut chicken crunch bowl", "src": "p5-9", "macro": "717 calories · 70 g protein · 65 g carbs · 20 g fat · 12 g fiber"}, {"id": "m-p5-10", "plan": "p5", "cat": "The Bowls", "title": "Caribbean Jerk Chicken and Sweet Potato Bowl", "html": "<div class=\"macro\">718 calories · 67 g protein · 71 g carbs · 19 g fat · 19 g fiber<\/div>\n<p>Island heat cooled by sweet pineapple.<\/p>\n<ul><li>3 pouches (2.6 oz) white chicken, 25% less sodium<\/li><li>1 medium sweet potato, microwaved 5 to 7 minutes until soft<\/li><li>1/2 cup no-salt-added black beans, rinsed<\/li><li>2 cups baby spinach<\/li><li>2/3 cup pineapple tidbits (canned in juice, drained) and 1/2 cup sliced red bell pepper<\/li><li>Jerk-lime yogurt: 1/2 cup nonfat plain Greek yogurt + 1 tsp salt-free jerk seasoning + lime juice<\/li><li>1/4 avocado, 1 tbsp pumpkin seeds<\/li><\/ul>\n<p><b>Build:<\/b> Toss the chicken with a little jerk seasoning. Split the sweet potato and mash it lightly in the bowl. Add spinach, beans, pineapple and pepper, then top with chicken, jerk-lime yogurt, avocado and pumpkin seeds.<\/p>", "gro": "p6-9", "groT": "caribbean jerk chicken and sweet potato bowl", "src": "p5-10", "macro": "718 calories · 67 g protein · 71 g carbs · 19 g fat · 19 g fiber"}, {"id": "m-p5-11", "plan": "p5", "cat": "The Bowls", "title": "Mackerel, White Bean and Tomato Bowl", "html": "<div class=\"macro\">678 calories · 67 g protein · 69 g carbs · 17 g fat · 19 g fiber · about 1.9 g omega-3s<\/div>\n<p>A rustic Italian-style bowl and the omega-3 champion of the week.<\/p>\n<ul><li>5 oz canned jack mackerel, drained<\/li><li>1 cup no-salt-added white beans (cannellini or great northern), rinsed<\/li><li>1/3 cup cooked quinoa (microwave cup)<\/li><li>2 cups baby spinach<\/li><li>1 cup cherry tomatoes, halved, 1/2 cup diced cucumber, 2 tbsp diced red onion<\/li><li>Lemon-herb yogurt: 1/2 cup nonfat plain Greek yogurt + lemon juice + garlic + dried basil or oregano<\/li><li>1 tbsp unsalted sunflower seeds<\/li><\/ul>\n<p><b>Build:<\/b> Flake the mackerel and toss it with the beans, tomatoes, onion and a squeeze of lemon. Spoon over spinach and quinoa, then top with the yogurt and sunflower seeds.<\/p>\n<p><b>Swap:<\/b> 1 can (4.4 oz) sardines in water plus 1 salmon pouch gives similar numbers.<\/p>", "gro": "p6-10", "groT": "mackerel white bean and tomato bowl", "src": "p5-11", "macro": "678 calories · 67 g protein · 69 g carbs · 17 g fat · 19 g fiber · about 1.9 g omega-3s"}, {"id": "m-p7-1", "plan": "p7", "cat": "Breakfasts", "title": "Egg Whites with Potato and Salsa", "html": "<div class=\"macro\">700 calories · 70 g protein · 71 g carbs · 15 g fat · 18 g fiber<\/div>\n<p><b>Nutrient highlights:<\/b> folate (beans, spinach), vitamin C (potato, salsa), selenium (eggs)<\/p>\n<ul><li>1 1/2 cups liquid egg whites + 2 whole eggs<\/li><li>1 medium russet potato (about 6 oz), skin on<\/li><li>1/2 cup no-salt-added black beans, rinsed<\/li><li>1/2 cup frozen spinach<\/li><li>1/4 cup chunky salsa, plus diced onion, mushrooms or jalapeños if you like<\/li><li>1/8 avocado, sliced<\/li><\/ul>\n<ol class=\"steps\"><li>Pierce the potato and microwave it 5 to 6 minutes until soft. Mash it on the plate with a fork.<\/li><li>Scramble the egg whites, eggs, spinach, beans and vegetables in a nonstick pan with cooking spray.<\/li><li>Pile the eggs on the potato and top with salsa and avocado.<\/li><\/ol>", "gro": "p8-3", "groT": "egg whites with potato and salsa", "src": "p7-4", "macro": "700 calories · 70 g protein · 71 g carbs · 15 g fat · 18 g fiber"}, {"id": "m-p7-2", "plan": "p7", "cat": "Breakfasts", "title": "Egg White Breakfast Tacos", "html": "<div class=\"macro\">694 calories · 66 g protein · 71 g carbs · 16 g fat · 18 g fiber<\/div>\n<p><b>Nutrient highlights:<\/b> folate (beans, avocado), vitamin C (red pepper, salsa)<\/p>\n<ul><li>1 1/2 cups liquid egg whites + 1 whole egg<\/li><li>1/2 cup no-salt-added black beans, rinsed<\/li><li>1/2 cup diced red bell pepper<\/li><li>1/4 cup chunky salsa<\/li><li>3 corn tortillas, warmed<\/li><li>1/4 avocado and 1/4 cup nonfat plain Greek yogurt (as sour cream)<\/li><\/ul>\n<ol class=\"steps\"><li>Scramble the eggs with the beans and pepper in a nonstick pan with cooking spray.<\/li><li>Spoon into warm tortillas and top with salsa, avocado and yogurt.<\/li><\/ol>", "gro": "p8-4", "groT": "egg white breakfast tacos", "src": "p7-5", "macro": "694 calories · 66 g protein · 71 g carbs · 16 g fat · 18 g fiber"}, {"id": "m-p7-3", "plan": "p7", "cat": "Breakfasts", "title": "Spinach Marinara Eggs with Toast", "html": "<div class=\"macro\">720 calories · 71 g protein · 73 g carbs · 17 g fat · 17 g fiber<\/div>\n<p><b>Nutrient highlights:<\/b> lycopene (marinara), folate and vitamin E (spinach), vitamin C (berries)<\/p>\n<ul><li>1 1/2 cups liquid egg whites + 2 whole eggs<\/li><li>1 cup frozen spinach<\/li><li>1/2 cup low-sodium marinara sauce, warmed<\/li><li>2 slices whole wheat toast with 1 tbsp low-sugar jam<\/li><li>1 cup strawberries or mixed berries on the side<\/li><\/ul>\n<ol class=\"steps\"><li>Scramble the egg whites, eggs and spinach in a nonstick pan with cooking spray.<\/li><li>Top with the warm marinara. Serve with toast and berries.<\/li><\/ol>", "gro": "p8-5", "groT": "spinach marinara eggs with toast", "src": "p7-6", "macro": "720 calories · 71 g protein · 73 g carbs · 17 g fat · 17 g fiber"}, {"id": "m-p7-4", "plan": "p7", "cat": "Breakfasts", "title": "Banana Oat Protein Pancake", "html": "<div class=\"macro\">732 calories · 75 g protein · 72 g carbs · 17 g fat · 12 g fiber<\/div>\n<p><b>Nutrient highlights:<\/b> omega-3 ALA (flaxseed), zinc (oats), vitamin C (berries)<\/p>\n<ul><li>1 cup liquid egg whites<\/li><li>1 scoop whey protein (about 24 g protein)<\/li><li>2/3 cup rolled oats<\/li><li>1/2 banana<\/li><li>1 tbsp ground flaxseed, cinnamon, optional sweetener<\/li><li>Toppings: 1/2 cup nonfat plain Greek yogurt, 1/2 cup berries, 1 tbsp natural peanut butter<\/li><\/ul>\n<ol class=\"steps\"><li>Blend the egg whites, whey, oats, banana, flaxseed and cinnamon until smooth.<\/li><li>Pour into a covered nonstick pan sprayed with cooking spray. Cook 4 to 5 minutes on medium-low, flip, and cook 1 to 2 minutes more.<\/li><li>Top with yogurt, berries and peanut butter.<\/li><\/ol>", "gro": "p8-6", "groT": "banana oat protein pancake", "src": "p7-7", "macro": "732 calories · 75 g protein · 72 g carbs · 17 g fat · 12 g fiber"}, {"id": "m-p7-5", "plan": "p7", "cat": "Breakfasts", "title": "Overnight Yogurt Oats and Raisins", "html": "<div class=\"macro\">710 calories · 69 g protein · 72 g carbs · 19 g fat · 12 g fiber<\/div>\n<p><b>Nutrient highlights:<\/b> omega-3 ALA (chia, walnuts), zinc and selenium (oats, yogurt)<\/p>\n<ul><li>1 1/2 cups nonfat plain Greek yogurt<\/li><li>1/2 cup rolled oats<\/li><li>1 scoop whey protein<\/li><li>2 tbsp raisins and 1/2 cup berries<\/li><li>1 tbsp chia seeds and 1/2 oz walnuts (about 7 halves)<\/li><li>Vanilla and cinnamon; splash of water to thin<\/li><\/ul>\n<ol class=\"steps\"><li>Stir everything except the walnuts together in a jar. Refrigerate overnight.<\/li><li>Top with walnuts in the morning.<\/li><\/ol>", "gro": "p8-7", "groT": "overnight yogurt oats and raisins", "src": "p7-8", "macro": "710 calories · 69 g protein · 72 g carbs · 19 g fat · 12 g fiber"}, {"id": "m-p7-6", "plan": "p7", "cat": "Lunches", "title": "Salmon or Tuna Salad Sandwich", "html": "<div class=\"macro\">714 calories · 75 g protein · 72 g carbs · 17 g fat · 16 g fiber (made with tuna; salmon is about the same)<\/div>\n<p><b>Nutrient highlights:<\/b> omega-3 EPA and DHA (salmon version, about 0.9 g), selenium (fish, whole wheat), vitamin E (avocado, sunflower seeds)<\/p>\n<ul><li>3 pouches (2.6 oz) pink salmon or light tuna in water<\/li><li>3 tbsp nonfat plain Greek yogurt, 1 tsp Dijon mustard, 1 tbsp dill relish<\/li><li>2 hard-boiled egg whites, chopped<\/li><li>1/4 avocado, mashed into the salad<\/li><li>2 slices whole wheat bread, lettuce and tomato<\/li><li>1 tbsp unsalted sunflower seeds mixed in for crunch<\/li><li>Sides: 1 apple and 1 cup baby carrots<\/li><\/ul>\n<ol class=\"steps\"><li>Mix the fish, yogurt, mustard, relish, egg whites, avocado and sunflower seeds.<\/li><li>Build the sandwich with lettuce and tomato. Eat with the apple and carrots.<\/li><\/ol>\n<p><b>Tip:<\/b> Use salmon at least twice a week for omega-3s. Your IEM menu limits tuna to twice a week.<\/p>", "gro": "p8-9", "groT": "salmon or tuna salad sandwich", "src": "p7-10", "macro": "714 calories · 75 g protein · 72 g carbs · 17 g fat · 16 g fiber (made with tuna; salmon is about the same)"}, {"id": "m-p7-7", "plan": "p7", "cat": "Lunches", "title": "Walnut Chicken Salad", "html": "<div class=\"macro\">715 calories · 72 g protein · 65 g carbs · 19 g fat · 12 g fiber<\/div>\n<p><b>Nutrient highlights:<\/b> omega-3 ALA (walnuts), vitamin C (red pepper), folate (spinach)<\/p>\n<ul><li>6 oz cooked chicken breast, chopped (rotisserie breast meat or 4 to 5 chicken pouches)<\/li><li>1/2 oz walnuts, chopped, and 2 tbsp chopped scallions<\/li><li>1/4 cup nonfat plain Greek yogurt, 2 tsp Dijon mustard, 2 tbsp lemon juice, black pepper<\/li><li>1 cup chopped red bell pepper<\/li><li>2 cups baby spinach<\/li><li>2 slices whole wheat toast and 1 apple<\/li><\/ul>\n<ol class=\"steps\"><li>Stir the walnuts, scallions, yogurt, mustard, lemon and pepper together, then fold in the chicken and bell pepper.<\/li><li>Serve over spinach with toast and an apple. Or stuff it into a hollowed-out bell pepper or tomato.<\/li><\/ol>", "gro": "p8-10", "groT": "walnut chicken salad", "src": "p7-11", "macro": "715 calories · 72 g protein · 65 g carbs · 19 g fat · 12 g fiber"}, {"id": "m-p7-8", "plan": "p7", "cat": "Dinners", "title": "Chicken and Portobello Fajitas", "html": "<div class=\"macro\">678 calories · 70 g protein · 66 g carbs · 16 g fat · 19 g fiber<\/div>\n<p><b>Nutrient highlights:<\/b> vitamin C (peppers), folate (beans, avocado), selenium (chicken, mushroom)<\/p>\n<ul><li>5.5 oz cooked chicken breast or thighs, sliced (about 7 oz raw)<\/li><li>1 large portobello cap, sliced<\/li><li>1 cup sliced bell pepper and 1/2 cup sliced onion<\/li><li>Balsamic vinegar, rosemary and salt-free Cajun seasoning<\/li><li>2 corn tortillas<\/li><li>1/2 cup no-salt-added black beans, warmed<\/li><li>1/4 cup pico de gallo, 1/4 avocado, 1/4 cup nonfat plain Greek yogurt<\/li><\/ul>\n<ol class=\"steps\"><li>Toss the chicken and portobello in balsamic vinegar and seasoning. Grill or cook in a hot nonstick skillet with cooking spray, 5 to 7 minutes per side for chicken.<\/li><li>Cook the peppers and onion in the same pan until soft.<\/li><li>Fill the tortillas and serve with beans, pico, avocado and yogurt.<\/li><\/ol>\n<p><b>Swap:<\/b> Use 7 oz cooked shrimp instead of chicken.<\/p>", "gro": "p8-12", "groT": "chicken and portobello fajitas", "src": "p7-13", "macro": "678 calories · 70 g protein · 66 g carbs · 16 g fat · 19 g fiber"}, {"id": "m-p7-9", "plan": "p7", "cat": "Dinners", "title": "Shrimp Jambalaya", "html": "<div class=\"macro\">717 calories · 72 g protein · 70 g carbs · 18 g fat · 13 g fiber<\/div>\n<p><b>Nutrient highlights:<\/b> lycopene (stewed tomatoes), selenium (shrimp), folate (red beans)<\/p>\n<ul><li>6 oz cooked shrimp (about 8 oz raw, peeled) and 2 oz cooked chicken breast<\/li><li>1/2 cup cooked brown rice (microwave cup works)<\/li><li>1 cup no-salt-added stewed tomatoes<\/li><li>1/2 cup no-salt-added kidney beans, rinsed<\/li><li>1/2 cup chopped onion, 1/2 cup chopped green pepper, 1 clove garlic<\/li><li>1 tbsp olive oil<\/li><li>Bay leaf, thyme, basil, cayenne, black pepper<\/li><\/ul>\n<ol class=\"steps\"><li>Cook the onion, pepper and garlic in the olive oil for 3 to 4 minutes.<\/li><li>Add tomatoes, beans, seasonings and raw shrimp. Simmer 5 to 7 minutes until the shrimp turn pink.<\/li><li>Stir in the rice and chicken and heat through.<\/li><\/ol>\n<p><b>Batch it:<\/b> Multiply by 4 and portion into containers; keeps 3 days in the fridge.<\/p>", "gro": "p8-13", "groT": "shrimp jambalaya", "src": "p7-14", "macro": "717 calories · 72 g protein · 70 g carbs · 18 g fat · 13 g fiber"}, {"id": "m-p7-10", "plan": "p7", "cat": "Dinners", "title": "Ginger Scallop Stir-Fry", "html": "<div class=\"macro\">693 calories · 70 g protein · 62 g carbs · 20 g fat · 13 g fiber<\/div>\n<p><b>Nutrient highlights:<\/b> zinc and selenium (scallops), folate and ALA (edamame), vitamin C (red pepper)<\/p>\n<ul><li>8 oz cooked scallops (about 10 oz raw), or shrimp<\/li><li>1 cup shelled edamame<\/li><li>1 cup sliced red bell pepper and 1/2 cup chopped tomato<\/li><li>1/2 cup cooked brown rice<\/li><li>Sauce: 1 tbsp low-sodium soy sauce, 1 tbsp lemon or lime juice, 1/2 tsp ground ginger, pinch of dry mustard<\/li><li>2 tsp toasted sesame oil<\/li><\/ul>\n<ol class=\"steps\"><li>Whisk the sauce. Skip the long marinade; 10 minutes is plenty.<\/li><li>Heat the sesame oil and stir-fry the peppers and edamame 3 minutes. Add the scallops and sauce and cook 2 to 3 minutes per side until opaque.<\/li><li>Add the tomato and serve over rice.<\/li><\/ol>", "gro": "p8-14", "groT": "ginger scallop stirfry", "src": "p7-15", "macro": "693 calories · 70 g protein · 62 g carbs · 20 g fat · 13 g fiber"}, {"id": "m-p7-11", "plan": "p7", "cat": "Dinners", "title": "Spicy Shrimp and Green Beans", "html": "<div class=\"macro\">739 calories · 74 g protein · 73 g carbs · 20 g fat · 17 g fiber<\/div>\n<p><b>Nutrient highlights:<\/b> selenium (shrimp), folate (edamame), vitamin C (green beans)<\/p>\n<ul><li>7 oz cooked shrimp (about 9 oz raw, peeled)<\/li><li>1 1/2 cups frozen cut green beans and 1 cup shelled edamame<\/li><li>1/2 cup chopped onion, 1 clove garlic, 1 tsp grated ginger<\/li><li>3/4 cup cooked brown rice<\/li><li>2 tsp olive oil<\/li><li>Coriander, ground red pepper, bay leaf, 1 tbsp vinegar<\/li><\/ul>\n<ol class=\"steps\"><li>Cook the onion, garlic, ginger and spices in the oil for 4 to 5 minutes.<\/li><li>Add the green beans, edamame and a splash of water; cook 3 minutes.<\/li><li>Add the shrimp and vinegar and cook until the shrimp are pink. Serve over rice.<\/li><\/ol>\n<p><b>Swap:<\/b> Use chicken breast or scallops instead of shrimp.<\/p>", "gro": "p8-15", "groT": "spicy shrimp and green beans", "src": "p7-16", "macro": "739 calories · 74 g protein · 73 g carbs · 20 g fat · 17 g fiber"}, {"id": "m-p7-12", "plan": "p7", "cat": "Dinners", "title": "Beef and Bean Chili", "html": "<div class=\"macro\">714 calories · 69 g protein · 70 g carbs · 19 g fat · 23 g fiber<\/div>\n<p><b>Nutrient highlights:<\/b> zinc (beef), lycopene (tomato sauce), folate (kidney beans); the highest-fiber meal here<\/p>\n<ul><li>7 oz raw 95% lean ground beef (or 93% lean ground turkey; then skip the avocado)<\/li><li>1 cup no-salt-added kidney beans, rinsed<\/li><li>1 cup no-salt-added tomato sauce and 1/2 cup low-sodium broth<\/li><li>1 cup chopped onion, celery and carrots (frozen soup-vegetable mix works)<\/li><li>1 tbsp chili powder, cumin, jalapeños if you like<\/li><li>Toppings: 1/4 cup nonfat plain Greek yogurt, 1/4 avocado<\/li><\/ul>\n<ol class=\"steps\"><li>Brown the beef, breaking it into small pieces.<\/li><li>Add the vegetables, beans, tomato sauce, broth and spices. Simmer 15 minutes.<\/li><li>Top with yogurt and avocado.<\/li><\/ol>\n<p><b>Batch it:<\/b> Multiply by 4; chili freezes well.<\/p>", "gro": "p8-16", "groT": "beef and bean chili", "src": "p7-17", "macro": "714 calories · 69 g protein · 70 g carbs · 19 g fat · 23 g fiber"}, {"id": "m-p7-13", "plan": "p7", "cat": "Dinners", "title": "Chicken Vegetable Soup", "html": "<div class=\"macro\">717 calories · 71 g protein · 68 g carbs · 18 g fat · 14 g fiber<\/div>\n<p><b>Nutrient highlights:<\/b> lycopene (tomatoes), folate (white beans, spinach), selenium (chicken)<\/p>\n<ul><li>6 oz cooked chicken breast or thighs, chopped<\/li><li>2 cups low-sodium chicken broth (replaces the bouillon granules)<\/li><li>1 cup no-salt-added diced tomatoes<\/li><li>1 cup sliced carrots, onion and green pepper<\/li><li>1/2 cup no-salt-added white beans, rinsed<\/li><li>1/2 cup cooked brown rice<\/li><li>1 cup baby spinach<\/li><li>2 tsp olive oil, thyme, sage, black pepper<\/li><\/ul>\n<ol class=\"steps\"><li>Simmer the broth, tomatoes, vegetables, beans and herbs for 15 minutes.<\/li><li>Stir in the chicken, rice, spinach and olive oil and heat 5 minutes.<\/li><\/ol>", "gro": "p8-17", "groT": "chicken vegetable soup", "src": "p7-18", "macro": "717 calories · 71 g protein · 68 g carbs · 18 g fat · 14 g fiber"}, {"id": "m-p7-14", "plan": "p7", "cat": "Dinners", "title": "Spanish Rice Skillet", "html": "<div class=\"macro\">731 calories · 69 g protein · 72 g carbs · 18 g fat · 16 g fiber<\/div>\n<p><b>Nutrient highlights:<\/b> zinc (beef), lycopene (tomato sauce), folate (black beans), vitamin C (peppers)<\/p>\n<ul><li>8 oz raw 95% lean ground beef<\/li><li>1 cup no-salt-added tomato sauce<\/li><li>1 cup diced red onion, celery and red and yellow bell pepper<\/li><li>1/2 cup cooked brown rice and 1/2 cup no-salt-added black beans<\/li><li>1 tsp olive oil, minced garlic, tarragon, black pepper (skip the garlic salt)<\/li><li>1/4 cup nonfat plain Greek yogurt on top<\/li><\/ul>\n<ol class=\"steps\"><li>Brown the beef in the oil.<\/li><li>Add the vegetables, tomato sauce and seasonings and simmer 8 to 10 minutes.<\/li><li>Stir in the rice and beans, heat through, and top with yogurt.<\/li><\/ol>", "gro": "p8-18", "groT": "spanish rice skillet", "src": "p7-19", "macro": "731 calories · 69 g protein · 72 g carbs · 18 g fat · 16 g fiber"}, {"id": "m-p7-15", "plan": "p7", "cat": "Crockpot", "title": "Chicken and Brown Rice Stew", "html": "<div class=\"macro\">Per portion: 722 calories · 68 g protein · 69 g carbs · 21 g fat · 13 g fiber<\/div>\n<p><b>Nutrient highlights:<\/b> folate (beans, peas, spinach), selenium and zinc (chicken thighs)<\/p>\n<ul><li>3 lb boneless skinless chicken thighs, whole<\/li><li>1 1/4 cups uncooked brown rice<\/li><li>1 lb baby carrots<\/li><li>1 can (15 oz) no-salt-added white beans, rinsed<\/li><li>2 cups frozen peas and 1 box or bag (10 oz) frozen chopped spinach<\/li><li>1 cup frozen diced onion, 2 cloves garlic<\/li><li>6 cups low-sodium chicken broth (replaces the soup mix and regular broth)<\/li><li>Thyme, rosemary, black pepper<\/li><\/ul>\n<p class=\"lead\"><b>Standard: crockpot on LOW (about 7 to 8 hours, overnight)<\/b><\/p>\n<ol class=\"steps\"><li>Put everything except the peas and spinach in the crockpot.<\/li><li>Cook on LOW overnight (7 to 8 hours) or HIGH 4 to 5 hours.<\/li><li>Shred the chicken in the pot, stir in the peas and spinach, and cook 15 minutes more. Divide into 5 containers.<\/li><\/ol>\n<p class=\"lead\"><b>Faster: crockpot, all on HIGH (about 4 to 5 hours)<\/b><\/p>\n<ol class=\"steps\"><li>Put everything except the peas and spinach in the crockpot.<\/li><li>Cook on HIGH 4 to 5 hours.<\/li><li>Shred the chicken, stir in the peas and spinach, and cook 15 minutes more.<\/li><\/ol>\n<p class=\"lead\"><b>Fastest: Instant Pot (about 50 minutes)<\/b><\/p>\n<ol class=\"steps\"><li>Add 4 cups of the broth (to stay under the fill line), the rice, carrots, beans, onion, garlic and herbs. Lay the thighs on top.<\/li><li>Pressure cook on HIGH 22 minutes, then let the pressure release naturally for 10 minutes.<\/li><li>Shred the chicken. Stir in the peas, spinach and the last 2 cups of broth on Sauté for 3 to 4 minutes.<\/li><\/ol>\n<p class=\"lead\"><b>Fast: stovetop soup pot (about 1 hour)<\/b><\/p>\n<ol class=\"steps\"><li>Bring the broth, carrots, beans, onion, garlic and herbs to a boil. Stir in the rice and add the thighs.<\/li><li>Cover and simmer on low 40 to 45 minutes, until the rice is tender and the chicken reaches 165°F.<\/li><li>Shred the chicken and stir in the peas and spinach for the last 5 minutes.<\/li><\/ol>", "gro": "p8-20", "groT": "chicken and brown rice stew", "src": "p7-21", "macro": "Per portion: 722 calories · 68 g protein · 69 g carbs · 21 g fat · 13 g fiber"}, {"id": "m-p9-1", "plan": "p9", "cat": "Fish", "title": "No-Cook Salmon and Black Bean Burrito", "html": "<div class=\"macro\">698 calories · 68 g protein · 74 g carbs · 16 g fat · 21 g fiber · about 0.9 g EPA and DHA<\/div>\n<p><b>Nutrient highlights:<\/b> omega-3 EPA and DHA (salmon), folate (beans, spinach, avocado), vitamin C (red pepper), selenium (salmon, whole wheat)<\/p>\n<ul><li>1 large whole wheat tortilla<\/li><li>3 pouches (2.6 oz) pink salmon in water<\/li><li>1/2 cup no-salt-added black beans, rinsed<\/li><li>1 cup baby spinach and 1/2 cup sliced red bell pepper<\/li><li>1/4 cup salsa<\/li><li>1/4 cup chipotle-lime crema<\/li><li>1/4 avocado, sliced<\/li><\/ul>\n<ol class=\"steps\"><li>Flake the salmon and toss it with the beans, salsa and a squeeze of lime.<\/li><li>Layer spinach, salmon mix, pepper and avocado on the tortilla. Top with crema and roll.<\/li><\/ol>\n<h3 id=\"rl-1\">Sauce<\/h3>\n<ul><li><b>Chipotle-lime crema:<\/b> Nonfat plain Greek yogurt, lime juice, chipotle powder, pinch of cumin<\/li><\/ul>\n<h3 id=\"rl-2\">How to Roll It<\/h3>\n<ol class=\"steps\"><li>Warm the tortilla for 10 to 15 seconds in the microwave or a dry skillet so it does not crack.<\/li><li>Lay the greens down first. They keep the tortilla from getting soggy.<\/li><li>Pile the filling in a line across the lower third, leaving 2 inches at each side.<\/li><li>Fold the sides in, fold the bottom edge over the filling, and roll tightly.<\/li><li>Wrap it in foil for the road. Keep no-cook burritos cold and eat them within 1 day.<\/li><\/ol>", "gro": "p10-3", "groT": "nocook salmon and black bean burrito", "src": "p9-6", "macro": "698 calories · 68 g protein · 74 g carbs · 16 g fat · 21 g fiber · about 0.9 g EPA and DHA"}, {"id": "m-p9-2", "plan": "p9", "cat": "Fish", "title": "Cooked Baja Salmon Burrito with Mango Slaw", "html": "<div class=\"macro\">708 calories · 67 g protein · 68 g carbs · 18 g fat · 16 g fiber · about 2 g EPA and DHA<\/div>\n<p><b>Nutrient highlights:<\/b> the most omega-3s of any burrito; vitamin C (mango, slaw); selenium (salmon); folate (beans)<\/p>\n<ul><li>1 large whole wheat tortilla<\/li><li>8 to 9 oz raw skinless salmon fillet (wild coho or sockeye is leanest), about 7 oz cooked<\/li><li>Salt-free chili-lime or Cajun seasoning<\/li><li>1/2 cup no-salt-added black beans, rinsed<\/li><li>1/2 cup coleslaw mix and 1/4 cup diced mango (fresh or thawed frozen)<\/li><li>1/4 cup lime crema<\/li><li>1/8 avocado<\/li><\/ul>\n<ol class=\"steps\"><li>Season the salmon. Cook it in a nonstick skillet with cooking spray over medium-high heat, 3 to 4 minutes per side, until it flakes. Flake with a fork.<\/li><li>Toss the slaw and mango with a squeeze of lime.<\/li><li>Fill the tortilla with beans, salmon, slaw and avocado. Top with crema and roll.<\/li><\/ol>\n<h3 id=\"rl-1\">Sauce<\/h3>\n<ul><li><b>Lime crema:<\/b> Nonfat plain Greek yogurt, lime juice and zest, pinch of chili powder<\/li><\/ul>\n<h3 id=\"rl-2\">How to Roll It<\/h3>\n<ol class=\"steps\"><li>Warm the tortilla for 10 to 15 seconds in the microwave or a dry skillet so it does not crack.<\/li><li>Lay the greens down first. They keep the tortilla from getting soggy.<\/li><li>Pile the filling in a line across the lower third, leaving 2 inches at each side.<\/li><li>Fold the sides in, fold the bottom edge over the filling, and roll tightly.<\/li><li>Wrap it in foil for the road. Keep no-cook burritos cold and eat them within 1 day.<\/li><\/ol>", "gro": "p10-4", "groT": "cooked baja salmon burrito with mango slaw", "src": "p9-7", "macro": "708 calories · 67 g protein · 68 g carbs · 18 g fat · 16 g fiber · about 2 g EPA and DHA"}, {"id": "m-p9-3", "plan": "p9", "cat": "Chicken", "title": "No-Cook Southwest Chicken Burrito", "html": "<div class=\"macro\">736 calories · 72 g protein · 68 g carbs · 18 g fat · 15 g fiber<\/div>\n<p><b>Nutrient highlights:<\/b> folate (pinto beans, spinach, avocado), vitamin C (red pepper), selenium (chicken)<\/p>\n<ul><li>1 large whole wheat tortilla<\/li><li>4 pouches (2.6 oz) white chicken, 25% less sodium<\/li><li>1/3 cup no-salt-added pinto beans, rinsed<\/li><li>1 cup baby spinach and 1/2 cup sliced red bell pepper<\/li><li>1/4 cup salsa<\/li><li>1/4 cup chipotle-lime crema<\/li><li>1/8 avocado<\/li><\/ul>\n<ol class=\"steps\"><li>Toss the chicken with the beans, half the salsa and a pinch of cumin.<\/li><li>Layer spinach, chicken mix, pepper and avocado on the tortilla. Top with crema and the rest of the salsa, then roll.<\/li><\/ol>\n<h3 id=\"rl-1\">Sauce<\/h3>\n<ul><li><b>Chipotle-lime crema:<\/b> Nonfat plain Greek yogurt, lime juice, chipotle powder, pinch of cumin<\/li><\/ul>\n<h3 id=\"rl-2\">How to Roll It<\/h3>\n<ol class=\"steps\"><li>Warm the tortilla for 10 to 15 seconds in the microwave or a dry skillet so it does not crack.<\/li><li>Lay the greens down first. They keep the tortilla from getting soggy.<\/li><li>Pile the filling in a line across the lower third, leaving 2 inches at each side.<\/li><li>Fold the sides in, fold the bottom edge over the filling, and roll tightly.<\/li><li>Wrap it in foil for the road. Keep no-cook burritos cold and eat them within 1 day.<\/li><\/ol>", "gro": "p10-6", "groT": "nocook southwest chicken burrito", "src": "p9-9", "macro": "736 calories · 72 g protein · 68 g carbs · 18 g fat · 15 g fiber"}, {"id": "m-p9-4", "plan": "p9", "cat": "Chicken", "title": "Cooked Chicken Thigh Fajita Burrito", "html": "<div class=\"macro\">759 calories · 70 g protein · 73 g carbs · 20 g fat · 16 g fiber<\/div>\n<p><b>Nutrient highlights:<\/b> zinc and selenium (chicken thighs), vitamin C (peppers), folate (pinto beans)<\/p>\n<ul><li>1 large whole wheat tortilla<\/li><li>8 oz raw boneless skinless chicken thighs, left whole (about 6 oz cooked)<\/li><li>Salt-free fajita or taco seasoning<\/li><li>1/2 cup no-salt-added pinto beans, rinsed<\/li><li>1/2 cup sliced bell pepper and 1/4 cup sliced onion<\/li><li>1/4 cup salsa<\/li><li>1/2 cup taco crema<\/li><\/ul>\n<ol class=\"steps\"><li>Season the thighs and cook them whole in a nonstick skillet with cooking spray over medium heat, 5 to 6 minutes per side, until they reach 165°F. Rest 2 minutes, then slice.<\/li><li>Cook the pepper and onion in the same pan for 3 to 4 minutes.<\/li><li>Fill the tortilla with beans, chicken, peppers and onions, salsa and crema, then roll.<\/li><\/ol>\n<p><b>Lighter option:<\/b> Use 5 oz cooked thighs to bring it to about 710 calories.<\/p>\n<h3 id=\"rl-1\">Sauce<\/h3>\n<ul><li><b>Taco crema:<\/b> Nonfat plain Greek yogurt, salt-free taco seasoning, lime juice<\/li><\/ul>\n<h3 id=\"rl-2\">How to Roll It<\/h3>\n<ol class=\"steps\"><li>Warm the tortilla for 10 to 15 seconds in the microwave or a dry skillet so it does not crack.<\/li><li>Lay the greens down first. They keep the tortilla from getting soggy.<\/li><li>Pile the filling in a line across the lower third, leaving 2 inches at each side.<\/li><li>Fold the sides in, fold the bottom edge over the filling, and roll tightly.<\/li><li>Wrap it in foil for the road. Keep no-cook burritos cold and eat them within 1 day.<\/li><\/ol>", "gro": "p10-7", "groT": "cooked chicken thigh fajita burrito", "src": "p9-10", "macro": "759 calories · 70 g protein · 73 g carbs · 20 g fat · 16 g fiber"}, {"id": "m-p9-5", "plan": "p9", "cat": "Beef", "title": "No-Cook Shredded Beef and Black Bean Burrito", "html": "<div class=\"macro\">713 calories · 70 g protein · 65 g carbs · 19 g fat · 16 g fiber<\/div>\n<p><b>Nutrient highlights:<\/b> zinc (beef, the best source here), selenium (beef, whole wheat), folate (beans, spinach)<\/p>\n<ul><li>1 large whole wheat tortilla<\/li><li>5 1/2 oz shredded beef from your crockpot pot roast (bottom round), cold or warmed<\/li><li>1/2 cup no-salt-added black beans, rinsed<\/li><li>1 cup baby spinach<\/li><li>1/4 cup salsa<\/li><li>1/4 cup taco crema<\/li><li>1/8 avocado<\/li><\/ul>\n<ol class=\"steps\"><li>Toss the beef and beans with the salsa.<\/li><li>Layer spinach, beef mix and avocado on the tortilla. Top with crema and roll.<\/li><\/ol>\n<p><b>Tip:<\/b> Set aside one pot roast portion after a cook day for 2 of these burritos (save the potatoes for another meal).<\/p>\n<h3 id=\"rl-1\">Sauce<\/h3>\n<ul><li><b>Taco crema:<\/b> Nonfat plain Greek yogurt, salt-free taco seasoning, lime juice<\/li><\/ul>\n<h3 id=\"rl-2\">How to Roll It<\/h3>\n<ol class=\"steps\"><li>Warm the tortilla for 10 to 15 seconds in the microwave or a dry skillet so it does not crack.<\/li><li>Lay the greens down first. They keep the tortilla from getting soggy.<\/li><li>Pile the filling in a line across the lower third, leaving 2 inches at each side.<\/li><li>Fold the sides in, fold the bottom edge over the filling, and roll tightly.<\/li><li>Wrap it in foil for the road. Keep no-cook burritos cold and eat them within 1 day.<\/li><\/ol>", "gro": "p10-9", "groT": "nocook shredded beef and black bean burrito", "src": "p9-12", "macro": "713 calories · 70 g protein · 65 g carbs · 19 g fat · 16 g fiber"}, {"id": "m-p9-6", "plan": "p9", "cat": "Beef", "title": "Cooked Tex-Mex Ground Beef Burrito", "html": "<div class=\"macro\">723 calories · 70 g protein · 69 g carbs · 17 g fat · 16 g fiber<\/div>\n<p><b>Nutrient highlights:<\/b> zinc (beef), selenium (beef), vitamin C (peppers), folate (beans), lycopene (salsa)<\/p>\n<ul><li>1 large whole wheat tortilla<\/li><li>8 oz raw 95% lean ground beef<\/li><li>1 tsp chili powder, 1/2 tsp cumin, 1/2 tsp garlic powder<\/li><li>1/2 cup no-salt-added black beans, rinsed<\/li><li>1/4 cup diced onion and 1/2 cup diced red bell pepper<\/li><li>1/4 cup salsa<\/li><li>1/4 cup chipotle-lime crema<\/li><\/ul>\n<ol class=\"steps\"><li>Brown the beef with the onion and pepper over medium-high heat for 6 to 8 minutes, breaking it up.<\/li><li>Stir in the spices, beans and salsa and heat 2 minutes.<\/li><li>Fill the tortilla, top with crema and roll.<\/li><\/ol>\n<p><b>Batch it:<\/b> Cook 2 lb of beef with 4 times the vegetables and spices, and portion into 4 containers.<\/p>\n<h3 id=\"rl-1\">Sauce<\/h3>\n<ul><li><b>Chipotle-lime crema:<\/b> Nonfat plain Greek yogurt, lime juice, chipotle powder, pinch of cumin<\/li><\/ul>\n<h3 id=\"rl-2\">How to Roll It<\/h3>\n<ol class=\"steps\"><li>Warm the tortilla for 10 to 15 seconds in the microwave or a dry skillet so it does not crack.<\/li><li>Lay the greens down first. They keep the tortilla from getting soggy.<\/li><li>Pile the filling in a line across the lower third, leaving 2 inches at each side.<\/li><li>Fold the sides in, fold the bottom edge over the filling, and roll tightly.<\/li><li>Wrap it in foil for the road. Keep no-cook burritos cold and eat them within 1 day.<\/li><\/ol>", "gro": "p10-10", "groT": "cooked texmex ground beef burrito", "src": "p9-13", "macro": "723 calories · 70 g protein · 69 g carbs · 17 g fat · 16 g fiber"}, {"id": "m-p9-7", "plan": "p9", "cat": "Lamb", "title": "No-Cook Greek Lamb and Chickpea Burrito", "html": "<div class=\"macro\">735 calories · 71 g protein · 66 g carbs · 20 g fat · 13 g fiber<\/div>\n<p><b>Nutrient highlights:<\/b> zinc (lamb), lycopene (cherry tomatoes), folate (chickpeas, spinach)<\/p>\n<ul><li>1 large whole wheat tortilla<\/li><li>5 1/2 oz shredded lamb from your crockpot Moroccan lamb (meat only), cold or warmed<\/li><li>1/2 cup no-salt-added chickpeas, rinsed<\/li><li>1 cup baby spinach<\/li><li>1/4 cup diced cucumber and 1/2 cup halved cherry tomatoes<\/li><li>1/2 cup tzatziki<\/li><li>Dried oregano and a squeeze of lemon<\/li><\/ul>\n<ol class=\"steps\"><li>Toss the lamb with the chickpeas, oregano and lemon.<\/li><li>Layer spinach, lamb mix, cucumber and tomatoes on the tortilla. Top with tzatziki and roll.<\/li><\/ol>\n<h3 id=\"rl-1\">Sauce<\/h3>\n<ul><li><b>Tzatziki:<\/b> Nonfat plain Greek yogurt, lemon juice, garlic, dried dill, a little grated cucumber<\/li><\/ul>\n<h3 id=\"rl-2\">How to Roll It<\/h3>\n<ol class=\"steps\"><li>Warm the tortilla for 10 to 15 seconds in the microwave or a dry skillet so it does not crack.<\/li><li>Lay the greens down first. They keep the tortilla from getting soggy.<\/li><li>Pile the filling in a line across the lower third, leaving 2 inches at each side.<\/li><li>Fold the sides in, fold the bottom edge over the filling, and roll tightly.<\/li><li>Wrap it in foil for the road. Keep no-cook burritos cold and eat them within 1 day.<\/li><\/ol>", "gro": "p10-12", "groT": "nocook greek lamb and chickpea burrito", "src": "p9-15", "macro": "735 calories · 71 g protein · 66 g carbs · 20 g fat · 13 g fiber"}, {"id": "m-p9-8", "plan": "p9", "cat": "Lamb", "title": "Cooked Seared Lamb Gyro Burrito", "html": "<div class=\"macro\">747 calories · 71 g protein · 69 g carbs · 20 g fat · 13 g fiber<\/div>\n<p><b>Nutrient highlights:<\/b> zinc (lamb), lycopene (tomatoes), folate (chickpeas, spinach)<\/p>\n<ul><li>1 large whole wheat tortilla<\/li><li>7 to 8 oz raw boneless leg of lamb steak, trimmed (about 5 1/2 oz cooked)<\/li><li>Garlic, oregano, cumin and black pepper<\/li><li>1/2 cup no-salt-added chickpeas, rinsed<\/li><li>1 cup baby spinach, 1/4 cup diced cucumber, 1/2 cup cherry tomatoes, 1/4 cup sliced red onion<\/li><li>1/2 cup tzatziki<\/li><\/ul>\n<ol class=\"steps\"><li>Season the lamb and sear it whole in a hot nonstick skillet with cooking spray, 3 to 4 minutes per side for medium. Rest 5 minutes, then slice thin.<\/li><li>Warm the chickpeas in the same pan for 1 minute.<\/li><li>Fill the tortilla with spinach, lamb, chickpeas and vegetables. Top with tzatziki and roll.<\/li><\/ol>\n<p><b>Swap:<\/b> Lean beef sirloin steak works the same way.<\/p>\n<h3 id=\"rl-1\">Sauce<\/h3>\n<ul><li><b>Tzatziki:<\/b> Nonfat plain Greek yogurt, lemon juice, garlic, dried dill, a little grated cucumber<\/li><\/ul>\n<h3 id=\"rl-2\">How to Roll It<\/h3>\n<ol class=\"steps\"><li>Warm the tortilla for 10 to 15 seconds in the microwave or a dry skillet so it does not crack.<\/li><li>Lay the greens down first. They keep the tortilla from getting soggy.<\/li><li>Pile the filling in a line across the lower third, leaving 2 inches at each side.<\/li><li>Fold the sides in, fold the bottom edge over the filling, and roll tightly.<\/li><li>Wrap it in foil for the road. Keep no-cook burritos cold and eat them within 1 day.<\/li><\/ol>", "gro": "p10-13", "groT": "cooked seared lamb gyro burrito", "src": "p9-16", "macro": "747 calories · 71 g protein · 69 g carbs · 20 g fat · 13 g fiber"}, {"id": "m-p11-1", "plan": "p11", "cat": "Salmon", "title": "Lemon-Dill Salmon with Barley and White Beans", "html": "<div class=\"macro\">Per bowl: 684 calories · 72 g protein · 68 g carbs · 16 g fat · 15 g fiber · LOW 5 to 6 hr or HIGH 3 hr<\/div>\n<p><b>Nutrient highlights:<\/b> omega-3 EPA and DHA and selenium (salmon), folate (white beans, spinach), lycopene (tomatoes), very high fiber (barley)<\/p>\n<p><b>Fish:<\/b> 2 lb skinless salmon fillets, fresh from the counter or frozen<\/p>\n<ul><li>1 cup pearled barley<\/li><li>2 cans (15 oz) no-salt-added cannellini beans, drained and rinsed (use about 2 cups)<\/li><li>1 can (14.5 oz) no-salt-added diced tomatoes<\/li><li>1 onion, diced, and 3 cloves garlic (or 1 tsp garlic powder)<\/li><li>3 cups low-sodium chicken or vegetable broth<\/li><li>1 tbsp olive oil, 1 tsp dried dill, zest and juice of 1 lemon, black pepper<\/li><li>1 bag (7 oz) baby spinach, or 2 cups frozen spinach<\/li><li>1 cup nonfat plain Greek yogurt mixed with 1 tsp dill and a squeeze of lemon (sauce)<\/li><\/ul>\n<p class=\"lead\"><b>Standard: crockpot on LOW (about 5 1/2 to 7 hours)<\/b><\/p>\n<ol class=\"steps\"><li>Add the barley, beans, tomatoes, onion, garlic, broth, oil, dill, lemon zest and pepper. Stir.<\/li><li>Cook on LOW 5 to 6 hours or HIGH 3 hours, until the barley is tender.<\/li><li>Switch to HIGH. Stir in the spinach. Lay the salmon on top and sprinkle with dill and pepper. Cover and cook until it flakes (see the timing table).<\/li><li>Squeeze the lemon over it, break the salmon into chunks and portion into 4 bowls. Top each with 1/4 cup dill yogurt sauce.<\/li><\/ol>\n<p class=\"lead\"><b>Faster: crockpot, all on HIGH (about 3 1/2 to 4 hours)<\/b><\/p>\n<ol class=\"steps\"><li>Load the base the same way as the standard steps.<\/li><li>Cook on HIGH 3 hours, until the barley is tender.<\/li><li>Stir in the spinach, add the salmon and cook on HIGH until it flakes (see the timing table). Finish with lemon and the dill sauce.<\/li><\/ol>\n<p class=\"lead\"><b>Fastest: Instant Pot (about 1 hour)<\/b><\/p>\n<ol class=\"steps\"><li>Add the barley, beans, tomatoes, onion, garlic, broth, oil, dill, lemon zest and pepper. Stir.<\/li><li>Pressure cook on HIGH 25 minutes, then let the pressure release naturally for 10 minutes.<\/li><li>Stir in the spinach. Switch to Sauté on Low. Lay the salmon on top, cover with the lid set to Venting, and cook 8 to 12 minutes for fresh or thawed, or 15 to 20 minutes for frozen, until it flakes at 145°F.<\/li><\/ol>\n<p class=\"lead\"><b>Fast: stovetop Dutch oven (about 1 hour)<\/b><\/p>\n<ol class=\"steps\"><li>Bring the barley, beans, tomatoes, onion, garlic, broth, oil and seasonings to a boil. Cover and simmer on low 40 to 45 minutes, until the barley is tender.<\/li><li>Stir in the spinach. Lay the salmon on top, cover and simmer 8 to 12 minutes for fresh or thawed, or 15 to 20 minutes for frozen, until it flakes at 145°F.<\/li><li>Finish with lemon and the dill sauce.<\/li><\/ol>\n<h3 id=\"ft-1\">Fish Timing<\/h3>\n<p>Add fish only after the base is hot and the crockpot is on HIGH. Fish is done at 145°F, when it turns opaque and flakes easily with a fork. Shrimp is done when it is pink and curled.<\/p>\n<table class=\"stack\"><thead><tr><th>Fish<\/th><th>Fresh or thawed<\/th><th>Frozen<\/th><\/tr><\/thead><tbody><tr><td>Salmon fillets (1 inch thick)<\/td><td>20 to 30 min<\/td><td>45 to 60 min<\/td><\/tr><tr><td>Cod, tilapia or pollock fillets<\/td><td>15 to 25 min<\/td><td>40 to 50 min<\/td><\/tr><tr><td>Raw shrimp, peeled<\/td><td>15 to 20 min<\/td><td>30 to 40 min<\/td><\/tr><tr><td>Canned or pouch tuna or salmon<\/td><td>Stir in for the last 10 to 15 min to heat through<\/td><td>Not needed<\/td><\/tr><\/tbody><\/table>\n<p><b>Quick thaw:<\/b> to cut the time, put frozen fillets or shrimp in a sealed bag in cold water for 15 to 30 minutes while the base finishes.<\/p>", "gro": "p12-3", "groT": "lemondill salmon with barley and white beans", "src": "p11-7", "macro": "Per bowl: 684 calories · 72 g protein · 68 g carbs · 16 g fat · 15 g fiber · LOW 5 to 6 hr or HIGH 3 hr"}, {"id": "m-p11-2", "plan": "p11", "cat": "Salmon", "title": "Moroccan Salmon with Sweet Potatoes and Chickpeas", "html": "<div class=\"macro\">Per bowl: 708 calories · 70 g protein · 72 g carbs · 17 g fat · 14 g fiber · LOW 6 hr or HIGH 3 to 4 hr<\/div>\n<p><b>Nutrient highlights:<\/b> omega-3s (salmon), vitamin E (almonds), vitamin C (sweet potatoes, tomatoes), lycopene (tomato paste), folate (chickpeas)<\/p>\n<p><b>Fish:<\/b> 2 lb skinless salmon fillets, fresh or frozen<\/p>\n<ul><li>2 medium sweet potatoes (about 1 1/4 lb), cut into 1-inch cubes<\/li><li>1 can (15 oz) no-salt-added chickpeas, drained and rinsed<\/li><li>1 can (14.5 oz) no-salt-added diced tomatoes and 2 tbsp tomato paste<\/li><li>1 onion, diced<\/li><li>3 tbsp raisins<\/li><li>1 cup low-sodium broth<\/li><li>2 tsp cumin, 1 tsp paprika, 1 tsp ground ginger, 1/2 tsp cinnamon, 1 tsp garlic powder<\/li><li>1 cup nonfat plain Greek yogurt with lemon juice (sauce)<\/li><li>1/3 cup sliced almonds<\/li><\/ul>\n<p class=\"lead\"><b>Standard: crockpot on LOW (about 6 1/2 to 7 hours)<\/b><\/p>\n<ol class=\"steps\"><li>Add the sweet potatoes, chickpeas, tomatoes, tomato paste, onion, raisins, broth and spices. Stir.<\/li><li>Cook on LOW 6 hours or HIGH 3 to 4 hours, until the sweet potatoes are tender.<\/li><li>Switch to HIGH. Season the salmon with a pinch of cumin and paprika and lay it on top. Cook until it flakes.<\/li><li>Portion into 4 bowls. Top each with 1/4 cup lemon yogurt and a sprinkle of almonds.<\/li><\/ol>\n<p class=\"lead\"><b>Faster: crockpot, all on HIGH (about 3 1/2 to 4 1/2 hours)<\/b><\/p>\n<ol class=\"steps\"><li>Load the base the same way as the standard steps.<\/li><li>Cook on HIGH 3 to 4 hours, until the sweet potatoes are tender.<\/li><li>Add the salmon and cook on HIGH until it flakes (see the timing table). Top with yogurt and almonds.<\/li><\/ol>\n<p class=\"lead\"><b>Fastest: Instant Pot (about 30 minutes)<\/b><\/p>\n<ol class=\"steps\"><li>Add the broth, sweet potatoes, chickpeas, onion, raisins and spices. Spoon the tomatoes and tomato paste on top and do not stir.<\/li><li>Pressure cook on HIGH 4 minutes and quick release.<\/li><li>Switch to Sauté on Low. Lay the salmon on top, cover with the lid set to Venting, and cook 8 to 12 minutes for fresh or thawed, or 15 to 20 minutes for frozen, until it flakes at 145°F.<\/li><\/ol>\n<p class=\"lead\"><b>Fast: stovetop Dutch oven (about 35 minutes)<\/b><\/p>\n<ol class=\"steps\"><li>Bring everything except the salmon, yogurt and almonds to a boil. Cover and simmer 15 to 20 minutes, until the sweet potatoes are tender.<\/li><li>Lay the salmon on top, cover and simmer 8 to 12 minutes for fresh or thawed, or 15 to 20 minutes for frozen, until it flakes at 145°F.<\/li><li>Top with lemon yogurt and almonds.<\/li><\/ol>\n<h3 id=\"ft-1\">Fish Timing<\/h3>\n<p>Add fish only after the base is hot and the crockpot is on HIGH. Fish is done at 145°F, when it turns opaque and flakes easily with a fork. Shrimp is done when it is pink and curled.<\/p>\n<table class=\"stack\"><thead><tr><th>Fish<\/th><th>Fresh or thawed<\/th><th>Frozen<\/th><\/tr><\/thead><tbody><tr><td>Salmon fillets (1 inch thick)<\/td><td>20 to 30 min<\/td><td>45 to 60 min<\/td><\/tr><tr><td>Cod, tilapia or pollock fillets<\/td><td>15 to 25 min<\/td><td>40 to 50 min<\/td><\/tr><tr><td>Raw shrimp, peeled<\/td><td>15 to 20 min<\/td><td>30 to 40 min<\/td><\/tr><tr><td>Canned or pouch tuna or salmon<\/td><td>Stir in for the last 10 to 15 min to heat through<\/td><td>Not needed<\/td><\/tr><\/tbody><\/table>\n<p><b>Quick thaw:<\/b> to cut the time, put frozen fillets or shrimp in a sealed bag in cold water for 15 to 30 minutes while the base finishes.<\/p>", "gro": "p12-4", "groT": "moroccan salmon with sweet potatoes and chickpeas", "src": "p11-8", "macro": "Per bowl: 708 calories · 70 g protein · 72 g carbs · 17 g fat · 14 g fiber · LOW 6 hr or HIGH 3 to 4 hr"}, {"id": "m-p11-3", "plan": "p11", "cat": "Shrimp", "title": "Cajun Shrimp and Brown Rice with Red Beans", "html": "<div class=\"macro\">Per bowl: 693 calories · 71 g protein · 69 g carbs · 16 g fat · 14 g fiber · HIGH 2 1/2 to 3 hr<\/div>\n<p><b>Nutrient highlights:<\/b> selenium and zinc (shrimp), vitamin C (bell peppers), vitamin E (avocado), folate (kidney beans), lycopene (tomatoes)<\/p>\n<p><b>Fish:<\/b> 2 1/2 lb raw peeled and deveined shrimp, fresh or frozen<\/p>\n<ul><li>1 cup uncooked brown rice<\/li><li>1 can (15 oz) no-salt-added red kidney beans, drained and rinsed<\/li><li>1 can (14.5 oz) no-salt-added diced tomatoes<\/li><li>2 bell peppers, 1 onion and 2 celery stalks, diced (or 3 cups frozen pepper and onion strips)<\/li><li>2 1/2 cups low-sodium chicken broth<\/li><li>2 tbsp olive oil (1 tbsp to grease the crock, 1 tbsp in the pot)<\/li><li>1 tbsp salt-free Cajun or Creole seasoning, 1 tsp garlic powder, 1 bay leaf<\/li><li>1 1/2 avocados, diced, and hot sauce to serve<\/li><\/ul>\n<p class=\"lead\"><b>Standard: crockpot on HIGH (about 3 to 3 1/2 hours; this recipe already uses HIGH)<\/b><\/p>\n<ol class=\"steps\"><li>Rub the crock with 1 tbsp oil. Add the rice, beans, tomatoes, vegetables, broth, the rest of the oil and the seasoning. Stir.<\/li><li>Cook on HIGH 2 1/2 to 3 hours, until the rice is tender and most of the liquid is absorbed. Crockpots vary, so check at 2 hours.<\/li><li>Stir the shrimp into the top of the rice. Cover and cook until pink (see the timing table).<\/li><li>Remove the bay leaf. Portion into 4 bowls and top with avocado and hot sauce.<\/li><\/ol>\n<
