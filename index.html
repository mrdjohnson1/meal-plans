Zinc<\/td><td>Beef (McDonald's hamburgers, Wendy's chili), chicken, oatmeal, sunflower seeds, almonds<\/td><\/tr><tr><td>Selenium<\/td><td>Chicken, beef, eggs, salmon, oatmeal, whole grain bread; already high, so skip Brazil nuts<\/td><\/tr><tr><td>Folate<\/td><td>Chipotle black beans, Wendy's chili beans, spinach, edamame, avocado, oranges, bananas<\/td><\/tr><tr><td>Vitamin C<\/td><td>Chick-fil-A fruit cup, Chipotle fajita veggies and salsa, Subway peppers and tomatoes, oranges, blueberries<\/td><\/tr><tr><td>Vitamin E<\/td><td>Sunflower seeds, almonds, avocado, spinach<\/td><\/tr><tr><td>Lycopene<\/td><td>Chipotle fresh tomato salsa, Wendy's chili, Subway tomatoes, salsa in the rotisserie chicken bowl, tomato juice<\/td><\/tr><tr><td>Omega-3 EPA and DHA<\/td><td>Salmon pouches twice a week<\/td><\/tr><tr><td>Omega-3 ALA<\/td><td>Chia seeds from the Road Nutrient Kit<\/td><\/tr><tr><td>L-arginine and amino acids<\/td><td>Every meal has 60 g or more of protein from chicken, beef, salmon, eggs, dairy, plus nuts and seeds<\/td><\/tr><\/tbody><\/table>\n<p>For daily targets and supplement notes, see the Key Nutrients and Supplement Notes sections of the home meal plan. The same cautions apply on the road: talk with your doctor before adding supplements, and do not stack zinc or selenium supplements on top of this plan without checking the upper limits.<\/p>\n<h2 id=\"p3-9\">Pre-Workout Snack on the Road<\/h2>\n<p>Same rule as at home: about 30 g carbs, 30 to 60 minutes before training. Gas station options:<\/p>\n<ul><li>1 banana (about 27 g carbs)<\/li><li>Pretzels: about 1.25 oz; pick the lowest-sodium bag<\/li><li>Fruit snacks or gummies: enough for about 30 g carbs per the label<\/li><li>1 packet Quaker Original instant oatmeal with a banana (about 46 g carbs) for longer sessions<\/li><\/ul>\n<h2 id=\"p3-10\">Cooler and Food Safety<\/h2>\n<ul><li><b>Keep cold items at 40°F or below<\/b> with ice packs or a bag of ice. Hard-boiled eggs, yogurt and opened shakes need the cooler.<\/li><li><b>Toss perishables left out more than 2 hours<\/b> (1 hour in a car or outdoors above 90°F).<\/li><li><b>Premier Protein shakes keep without refrigeration until opened<\/b>, which makes them the best backup when there is no cooler.<\/li><\/ul>\n<h2 id=\"p3-11\">Nutrition Sources<\/h2>\n<ul><li>Chick-fil-A 12 ct Grilled Nuggets: <a href=\"https://www.chick-fil-a.com/menu/12-ct-grilled-nuggets\" target=\"_blank\" rel=\"noopener\">chick-fil-a.com<\/a><\/li><li>Chick-fil-A Grilled Chicken Sandwich: <a href=\"https://chick-fil-a.com/menu/grilled-chicken-sandwich\" target=\"_blank\" rel=\"noopener\">chick-fil-a.com<\/a><\/li><li>Chick-fil-A Egg White Grill: <a href=\"https://www.chick-fil-a.com/menu-items/egg-white-grill\" target=\"_blank\" rel=\"noopener\">chick-fil-a.com<\/a><\/li><li>Chick-fil-A Medium Fruit Cup: <a href=\"https://www.chick-fil-a.com/menu/breakfast/medium-fruit-cup\" target=\"_blank\" rel=\"noopener\">chick-fil-a.com<\/a><\/li><li>Chipotle ingredients (chicken, brown rice, black beans, salsa): <a href=\"https://www.caloriedetails.com/restaurant/chipotle/high-fiber-bowl\" target=\"_blank\" rel=\"noopener\">caloriedetails.com<\/a> and <a href=\"https://www.cleaneatzkitchen.com/blogs/healthy-eating-blog/is-chipotle-healthy-how-to-order-for-your-goals\" target=\"_blank\" rel=\"noopener\">cleaneatzkitchen.com<\/a>, drawn from Chipotle's nutrition chart<\/li><li>Subway Fresh Fit Grilled Chicken 6-inch: <a href=\"https://nutriscan.app/calculators/subway-nutrition-calculator\" target=\"_blank\" rel=\"noopener\">nutriscan.app<\/a>, drawn from Subway's U.S. nutrition information<\/li><li>Subway Grilled Chicken Protein Bowl: <a href=\"https://www.eatthis.com/high-protein-subway-orders/\" target=\"_blank\" rel=\"noopener\">eatthis.com<\/a><\/li><li>McDonald's Fruit and Maple Oatmeal: <a href=\"https://www.mcdonalds.com/us/en-us/product/fruit-maple-oatmeal.html\" target=\"_blank\" rel=\"noopener\">mcdonalds.com<\/a> and <a href=\"https://android.fatsecret.com/calories-nutrition/mcdonalds/fruit-and-maple-oatmeal\" target=\"_blank\" rel=\"noopener\">fatsecret.com<\/a><\/li><li>McDonald's Hamburger: <a href=\"https://thetakeout.com/1828166/how-much-protein-in-mcdonalds-cheeseburger\" target=\"_blank\" rel=\"noopener\">thetakeout.com<\/a><\/li><li>Wendy's Large Chili: <a href=\"https://www.calorieking.com/us/en/foods/f/calories-in-sides-rich-meaty-chili-without-toppings-large/Q0iXUK0RRgeyTMvgLXs61Q\" target=\"_blank\" rel=\"noopener\">calorieking.com<\/a> and <a href=\"https://www.wendys.com/blog/wendys-high-protein-offerings\" target=\"_blank\" rel=\"noopener\">wendys.com<\/a><\/li><li>Wendy's Plain Baked Potato: <a href=\"https://www.fatsecret.com/calories-nutrition/wendys/baked-potato\" target=\"_blank\" rel=\"noopener\">fatsecret.com<\/a><\/li><li>Core Power 42g: <a href=\"https://fairlife.com/?p=59781\" target=\"_blank\" rel=\"noopener\">fairlife.com<\/a><\/li><li>Premier Protein: <a href=\"https://carewell.com/product/premier-protein-high-protein-shake\" target=\"_blank\" rel=\"noopener\">carewell.com<\/a><\/li><li>Oikos Pro cup: <a href=\"https://giantfoodstores.com/groceries/dairy-eggs/yogurt/traditional-yogurt/more-traditional-yogurt-flavors/oikos-pro-20g-protein-banana-cultured-ultra-filtered-milk-yogurt-cup-53-oz-cup.html\" target=\"_blank\" rel=\"noopener\">giantfoodstores.com<\/a><\/li><li>Quaker Original Instant Oatmeal: <a href=\"https://myfooddiary.com/foods/1666994/quaker-original-instant-oatmeal\" target=\"_blank\" rel=\"noopener\">myfooddiary.com<\/a><\/li><li>Banana, almonds, hard-boiled eggs, rotisserie chicken breast, brown rice, black beans, light tuna, Greek yogurt, blueberries, apple, avocado, cherry tomatoes and edamame: standard USDA values<\/li><li>Pink salmon pouch nutrition and EPA and DHA: <a href=\"https://starkist.com/?p=9738\" target=\"_blank\" rel=\"noopener\">StarKist<\/a><\/li><li>Nutrient targets and food sources: NIH Office of Dietary Supplements fact sheets for <a href=\"https://ods.od.nih.gov/factsheets/Zinc-HealthProfessional/\" target=\"_blank\" rel=\"noopener\">zinc<\/a>, <a href=\"https://ods.od.nih.gov/factsheets/Selenium-HealthProfessional/\" target=\"_blank\" rel=\"noopener\">selenium<\/a>, <a href=\"https://ods.od.nih.gov/factsheets/Folate-HealthProfessional\" target=\"_blank\" rel=\"noopener\">folate<\/a>, <a href=\"https://ods.od.nih.gov/factsheets/VitaminC-HealthProfessional/\" target=\"_blank\" rel=\"noopener\">vitamin C<\/a>, <a href=\"https://ods.od.nih.gov/factsheets/VitaminE-Consumer/\" target=\"_blank\" rel=\"noopener\">vitamin E<\/a> and <a href=\"https://ods.od.nih.gov/factsheets/Omega3FattyAcids-Consumer/\" target=\"_blank\" rel=\"noopener\">omega-3s<\/a><\/li><\/ul>", "heads": [{"id": "p3-1", "t": "How to Use This Plan", "l": 2}, {"id": "p3-2", "t": "Breakfasts", "l": 2}, {"id": "p3-3", "t": "Lunches and Dinners", "l": 2}, {"id": "p3-4", "t": "Sample Road Days", "l": 2}, {"id": "p3-5", "t": "Gas Station Made-to-Order Counters", "l": 2}, {"id": "p3-6", "t": "Grocery Store Ready-to-Eat Meals", "l": 2}, {"id": "p3-7", "t": "Road Nutrient Kit", "l": 2}, {"id": "p3-8", "t": "How Road Meals Cover Key Nutrients", "l": 2}, {"id": "p3-9", "t": "Pre-Workout Snack on the Road", "l": 2}, {"id": "p3-10", "t": "Cooler and Food Safety", "l": 2}, {"id": "p3-11", "t": "Nutrition Sources", "l": 2}]}, {"id": "p4", "kicker": "Plan 2 · Grocery List", "title": "40-40-20 Road Grocery List", "sub": "One list per meal · what to pack, order or grab for each road meal · November 20, 2026", "kind": "grocery", "html": "<h2 id=\"p4-1\">How to Use This List<\/h2>\n<ul><li><b>Shop by meal.<\/b> Each meal has its own list: what to pack from home, what to buy at a gas station and what to order at the counter.<\/li><li><b>Pack shelf-stable items from home.<\/b> Shakes, oatmeal packets, almonds and salmon pouches cost far less at Walmart, Aldi, Kroger or Food Lion than at a gas station.<\/li><li><b>Buy cold items as you go.<\/b> Sheetz, Wawa, QuickTrip and RaceTrac generally carry the gas station items, but stock varies by store.<\/li><li><b>Car supplies and the Road Nutrient Kit<\/b> are at the end. Pack them once per trip.<\/li><\/ul>\n<h2 id=\"p4-2\">Breakfasts (1 meal each)<\/h2>\n<h3 id=\"p4-3\">Chick-fil-A Breakfast<\/h3>\n<ul class=\"check\"><li><label><input type=\"checkbox\" data-k=\"p4-3-egg-white-grill\"><span class=\"tx\"><span class=\"it\">Egg White Grill<\/span><span class=\"am\">Where: Chick-fil-A · Get: 1<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p4-3-medium-fruit-cups\"><span class=\"tx\"><span class=\"it\">Medium fruit cups<\/span><span class=\"am\">Where: Chick-fil-A · Get: 2<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p4-3-core-power-42g-protein-shake-fairlife-\"><span class=\"tx\"><span class=\"it\">Core Power 42g protein shake (Fairlife)<\/span><span class=\"am\">Where: Gas station · Get: 1<\/span><\/span><\/label><\/li><\/ul>\n<h3 id=\"p4-4\">McDonald's Oatmeal Breakfast<\/h3>\n<ul class=\"check\"><li><label><input type=\"checkbox\" data-k=\"p4-4-fruit-and-maple-oatmeal\"><span class=\"tx\"><span class=\"it\">Fruit and Maple Oatmeal<\/span><span class=\"am\">Where: McDonald's · Get: 1<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p4-4-core-power-42g-protein-shake\"><span class=\"tx\"><span class=\"it\">Core Power 42g protein shake<\/span><span class=\"am\">Where: Gas station · Get: 1<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p4-4-oikos-pro-20g-protein-yogurt-cup\"><span class=\"tx\"><span class=\"it\">Oikos Pro 20g protein yogurt cup<\/span><span class=\"am\">Where: Gas station (keep cold) · Get: 1<\/span><\/span><\/label><\/li><\/ul>\n<h3 id=\"p4-5\">Hotel or Gas Station Oatmeal<\/h3>\n<ul class=\"check\"><li><label><input type=\"checkbox\" data-k=\"p4-5-quaker-original-instant-oatmeal-packets\"><span class=\"tx\"><span class=\"it\">Quaker Original instant oatmeal packets<\/span><span class=\"am\">Where: Pack from home · Get: 2 packets<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p4-5-banana\"><span class=\"tx\"><span class=\"it\">Banana<\/span><span class=\"am\">Where: Pack from home or gas station · Get: 1<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p4-5-core-power-42g-protein-shake\"><span class=\"tx\"><span class=\"it\">Core Power 42g protein shake<\/span><span class=\"am\">Where: Gas station · Get: 1<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p4-5-hard-boiled-eggs\"><span class=\"tx\"><span class=\"it\">Hard-boiled eggs<\/span><span class=\"am\">Where: Gas station (keep cold) · Get: 1 two-pack<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p4-5-hot-water-cup\"><span class=\"tx\"><span class=\"it\">Hot water cup<\/span><span class=\"am\">Where: Gas station, if the hotel has no microwave · Get: 1<\/span><\/span><\/label><\/li><\/ul>\n<h3 id=\"p4-6\">Nothing-Needed Breakfast (no cooler, fridge or microwave)<\/h3>\n<ul class=\"check\"><li><label><input type=\"checkbox\" data-k=\"p4-6-premier-protein-shakes\"><span class=\"tx\"><span class=\"it\">Premier Protein shakes<\/span><span class=\"am\">Where: Pack from home · Get: 2<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p4-6-bananas\"><span class=\"tx\"><span class=\"it\">Bananas<\/span><span class=\"am\">Where: Pack from home · Get: 2<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p4-6-almonds-unsalted\"><span class=\"tx\"><span class=\"it\">Almonds, unsalted<\/span><span class=\"am\">Where: Pack from home · Get: 1 oz bag<\/span><\/span><\/label><\/li><\/ul>\n<h2 id=\"p4-7\">Fast Food Lunches and Dinners (1 meal each)<\/h2>\n<h3 id=\"p4-8\">Chipotle Bowl<\/h3>\n<ul class=\"check\"><li><label><input type=\"checkbox\" data-k=\"p4-8-bowl-double-chicken-brown-rice-black-bea\"><span class=\"tx\"><span class=\"it\">Bowl: double chicken, brown rice, black beans, fajita veggies, fresh tomato salsa, romaine. No cheese, sour cream, queso or guac.<\/span><span class=\"am\">Where: Chipotle · Get: 1<\/span><\/span><\/label><\/li><\/ul>\n<h3 id=\"p4-9\">Chick-fil-A Lunch<\/h3>\n<ul class=\"check\"><li><label><input type=\"checkbox\" data-k=\"p4-9-grilled-chicken-sandwich\"><span class=\"tx\"><span class=\"it\">Grilled Chicken Sandwich<\/span><span class=\"am\">Where: Chick-fil-A · Get: 1<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p4-9-12-ct-grilled-nuggets\"><span class=\"tx\"><span class=\"it\">12 ct Grilled Nuggets<\/span><span class=\"am\">Where: Chick-fil-A · Get: 1<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p4-9-medium-fruit-cup\"><span class=\"tx\"><span class=\"it\">Medium fruit cup<\/span><span class=\"am\">Where: Chick-fil-A · Get: 1<\/span><\/span><\/label><\/li><\/ul>\n<h3 id=\"p4-10\">Subway<\/h3>\n<ul class=\"check\"><li><label><input type=\"checkbox\" data-k=\"p4-10-6-inch-fresh-fit-grilled-chicken-on-mult\"><span class=\"tx\"><span class=\"it\">6-inch Fresh Fit Grilled Chicken on multigrain, all veggies, no cheese or mayo<\/span><span class=\"am\">Where: Subway · Get: 1<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p4-10-grilled-chicken-protein-bowl\"><span class=\"tx\"><span class=\"it\">Grilled Chicken Protein Bowl<\/span><span class=\"am\">Where: Subway · Get: 1<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p4-10-banana\"><span class=\"tx\"><span class=\"it\">Banana<\/span><span class=\"am\">Where: Gas station or packed · Get: 1<\/span><\/span><\/label><\/li><\/ul>\n<h3 id=\"p4-11\">McDonald's Lunch<\/h3>\n<ul class=\"check\"><li><label><input type=\"checkbox\" data-k=\"p4-11-plain-hamburgers\"><span class=\"tx\"><span class=\"it\">Plain Hamburgers<\/span><span class=\"am\">Where: McDonald's · Get: 2<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p4-11-core-power-42g-protein-shake\"><span class=\"tx\"><span class=\"it\">Core Power 42g protein shake<\/span><span class=\"am\">Where: Gas station · Get: 1<\/span><\/span><\/label><\/li><\/ul>\n<h3 id=\"p4-12\">Wendy's Chili<\/h3>\n<ul class=\"check\"><li><label><input type=\"checkbox\" data-k=\"p4-12-large-chili-no-cheese-or-crackers\"><span class=\"tx\"><span class=\"it\">Large Chili, no cheese or crackers<\/span><span class=\"am\">Where: Wendy's · Get: 1<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p4-12-core-power-42g-protein-shake\"><span class=\"tx\"><span class=\"it\">Core Power 42g protein shake<\/span><span class=\"am\">Where: Gas station · Get: 1<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p4-12-banana\"><span class=\"tx\"><span class=\"it\">Banana<\/span><span class=\"am\">Where: Gas station or packed · Get: 1<\/span><\/span><\/label><\/li><\/ul>\n<h3 id=\"p4-13\">Gas Station Meal, With Cooler<\/h3>\n<ul class=\"check\"><li><label><input type=\"checkbox\" data-k=\"p4-13-core-power-42g-protein-shake\"><span class=\"tx\"><span class=\"it\">Core Power 42g protein shake<\/span><span class=\"am\">Where: Gas station · Get: 1<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p4-13-oikos-pro-20g-protein-yogurt-cup\"><span class=\"tx\"><span class=\"it\">Oikos Pro 20g protein yogurt cup<\/span><span class=\"am\">Where: Gas station · Get: 1<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p4-13-bananas\"><span class=\"tx\"><span class=\"it\">Bananas<\/span><span class=\"am\">Where: Gas station or packed · Get: 2<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p4-13-almonds-unsalted\"><span class=\"tx\"><span class=\"it\">Almonds, unsalted<\/span><span class=\"am\">Where: Pack from home · Get: 1 oz bag<\/span><\/span><\/label><\/li><\/ul>\n<h3 id=\"p4-14\">Gas Station Meal, No Cooler<\/h3>\n<ul class=\"check\"><li><label><input type=\"checkbox\" data-k=\"p4-14-premier-protein-shakes\"><span class=\"tx\"><span class=\"it\">Premier Protein shakes<\/span><span class=\"am\">Where: Pack from home · Get: 2<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p4-14-bananas\"><span class=\"tx\"><span class=\"it\">Bananas<\/span><span class=\"am\">Where: Pack from home or gas station · Get: 2<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p4-14-almonds-unsalted\"><span class=\"tx\"><span class=\"it\">Almonds, unsalted<\/span><span class=\"am\">Where: Pack from home · Get: 1 oz bag<\/span><\/span><\/label><\/li><\/ul>\n<h2 id=\"p4-15\">Grocery Store Ready-to-Eat Meals (1 meal each)<\/h2>\n<p>Walmart, Kroger, Food Lion, Publix and Whole Foods carry everything below. Aldi carries most of it, but not every Aldi has hot rotisserie chicken. Store brands work for everything except the Oikos Pro cups.<\/p>\n<h3 id=\"p4-16\">Rotisserie Chicken Bowl<\/h3>\n<ul class=\"check\"><li><label><input type=\"checkbox\" data-k=\"p4-16-rotisserie-chicken\"><span class=\"tx\"><span class=\"it\">Rotisserie chicken<\/span><span class=\"am\">Buy: 1 whole (covers 2 to 3 meals) · Meal uses: 6 oz breast meat, skin removed<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p4-16-microwave-brown-rice-cup-plain\"><span class=\"tx\"><span class=\"it\">Microwave brown rice cup, plain<\/span><span class=\"am\">Buy: 1 · Meal uses: 3/4 cup<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p4-16-no-salt-added-black-beans-pull-tab-can\"><span class=\"tx\"><span class=\"it\">No-salt-added black beans, pull-tab can<\/span><span class=\"am\">Buy: 1 can · Meal uses: 1/2 cup, rinsed<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p4-16-avocado-or-guacamole-cups-\"><span class=\"tx\"><span class=\"it\">Avocado (or guacamole cups)<\/span><span class=\"am\">Buy: 1 · Meal uses: 1/4<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p4-16-salsa-lowest-sodium\"><span class=\"tx\"><span class=\"it\">Salsa, lowest sodium<\/span><span class=\"am\">Buy: 1 small jar or deli cup · Meal uses: 2 tbsp<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p4-16-bagged-salad-greens\"><span class=\"tx\"><span class=\"it\">Bagged salad greens<\/span><span class=\"am\">Buy: 1 bag · Meal uses: 2 cups<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p4-16-disposable-bowl-and-fork\"><span class=\"tx\"><span class=\"it\">Disposable bowl and fork<\/span><span class=\"am\">Buy: 1 pack · Meal uses: 1 each<\/span><\/span><\/label><\/li><\/ul>\n<h3 id=\"p4-17\">Salmon Rice Bowl (eat 2 a week)<\/h3>\n<ul class=\"check\"><li><label><input type=\"checkbox\" data-k=\"p4-17-pink-salmon-in-water-pouches-2-6-oz-\"><span class=\"tx\"><span class=\"it\">Pink salmon in water, pouches (2.6 oz)<\/span><span class=\"am\">Buy: 4 pouches · Meal uses: 4 pouches<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p4-17-microwave-brown-rice-cup-plain\"><span class=\"tx\"><span class=\"it\">Microwave brown rice cup, plain<\/span><span class=\"am\">Buy: 1 · Meal uses: 1 cup<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p4-17-avocado-or-guacamole-cups-\"><span class=\"tx\"><span class=\"it\">Avocado (or guacamole cups)<\/span><span class=\"am\">Buy: 1 · Meal uses: 1/4<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p4-17-bagged-salad-greens\"><span class=\"tx\"><span class=\"it\">Bagged salad greens<\/span><span class=\"am\">Buy: 1 bag · Meal uses: 2 cups<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p4-17-cherry-tomatoes\"><span class=\"tx\"><span class=\"it\">Cherry tomatoes<\/span><span class=\"am\">Buy: 1 pint · Meal uses: 1/2 cup<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p4-17-disposable-bowl-and-fork\"><span class=\"tx\"><span class=\"it\">Disposable bowl and fork<\/span><span class=\"am\">Buy: 1 pack · Meal uses: 1 each<\/span><\/span><\/label><\/li><\/ul>\n<p><b>If the store has no salmon:<\/b> 3 pouches light tuna plus 1 Oikos Pro cup. Get salmon at the next stop for the omega-3s.<\/p>\n<h3 id=\"p4-18\">Yogurt Bowl (breakfast)<\/h3>\n<ul class=\"check\"><li><label><input type=\"checkbox\" data-k=\"p4-18-oikos-pro-cups\"><span class=\"tx\"><span class=\"it\">Oikos Pro cups<\/span><span class=\"am\">Buy: 2 · Meal uses: 2<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p4-18-plain-nonfat-greek-yogurt\"><span class=\"tx\"><span class=\"it\">Plain nonfat Greek yogurt<\/span><span class=\"am\">Buy: Single cups, or a 32 oz tub if you have a fridge · Meal uses: 1 cup<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p4-18-blueberries-or-mixed-berries\"><span class=\"tx\"><span class=\"it\">Blueberries or mixed berries<\/span><span class=\"am\">Buy: 1 pint · Meal uses: 1 cup<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p4-18-banana\"><span class=\"tx\"><span class=\"it\">Banana<\/span><span class=\"am\">Buy: 1 · Meal uses: 1<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p4-18-almonds-unsalted\"><span class=\"tx\"><span class=\"it\">Almonds, unsalted<\/span><span class=\"am\">Buy: 1 bag · Meal uses: 1/2 oz<\/span><\/span><\/label><\/li><\/ul>\n<h3 id=\"p4-19\">No-Heat Chicken Plate<\/h3>\n<ul class=\"check\"><li><label><input type=\"checkbox\" data-k=\"p4-19-rotisserie-chicken\"><span class=\"tx\"><span class=\"it\">Rotisserie chicken<\/span><span class=\"am\">Buy: 1 whole (covers 2 to 3 meals) · Meal uses: 5 oz breast meat, skin removed<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p4-19-shelled-edamame-refrigerated-ready-to-ea\"><span class=\"tx\"><span class=\"it\">Shelled edamame, refrigerated ready-to-eat<\/span><span class=\"am\">Buy: 1 bag · Meal uses: 1 cup<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p4-19-banana\"><span class=\"tx\"><span class=\"it\">Banana<\/span><span class=\"am\">Buy: 1 · Meal uses: 1<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p4-19-apple\"><span class=\"tx\"><span class=\"it\">Apple<\/span><span class=\"am\">Buy: 1 · Meal uses: 1<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p4-19-almonds-unsalted\"><span class=\"tx\"><span class=\"it\">Almonds, unsalted<\/span><span class=\"am\">Buy: 1 bag · Meal uses: 1/2 oz<\/span><\/span><\/label><\/li><\/ul>\n<h2 id=\"p4-20\">Pre-Workout Snack on the Road (1 snack each)<\/h2>\n<ul class=\"check\"><li><label><input type=\"checkbox\" data-k=\"p4-20-banana\"><span class=\"tx\"><span class=\"it\">Banana<\/span><span class=\"am\">Where: Gas station or packed · Get: 1<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p4-20-pretzels-lowest-sodium\"><span class=\"tx\"><span class=\"it\">Pretzels, lowest sodium<\/span><span class=\"am\">Where: Gas station or packed · Get: About 1.25 oz<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p4-20-fruit-snacks-or-gummies\"><span class=\"tx\"><span class=\"it\">Fruit snacks or gummies<\/span><span class=\"am\">Where: Gas station or packed · Get: Enough for about 30 g carbs<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p4-20-quaker-original-instant-oatmeal-banana-l\"><span class=\"tx\"><span class=\"it\">Quaker Original instant oatmeal + banana (longer sessions)<\/span><span class=\"am\">Where: Packed · Get: 1 packet + 1 banana<\/span><\/span><\/label><\/li><\/ul>\n<h2 id=\"p4-21\">Road Nutrient Kit (pack once per trip)<\/h2>\n<ul class=\"check\"><li><label><input type=\"checkbox\" data-k=\"p4-21-unsalted-sunflower-seeds\"><span class=\"tx\"><span class=\"it\">Unsalted sunflower seeds<\/span><span class=\"am\">Amount: 1/2 to 1 oz per day, pre-portioned · What it covers: Vitamin E, zinc, selenium, folate<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p4-21-chia-seeds\"><span class=\"tx\"><span class=\"it\">Chia seeds<\/span><span class=\"am\">Amount: 1 tbsp per day, pre-portioned · What it covers: Omega-3 ALA; stir into a yogurt cup<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p4-21-oranges-or-clementines\"><span class=\"tx\"><span class=\"it\">Oranges or clementines<\/span><span class=\"am\">Amount: 1 per day · What it covers: Vitamin C<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p4-21-low-sodium-tomato-or-vegetable-juice-sma\"><span class=\"tx\"><span class=\"it\">Low-sodium tomato or vegetable juice, small cans<\/span><span class=\"am\">Amount: A few per trip · What it covers: Lycopene, vitamin C<\/span><\/span><\/label><\/li><\/ul>\n<h2 id=\"p4-22\">Car Supplies (pack once per trip)<\/h2>\n<ul class=\"check\"><li><label><input type=\"checkbox\" data-k=\"p4-22-cooler-ice-packs-and-zip-bags\"><span class=\"tx\"><span class=\"it\">Cooler, ice packs and zip bags<\/span><span class=\"am\">Amount: 1 set · Tip: Refreeze ice packs in the hotel freezer if there is one<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p4-22-disposable-bowls-forks-and-napkins\"><span class=\"tx\"><span class=\"it\">Disposable bowls, forks and napkins<\/span><span class=\"am\">Amount: 1 pack · Tip: Keep a set in the car<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p4-22-bottled-water\"><span class=\"tx\"><span class=\"it\">Bottled water<\/span><span class=\"am\">Amount: Several per day · Tip: Fast food is high in sodium<\/span><\/span><\/label><\/li><\/ul>\n<h2 id=\"p4-23\">Swaps if a Store Is Out<\/h2>\n<table class=\"stack\"><thead><tr><th>If they don't have<\/th><th>Get this instead<\/th><th>Adjust<\/th><\/tr><\/thead><tbody><tr><td>Core Power 42g<\/td><td>1 Premier Protein shake + 1 Oikos Pro cup<\/td><td>About the same protein (50 g); adds about 60 calories<\/td><\/tr><tr><td>Oikos Pro<\/td><td>Chobani or other plain Greek yogurt cup<\/td><td>Lower protein; check the label for about 15 to 20 g<\/td><\/tr><tr><td>Hard-boiled eggs<\/td><td>1 Oikos Pro cup<\/td><td>Similar protein, less fat<\/td><\/tr><tr><td>Bananas<\/td><td>Apple or fruit cup<\/td><td>Check carbs on the label; aim for about 25 g<\/td><\/tr><tr><td>Almonds<\/td><td>Peanuts or mixed nuts, unsalted<\/td><td>About the same per 1 oz<\/td><\/tr><\/tbody><\/table>\n<h2 id=\"p4-24\">Ways to Keep Costs Down<\/h2>\n<ul><li><b>Shakes and oatmeal cost much more at gas stations.<\/b> Buy multipacks before the trip and only buy cold items on the road.<\/li><li><b>Use fast food apps.<\/b> Chick-fil-A, McDonald's, Wendy's, Subway and Chipotle all run deals in their apps.<\/li><li><b>Refill the cooler with a bag of gas station ice<\/b> instead of buying more ice packs.<\/li><\/ul>", "heads": [{"id": "p4-1", "t": "How to Use This List", "l": 2}, {"id": "p4-2", "t": "Breakfasts (1 meal each)", "l": 2}, {"id": "p4-3", "t": "Chick-fil-A Breakfast", "l": 3}, {"id": "p4-4", "t": "McDonald's Oatmeal Breakfast", "l": 3}, {"id": "p4-5", "t": "Hotel or Gas Station Oatmeal", "l": 3}, {"id": "p4-6", "t": "Nothing-Needed Breakfast (no cooler, fridge or microwave)", "l": 3}, {"id": "p4-7", "t": "Fast Food Lunches and Dinners (1 meal each)", "l": 2}, {"id": "p4-8", "t": "Chipotle Bowl", "l": 3}, {"id": "p4-9", "t": "Chick-fil-A Lunch", "l": 3}, {"id": "p4-10", "t": "Subway", "l": 3}, {"id": "p4-11", "t": "McDonald's Lunch", "l": 3}, {"id": "p4-12", "t": "Wendy's Chili", "l": 3}, {"id": "p4-13", "t": "Gas Station Meal, With Cooler", "l": 3}, {"id": "p4-14", "t": "Gas Station Meal, No Cooler", "l": 3}, {"id": "p4-15", "t": "Grocery Store Ready-to-Eat Meals (1 meal each)", "l": 2}, {"id": "p4-16", "t": "Rotisserie Chicken Bowl", "l": 3}, {"id": "p4-17", "t": "Salmon Rice Bowl (eat 2 a week)", "l": 3}, {"id": "p4-18", "t": "Yogurt Bowl (breakfast)", "l": 3}, {"id": "p4-19", "t": "No-Heat Chicken Plate", "l": 3}, {"id": "p4-20", "t": "Pre-Workout Snack on the Road (1 snack each)", "l": 2}, {"id": "p4-21", "t": "Road Nutrient Kit (pack once per trip)", "l": 2}, {"id": "p4-22", "t": "Car Supplies (pack once per trip)", "l": 2}, {"id": "p4-23", "t": "Swaps if a Store Is Out", "l": 2}, {"id": "p4-24", "t": "Ways to Keep Costs Down", "l": 2}]}, {"id": "p5", "kicker": "Plan 3 · Meal Plan", "title": "No-Cook Power Bowls", "sub": "A 40-40-20 meal plan built on pouches · home or on the go · 2,100 calories · 35 g+ fiber · key nutrients · November 19, 2026", "kind": "plan", "html": "<h2 id=\"p5-1\">How It Works<\/h2>\n<p>Every lunch and dinner is a bowl built from shelf-stable pouches or cans, microwave grains, beans and fresh or frozen produce. Each bowl lands near 700 calories with about 40% protein, 40% carbs and 20 to 25% fat. Add a no-cook breakfast and a typical day comes to about 2,125 calories, 209 g protein, 207 g carbs, 54 g fat and 46 g fiber.<\/p>\n<ul><li><b>The only \"cooking\"<\/b> is microwaving a rice or quinoa cup, a sweet potato or frozen edamame.<\/li><li><b>Same bowls at home or on the road.<\/b> Pack the pouches, grain cups and spices; buy the fresh items and yogurt wherever you stop.<\/li><li><b>Fish 7 times a week:<\/b> salmon 4 times, tuna twice and mackerel once, for about 7 g of EPA and DHA omega-3s a week.<\/li><li><b>Pick the 25% less sodium chicken pouches<\/b> and no-salt-added beans to keep sodium in check.<\/li><li><b>Numbers<\/b> come from pouch and can labels and standard USDA values. Brands vary, so check your labels.<\/li><\/ul>\n<h2 id=\"p5-2\">The Bowls at a Glance<\/h2>\n<div class=\"scroll\"><table class=\"\"><thead><tr><th>#<\/th><th>Bowl<\/th><th>Protein<\/th><th>Cal<\/th><th>Protein (g)<\/th><th>Carbs (g)<\/th><th>Fat (g)<\/th><th>Fiber (g)<\/th><\/tr><\/thead><tbody><tr><td class=n>1<\/td><td>Mediterranean Salmon Bowl<\/td><td>Salmon<\/td><td class=n>697<\/td><td class=n>74<\/td><td class=n>69<\/td><td class=n>18<\/td><td class=n>19<\/td><\/tr><tr><td class=n>2<\/td><td>Greek Chicken Gyro Bowl<\/td><td>Chicken<\/td><td class=n>704<\/td><td class=n>69<\/td><td class=n>70<\/td><td class=n>16<\/td><td class=n>14<\/td><\/tr><tr><td class=n>3<\/td><td>Southwest Chicken Burrito Bowl<\/td><td>Chicken<\/td><td class=n>706<\/td><td class=n>67<\/td><td class=n>65<\/td><td class=n>20<\/td><td class=n>18<\/td><\/tr><tr><td class=n>4<\/td><td>Baja Salmon and Mango Bowl<\/td><td>Salmon<\/td><td class=n>679<\/td><td class=n>71<\/td><td class=n>69<\/td><td class=n>17<\/td><td class=n>17<\/td><\/tr><tr><td class=n>5<\/td><td>Sesame Ginger Tuna Poke Bowl<\/td><td>Tuna<\/td><td class=n>662<\/td><td class=n>68<\/td><td class=n>68<\/td><td class=n>16<\/td><td class=n>14<\/td><\/tr><tr><td class=n>6<\/td><td>Thai Peanut Chicken Crunch Bowl<\/td><td>Chicken<\/td><td class=n>717<\/td><td class=n>70<\/td><td class=n>65<\/td><td class=n>20<\/td><td class=n>12<\/td><\/tr><tr><td class=n>7<\/td><td>Caribbean Jerk Chicken and Sweet Potato Bowl<\/td><td>Chicken<\/td><td class=n>718<\/td><td class=n>67<\/td><td class=n>71<\/td><td class=n>19<\/td><td class=n>19<\/td><\/tr><tr><td class=n>8<\/td><td>Mackerel, White Bean and Tomato Bowl<\/td><td>Mackerel<\/td><td class=n>678<\/td><td class=n>67<\/td><td class=n>69<\/td><td class=n>17<\/td><td class=n>19<\/td><\/tr><\/tbody><\/table><\/div>\n<h2 id=\"p5-3\">The Bowls<\/h2>\n<h3 id=\"p5-4\">1. Mediterranean Salmon Bowl<\/h3>\n<div class=\"macro\">697 calories · 74 g protein · 69 g carbs · 18 g fat · 19 g fiber · about 1.2 g EPA and DHA<\/div>\n<p>The original: bright, lemony and loaded with color.<\/p>\n<ul><li>4 pouches (2.6 oz) pink salmon in water<\/li><li>1/2 cup cooked brown rice (microwave cup)<\/li><li>1/2 cup no-salt-added chickpeas, rinsed<\/li><li>1/3 avocado, sliced<\/li><li>2 cups salad greens<\/li><li>1/2 cup cherry tomatoes, 1/2 cup sliced red bell pepper<\/li><li>Juice of 1/2 lemon, black pepper, dried dill<\/li><\/ul>\n<p><b>Build:<\/b> Greens on the bottom, then rice, chickpeas and vegetables. Top with salmon and avocado and squeeze the lemon over everything.<\/p>\n<h3 id=\"p5-5\">2. Greek Chicken Gyro Bowl<\/h3>\n<div class=\"macro\">704 calories · 69 g protein · 70 g carbs · 16 g fat · 14 g fiber<\/div>\n<p>Everything you love about a gyro, minus the pita and fryer.<\/p>\n<ul><li>3 pouches (2.6 oz) white chicken, 25% less sodium<\/li><li>3/4 cup cooked quinoa (microwave cup)<\/li><li>1/2 cup no-salt-added chickpeas, rinsed<\/li><li>2 cups baby spinach<\/li><li>1/2 cup diced cucumber, 1/2 cup cherry tomatoes, 2 tbsp diced red onion<\/li><li>Tzatziki: 1/2 cup nonfat plain Greek yogurt + lemon juice + garlic + dried dill + a little grated cucumber<\/li><li>1 tbsp unsalted sunflower seeds<\/li><li>Dried oregano<\/li><\/ul>\n<p><b>Build:<\/b> Toss the chicken with oregano and a squeeze of lemon. Layer spinach, quinoa, chickpeas and vegetables, then top with chicken, a big spoonful of tzatziki and the sunflower seeds.<\/p>\n<h3 id=\"p5-6\">3. Southwest Chicken Burrito Bowl<\/h3>\n<div class=\"macro\">706 calories · 67 g protein · 65 g carbs · 20 g fat · 18 g fiber<\/div>\n<p>Chipotle at home for a fraction of the price.<\/p>\n<ul><li>3 pouches (2.6 oz) white chicken, 25% less sodium<\/li><li>1/3 cup cooked brown rice (microwave cup)<\/li><li>1/2 cup no-salt-added black beans, rinsed<\/li><li>2 cups salad greens<\/li><li>1/2 cup sliced red bell pepper, 1/2 cup cherry tomatoes<\/li><li>1/4 cup salsa (lowest sodium you can find)<\/li><li>Chipotle-lime crema: 1/2 cup nonfat plain Greek yogurt + lime juice + chipotle powder + cumin<\/li><li>1/4 avocado, 1 tbsp pumpkin seeds<\/li><\/ul>\n<p><b>Build:<\/b> Toss the chicken with half the salsa and a pinch of cumin. Layer greens, rice, beans and peppers, then top with chicken, tomatoes, the rest of the salsa, crema, avocado and pumpkin seeds.<\/p>\n<h3 id=\"p5-7\">4. Baja Salmon and Mango Bowl<\/h3>\n<div class=\"macro\">679 calories · 71 g protein · 69 g carbs · 17 g fat · 17 g fiber · about 0.9 g EPA and DHA<\/div>\n<p>Fish taco flavor: sweet mango, crunchy slaw and cool lime crema.<\/p>\n<ul><li>3 pouches (2.6 oz) pink salmon in water<\/li><li>1/3 cup cooked brown rice (microwave cup)<\/li><li>1/2 cup no-salt-added black beans, rinsed<\/li><li>1 cup coleslaw mix (no dressing)<\/li><li>1/2 cup diced mango (fresh or thawed frozen), 2 tbsp diced red onion, cilantro<\/li><li>Lime crema: 1/2 cup nonfat plain Greek yogurt + lime juice and zest + pinch of chili powder<\/li><li>1/4 avocado, 1 tbsp pumpkin seeds<\/li><\/ul>\n<p><b>Build:<\/b> Mix the mango, onion, cilantro and a squeeze of lime for a quick salsa. Layer slaw, rice and beans, then top with salmon, mango salsa, crema, avocado and pumpkin seeds.<\/p>\n<h3 id=\"p5-8\">5. Sesame Ginger Tuna Poke Bowl<\/h3>\n<div class=\"macro\">662 calories · 68 g protein · 68 g carbs · 16 g fat · 14 g fiber · about 0.5 g EPA and DHA<\/div>\n<p>Poke-shop flavor with zero raw fish.<\/p>\n<ul><li>3 pouches (2.6 oz) light tuna in water<\/li><li>3/4 cup cooked brown rice (microwave cup)<\/li><li>1/2 cup shelled edamame (microwave if frozen)<\/li><li>1 cup coleslaw mix, 1/2 cup shredded carrots, 1/2 cup sliced cucumber<\/li><li>1/4 avocado<\/li><li>Sesame-ginger dressing: 2 tsp low-sodium soy sauce + 1 tbsp rice vinegar + 1 tsp honey + 1/2 tsp ginger paste<\/li><li>1 tsp sesame seeds, sliced green onion if you have it<\/li><\/ul>\n<p><b>Build:<\/b> Whisk the dressing and toss half of it with the tuna. Layer rice, slaw, carrots, cucumber and edamame, then top with tuna, avocado, the rest of the dressing and sesame seeds.<\/p>\n<p><b>Swap:<\/b> Use 3 salmon pouches instead of tuna for more omega-3s (about 62 g protein).<\/p>\n<h3 id=\"p5-9\">6. Thai Peanut Chicken Crunch Bowl<\/h3>\n<div class=\"macro\">717 calories · 70 g protein · 65 g carbs · 20 g fat · 12 g fiber<\/div>\n<p>Creamy, crunchy and a little spicy.<\/p>\n<ul><li>3 pouches (2.6 oz) white chicken, 25% less sodium<\/li><li>1/2 cup cooked brown rice (microwave cup)<\/li><li>1/2 cup shelled edamame (microwave if frozen)<\/li><li>1 cup coleslaw mix, 1/2 cup sliced red bell pepper, 1/2 cup shredded carrots, 1/2 cup sliced cucumber<\/li><li>Peanut-lime sauce: 1 tbsp natural peanut butter + 1/2 cup nonfat plain Greek yogurt + 2 tsp low-sodium soy sauce + 1 tsp honey + lime juice + pinch of red pepper flakes<\/li><li>Cilantro and a lime wedge<\/li><\/ul>\n<p><b>Build:<\/b> Stir the sauce until smooth, adding a splash of water if needed. Toss the chicken in a third of it. Layer rice and vegetables, then top with chicken, edamame, the rest of the sauce and cilantro.<\/p>\n<h3 id=\"p5-10\">7. Caribbean Jerk Chicken and Sweet Potato Bowl<\/h3>\n<div class=\"macro\">718 calories · 67 g protein · 71 g carbs · 19 g fat · 19 g fiber<\/div>\n<p>Island heat cooled by sweet pineapple.<\/p>\n<ul><li>3 pouches (2.6 oz) white chicken, 25% less sodium<\/li><li>1 medium sweet potato, microwaved 5 to 7 minutes until soft<\/li><li>1/2 cup no-salt-added black beans, rinsed<\/li><li>2 cups baby spinach<\/li><li>2/3 cup pineapple tidbits (canned in juice, drained) and 1/2 cup sliced red bell pepper<\/li><li>Jerk-lime yogurt: 1/2 cup nonfat plain Greek yogurt + 1 tsp salt-free jerk seasoning + lime juice<\/li><li>1/4 avocado, 1 tbsp pumpkin seeds<\/li><\/ul>\n<p><b>Build:<\/b> Toss the chicken with a little jerk seasoning. Split the sweet potato and mash it lightly in the bowl. Add spinach, beans, pineapple and pepper, then top with chicken, jerk-lime yogurt, avocado and pumpkin seeds.<\/p>\n<h3 id=\"p5-11\">8. Mackerel, White Bean and Tomato Bowl<\/h3>\n<div class=\"macro\">678 calories · 67 g protein · 69 g carbs · 17 g fat · 19 g fiber · about 1.9 g omega-3s<\/div>\n<p>A rustic Italian-style bowl and the omega-3 champion of the week.<\/p>\n<ul><li>5 oz canned jack mackerel, drained<\/li><li>1 cup no-salt-added white beans (cannellini or great northern), rinsed<\/li><li>1/3 cup cooked quinoa (microwave cup)<\/li><li>2 cups baby spinach<\/li><li>1 cup cherry tomatoes, halved, 1/2 cup diced cucumber, 2 tbsp diced red onion<\/li><li>Lemon-herb yogurt: 1/2 cup nonfat plain Greek yogurt + lemon juice + garlic + dried basil or oregano<\/li><li>1 tbsp unsalted sunflower seeds<\/li><\/ul>\n<p><b>Build:<\/b> Flake the mackerel and toss it with the beans, tomatoes, onion and a squeeze of lemon. Spoon over spinach and quinoa, then top with the yogurt and sunflower seeds.<\/p>\n<p><b>Swap:<\/b> 1 can (4.4 oz) sardines in water plus 1 salmon pouch gives similar numbers.<\/p>\n<h2 id=\"p5-12\">7-Day Rotation<\/h2>\n<table class=\"stack\"><thead><tr><th>Day<\/th><th>Breakfast<\/th><th>Lunch<\/th><th>Dinner<\/th><\/tr><\/thead><tbody><tr><td>Mon<\/td><td>Protein overnight oats<\/td><td>Mediterranean Salmon<\/td><td>Southwest Chicken Burrito<\/td><\/tr><tr><td>Tue<\/td><td>Greek yogurt parfait<\/td><td>Greek Chicken Gyro<\/td><td>Sesame Ginger Tuna Poke<\/td><\/tr><tr><td>Wed<\/td><td>Green protein smoothie<\/td><td>Baja Salmon and Mango<\/td><td>Thai Peanut Chicken Crunch<\/td><\/tr><tr><td>Thu<\/td><td>Protein overnight oats<\/td><td>Southwest Chicken Burrito<\/td><td>Mackerel, White Bean and Tomato<\/td><\/tr><tr><td>Fri<\/td><td>Greek yogurt parfait<\/td><td>Mediterranean Salmon<\/td><td>Caribbean Jerk Chicken<\/td><\/tr><tr><td>Sat<\/td><td>Green protein smoothie<\/td><td>Greek Chicken Gyro<\/td><td>Baja Salmon and Mango<\/td><\/tr><tr><td>Sun<\/td><td>Protein overnight oats<\/td><td>Thai Peanut Chicken Crunch<\/td><td>Sesame Ginger Tuna Poke<\/td><\/tr><\/tbody><\/table>\n<h2 id=\"p5-13\">No-Cook Breakfasts<\/h2>\n<div class=\"scroll\"><table class=\"\"><thead><tr><th>Breakfast<\/th><th>What goes in it<\/th><th>Cal<\/th><th>Protein (g)<\/th><th>Carbs (g)<\/th><th>Fat (g)<\/th><th>Fiber (g)<\/th><\/tr><\/thead><tbody><tr><td>Protein overnight oats<\/td><td>3/4 cup rolled oats, 1.5 scoops whey, 3/4 cup nonfat Greek yogurt, 1 tbsp chia seeds, 1.5 tbsp unsalted sunflower seeds, 3/4 cup strawberries or mixed berries, water or almond milk to thin<\/td><td class=n>713<\/td><td class=n>67<\/td><td class=n>71<\/td><td class=n>18<\/td><td class=n>15.5<\/td><\/tr><tr><td>Greek yogurt parfait<\/td><td>2.5 cups nonfat plain Greek yogurt, 1/2 cup rolled oats, 1 cup strawberries or mixed berries, 17 almonds, 1 tbsp chia seeds<\/td><td class=n>741<\/td><td class=n>71<\/td><td class=n>72<\/td><td class=n>19<\/td><td class=n>16<\/td><\/tr><tr><td>Green protein smoothie<\/td><td>1.5 scoops whey, 1 medium banana, 1/3 cup rolled oats, 1.5 tbsp sunflower seeds, 1 tbsp chia seeds, 1/2 cup frozen spinach, 1 cup unsweetened almond milk with added vitamin E, 1 cup nonfat Greek yogurt, ice<\/td><td class=n>753<\/td><td class=n>73<\/td><td class=n>72<\/td><td class=n>19<\/td><td class=n>14.5<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Protein powder values assume a 30 g scoop with 24 g protein.<\/p>\n<h2 id=\"p5-14\">Pre-Workout Snack (Training Days)<\/h2>\n<p>About 30 g of fast carbs, 30 to 60 minutes before training, on top of the 2,100 calories. Pick one: 2 plain unsalted rice cakes with 1 tbsp honey, 1 banana, 1.25 oz unsalted pretzels, or 3 graham cracker sheets.<\/p>\n<h2 id=\"p5-15\">Key Nutrients<\/h2>\n<p>Targets are the NIH Office of Dietary Supplements recommendations for adult men. Daily amounts are estimates from standard USDA values and pouch labels.<\/p>\n<table class=\"stack\"><thead><tr><th>Nutrient<\/th><th>Daily target<\/th><th>Main sources in these bowls<\/th><th>Typical day<\/th><\/tr><\/thead><tbody><tr><td>Zinc<\/td><td>11 mg (upper limit 40 mg)<\/td><td>Oats, quinoa, beans, edamame, pumpkin and sunflower seeds, fish, chicken<\/td><td>About 14 to 17 mg<\/td><\/tr><tr><td>Selenium<\/td><td>55 mcg (upper limit 400 mcg)<\/td><td>Tuna, salmon, mackerel, chicken, oats, Greek yogurt, brown rice<\/td><td>About 160 to 350 mcg; tuna days are highest<\/td><\/tr><tr><td>Folate<\/td><td>400 mcg<\/td><td>Edamame, black and white beans, chickpeas, spinach, greens, avocado, quinoa<\/td><td>About 700 mcg<\/td><\/tr><tr><td>Vitamin C<\/td><td>90 mg<\/td><td>Red bell pepper, pineapple, mango, slaw, sweet potato, strawberries, tomatoes<\/td><td>About 190 to 260 mg<\/td><\/tr><tr><td>Vitamin E<\/td><td>15 mg<\/td><td>Sunflower seeds, almonds, spinach, avocado, red pepper, quinoa, fortified almond milk<\/td><td>About 11 to 17 mg<\/td><\/tr><tr><td>Lycopene<\/td><td>No official target<\/td><td>Cherry tomatoes in 4 bowls, salsa<\/td><td>About 2 to 4 mg; see the booster below<\/td><\/tr><tr><td>Omega-3 EPA and DHA<\/td><td>No official target; 1 to 2 seafood meals a week is common advice<\/td><td>Salmon, tuna and mackerel bowls<\/td><td>About 7 g a week<\/td><\/tr><tr><td>Omega-3 ALA<\/td><td>1.6 g<\/td><td>Chia seeds at every breakfast, edamame<\/td><td>About 2.8 g<\/td><\/tr><tr><td>L-arginine and amino acids<\/td><td>No official target<\/td><td>60 to 75 g complete protein per meal, plus seeds, peanuts and beans<\/td><td>Well covered<\/td><\/tr><\/tbody><\/table>\n<p class=\"lead\"><b>Boosters<\/b><\/p>\n<ul><li><b>Lycopene:<\/b> drink 1 cup of low-sodium tomato juice or vegetable juice with a meal 3 or 4 times a week. A cup of tomato juice has about 22 mg of lycopene and about 40 calories.<\/li><li><b>Vitamin E:<\/b> on days without the smoothie, add 1/2 oz unsalted sunflower seeds (about 80 calories, 3.7 mg vitamin E).<\/li><li><b>Selenium:<\/b> skip Brazil nuts and selenium supplements. These bowls already cover selenium, and tuna days run close to the upper limit.<\/li><li><b>Supplements:<\/b> talk with your doctor before adding fish oil, vitamin E, zinc, selenium or L-arginine supplements.<\/li><\/ul>\n<h2 id=\"p5-16\">Prep, Storage and Food Safety<\/h2>\n<ul><li><b>Batch prep:<\/b> build 3 or 4 bowls at a time in lidded containers. Keep sauces, avocado and seeds in small separate containers and add them when you eat.<\/li><li><b>Fridge life:<\/b> chicken and bean bowls keep 3 days. Fish bowls taste best within 1 to 2 days.<\/li><li><b>Pouches<\/b> are shelf-stable until opened. Do not microwave them in the pouch.<\/li><li><b>Frozen edamame:<\/b> microwave it per the bag unless the bag says ready to eat. Thawed frozen mango is fine as is.<\/li><li><b>On the road:<\/b> keep yogurt, cut produce and built bowls at 40°F or below. Toss perishables left out more than 2 hours, or 1 hour above 90°F.<\/li><\/ul>\n<h2 id=\"p5-17\">Building Bowls on the Go<\/h2>\n<table class=\"stack\"><thead><tr><th>Pack from home<\/th><th>Buy where you stop<\/th><\/tr><\/thead><tbody><tr><td>Salmon, tuna and chicken pouches; jack mackerel or sardine cans with pull tabs<\/td><td>Plain nonfat Greek yogurt cups (a 5.3 oz cup is a little more than the 1/2 cup used per bowl)<\/td><\/tr><tr><td>Microwave rice and quinoa cups<\/td><td>Bagged salad greens, spinach and coleslaw mix<\/td><\/tr><tr><td>No-salt-added beans and chickpeas in pull-tab cans<\/td><td>Cherry tomatoes, cucumbers, bell peppers<\/td><\/tr><tr><td>Pre-mixed spice packets: tzatziki herbs, chipotle-cumin, jerk, lemon-herb<\/td><td>Avocados or single-serve guacamole cups<\/td><\/tr><tr><td>Pumpkin seeds, sunflower seeds, sesame seeds, small peanut butter cups<\/td><td>Mango or pineapple fruit cups in juice<\/td><\/tr><tr><td>Low-sodium soy sauce packets, honey packets, plastic forks and bowls<\/td><td>Limes and lemons, or bottled juice<\/td><\/tr><\/tbody><\/table>\n<h2 id=\"p5-18\">Sources<\/h2>\n<ul><li>Pink salmon pouch nutrition and EPA and DHA: <a href=\"https://starkist.com/?p=9738\" target=\"_blank\" rel=\"noopener\">StarKist<\/a><\/li><li>Chicken pouch nutrition, including the 25% less sodium version: <a href=\"https://www.kroger.com/p/p/0008000052086\" target=\"_blank\" rel=\"noopener\">Kroger<\/a> and <a href=\"https://business.albertsons.com/shop/product-details.970071215.html\" target=\"_blank\" rel=\"noopener\">Albertsons<\/a><\/li><li>Light tuna pouch nutrition: <a href=\"https://business.acmemarkets.com/shop/product-details.960016872.html\" target=\"_blank\" rel=\"noopener\">Acme Markets<\/a><\/li><li>Sardines in water nutrition and omega-3s: <a href=\"https://shoprite.com/sm/pickup/rsid/430/product/season-brand-sardines-in-water-4375-oz-id-00070303010204\" target=\"_blank\" rel=\"noopener\">ShopRite (Season brand)<\/a><\/li><li>Jack mackerel, canned: <a href=\"https://www.uhhospitals.org/health-information/health-and-wellness-library/article/nutritionfacts-v1/fish-mackerel-jack-canned-drained-solids-1-can-15-oz\" target=\"_blank\" rel=\"noopener\">UH Hospitals nutrition facts from USDA data<\/a> and <a href=\"https://happyforks.com/food/mackerel/4329\" target=\"_blank\" rel=\"noopener\">Happy Forks (USDA values, omega-3s)<\/a><\/li><li>Lycopene in tomato juice: <a href=\"https://ific.org/?p=2336\" target=\"_blank\" rel=\"noopener\">International Food Information Council<\/a><\/li><li>Nutrient targets and food values: NIH Office of Dietary Supplements fact sheets for <a href=\"https://ods.od.nih.gov/factsheets/Zinc-HealthProfessional/\" target=\"_blank\" rel=\"noopener\">zinc<\/a>, <a href=\"https://ods.od.nih.gov/factsheets/Selenium-HealthProfessional/\" target=\"_blank\" rel=\"noopener\">selenium<\/a>, <a href=\"https://ods.od.nih.gov/factsheets/Folate-HealthProfessional\" target=\"_blank\" rel=\"noopener\">folate<\/a>, <a href=\"https://ods.od.nih.gov/factsheets/VitaminC-HealthProfessional/\" target=\"_blank\" rel=\"noopener\">vitamin C<\/a>, <a href=\"https://ods.od.nih.gov/factsheets/VitaminE-Consumer/\" target=\"_blank\" rel=\"noopener\">vitamin E<\/a> and <a href=\"https://ods.od.nih.gov/factsheets/Omega3FattyAcids-Consumer/\" target=\"_blank\" rel=\"noopener\">omega-3s<\/a><\/li><li>Everything else (grains, beans, produce, seeds, yogurt): standard USDA values<\/li><\/ul>", "heads": [{"id": "p5-1", "t": "How It Works", "l": 2}, {"id": "p5-2", "t": "The Bowls at a Glance", "l": 2}, {"id": "p5-3", "t": "The Bowls", "l": 2}, {"id": "p5-4", "t": "1. Mediterranean Salmon Bowl", "l": 3}, {"id": "p5-5", "t": "2. Greek Chicken Gyro Bowl", "l": 3}, {"id": "p5-6", "t": "3. Southwest Chicken Burrito Bowl", "l": 3}, {"id": "p5-7", "t": "4. Baja Salmon and Mango Bowl", "l": 3}, {"id": "p5-8", "t": "5. Sesame Ginger Tuna Poke Bowl", "l": 3}, {"id": "p5-9", "t": "6. Thai Peanut Chicken Crunch Bowl", "l": 3}, {"id": "p5-10", "t": "7. Caribbean Jerk Chicken and Sweet Potato Bowl", "l": 3}, {"id": "p5-11", "t": "8. Mackerel, White Bean and Tomato Bowl", "l": 3}, {"id": "p5-12", "t": "7-Day Rotation", "l": 2}, {"id": "p5-13", "t": "No-Cook Breakfasts", "l": 2}, {"id": "p5-14", "t": "Pre-Workout Snack (Training Days)", "l": 2}, {"id": "p5-15", "t": "Key Nutrients", "l": 2}, {"id": "p5-16", "t": "Prep, Storage and Food Safety", "l": 2}, {"id": "p5-17", "t": "Building Bowls on the Go", "l": 2}, {"id": "p5-18", "t": "Sources", "l": 2}]}, {"id": "p6", "kicker": "Plan 3 · Grocery List", "title": "No-Cook Power Bowls Grocery List", "sub": "One list per bowl and breakfast · store brands work for nearly everything · November 20, 2026", "kind": "grocery", "html": "<h2 id=\"p6-1\">How to Use This List<\/h2>\n<ul><li><b>Shop by meal.<\/b> Each bowl and breakfast has its own complete list for 1 serving. Making it twice this week? Double the \"Recipe uses\" amounts.<\/li><li><b>\"Buy\" is the package size. \"Recipe uses\" is how much goes in one bowl.<\/b> Opened cans and bags carry over to the next bowl that uses them.<\/li><li><b>Some items repeat across bowls,<\/b> like Greek yogurt, beans, rice cups and avocado. Check your fridge and pantry before buying them again.<\/li><li><b>Seasonings and garlic<\/b> are in Pantry Staples at the end.<\/li><\/ul>\n<h2 id=\"p6-2\">The Bowls (1 bowl each)<\/h2>\n<h3 id=\"p6-3\">1. Mediterranean Salmon Bowl<\/h3>\n<ul class=\"check\"><li><label><input type=\"checkbox\" data-k=\"p6-3-pink-salmon-in-water-pouches-2-6-oz-\"><span class=\"tx\"><span class=\"it\">Pink salmon in water, pouches (2.6 oz)<\/span><span class=\"am\">Buy: 4 pouches · Recipe uses: 4 pouches<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p6-3-microwave-brown-rice-cup\"><span class=\"tx\"><span class=\"it\">Microwave brown rice cup<\/span><span class=\"am\">Buy: 1 · Recipe uses: 1/2 cup<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p6-3-no-salt-added-chickpeas\"><span class=\"tx\"><span class=\"it\">No-salt-added chickpeas<\/span><span class=\"am\">Buy: 1 can (15 oz) · Recipe uses: 1/2 cup<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p6-3-avocado\"><span class=\"tx\"><span class=\"it\">Avocado<\/span><span class=\"am\">Buy: 1 · Recipe uses: 1/3<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p6-3-salad-greens\"><span class=\"tx\"><span class=\"it\">Salad greens<\/span><span class=\"am\">Buy: 1 bag (5 oz) · Recipe uses: 2 cups<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p6-3-cherry-tomatoes\"><span class=\"tx\"><span class=\"it\">Cherry tomatoes<\/span><span class=\"am\">Buy: 1 pint · Recipe uses: 1/2 cup<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p6-3-red-bell-pepper-or-frozen-strips-\"><span class=\"tx\"><span class=\"it\">Red bell pepper (or frozen strips)<\/span><span class=\"am\">Buy: 1 · Recipe uses: 1/2 cup sliced<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p6-3-lemon\"><span class=\"tx\"><span class=\"it\">Lemon<\/span><span class=\"am\">Buy: 1 · Recipe uses: Juice of 1/2<\/span><\/span><\/label><\/li><\/ul>\n<p><b>From the pantry:<\/b> black pepper, dried dill.<\/p>\n<h3 id=\"p6-4\">2. Greek Chicken Gyro Bowl<\/h3>\n<ul class=\"check\"><li><label><input type=\"checkbox\" data-k=\"p6-4-white-chicken-pouches-2-6-oz-25-less-sod\"><span class=\"tx\"><span class=\"it\">White chicken pouches (2.6 oz), 25% less sodium<\/span><span class=\"am\">Buy: 3 pouches · Recipe uses: 3 pouches<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p6-4-microwave-quinoa-cup\"><span class=\"tx\"><span class=\"it\">Microwave quinoa cup<\/span><span class=\"am\">Buy: 1 · Recipe uses: 3/4 cup<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p6-4-no-salt-added-chickpeas\"><span class=\"tx\"><span class=\"it\">No-salt-added chickpeas<\/span><span class=\"am\">Buy: 1 can (15 oz) · Recipe uses: 1/2 cup<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p6-4-baby-spinach\"><span class=\"tx\"><span class=\"it\">Baby spinach<\/span><span class=\"am\">Buy: 1 container (10 to 11 oz) · Recipe uses: 2 cups<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p6-4-cucumber\"><span class=\"tx\"><span class=\"it\">Cucumber<\/span><span class=\"am\">Buy: 1 · Recipe uses: 1/2 cup diced, plus a little grated for tzatziki<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p6-4-cherry-tomatoes\"><span class=\"tx\"><span class=\"it\">Cherry tomatoes<\/span><span class=\"am\">Buy: 1 pint · Recipe uses: 1/2 cup<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p6-4-red-onion\"><span class=\"tx\"><span class=\"it\">Red onion<\/span><span class=\"am\">Buy: 1 · Recipe uses: 2 tbsp diced<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p6-4-nonfat-plain-greek-yogurt\"><span class=\"tx\"><span class=\"it\">Nonfat plain Greek yogurt<\/span><span class=\"am\">Buy: 1 tub (32 oz) · Recipe uses: 1/2 cup, for tzatziki<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p6-4-lemon\"><span class=\"tx\"><span class=\"it\">Lemon<\/span><span class=\"am\">Buy: 1 · Recipe uses: Juice for tzatziki and chicken<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p6-4-unsalted-sunflower-seeds\"><span class=\"tx\"><span class=\"it\">Unsalted sunflower seeds<\/span><span class=\"am\">Buy: 1 bag · Recipe uses: 1 tbsp<\/span><\/span><\/label><\/li><\/ul>\n<p><b>From the pantry:<\/b> jarred minced garlic, dried dill, dried oregano.<\/p>\n<h3 id=\"p6-5\">3. Southwest Chicken Burrito Bowl<\/h3>\n<ul class=\"check\"><li><label><input type=\"checkbox\" data-k=\"p6-5-white-chicken-pouches-2-6-oz-25-less-sod\"><span class=\"tx\"><span class=\"it\">White chicken pouches (2.6 oz), 25% less sodium<\/span><span class=\"am\">Buy: 3 pouches · Recipe uses: 3 pouches<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p6-5-microwave-brown-rice-cup\"><span class=\"tx\"><span class=\"it\">Microwave brown rice cup<\/span><span class=\"am\">Buy: 1 · Recipe uses: 1/3 cup<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p6-5-no-salt-added-black-beans\"><span class=\"tx\"><span class=\"it\">No-salt-added black beans<\/span><span class=\"am\">Buy: 1 can (15 oz) · Recipe uses: 1/2 cup<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p6-5-salad-greens\"><span class=\"tx\"><span class=\"it\">Salad greens<\/span><span class=\"am\">Buy: 1 bag (5 oz) · Recipe uses: 2 cups<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p6-5-red-bell-pepper-or-frozen-strips-\"><span class=\"tx\"><span class=\"it\">Red bell pepper (or frozen strips)<\/span><span class=\"am\">Buy: 1 · Recipe uses: 1/2 cup sliced<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p6-5-cherry-tomatoes\"><span class=\"tx\"><span class=\"it\">Cherry tomatoes<\/span><span class=\"am\">Buy: 1 pint · Recipe uses: 1/2 cup<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p6-5-salsa-lowest-sodium\"><span class=\"tx\"><span class=\"it\">Salsa, lowest sodium<\/span><span class=\"am\">Buy: 1 small jar · Recipe uses: 1/4 cup<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p6-5-nonfat-plain-greek-yogurt\"><span class=\"tx\"><span class=\"it\">Nonfat plain Greek yogurt<\/span><span class=\"am\">Buy: 1 tub (32 oz) · Recipe uses: 1/2 cup, for crema<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p6-5-lime\"><span class=\"tx\"><span class=\"it\">Lime<\/span><span class=\"am\">Buy: 1 · Recipe uses: Juice for crema<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p6-5-avocado\"><span class=\"tx\"><span class=\"it\">Avocado<\/span><span class=\"am\">Buy: 1 · Recipe uses: 1/4<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p6-5-pumpkin-seeds-pepitas-unsalted\"><span class=\"tx\"><span class=\"it\">Pumpkin seeds (pepitas), unsalted<\/span><span class=\"am\">Buy: 1 small bag · Recipe uses: 1 tbsp<\/span><\/span><\/label><\/li><\/ul>\n<p><b>From the pantry:<\/b> chipotle powder, cumin.<\/p>\n<h3 id=\"p6-6\">4. Baja Salmon and Mango Bowl<\/h3>\n<ul class=\"check\"><li><label><input type=\"checkbox\" data-k=\"p6-6-pink-salmon-in-water-pouches-2-6-oz-\"><span class=\"tx\"><span class=\"it\">Pink salmon in water, pouches (2.6 oz)<\/span><span class=\"am\">Buy: 3 pouches · Recipe uses: 3 pouches<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p6-6-microwave-brown-rice-cup\"><span class=\"tx\"><span class=\"it\">Microwave brown rice cup<\/span><span class=\"am\">Buy: 1 · Recipe uses: 1/3 cup<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p6-6-no-salt-added-black-beans\"><span class=\"tx\"><span class=\"it\">No-salt-added black beans<\/span><span class=\"am\">Buy: 1 can (15 oz) · Recipe uses: 1/2 cup<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p6-6-coleslaw-mix\"><span class=\"tx\"><span class=\"it\">Coleslaw mix<\/span><span class=\"am\">Buy: 1 bag (14 to 16 oz) · Recipe uses: 1 cup<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p6-6-mango-chunks-frozen-or-1-fresh-mango-\"><span class=\" =\"am\">Buy: 1 · Recipe uses: 3/4 cup<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p6-7-shelled-edamame-frozen\"><span class=\"tx\"><span class=\"it\">Shelled edamame, frozen<\/span><span class=\"am\">Buy: 1 bag (12 oz) · Recipe uses: 1/2 cup<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p6-7-coleslaw-mix\"><span class=\"tx\"><span class=\"it\">Coleslaw mix<\/span><span class=\"am\">Buy: 1 bag (14 to 16 oz) · Recipe uses: 1 cup<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p6-7-shredded-carrots\"><span class=\"tx\"><span class=\"it\">Shredded carrots<\/span><span class=\"am\">Buy: 1 bag (10 oz) · Recipe uses: 1/2 cup<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p6-7-cucumber\"><span class=\"tx\"><span class=\"it\">Cucumber<\/span><span class=\"am\">Buy: 1 · Recipe uses: 1/2 cup sliced<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p6-7-avocado\"><span class=\"tx\"><span class=\"it\">Avocado<\/span><span class=\"am\">Buy: 1 · Recipe uses: 1/4<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p6-7-low-sodium-soy-sauce\"><span class=\"tx\"><span class=\"it\">Low-sodium soy sauce<\/span><span class=\"am\">Buy: 1 bottle · Recipe uses: 2 tsp<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p6-7-rice-vinegar\"><span class=\"tx\"><span class=\"it\">Rice vinegar<\/span><span class=\"am\">Buy: 1 bottle · Recipe uses: 1 tbsp<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p6-7-honey\"><span class=\"tx\"><span class=\"it\">Honey<\/span><span class=\"am\">Buy: 1 bottle · Recipe uses: 1 tsp<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p6-7-ginger-paste\"><span class=\"tx\"><span class=\"it\">Ginger paste<\/span><span class=\"am\">Buy: 1 tube · Recipe uses: 1/2 tsp<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p6-7-sesame-seeds\"><span class=\"tx\"><span class=\"it\">Sesame seeds<\/span><span class=\"am\">Buy: 1 small jar · Recipe uses: 1 tsp<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p6-7-green-onions-optional-\"><span class=\"tx\"><span class=\"it\">Green onions (optional)<\/span><span class=\"am\">Buy: 1 bunch · Recipe uses: 1 sliced<\/span><\/span><\/label><\/li><\/ul>\n<h3 id=\"p6-8\">6. Thai Peanut Chicken Crunch Bowl<\/h3>\n<ul class=\"check\"><li><label><input type=\"checkbox\" data-k=\"p6-8-white-chicken-pouches-2-6-oz-25-less-sod\"><span class=\"tx\"><span class=\"it\">White chicken pouches (2.6 oz), 25% less sodium<\/span><span class=\"am\">Buy: 3 pouches · Recipe uses: 3 pouches<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p6-8-microwave-brown-rice-cup\"><span class=\"tx\"><span class=\"it\">Microwave brown rice cup<\/span><span class=\"am\">Buy: 1 · Recipe uses: 1/2 cup<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p6-8-shelled-edamame-frozen\"><span class=\"tx\"><span class=\"it\">Shelled edamame, frozen<\/span><span class=\"am\">Buy: 1 bag (12 oz) · Recipe uses: 1/2 cup<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p6-8-coleslaw-mix\"><span class=\"tx\"><span class=\"it\">Coleslaw mix<\/span><span class=\"am\">Buy: 1 bag (14 to 16 oz) · Recipe uses: 1 cup<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p6-8-red-bell-pepper-or-frozen-strips-\"><span class=\"tx\"><span class=\"it\">Red bell pepper (or frozen strips)<\/span><span class=\"am\">Buy: 1 · Recipe uses: 1/2 cup sliced<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p6-8-shredded-carrots\"><span class=\"tx\"><span class=\"it\">Shredded carrots<\/span><span class=\"am\">Buy: 1 bag (10 oz) · Recipe uses: 1/2 cup<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p6-8-cucumber\"><span class=\"tx\"><sp
