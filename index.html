">Pre-Workout Snack (1 snack each)<\/h2>\n<ul class=\"check\"><li><label><input type=\"checkbox\" data-k=\"p6-15-rice-cakes-and-honey\"><span class=\"tx\"><span class=\"it\">Rice cakes and honey<\/span><span class=\"am\">Buy: 1 sleeve plain unsalted rice cakes, 1 bottle honey · Each snack uses: 2 rice cakes + 1 tbsp honey<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p6-15-banana\"><span class=\"tx\"><span class=\"it\">Banana<\/span><span class=\"am\">Buy: 1 · Each snack uses: 1<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p6-15-unsalted-pretzels\"><span class=\"tx\"><span class=\"it\">Unsalted pretzels<\/span><span class=\"am\">Buy: 1 bag · Each snack uses: 1.25 oz<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p6-15-graham-crackers\"><span class=\"tx\"><span class=\"it\">Graham crackers<\/span><span class=\"am\">Buy: 1 box · Each snack uses: 3 sheets<\/span><\/span><\/label><\/li><\/ul>\n<h2 id=\"p6-16\">Boosters<\/h2>\n<ul class=\"check\"><li><label><input type=\"checkbox\" data-k=\"p6-16-low-sodium-tomato-juice-or-vegetable-jui\"><span class=\"tx\"><span class=\"it\">Low-sodium tomato juice or vegetable juice<\/span><span class=\"am\">Buy: 4 small cans or 1 bottle · Use: Lycopene booster with any bowl<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p6-16-unsalted-sunflower-seeds\"><span class=\"tx\"><span class=\"it\">Unsalted sunflower seeds<\/span><span class=\"am\">Buy: 1 bag · Use: Vitamin E booster: 1 tbsp on any bowl<\/span><\/span><\/label><\/li><\/ul>\n<h2 id=\"p6-17\">Pantry Staples (buy once)<\/h2>\n<ul class=\"check\"><li><label><input type=\"checkbox\" data-k=\"p6-17-jarred-minced-garlic\"><span class=\"tx\"><span class=\"it\">Jarred minced garlic<\/span><span class=\"am\">Buy: 1 jar · Used in: Bowls 2 and 8<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p6-17-dried-dill\"><span class=\"tx\"><span class=\"it\">Dried dill<\/span><span class=\"am\">Buy: 1 jar · Used in: Bowls 1 and 2<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p6-17-dried-oregano-or-basil\"><span class=\"tx\"><span class=\"it\">Dried oregano or basil<\/span><span class=\"am\">Buy: 1 jar · Used in: Bowls 2 and 8<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p6-17-chipotle-powder-and-cumin\"><span class=\"tx\"><span class=\"it\">Chipotle powder and cumin<\/span><span class=\"am\">Buy: 1 jar each · Used in: Bowl 3<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p6-17-chili-powder\"><span class=\"tx\"><span class=\"it\">Chili powder<\/span><span class=\"am\">Buy: 1 jar · Used in: Bowl 4<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p6-17-salt-free-jerk-seasoning\"><span class=\"tx\"><span class=\"it\">Salt-free jerk seasoning<\/span><span class=\"am\">Buy: 1 jar · Used in: Bowl 7<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p6-17-red-pepper-flakes\"><span class=\"tx\"><span class=\"it\">Red pepper flakes<\/span><span class=\"am\">Buy: 1 jar · Used in: Bowl 6<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p6-17-black-pepper\"><span class=\"tx\"><span class=\"it\">Black pepper<\/span><span class=\"am\">Buy: 1 jar · Used in: All bowls<\/span><\/span><\/label><\/li><\/ul>", "heads": [{"id": "p6-1", "t": "How to Use This List", "l": 2}, {"id": "p6-2", "t": "The Bowls (1 bowl each)", "l": 2}, {"id": "p6-3", "t": "1. Mediterranean Salmon Bowl", "l": 3}, {"id": "p6-4", "t": "2. Greek Chicken Gyro Bowl", "l": 3}, {"id": "p6-5", "t": "3. Southwest Chicken Burrito Bowl", "l": 3}, {"id": "p6-6", "t": "4. Baja Salmon and Mango Bowl", "l": 3}, {"id": "p6-7", "t": "5. Sesame Ginger Tuna Poke Bowl", "l": 3}, {"id": "p6-8", "t": "6. Thai Peanut Chicken Crunch Bowl", "l": 3}, {"id": "p6-9", "t": "7. Caribbean Jerk Chicken and Sweet Potato Bowl", "l": 3}, {"id": "p6-10", "t": "8. Mackerel, White Bean and Tomato Bowl", "l": 3}, {"id": "p6-11", "t": "No-Cook Breakfasts (1 serving each)", "l": 2}, {"id": "p6-12", "t": "Protein Overnight Oats", "l": 3}, {"id": "p6-13", "t": "Greek Yogurt Parfait", "l": 3}, {"id": "p6-14", "t": "Green Protein Smoothie", "l": 3}, {"id": "p6-15", "t": "Pre-Workout Snack (1 snack each)", "l": 2}, {"id": "p6-16", "t": "Boosters", "l": 2}, {"id": "p6-17", "t": "Pantry Staples (buy once)", "l": 2}]}, {"id": "p7", "kicker": "Plan 4 · Meal Plan", "title": "Quick and Easy 40-40-20 Recipes", "sub": "Best picks from your IEM recipe packet, clean eating recipes, menu food lists and dining out guide · adjusted for 2,100 calories, fiber and key nutrients · November 19, 2026", "kind": "plan", "html": "<h2 id=\"p7-1\">How This Document Works<\/h2>\n<p>These are the recipes from your four documents that are quick (about 25 minutes or less, or set-and-forget in a crockpot) and that fit your plan once portions are adjusted. Each one is rescaled to one meal of about 700 calories with roughly 40% protein, 40% carbs and 20% fat, plus 12 g or more of fiber.<\/p>\n<ul><li><b>What changed from the originals:<\/b> portions are sized for your 2,100-calorie day; beans, greens, berries and whole grains were added for fiber; whole eggs, avocado, nuts or olive oil were added where a meal needed its 15 to 20 g of fat; and seasoning packets, bouillon and regular canned tomato products were swapped for low-sodium versions.<\/li><li><b>No pork:<\/b> nothing here contains pork.<\/li><li><b>Ground turkey:<\/b> you find lean turkey dry, so the chili and Spanish rice use 95% lean ground beef. 93% lean ground turkey works too; skip the avocado if you use it.<\/li><li><b>Numbers<\/b> are estimates from standard USDA values and package labels. Check your labels.<\/li><li><b>Source:<\/b> adapted from the Institute of Eating Management recipe packet and Clean Eating Recipes (Keith Klein), the IEM menu food lists, and the dining out cheat sheet.<\/li><\/ul>\n<h2 id=\"p7-2\">Recipes at a Glance<\/h2>\n<div class=\"scroll\"><table class=\"\"><thead><tr><th>Meal<\/th><th>Recipe<\/th><th>Time<\/th><th>Cal<\/th><th>Protein (g)<\/th><th>Carbs (g)<\/th><th>Fat (g)<\/th><th>Fiber (g)<\/th><\/tr><\/thead><tbody><tr><td>Breakfast<\/td><td>Egg Whites with Potato and Salsa<\/td><td>12 min<\/td><td class=n>700<\/td><td class=n>70<\/td><td class=n>71<\/td><td class=n>15<\/td><td class=n>18<\/td><\/tr><tr><td>Breakfast<\/td><td>Egg White Breakfast Tacos<\/td><td>10 min<\/td><td class=n>694<\/td><td class=n>66<\/td><td class=n>71<\/td><td class=n>16<\/td><td class=n>18<\/td><\/tr><tr><td>Breakfast<\/td><td>Spinach Marinara Eggs with Toast<\/td><td>10 min<\/td><td class=n>720<\/td><td class=n>71<\/td><td class=n>73<\/td><td class=n>17<\/td><td class=n>17<\/td><\/tr><tr><td>Breakfast<\/td><td>Banana Oat Protein Pancake<\/td><td>10 min<\/td><td class=n>732<\/td><td class=n>75<\/td><td class=n>72<\/td><td class=n>17<\/td><td class=n>12<\/td><\/tr><tr><td>Breakfast<\/td><td>Overnight Yogurt Oats and Raisins<\/td><td>5 min, no cook<\/td><td class=n>710<\/td><td class=n>69<\/td><td class=n>72<\/td><td class=n>19<\/td><td class=n>12<\/td><\/tr><tr><td>Lunch<\/td><td>Salmon or Tuna Salad Sandwich<\/td><td>10 min, no cook<\/td><td class=n>714<\/td><td class=n>75<\/td><td class=n>72<\/td><td class=n>17<\/td><td class=n>16<\/td><\/tr><tr><td>Lunch<\/td><td>Walnut Chicken Salad<\/td><td>10 min, no cook<\/td><td class=n>715<\/td><td class=n>72<\/td><td class=n>65<\/td><td class=n>19<\/td><td class=n>12<\/td><\/tr><tr><td>Dinner<\/td><td>Chicken and Portobello Fajitas<\/td><td>20 min<\/td><td class=n>678<\/td><td class=n>70<\/td><td class=n>66<\/td><td class=n>16<\/td><td class=n>19<\/td><\/tr><tr><td>Dinner<\/td><td>Shrimp Jambalaya<\/td><td>25 min<\/td><td class=n>717<\/td><td class=n>72<\/td><td class=n>70<\/td><td class=n>18<\/td><td class=n>13<\/td><\/tr><tr><td>Dinner<\/td><td>Ginger Scallop Stir-Fry<\/td><td>15 min<\/td><td class=n>693<\/td><td class=n>70<\/td><td class=n>62<\/td><td class=n>20<\/td><td class=n>13<\/td><\/tr><tr><td>Dinner<\/td><td>Spicy Shrimp and Green Beans<\/td><td>15 min<\/td><td class=n>739<\/td><td class=n>74<\/td><td class=n>73<\/td><td class=n>20<\/td><td class=n>17<\/td><\/tr><tr><td>Dinner<\/td><td>Beef and Bean Chili<\/td><td>25 min<\/td><td class=n>714<\/td><td class=n>69<\/td><td class=n>70<\/td><td class=n>19<\/td><td class=n>23<\/td><\/tr><tr><td>Dinner<\/td><td>Chicken Vegetable Soup<\/td><td>25 min<\/td><td class=n>717<\/td><td class=n>71<\/td><td class=n>68<\/td><td class=n>18<\/td><td class=n>14<\/td><\/tr><tr><td>Dinner<\/td><td>Spanish Rice Skillet<\/td><td>20 min<\/td><td class=n>731<\/td><td class=n>69<\/td><td class=n>72<\/td><td class=n>18<\/td><td class=n>16<\/td><\/tr><tr><td>Crockpot<\/td><td>Chicken and Brown Rice Stew (5 portions)<\/td><td>10 min prep<\/td><td class=n>722<\/td><td class=n>68<\/td><td class=n>69<\/td><td class=n>21<\/td><td class=n>13<\/td><\/tr><\/tbody><\/table><\/div>\n<h2 id=\"p7-3\">Breakfasts<\/h2>\n<h3 id=\"p7-4\">Egg Whites with Potato and Salsa<\/h3>\n<div class=\"macro\">700 calories · 70 g protein · 71 g carbs · 15 g fat · 18 g fiber<\/div>\n<p><b>Nutrient highlights:<\/b> folate (beans, spinach), vitamin C (potato, salsa), selenium (eggs)<\/p>\n<ul><li>1 1/2 cups liquid egg whites + 2 whole eggs<\/li><li>1 medium russet potato (about 6 oz), skin on<\/li><li>1/2 cup no-salt-added black beans, rinsed<\/li><li>1/2 cup frozen spinach<\/li><li>1/4 cup chunky salsa, plus diced onion, mushrooms or jalapeños if you like<\/li><li>1/8 avocado, sliced<\/li><\/ul>\n<ol class=\"steps\"><li>Pierce the potato and microwave it 5 to 6 minutes until soft. Mash it on the plate with a fork.<\/li><li>Scramble the egg whites, eggs, spinach, beans and vegetables in a nonstick pan with cooking spray.<\/li><li>Pile the eggs on the potato and top with salsa and avocado.<\/li><\/ol>\n<h3 id=\"p7-5\">Egg White Breakfast Tacos<\/h3>\n<div class=\"macro\">694 calories · 66 g protein · 71 g carbs · 16 g fat · 18 g fiber<\/div>\n<p><b>Nutrient highlights:<\/b> folate (beans, avocado), vitamin C (red pepper, salsa)<\/p>\n<ul><li>1 1/2 cups liquid egg whites + 1 whole egg<\/li><li>1/2 cup no-salt-added black beans, rinsed<\/li><li>1/2 cup diced red bell pepper<\/li><li>1/4 cup chunky salsa<\/li><li>3 corn tortillas, warmed<\/li><li>1/4 avocado and 1/4 cup nonfat plain Greek yogurt (as sour cream)<\/li><\/ul>\n<ol class=\"steps\"><li>Scramble the eggs with the beans and pepper in a nonstick pan with cooking spray.<\/li><li>Spoon into warm tortillas and top with salsa, avocado and yogurt.<\/li><\/ol>\n<h3 id=\"p7-6\">Spinach Marinara Eggs with Toast<\/h3>\n<div class=\"macro\">720 calories · 71 g protein · 73 g carbs · 17 g fat · 17 g fiber<\/div>\n<p><b>Nutrient highlights:<\/b> lycopene (marinara), folate and vitamin E (spinach), vitamin C (berries)<\/p>\n<ul><li>1 1/2 cups liquid egg whites + 2 whole eggs<\/li><li>1 cup frozen spinach<\/li><li>1/2 cup low-sodium marinara sauce, warmed<\/li><li>2 slices whole wheat toast with 1 tbsp low-sugar jam<\/li><li>1 cup strawberries or mixed berries on the side<\/li><\/ul>\n<ol class=\"steps\"><li>Scramble the egg whites, eggs and spinach in a nonstick pan with cooking spray.<\/li><li>Top with the warm marinara. Serve with toast and berries.<\/li><\/ol>\n<h3 id=\"p7-7\">Banana Oat Protein Pancake<\/h3>\n<div class=\"macro\">732 calories · 75 g protein · 72 g carbs · 17 g fat · 12 g fiber<\/div>\n<p><b>Nutrient highlights:<\/b> omega-3 ALA (flaxseed), zinc (oats), vitamin C (berries)<\/p>\n<ul><li>1 cup liquid egg whites<\/li><li>1 scoop whey protein (about 24 g protein)<\/li><li>2/3 cup rolled oats<\/li><li>1/2 banana<\/li><li>1 tbsp ground flaxseed, cinnamon, optional sweetener<\/li><li>Toppings: 1/2 cup nonfat plain Greek yogurt, 1/2 cup berries, 1 tbsp natural peanut butter<\/li><\/ul>\n<ol class=\"steps\"><li>Blend the egg whites, whey, oats, banana, flaxseed and cinnamon until smooth.<\/li><li>Pour into a covered nonstick pan sprayed with cooking spray. Cook 4 to 5 minutes on medium-low, flip, and cook 1 to 2 minutes more.<\/li><li>Top with yogurt, berries and peanut butter.<\/li><\/ol>\n<h3 id=\"p7-8\">Overnight Yogurt Oats and Raisins<\/h3>\n<div class=\"macro\">710 calories · 69 g protein · 72 g carbs · 19 g fat · 12 g fiber<\/div>\n<p><b>Nutrient highlights:<\/b> omega-3 ALA (chia, walnuts), zinc and selenium (oats, yogurt)<\/p>\n<ul><li>1 1/2 cups nonfat plain Greek yogurt<\/li><li>1/2 cup rolled oats<\/li><li>1 scoop whey protein<\/li><li>2 tbsp raisins and 1/2 cup berries<\/li><li>1 tbsp chia seeds and 1/2 oz walnuts (about 7 halves)<\/li><li>Vanilla and cinnamon; splash of water to thin<\/li><\/ul>\n<ol class=\"steps\"><li>Stir everything except the walnuts together in a jar. Refrigerate overnight.<\/li><li>Top with walnuts in the morning.<\/li><\/ol>\n<h2 id=\"p7-9\">Lunches<\/h2>\n<h3 id=\"p7-10\">Salmon or Tuna Salad Sandwich<\/h3>\n<div class=\"macro\">714 calories · 75 g protein · 72 g carbs · 17 g fat · 16 g fiber (made with tuna; salmon is about the same)<\/div>\n<p><b>Nutrient highlights:<\/b> omega-3 EPA and DHA (salmon version, about 0.9 g), selenium (fish, whole wheat), vitamin E (avocado, sunflower seeds)<\/p>\n<ul><li>3 pouches (2.6 oz) pink salmon or light tuna in water<\/li><li>3 tbsp nonfat plain Greek yogurt, 1 tsp Dijon mustard, 1 tbsp dill relish<\/li><li>2 hard-boiled egg whites, chopped<\/li><li>1/4 avocado, mashed into the salad<\/li><li>2 slices whole wheat bread, lettuce and tomato<\/li><li>1 tbsp unsalted sunflower seeds mixed in for crunch<\/li><li>Sides: 1 apple and 1 cup baby carrots<\/li><\/ul>\n<ol class=\"steps\"><li>Mix the fish, yogurt, mustard, relish, egg whites, avocado and sunflower seeds.<\/li><li>Build the sandwich with lettuce and tomato. Eat with the apple and carrots.<\/li><\/ol>\n<p><b>Tip:<\/b> Use salmon at least twice a week for omega-3s. Your IEM menu limits tuna to twice a week.<\/p>\n<h3 id=\"p7-11\">Walnut Chicken Salad<\/h3>\n<div class=\"macro\">715 calories · 72 g protein · 65 g carbs · 19 g fat · 12 g fiber<\/div>\n<p><b>Nutrient highlights:<\/b> omega-3 ALA (walnuts), vitamin C (red pepper), folate (spinach)<\/p>\n<ul><li>6 oz cooked chicken breast, chopped (rotisserie breast meat or 4 to 5 chicken pouches)<\/li><li>1/2 oz walnuts, chopped, and 2 tbsp chopped scallions<\/li><li>1/4 cup nonfat plain Greek yogurt, 2 tsp Dijon mustard, 2 tbsp lemon juice, black pepper<\/li><li>1 cup chopped red bell pepper<\/li><li>2 cups baby spinach<\/li><li>2 slices whole wheat toast and 1 apple<\/li><\/ul>\n<ol class=\"steps\"><li>Stir the walnuts, scallions, yogurt, mustard, lemon and pepper together, then fold in the chicken and bell pepper.<\/li><li>Serve over spinach with toast and an apple. Or stuff it into a hollowed-out bell pepper or tomato.<\/li><\/ol>\n<h2 id=\"p7-12\">Dinners<\/h2>\n<h3 id=\"p7-13\">Chicken and Portobello Fajitas<\/h3>\n<div class=\"macro\">678 calories · 70 g protein · 66 g carbs · 16 g fat · 19 g fiber<\/div>\n<p><b>Nutrient highlights:<\/b> vitamin C (peppers), folate (beans, avocado), selenium (chicken, mushroom)<\/p>\n<ul><li>5.5 oz cooked chicken breast or thighs, sliced (about 7 oz raw)<\/li><li>1 large portobello cap, sliced<\/li><li>1 cup sliced bell pepper and 1/2 cup sliced onion<\/li><li>Balsamic vinegar, rosemary and salt-free Cajun seasoning<\/li><li>2 corn tortillas<\/li><li>1/2 cup no-salt-added black beans, warmed<\/li><li>1/4 cup pico de gallo, 1/4 avocado, 1/4 cup nonfat plain Greek yogurt<\/li><\/ul>\n<ol class=\"steps\"><li>Toss the chicken and portobello in balsamic vinegar and seasoning. Grill or cook in a hot nonstick skillet with cooking spray, 5 to 7 minutes per side for chicken.<\/li><li>Cook the peppers and onion in the same pan until soft.<\/li><li>Fill the tortillas and serve with beans, pico, avocado and yogurt.<\/li><\/ol>\n<p><b>Swap:<\/b> Use 7 oz cooked shrimp instead of chicken.<\/p>\n<h3 id=\"p7-14\">Shrimp Jambalaya<\/h3>\n<div class=\"macro\">717 calories · 72 g protein · 70 g carbs · 18 g fat · 13 g fiber<\/div>\n<p><b>Nutrient highlights:<\/b> lycopene (stewed tomatoes), selenium (shrimp), folate (red beans)<\/p>\n<ul><li>6 oz cooked shrimp (about 8 oz raw, peeled) and 2 oz cooked chicken breast<\/li><li>1/2 cup cooked brown rice (microwave cup works)<\/li><li>1 cup no-salt-added stewed tomatoes<\/li><li>1/2 cup no-salt-added kidney beans, rinsed<\/li><li>1/2 cup chopped onion, 1/2 cup chopped green pepper, 1 clove garlic<\/li><li>1 tbsp olive oil<\/li><li>Bay leaf, thyme, basil, cayenne, black pepper<\/li><\/ul>\n<ol class=\"steps\"><li>Cook the onion, pepper and garlic in the olive oil for 3 to 4 minutes.<\/li><li>Add tomatoes, beans, seasonings and raw shrimp. Simmer 5 to 7 minutes until the shrimp turn pink.<\/li><li>Stir in the rice and chicken and heat through.<\/li><\/ol>\n<p><b>Batch it:<\/b> Multiply by 4 and portion into containers; keeps 3 days in the fridge.<\/p>\n<h3 id=\"p7-15\">Ginger Scallop Stir-Fry<\/h3>\n<div class=\"macro\">693 calories · 70 g protein · 62 g carbs · 20 g fat · 13 g fiber<\/div>\n<p><b>Nutrient highlights:<\/b> zinc and selenium (scallops), folate and ALA (edamame), vitamin C (red pepper)<\/p>\n<ul><li>8 oz cooked scallops (about 10 oz raw), or shrimp<\/li><li>1 cup shelled edamame<\/li><li>1 cup sliced red bell pepper and 1/2 cup chopped tomato<\/li><li>1/2 cup cooked brown rice<\/li><li>Sauce: 1 tbsp low-sodium soy sauce, 1 tbsp lemon or lime juice, 1/2 tsp ground ginger, pinch of dry mustard<\/li><li>2 tsp toasted sesame oil<\/li><\/ul>\n<ol class=\"steps\"><li>Whisk the sauce. Skip the long marinade; 10 minutes is plenty.<\/li><li>Heat the sesame oil and stir-fry the peppers and edamame 3 minutes. Add the scallops and sauce and cook 2 to 3 minutes per side until opaque.<\/li><li>Add the tomato and serve over rice.<\/li><\/ol>\n<h3 id=\"p7-16\">Spicy Shrimp and Green Beans<\/h3>\n<div class=\"macro\">739 calories · 74 g protein · 73 g carbs · 20 g fat · 17 g fiber<\/div>\n<p><b>Nutrient highlights:<\/b> selenium (shrimp), folate (edamame), vitamin C (green beans)<\/p>\n<ul><li>7 oz cooked shrimp (about 9 oz raw, peeled)<\/li><li>1 1/2 cups frozen cut green beans and 1 cup shelled edamame<\/li><li>1/2 cup chopped onion, 1 clove garlic, 1 tsp grated ginger<\/li><li>3/4 cup cooked brown rice<\/li><li>2 tsp olive oil<\/li><li>Coriander, ground red pepper, bay leaf, 1 tbsp vinegar<\/li><\/ul>\n<ol class=\"steps\"><li>Cook the onion, garlic, ginger and spices in the oil for 4 to 5 minutes.<\/li><li>Add the green beans, edamame and a splash of water; cook 3 minutes.<\/li><li>Add the shrimp and vinegar and cook until the shrimp are pink. Serve over rice.<\/li><\/ol>\n<p><b>Swap:<\/b> Use chicken breast or scallops instead of shrimp.<\/p>\n<h3 id=\"p7-17\">Beef and Bean Chili<\/h3>\n<div class=\"macro\">714 calories · 69 g protein · 70 g carbs · 19 g fat · 23 g fiber<\/div>\n<p><b>Nutrient highlights:<\/b> zinc (beef), lycopene (tomato sauce), folate (kidney beans); the highest-fiber meal here<\/p>\n<ul><li>7 oz raw 95% lean ground beef (or 93% lean ground turkey; then skip the avocado)<\/li><li>1 cup no-salt-added kidney beans, rinsed<\/li><li>1 cup no-salt-added tomato sauce and 1/2 cup low-sodium broth<\/li><li>1 cup chopped onion, celery and carrots (frozen soup-vegetable mix works)<\/li><li>1 tbsp chili powder, cumin, jalapeños if you like<\/li><li>Toppings: 1/4 cup nonfat plain Greek yogurt, 1/4 avocado<\/li><\/ul>\n<ol class=\"steps\"><li>Brown the beef, breaking it into small pieces.<\/li><li>Add the vegetables, beans, tomato sauce, broth and spices. Simmer 15 minutes.<\/li><li>Top with yogurt and avocado.<\/li><\/ol>\n<p><b>Batch it:<\/b> Multiply by 4; chili freezes well.<\/p>\n<h3 id=\"p7-18\">Chicken Vegetable Soup<\/h3>\n<div class=\"macro\">717 calories · 71 g protein · 68 g carbs · 18 g fat · 14 g fiber<\/div>\n<p><b>Nutrient highlights:<\/b> lycopene (tomatoes), folate (white beans, spinach), selenium (chicken)<\/p>\n<ul><li>6 oz cooked chicken breast or thighs, chopped<\/li><li>2 cups low-sodium chicken broth (replaces the bouillon granules)<\/li><li>1 cup no-salt-added diced tomatoes<\/li><li>1 cup sliced carrots, onion and green pepper<\/li><li>1/2 cup no-salt-added white beans, rinsed<\/li><li>1/2 cup cooked brown rice<\/li><li>1 cup baby spinach<\/li><li>2 tsp olive oil, thyme, sage, black pepper<\/li><\/ul>\n<ol class=\"steps\"><li>Simmer the broth, tomatoes, vegetables, beans and herbs for 15 minutes.<\/li><li>Stir in the chicken, rice, spinach and olive oil and heat 5 minutes.<\/li><\/ol>\n<h3 id=\"p7-19\">Spanish Rice Skillet<\/h3>\n<div class=\"macro\">731 calories · 69 g protein · 72 g carbs · 18 g fat · 16 g fiber<\/div>\n<p><b>Nutrient highlights:<\/b> zinc (beef), lycopene (tomato sauce), folate (black beans), vitamin C (peppers)<\/p>\n<ul><li>8 oz raw 95% lean ground beef<\/li><li>1 cup no-salt-added tomato sauce<\/li><li>1 cup diced red onion, celery and red and yellow bell pepper<\/li><li>1/2 cup cooked brown rice and 1/2 cup no-salt-added black beans<\/li><li>1 tsp olive oil, minced garlic, tarragon, black pepper (skip the garlic salt)<\/li><li>1/4 cup nonfat plain Greek yogurt on top<\/li><\/ul>\n<ol class=\"steps\"><li>Brown the beef in the oil.<\/li><li>Add the vegetables, tomato sauce and seasonings and simmer 8 to 10 minutes.<\/li><li>Stir in the rice and beans, heat through, and top with yogurt.<\/li><\/ol>\n<h2 id=\"p7-20\">Crockpot<\/h2>\n<p class=\"lead\"><b>Faster cooking options<\/b><\/p>\n<p>Every crockpot recipe below has its standard steps first, then faster methods, each listed separately. Recipes that already cook on HIGH list only the Instant Pot and stovetop versions.<\/p>\n<table class=\"stack\"><thead><tr><th>Method<\/th><th>Typical time<\/th><th>Best for<\/th><\/tr><\/thead><tbody><tr><td>Crockpot, all on HIGH<\/td><td>About half to two-thirds of the LOW time<\/td><td>Same pot and steps, just sooner<\/td><\/tr><tr><td>Instant Pot (6-quart)<\/td><td>About 25 minutes to 2 1/2 hours, including time to come to pressure<\/td><td>The fastest hands-off option<\/td><\/tr><tr><td>Stovetop Dutch oven<\/td><td>About 30 minutes to 3 1/2 hours<\/td><td>No special equipment<\/td><\/tr><\/tbody><\/table>\n<ul><li><b>Instant Pot liquid:<\/b> pressure cookers lose almost no liquid, so some recipes use less broth. Use the amount listed in the Instant Pot steps.<\/li><li><b>Avoid the \"burn\" warning:<\/b> put thin liquid on the bottom and spoon tomatoes, tomato paste or salsa on top without stirring. Add cornstarch, yogurt and milk only after pressure cooking.<\/li><li><b>Do not fill past the 2/3 line<\/b> in an Instant Pot. A doubled batch will not fit.<\/li><li><b>Time to pressure:<\/b> the Instant Pot times include about 10 to 15 minutes to come to pressure.<\/li><li><b>Frozen meat:<\/b> thaw it first for the crockpot. In the Instant Pot, frozen boneless chicken needs about 5 more minutes under pressure.<\/li><li><b>Always check doneness:<\/b> chicken 165°F, beef and lamb fork-tender, fish 145°F, shrimp pink.<\/li><\/ul>\n<h3 id=\"p7-21\">Chicken and Brown Rice Stew (5 portions)<\/h3>\n<div class=\"macro\">Per portion: 722 calories · 68 g protein · 69 g carbs · 21 g fat · 13 g fiber<\/div>\n<p><b>Nutrient highlights:<\/b> folate (beans, peas, spinach), selenium and zinc (chicken thighs)<\/p>\n<ul><li>3 lb boneless skinless chicken thighs, whole<\/li><li>1 1/4 cups uncooked brown rice<\/li><li>1 lb baby carrots<\/li><li>1 can (15 oz) no-salt-added white beans, rinsed<\/li><li>2 cups frozen peas and 1 box or bag (10 oz) frozen chopped spinach<\/li><li>1 cup frozen diced onion, 2 cloves garlic<\/li><li>6 cups low-sodium chicken broth (replaces the soup mix and regular broth)<\/li><li>Thyme, rosemary, black pepper<\/li><\/ul>\n<p class=\"lead\"><b>Standard: crockpot on LOW (about 7 to 8 hours, overnight)<\/b><\/p>\n<ol class=\"steps\"><li>Put everything except the peas and spinach in the crockpot.<\/li><li>Cook on LOW overnight (7 to 8 hours) or HIGH 4 to 5 hours.<\/li><li>Shred the chicken in the pot, stir in the peas and spinach, and cook 15 minutes more. Divide into 5 containers.<\/li><\/ol>\n<p class=\"lead\"><b>Faster: crockpot, all on HIGH (about 4 to 5 hours)<\/b><\/p>\n<ol class=\"steps\"><li>Put everything except the peas and spinach in the crockpot.<\/li><li>Cook on HIGH 4 to 5 hours.<\/li><li>Shred the chicken, stir in the peas and spinach, and cook 15 minutes more.<\/li><\/ol>\n<p class=\"lead\"><b>Fastest: Instant Pot (about 50 minutes)<\/b><\/p>\n<ol class=\"steps\"><li>Add 4 cups of the broth (to stay under the fill line), the rice, carrots, beans, onion, garlic and herbs. Lay the thighs on top.<\/li><li>Pressure cook on HIGH 22 minutes, then let the pressure release naturally for 10 minutes.<\/li><li>Shred the chicken. Stir in the peas, spinach and the last 2 cups of broth on Sauté for 3 to 4 minutes.<\/li><\/ol>\n<p class=\"lead\"><b>Fast: stovetop soup pot (about 1 hour)<\/b><\/p>\n<ol class=\"steps\"><li>Bring the broth, carrots, beans, onion, garlic and herbs to a boil. Stir in the rice and add the thighs.<\/li><li>Cover and simmer on low 40 to 45 minutes, until the rice is tender and the chicken reaches 165°F.<\/li><li>Shred the chicken and stir in the peas and spinach for the last 5 minutes.<\/li><\/ol>\n<h2 id=\"p7-22\">Sample Week<\/h2>\n<table class=\"stack\"><thead><tr><th>Day<\/th><th>Breakfast<\/th><th>Lunch<\/th><th>Dinner<\/th><\/tr><\/thead><tbody><tr><td>Mon<\/td><td>Egg Whites with Potato and Salsa<\/td><td>Salmon Salad Sandwich<\/td><td>Beef and Bean Chili<\/td><\/tr><tr><td>Tue<\/td><td>Overnight Yogurt Oats<\/td><td>Walnut Chicken Salad<\/td><td>Chicken and Portobello Fajitas<\/td><\/tr><tr><td>Wed<\/td><td>Spinach Marinara Eggs<\/td><td>Chicken and Brown Rice Stew<\/td><td>Ginger Scallop Stir-Fry<\/td><\/tr><tr><td>Thu<\/td><td>Egg White Breakfast Tacos<\/td><td>Chicken and Brown Rice Stew<\/td><td>Shrimp Jambalaya<\/td><\/tr><tr><td>Fri<\/td><td>Banana Oat Protein Pancake<\/td><td>Salmon Salad Sandwich<\/td><td>Chicken Vegetable Soup<\/td><\/tr><tr><td>Sat<\/td><td>Egg Whites with Potato and Salsa<\/td><td>Chicken and Brown Rice Stew<\/td><td>Spanish Rice Skillet<\/td><\/tr><tr><td>Sun<\/td><td>Overnight Yogurt Oats<\/td><td>Walnut Chicken Salad<\/td><td>Spicy Shrimp and Green Beans<\/td><\/tr><\/tbody><\/table>\n<p>Each day lands near 2,100 to 2,200 calories, 210 g protein, 210 g carbs, 50 to 60 g fat and 40 g or more of fiber. Freeze the 2 extra stew portions for the next week. Add your pre-workout snack on training days.<\/p>\n<h2 id=\"p7-23\">Key Nutrients Across These Recipes<\/h2>\n<table class=\"stack\"><thead><tr><th>Nutrient<\/th><th>Daily target (men)<\/th><th>Where it comes from here<\/th><\/tr><\/thead><tbody><tr><td>Zinc<\/td><td>11 mg<\/td><td>Beef chili and Spanish rice, scallops, chicken thighs, oats, eggs, beans<\/td><\/tr><tr><td>Selenium<\/td><td>55 mcg<\/td><td>Salmon, tuna, shrimp, scallops, eggs, chicken, whole wheat bread, oats<\/td><\/tr><tr><td>Folate<\/td><td>400 mcg<\/td><td>Beans in most recipes, edamame, spinach, peas, avocado<\/td><\/tr><tr><td>Vitamin C<\/td><td>90 mg<\/td><td>Bell peppers, berries, potatoes, tomatoes, salsa, green beans<\/td><\/tr><tr><td>Vitamin E<\/td><td>15 mg<\/td><td>Sunflower seeds, walnuts, peanut butter, avocado, spinach; add the sunflower seed booster on most days<\/td><\/tr><tr><td>Lycopene<\/td><td>No official target<\/td><td>Marinara, stewed tomatoes, tomato sauce, diced tomatoes, salsa<\/td><\/tr><tr><td>Omega-3 EPA and DHA<\/td><td>1 to 2 fish meals a week<\/td><td>Salmon Salad Sandwich twice a week; shrimp and scallops add a little<\/td><\/tr><tr><td>Omega-3 ALA<\/td><td>1.6 g<\/td><td>Ground flaxseed, chia, walnuts, edamame<\/td><\/tr><tr><td>L-arginine and amino acids<\/td><td>No official target<\/td><td>66 to 75 g of protein per meal from eggs, fish, shellfish, chicken and beef, plus beans and nuts<\/td><\/tr><\/tbody><\/table>\n<p><b>Supplement notes:<\/b> Food covers most of these. Talk with your doctor before adding fish oil (especially if you take blood thinners), vitamin E, zinc, selenium or L-arginine supplements. Keep zinc under 40 mg and selenium under 400 mcg a day from all sources, and skip Brazil nuts as a daily habit.<\/p>\n<h2 id=\"p7-24\">Eating Out: 40-40-20 Restaurant Guide<\/h2>\n<p><b>The plate formula:<\/b> 6 to 7 oz cooked lean protein (about the size of 1 1/2 palms) + 1 to 1 1/4 cups starch + at least 2 cups vegetables + 1 small fat (1/4 avocado, a few nuts or 1 tsp oil). That lands near 700 calories and 40-40-20.<\/p>\n<table class=\"stack\"><thead><tr><th>Cuisine<\/th><th>Order this<\/th><th>40-40-20 adjustment<\/th><\/tr><\/thead><tbody><tr><td>Breakfast<\/td><td>Egg white omelet cooked with spray, no oil or butter, loaded with vegetables; 2 slices dry whole wheat toast with jam<\/td><td>Ask for 1 to 2 whole eggs mixed in for fat; add a side of fruit for carbs<\/td><\/tr><tr><td>Chinese<\/td><td>Steamed chicken, shrimp or scallops (or a mix) with steamed vegetables and steamed rice<\/td><td>Ask for brown rice if available; use lite soy sauce sparingly, it is high in sodium; ginger and chili flakes are free flavor<\/td><\/tr><tr><td>Continental<\/td><td>Grilled fish or chicken breast cooked with seasoning, no butter or sauce, topped with onions, tomatoes and steamed spinach<\/td><td>Add a baked potato or a side of rice; ask for olive oil on the side, 1 tsp<\/td><\/tr><tr><td>Italian<\/td><td>Grilled snapper or chicken breast with steamed spinach and garlic, tomato sauce on the side, steamed asparagus<\/td><td>Add 1 cup whole wheat pasta or a small potato; tomato sauce adds lycopene<\/td><\/tr><tr><td>Mexican<\/td><td>Grilled chicken or shrimp fajitas without oil or butter in corn tortillas with onions, pico de gallo and salsa<\/td><td>Ask for black beans on the side (fiber, folate) and a little guacamole for fat<\/td><\/tr><tr><td>Seafood<\/td><td>Blackened-style fish grilled without butter, topped with pico de gallo; plain baked potato with salsa or mustard; steamed vegetables. Ceviche or shrimp cocktail also work<\/td><td>Choose salmon when you can for omega-3s<\/td><\/tr><tr><td>Sushi<\/td><td>Sashimi, shrimp, California or cucumber rolls without mayo; tuna, salmon, scallops or flounder<\/td><td>Add edamame for protein and fiber; go light on soy sauce<\/td><\/tr><\/tbody><\/table>\n<h2 id=\"p7-25\">Food Lists from Your IEM Menu<\/h2>\n<p>These are the portion lists from your IEM menu with approximate carbs added so you can swap starches and still hit about 70 g carbs per meal. Starch amounts are cooked. Carb values are estimates from standard USDA data.<\/p>\n<table class=\"stack\"><thead><tr><th>Starch (one portion)<\/th><th>Approx. carbs (g)<\/th><\/tr><\/thead><tbody><tr><td>Rice, 1 cup (brown is higher in fiber)<\/td><td>45 to 52<\/td><\/tr><tr><td>Quinoa, 1 cup<\/td><td class=n>39<\/td><\/tr><tr><td>Beans or lentils, 1 cup<\/td><td class=n>40<\/td><\/tr><tr><td>Black-eyed peas, 1 cup<\/td><td class=n>36<\/td><\/tr><tr><td>Barley, 1 cup<\/td><td class=n>44<\/td><\/tr><tr><td>Couscous, 1 cup<\/td><td class=n>36<\/td><\/tr><tr><td>Corn, 1 cup<\/td><td class=n>31<\/td><\/tr><tr><td>Peas, 1 cup<\/td><td class=n>25<\/td><\/tr><tr><td>Potato or yam, 8 oz<\/td><td>47 to 48<\/td><\/tr><tr><td>Pasta, 1 1/2 cups (whole wheat preferred)<\/td><td class=n>56<\/td><\/tr><tr><td>Corn tortillas, 4<\/td><td class=n>46<\/td><\/tr><tr><td>Butternut squash, 2 cups<\/td><td class=n>43<\/td><\/tr><tr><td>Acorn squash, 2 cups<\/td><td class=n>60<\/td><\/tr><tr><td>Rice cakes, 5<\/td><td class=n>37<\/td><\/tr><\/tbody><\/table>\n<ul><li><b>Proteins from the list that fit best:<\/b> chicken breast, fish (snapper, tilapia, grouper, mahi mahi, cod, halibut, flounder, sea bass), shrimp, scallops, crab, lobster, crawfish, clams, egg whites, nonfat plain Greek yogurt and fat-free cottage cheese. Your IEM menu limits tuna to twice a week and other meats to 1 or 2 meals a week; your home plan includes chicken thighs, beef and lamb on purpose for zinc and taste, so follow whichever your coach has set for you.<\/li><li><b>Vegetables:<\/b> any from the list, as much as you like. Spinach, broccoli, Brussels sprouts, asparagus, peppers and tomato do the most for folate, vitamin C and lycopene.<\/li><li><b>Fats:<\/b> each portion on the list is small (5 to 6 nuts, 1/8 avocado, 2 tsp chia or flaxseed, 1 tsp oil, 1 to 2 tsp nut butter). The IEM menu allows 2 a day; your 2,100-calorie plan has room for about 3 to 4 a day on top of the fat in your proteins.<\/li><li><b>Fruit:<\/b> up to 2 fist-sized portions a day. Berries count toward both fiber and vitamin C.<\/li><\/ul>\n<h2 id=\"p7-26\">Left Out and Why<\/h2>\n<table class=\"stack\"><thead><tr><th>Recipe<\/th><th>Reason<\/th><\/tr><\/thead><tbody><tr><td>Protein muffins (chocolate, banana nut, pumpkin, carrot)<\/td><td>30 to 50 minutes of baking; not quick<\/td><\/tr><tr><td>Turkey meatloaf, eggplant lasagna, enchiladas, oven-fried fish, spicy chicken, chicken tenders, cherry tomato meatballs<\/td><td>Oven time of 25 minutes to 1 hour, plus marinating for some<\/td><\/tr><tr><td>Gumbo, turkey casserole<\/td><td>Roux and gravy mix and turkey sausage make them very high in sodium<\/td><\/tr><tr><td>Paella<\/td><td>Uses ham bouillon (pork)<\/td><\/tr><tr><td>Moo shu chicken<\/td><td>Hoisin sauce, sugar and cooking oil push sodium, sugar and fat too high<\/td><\/tr><tr><td>Turkey burgers, turkey lettuce wraps<\/td><td>Only fit with extra-lean turkey breast, which you find dry<\/td><\/tr><tr><td>Crab cakes and crab salad<\/td><td>Imitation crab adds sodium and starch; real crab is a pricey swap<\/td><\/tr><tr><td>Chicken Caesar salad<\/td><td>Fat-free Caesar dressing is high in sodium<\/td><\/tr><tr><td>Protein puddings and shake variations<\/td><td>Sugar-free pudding mixes add little fiber or nutrients; fine as an occasional treat<\/td><\/tr><tr><td>Turkey stew (crockpot)<\/td><td>Very close to the beef pot roast already in your home plan<\/td><\/tr><\/tbody><\/table>", "heads": [{"id": "p7-1", "t": "How This Document Works", "l": 2}, {"id": "p7-2", "t": "Recipes at a Glance", "l": 2}, {"id": "p7-3", "t": "Breakfasts", "l": 2}, {"id": "p7-4", "t": "Egg Whites with Potato and Salsa", "l": 3}, {"id": "p7-5", "t": "Egg White Breakfast Tacos", "l": 3}, {"id": "p7-6", "t": "Spinach Marinara Eggs with Toast", "l": 3}, {"id": "p7-7", "t": "Banana Oat Protein Pancake", "l": 3}, {"id": "p7-8", "t": "Overnight Yogurt Oats and Raisins", "l": 3}, {"id": "p7-9", "t": "Lunches", "l": 2}, {"id": "p7-10", "t": "Salmon or Tuna Salad Sandwich", "l": 3}, {"id": "p7-11", "t": "Walnut Chicken Salad", "l": 3}, {"id": "p7-12", "t": "Dinners", "l": 2}, {"id": "p7-13", "t": "Chicken and Portobello Fajitas", "l": 3}, {"id": "p7-14", "t": "Shrimp Jambalaya", "l": 3}, {"id": "p7-15", "t": "Ginger Scallop Stir-Fry", "l": 3}, {"id": "p7-16", "t": "Spicy Shrimp and Green Beans", "l": 3}, {"id": "p7-17", "t": "Beef and Bean Chili", "l": 3}, {"id": "p7-18", "t": "Chicken Vegetable Soup", "l": 3}, {"id": "p7-19", "t": "Spanish Rice Skillet", "l": 3}, {"id": "p7-20", "t": "Crockpot", "l": 2}, {"id": "p7-21", "t": "Chicken and Brown Rice Stew (5 portions)", "l": 3}, {"id": "p7-22", "t": "Sample Week", "l": 2}, {"id": "p7-23", "t": "Key Nutrients Across These Recipes", "l": 2}, {"id": "p7-24", "t": "Eating Out: 40-40-20 Restaurant Guide", "l": 2}, {"id": "p7-25", "t": "Food Lists from Your IEM Menu", "l": 2}, {"id": "p7-26", "t": "Left Out and Why", "l": 2}]}, {"id": "p8", "kicker": "Plan 4 · Grocery List", "title": "Quick and Easy 40-40-20 Recipes Grocery List", "sub": "One list per recipe · 1 serving each except the crockpot stew · November 20, 2026", "kind": "grocery", "html": "<h2 id=\"p8-1\">How to Use This List<\/h2>\n<ul><li><b>Shop by meal.<\/b> Each recipe has its own complete list. Recipes ><label><input type=\"checkbox\" data-k=\"p8-21-cinnamon-and-vanilla\"><span class=\"tx\"><span class=\"it\">Cinnamon and vanilla<\/span><span class=\"am\">Buy: 1 each · Used in: Pancake, overnight oats<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p8-21-bay-leaves\"><span class=\"tx\"><span class=\"it\">Bay leaves<\/span><span class=\"am\">Buy: 1 jar · Used in: Jambalaya, spicy shrimp<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p8-21-vinegar-white-or-cider-\"><span class=\"tx\"><span class=\"it\">Vinegar (white or cider)<\/span><span class=\"am\">Buy: 1 bottle · Used in: Spicy shrimp<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p8-21-black-pepper\"><span class=\"tx\"><span class=\"it\">Black pepper<\/span><span class=\"am\">Buy: 1 jar · Used in: Most recipes<\/span><\/span><\/label><\/li><\/ul>\n<p><b>Left off this list from your packet:<\/b> fat-free cheese singles, fat-free mayo, Smart Balance, soup mix packets, bouillon, lean turkey sausage, imitation crab, fat-free dressings, butter-flavored sprinkles and Nesquick. See \"Left Out and Why\" in the meal plan.<\/p>", "heads": [{"id": "p8-1", "t": "How to Use This List", "l": 2}, {"id": "p8-2", "t": "Breakfasts", "l": 2}, {"id": "p8-3", "t": "Egg Whites with Potato and Salsa", "l": 3}, {"id": "p8-4", "t": "Egg White Breakfast Tacos", "l": 3}, {"id": "p8-5", "t": "Spinach Marinara Eggs with Toast", "l": 3}, {"id": "p8-6", "t": "Banana Oat Protein Pancake", "l": 3}, {"id": "p8-7", "t": "Overnight Yogurt Oats and Raisins", "l": 3}, {"id": "p8-8", "t": "Lunches", "l": 2}, {"id": "p8-9", "t": "Salmon or Tuna Salad Sandwich", "l": 3}, {"id": "p8-10", "t": "Walnut Chicken Salad", "l": 3}, {"id": "p8-11", "t": "Dinners", "l": 2}, {"id": "p8-12", "t": "Chicken and Portobello Fajitas", "l": 3}, {"id": "p8-13", "t": "Shrimp Jambalaya", "l": 3}, {"id": "p8-14", "t": "Ginger Scallop Stir-Fry", "l": 3}, {"id": "p8-15", "t": "Spicy Shrimp and Green Beans", "l": 3}, {"id": "p8-16", "t": "Beef and Bean Chili", "l": 3}, {"id": "p8-17", "t": "Chicken Vegetable Soup", "l": 3}, {"id": "p8-18", "t": "Spanish Rice Skillet", "l": 3}, {"id": "p8-19", "t": "Crockpot", "l": 2}, {"id": "p8-20", "t": "Chicken and Brown Rice Stew (5 portions)", "l": 3}, {"id": "p8-21", "t": "Pantry Staples (buy once)", "l": 2}]}, {"id": "p9", "kicker": "Plan 5 · Meal Plan", "title": "40-40-20 Burritos: Cooked and No-Cook", "sub": "Fish, chicken, beef and lamb · quick and easy · about 700 calories each · 13 to 21 g fiber · key nutrients · November 19, 2026", "kind": "plan", "html": "<h2 id=\"p9-1\">How It Works<\/h2>\n<p>Every burrito follows the same formula: a whole wheat tortilla, a lean protein, beans, vegetables, salsa or tomatoes, a Greek yogurt sauce and a little avocado. Each one is a full meal of about 700 calories with roughly 40% protein, 40% carbs and 20 to 24% fat.<\/p>\n<ul><li><b>No-cook versions<\/b> take about 5 minutes and use pouches or leftovers from your crockpot.<\/li><li><b>Cooked versions<\/b> take 15 to 20 minutes in one skillet. Meat is cooked whole and sliced or shredded after.<\/li><li><b>The tortilla matters.<\/b> Brands vary a lot. Pick a large (10-inch) whole wheat tortilla with about 200 calories, 35 g carbs and at least 4 g fiber, and check the sodium.<\/li><li><b>Low sodium:<\/b> use no-salt-added beans, the lowest-sodium salsa you can find, 25% less sodium chicken pouches and salt-free seasonings.<\/li><li><b>No pork<\/b> in any recipe.<\/li><li><b>Numbers<\/b> are estimates from pouch labels and standard USDA values.<\/li><\/ul>\n<h2 id=\"p9-2\">Burritos at a Glance<\/h2>\n<div class=\"scroll\"><table class=\"\"><thead><tr><th>Protein<\/th><th>Version<\/th><th>Cal<\/th><th>Protein (g)<\/th><th>Carbs (g)<\/th><th>Fat (g)<\/th><th>Fiber (g)<\/th><th>Time<\/th><\/tr><\/thead><tbody><tr><td>Fish<\/td><td>No-cook: Salmon and Black Bean<\/td><td class=n>698<\/td><td class=n>68<\/td><td class=n>74<\/td><td class=n>16<\/td><td class=n>21<\/td><td>5 min<\/td><\/tr><tr><td>Fish<\/td><td>Cooked: Baja Salmon with Mango Slaw<\/td><td class=n>708<\/td><td class=n>67<\/td><td class=n>68<\/td><td class=n>18<\/td><td class=n>16<\/td><td>15 min<\/td><\/tr><tr><td>Chicken<\/td><td>No-cook: Southwest Chicken<\/td><td class=n>736<\/td><td class=n>72<\/td><td class=n>68<\/td><td class=n>18<\/td><td class=n>15<\/td><td>5 min<\/td><\/tr><tr><td>Chicken<\/td><td>Cooked: Chicken Thigh Fajita<\/td><td class=n>759<\/td><td class=n>70<\/td><td class=n>73<\/td><td class=n>20<\/td><td class=n>16<\/td><td>20 min<\/td><\/tr><tr><td>Beef<\/td><td>No-cook: Shredded Beef and Black Bean<\/td><td class=n>713<\/td><td class=n>70<\/td><td class=n>65<\/td><td class=n>19<\/td><td class=n>16<\/td><td>5 min<\/td><\/tr><tr><td>Beef<\/td><td>Cooked: Tex-Mex Ground Beef<\/td><td class=n>723<\/td><td class=n>70<\/td><td class=n>69<\/td><td class=n>17<\/td><td class=n>16<\/td><td>15 min<\/td><\/tr><tr><td>Lamb<\/td><td>No-cook: Greek Lamb and Chickpea<\/td><td class=n>735<\/td><td class=n>71<\/td><td class=n>66<\/td><td class=n>20<\/td><td class=n>13<\/td><td>5 min<\/td><\/tr><tr><td>Lamb<\/td><td>Cooked: Seared Lamb Gyro<\/td><td class=n>747<\/td><td class=n>71<\/td><td class=n>69<\/td><td class=n>20<\/td><td class=n>13<\/td><td>15 min<\/td><\/tr><\/tbody><\/table><\/div>\n<h2 id=\"p9-3\">Sauces<\/h2>\n<p>Each sauce uses Greek yogurt as its base, which adds protein without much fat.<\/p>\n<table class=\"stack\"><thead><tr><th>Sauce<\/th><th>Mix<\/th><th>Used in<\/th><\/tr><\/thead><tbody><tr><td>Chipotle-lime crema<\/td><td>Nonfat plain Greek yogurt, lime juice, chipotle powder, pinch of cumin<\/td><td>Salmon and black bean, Southwest chicken, Tex-Mex beef<\/td><\/tr><tr><td>Lime crema<\/td><td>Nonfat plain Greek yogurt, lime juice and zest, pinch of chili powder<\/td><td>Baja salmon<\/td><\/tr><tr><td>Taco crema<\/td><td>Nonfat plain Greek yogurt, salt-free taco seasoning, lime juice<\/td><td>Chicken thigh fajita, shredded beef<\/td><\/tr><tr><td>Tzatziki<\/td><td>Nonfat plain Greek yogurt, lemon juice, garlic, dried dill, a little grated cucumber<\/td><td>Both lamb burritos<\/td><\/tr><\/tbody><\/table>\n<h2 id=\"p9-4\">How to Roll a Burrito That Holds<\/h2>\n<ol class=\"steps\"><li>Warm the tortilla for 10 to 15 seconds in the microwave or a dry skillet so it does not crack.<\/li><li>Lay the greens down first. They keep the tortilla from getting soggy.<\/li><li>Pile the filling in a line across the lower third, leaving 2 inches at each side.<\/li><li>Fold the sides in, fold the bottom edge over the filling, and roll tightly.<\/li><li>Wrap it in foil for the road. Keep no-cook burritos cold and eat them within 1 day.<\/li><\/ol>\n<h2 id=\"p9-5\">Fish<\/h2>\n<h3 id=\"p9-6\">No-Cook: Salmon and Black Bean Burrito<\/h3>\n<div class=\"macro\">698 calories · 68 g protein · 74 g carbs · 16 g fat · 21 g fiber · about 0.9 g EPA and DHA<\/div>\n<p><b>Nutrient highlights:<\/b> omega-3 EPA and DHA (salmon), folate (beans, spinach, avocado), vitamin C (red pepper), selenium (salmon, whole wheat)<\/p>\n<ul><li>1 large whole wheat tortilla<\/li><li>3 pouches (2.6 oz) pink salmon in water<\/li><li>1/2 cup no-salt-added black beans, rinsed<\/li><li>1 cup baby spinach and 1/2 cup sliced red bell pepper<\/li><li>1/4 cup salsa<\/li><li>1/4 cup chipotle-lime crema<\/li><li>1/4 avocado, sliced<\/li><\/ul>\n<ol class=\"steps\"><li>Flake the salmon and toss it with the beans, salsa and a squeeze of lime.<\/li><li>Layer spinach, salmon mix, pepper and avocado on the tortilla. Top with crema and roll.<\/li><\/ol>\n<h3 id=\"p9-7\">Cooked: Baja Salmon Burrito with Mango Slaw<\/h3>\n<div class=\"macro\">708 calories · 67 g protein · 68 g carbs · 18 g fat · 16 g fiber · about 2 g EPA and DHA<\/div>\n<p><b>Nutrient highlights:<\/b> the most omega-3s of any burrito; vitamin C (mango, slaw); selenium (salmon); folate (beans)<\/p>\n<ul><li>1 large whole wheat tortilla<\/li><li>8 to 9 oz raw skinless salmon fillet (wild coho or sockeye is leanest), about 7 oz cooked<\/li><li>Salt-free chili-lime or Cajun seasoning<\/li><li>1/2 cup no-salt-added black beans, rinsed<\/li><li>1/2 cup coleslaw mix and 1/4 cup diced mango (fresh or thawed frozen)<\/li><li>1/4 cup lime crema<\/li><li>1/8 avocado<\/li><\/ul>\n<ol class=\"steps\"><li>Season the salmon. Cook it in a nonstick skillet with cooking spray over medium-high heat, 3 to 4 minutes per side, until it flakes. Flake with a fork.<\/li><li>Toss the slaw and mango with a squeeze of lime.<\/li><li>Fill the tortilla with beans, salmon, slaw and avocado. Top with crema and roll.<\/li><\/ol>\n<h2 id=\"p9-8\">Chicken<\/h2>\n<h3 id=\"p9-9\">No-Cook: Southwest Chicken Burrito<\/h3>\n<div class=\"macro\">736 calories · 72 g protein · 68 g carbs · 18 g fat · 15 g fiber<\/div>\n<p><b>Nutrient highlights:<\/b> folate (pinto beans, spinach, avocado), vitamin C (red pepper), selenium (chicken)<\/p>\n<ul><li>1 large whole wheat tortilla<\/li><li>4 pouches (2.6 oz) white chicken, 25% less sodium<\/li><li>1/3 cup no-salt-added pinto beans, rinsed<\/li><li>1 cup baby spinach and 1/2 cup sliced red bell pepper<\/li><li>1/4 cup salsa<\/li><li>1/4 cup chipotle-lime crema<\/li><li>1/8 avocado<\/li><\/ul>\n<ol class=\"steps\"><li>Toss the chicken with the beans, half the salsa and a pinch of cumin.<\/li><li>Layer spinach, chicken mix, pepper and avocado on the tortilla. Top with crema and the rest of the salsa, then roll.<\/li><\/ol>\n<h3 id=\"p9-10\">Cooked: Chicken Thigh Fajita Burrito<\/h3>\n<div class=\"macro\">759 calories · 70 g protein · 73 g carbs · 20 g fat · 16 g fiber<\/div>\n<p><b>Nutrient highlights:<\/b> zinc and selenium (chicken thighs), vitamin C (peppers), folate (pinto beans)<\/p>\n<ul><li>1 large whole wheat tortilla<\/li><li>8 oz raw boneless skinless chicken thighs, left whole (about 6 oz cooked)<\/li><li>Salt-free fajita or taco seasoning<\/li><li>1/2 cup no-salt-added pinto beans, rinsed<\/li><li>1/2 cup sliced bell pepper and 1/4 cup sliced onion<\/li><li>1/4 cup salsa<\/li><li>1/2 cup taco crema<\/li><\/ul>\n<ol class=\"steps\"><li>Season the thighs and cook them whole in a nonstick skillet with cooking spray over medium heat, 5 to 6 minutes per side, until they reach 165°F. Rest 2 minutes, then slice.<\/li><li>Cook the pepper and onion in the same pan for 3 to 4 minutes.<\/li><li>Fill the tortilla with beans, chicken, peppers and onions, salsa and crema, then roll.<\/li><\/ol>\n<p><b>Lighter option:<\/b> Use 5 oz cooked thighs to bring it to about 710 calories.<\/p>\n<h2 id=\"p9-11\">Beef<\/h2>\n<h3 id=\"p9-12\">No-Cook: Shredded Beef and Black Bean Burrito<\/h3>\n<div class=\"macro\">713 calories · 70 g protein · 65 g carbs · 19 g fat · 16 g fiber<\/div>\n<p><b>Nutrient highlights:<\/b> zinc (beef, the best source here), selenium (beef, whole wheat), folate (beans, spinach)<\/p>\n<ul><li>1 large whole wheat tortilla<\/li><li>5 1/2 oz shredded beef from your crockpot pot roast (bottom round), cold or warmed<\/li><li>1/2 cup no-salt-added black beans, rinsed<\/li><li>1 cup baby spinach<\/li><li>1/4 cup salsa<\/li><li>1/4 cup taco crema<\/li><li>1/8 avocado<\/li><\/ul>\n<ol class=\"steps\"><li>Toss the beef and beans with the salsa.<\/li><li>Layer spinach, beef mix and avocado on the tortilla. Top with crema and roll.<\/li><\/ol>\n<p><b>Tip:<\/b> Set aside one pot roast portion after a cook day for 2 of these burritos (save the potatoes for another meal).<\/p>\n<h3 id=\"p9-13\">Cooked: Tex-Mex Ground Beef Burrito<\/h3>\n<div class=\"macro\">723 calories · 70 g protein · 69 g carbs · 17 g fat · 16 g fiber<\/div>\n<p><b>Nutrient highlights:<\/b> zinc (beef), selenium (beef), vitamin C (peppers), folate (beans), lycopene (salsa)<\/p>\n<ul><li>1 large whole wheat tortilla<\/li><li>8 oz raw 95% lean ground beef<\/li><li>1 tsp chili powder, 1/2 tsp cumin, 1/2 tsp garlic powder<\/li><li>1/2 cup no-salt-added black beans, rinsed<\/li><li>1/4 cup diced onion and 1/2 cup diced red bell pepper<\/li><li>1/4 cup salsa<\/li><li>1/4 cup chipotle-lime crema<\/li><\/ul>\n<ol class=\"steps\"><li>Brown the beef with the onion and pepper over medium-high heat for 6 to 8 minutes, breaking it up.<\/li><li>Stir in the spices, beans and salsa and heat 2 minutes.<\/li><li>Fill the tortilla, top with crema and roll.<\/li><\/ol>\n<p><b>Batch it:<\/b> Cook 2 lb of beef with 4 times the vegetables and spices, and portion into 4 containers.<\/p>\n<h2 id=\"p9-14\">Lamb<\/h2>\n<h3 id=\"p9-15\">No-Cook: Greek Lamb and Chickpea Burrito<\/h3>\n<div class=\"macro\">735 calories · 71 g protein · 66 g carbs · 20 g fat · 13 g fiber<\/div>\n<p><b>Nutrient highlights:<\/b> zinc (lamb), lycopene (cherry tomatoes), folate (chickpeas, spinach)<\/p>\n<ul><li>1 large whole wheat tortilla<\/li><li>5 1/2 oz shredded lamb from your crockpot Moroccan lamb (meat only), cold or warmed<\/li><li>1/2 cup no-salt-added chickpeas, rinsed<\/li><li>1 cup baby spinach<\/li><li>1/4 cup diced cucumber and 1/2 cup halved cherry tomatoes<\/li><li>1/2 cup tzatziki<\/li><li>Dried oregano and a squeeze of lemon<\/li><\/ul>\n<ol class=\"steps\"><li>Toss the lamb with the chickpeas, oregano and lemon.<\/li><li>Layer spinach, lamb mix, cucumber and tomatoes on the tortilla. Top with tzatziki and roll.<\/li><\/ol>\n<h3 id=\"p9-16\">Cooked: Seared Lamb Gyro Burrito<\/h3>\n<div class=\"macro\">747 calories · 71 g protein · 69 g carbs · 20 g fat · 13 g fiber<\/div>\n<p><b>Nutrient highlights:<\/b> zinc (lamb), lycopene (tomatoes), folate (chickpeas, spinach)<\/p>\n<ul><li>1 large whole wheat tortilla<\/li><li>7 to 8 oz raw boneless leg of lamb steak, trimmed (about 5 1/2 oz cooked)<\/li><li>Garlic, oregano, cumin and black pepper<\/li><li>1/2 cup no-salt-added chickpeas, rinsed<\/li><li>1 cup baby spinach, 1/4 cup diced cucumber, 1/2 cup cherry tomatoes, 1/4 cup sliced red onion<\/li><li>1/2 cup tzatziki<\/li><\/ul>\n<ol class=\"steps\"><li>Season the lamb and sear it whole in a hot nonstick skillet with cooking spray, 3 to 4 minutes per side for medium. Rest 5 minutes, then slice thin.<\/li><li>Warm the chickpeas in the same pan for 1 minute.<\/li><li>Fill the tortilla with spinach, lamb, chickpeas and vegetables. Top with tzatziki and roll.<\/li><\/ol>\n<p><b>Swap:<\/b> Lean beef sirloin steak works the same way.<\/p>\n<h2 id=\"p9-17\">Make-Ahead and Food Safety<\/h2>\n<ul><li><b>Cooked fillings<\/b> (beef, chicken, salmon, lamb) keep 3 to 4 days in the fridge. Store them apart from the greens, avocado and sauce, and roll the burrito when you eat it.<\/li><li><b>Freezer burritos:<\/b> the beef and chicken fillings with beans freeze well rolled in a tortilla without the spinach, avocado or yogurt. Wrap in foil, freeze up to 2 months, and microwave unwrapped from frozen for 2 to 3 minutes, turning once.<\/li><li><b>On the road:<\/b> pack tortillas, pouches, beans and spices from home. Buy yogurt cups, guacamole cups and fresh vegetables as you go. Keep built burritos at 40°F or below.<\/li><li><b>Pouches:<\/b> never microwave them in the pouch.<\/li><\/ul>\n<h2 id=\"p9-18\">Key Nutrients<\/h2>\n<table class=\"stack\"><thead><tr><th>Nutrient<\/th><th>Best burritos for it<\/th><th>Notes<\/th><\/tr><\/thead><tbody><tr><td>Zinc (11 mg a day)<\/td><td>Beef and lamb<\/td><td>Beef and lamb are the richest zinc sources in your plans<\/td><\/tr><tr><td>Selenium (55 mcg a day)<\/td><td>Salmon, beef, chicken<\/td><td>Whole wheat tortillas add more; no need for Brazil nuts or supplements<\/td><\/tr><tr><td>Folate (400 mcg a day)<\/td><td>All, from beans, spinach and avocado<\/td><td>Chickpeas, pinto and black beans are all strong sources<\/td><\/tr><tr><td>Vitamin C (90 mg a day)<\/td><td>Red pepper and mango versions<\/td><td>1/2 cup red bell pepper covers most of a day<\/td><\/tr><tr><td>Vitamin E (15 mg a day)<\/td><td>Avocado and spinach versions<\/td><td>Add 1 tbsp sunflower seeds inside for about 2.3 mg more (adds about 50 calories)<\/td><\/tr><tr><td>Lycopene<\/td><td>Lamb (cherry tomatoes), any with salsa<\/td><td>Add 1/4 cup more salsa or tomatoes to any burrito<\/td><\/tr><tr><td>Omega-3 EPA and DHA<\/td><td>Both salmon burritos<\/td><td>Count either one as a fish meal; aim for 2 a week<\/td><\/tr><tr><td>Omega-3 ALA (1.6 g a day)<\/td><td>Not a strong source<\/td><td>Keep chia or flaxseed at breakfast<\/td><\/tr><tr><td>L-arginine and amino acids<\/td><td>All<\/td><td>67 to 72 g complete protein per burrito<\/td><\/tr><\/tbody><\/table>\n<p><b>Supplement notes:<\/b> talk with your doctor before adding fish oil, vitamin E, zinc, selenium or L-arginine supplements. Keep total zinc under 40 mg and selenium under 400 mcg a day.<\/p>\n<h2 id=\"p9-19\">Sources<\/h2>\n<ul><li>Pink salmon pouch nutrition and EPA and DHA: <a href=\"https://starkist.com/?p=9738\" target=\"_blank\" rel=\"noopener\">StarKist<\/a><\/li><li>Chicken pouch nutrition, 25% less sodium: <a href=\"https://business.albertsons.com/shop/product-details.970071215.html\" target=\"_blank\" rel=\"noopener\">Albertsons<\/a><\/li><li>Nutrient targets and upper limits: NIH Office of Dietary Supplements fact sheets for <a href=\"https://ods.od.nih.gov/factsheets/Zinc-HealthProfessional/\" target=\"_blank\" rel=\"noopener\">zinc<\/a> and <a href=\"https://ods.od.nih.gov/factsheets/Selenium-HealthProfessional/\" target=\"_blank\" rel=\"noopener\">selenium<\/a><\/li><li>Salmon fillet, chicken thighs, beef, lamb, beans, vegetables and yogurt: standard USDA values<\/li><\/ul>", "heads": [{"id": "p9-1", "t": "How It Works", "l": 2}, {"id": "p9-2", "t": "Burritos at a Glance", "l": 2}, {"id": "p9-3", "t": "Sauces", "l": 2}, {"id": "p9-4", "t": "How to Roll a Burrito That Holds", "l": 2}, {"id": "p9-5", "t": "Fish", "l": 2}, {"id": "p9-6", "t": "No-Cook: Salmon and Black Bean Burrito", "l": 3}, {"id": "p9-7", "t": "Cooked: Baja Salmon Burrito with Mango Slaw", "l": 3}, {"id": "p9-8", "t": "Chicken", "l": 2}, {"id": "p9-9", "t": "No-Cook: Southwest Chicken Burrito", "l": 3}, {"id": "p9-10", "t": "Cooked: Chicken Thigh Fajita Burrito", "l": 3}, {"id": "p9-11", "t": "Beef", "l": 2}, {"id": "p9-12", "t": "No-Cook: Shredded Beef and Black Bean Burrito", "l": 3}, {"id": "p9-13", "t": "Cooked: Tex-Mex Ground Beef Burrito", "l": 3}, {"id": "p9-14", "t": "Lamb", "l": 2}, {"id": "p9-15", "t": "No-Cook: Greek Lamb and Chickpea Burrito", "l": 3}, {"id": "p9-16", "t": "Cooked: Seared Lamb Gyro Burrito", "l": 3}, {"id": "p9-17", "t": "Make-Ahead and Food Safety", "l": 2}, {"id": "p9-18", "t": "Key Nutrients", "l": 2}, {"id": "p9-19", "t": "Sources", "l": 2}]}, {"id": "p10", "kicker": "Plan 5 · Grocery List", "title": "40-40-20 Burritos Grocery List", "sub": "One list per burrito · 1 burrito each · November 20, 2026", "kind": "grocery", "html": "<h2 id=\"p10-1\">How to Use This List<\/h2>\n<ul><li><b>Shop by meal.<\/b> Each burrito has its own complete list, sauce included. Making more than one? Multiply the \"Recipe uses\" amounts.<\/li><li><b>\"Buy\" is the package size. \"Recipe uses\" is how much goes in one burrito.<\/b> Opened tortillas, cans, yogurt and salsa carry over to the next burrito.<\/li><li><b>The no-cook beef and lamb burritos use crockpot leftovers<\/b> from the Crockpot Meal Plan. If you have none, use the cooked beef or lamb version instead.<\/li><li><b>Spices and cooking spray<\/b> are in Pantry Staples at the end.<\/li><\/ul>\n<h2 id=\"p10-2\">Fish<\/h2>\n<h3 id=\"p10-3\">No-Cook Salmon and Black Bean Burrito<\/h3>\n<ul class=\"check\"><li><label><input type=\"checkbox\" data-k=\"p10-3-large-10-inch-whole-wheat-tortillas\"><span class=\"tx\"><span class=\"it\">Large (10-inch) whole wheat tortillas<\/span><span class=\"am\">Buy: 1 pack · Recipe uses: 1<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p10-3-pink-salmon-in-water-pouches-2-6-oz-\"><span class=\"tx\"><span class=\"it\">Pink salmon in water, pouches (2.6 oz)<\/span><span class=\"am\">Buy: 3 pouches · Recipe uses: 3 pouches<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p10-3-no-salt-added-black-beans\"><span class=\"tx\"><span class=\"it\">No-salt-added black beans<\/span><span class=\"am\">Buy: 1 can (15 oz) · Recipe uses: 1/2 cup<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p10-3-baby-spinach\"><span class=\"tx\"><span class=\"it\">Baby spinach<\/span><span class=\"am\">Buy: 1 bag (5 oz) · Recipe uses: 1 cup<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p10-3-red-bell-pepper\"><span class=\"tx\"><span class=\"it\">Red bell pepper<\/span><span class=\"am\">Buy: 1 · Recipe uses: 1/2 cup sliced<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p10-3-salsa-lowest-sodium\"><span class=\"tx\"><span class=\"it\">Salsa, lowest sodium<\/span><span class=\"am\">Buy: 1 jar (16 oz) · Recipe uses: 1/4 cup<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p10-3-nonfat-plain-greek-yogurt\"><span class=\"tx\"><span class=\"it\">Nonfat plain Greek yogurt<\/span><span class=\"am\">Buy: 1 tub (32 oz) · Recipe uses: 1/4 cup, for chipotle-lime crema<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p10-3-lime\"><span class=\"tx\"><span class=\"it\">Lime<\/span><span class=\"am\">Buy: 1 · Recipe uses: Juice for crema and salmon<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p10-3-avocado\"><span class=\"tx\"><span class=\"it\">Avocado<\/span><span class=\"am\">Buy: 1 · Recipe uses: 1/4<\/span><\/span><\/label><\/li><\/ul>\n<p><b>From the pantry:<\/b> chipotle powder, cumin.<\/p>\n<h3 id=\"p10-4\">Cooked Baja Salmon Burrito with Mango Slaw<\/h3>\n<ul class=\"check\"><li><label><input type=\"checkbox\" data-k=\"p10-4-large-10-inch-whole-wheat-tortillas\"><span class=\"tx\"><span class=\"it\">Large (10-inch) whole wheat tortillas<\/span><span class=\"am\">Buy: 1 pack · Recipe uses: 1<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" d
