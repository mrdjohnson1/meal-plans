pollock<\/span><span class=\"am\">Buy: 8 cans · Recipe uses: 8 cans, drained<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p12-13-brown-rice\"><span class=\"tx\"><span class=\"it\">Brown rice<\/span><span class=\"am\">Buy: 1 bag (2 lb) · Recipe uses: 1 1/4 cups uncooked<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p12-13-sliced-mushrooms\"><span class=\"tx\"><span class=\"it\">Sliced mushrooms<\/span><span class=\"am\">Buy: 8 oz · Recipe uses: 8 oz<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p12-13-onion\"><span class=\"tx\"><span class=\"it\">Onion<\/span><span class=\"am\">Buy: 1 · Recipe uses: 1, diced<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p12-13-low-sodium-broth\"><span class=\"tx\"><span class=\"it\">Low-sodium broth<\/span><span class=\"am\">Buy: 1 carton (32 oz) · Recipe uses: 3 cups<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p12-13-frozen-broccoli-florets\"><span class=\"tx\"><span class=\"it\">Frozen broccoli florets<\/span><span class=\"am\">Buy: 2 bags (12 oz) · Recipe uses: 2 bags<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p12-13-frozen-peas\"><span class=\"tx\"><span class=\"it\">Frozen peas<\/span><span class=\"am\">Buy: 1 bag · Recipe uses: 2 cups<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p12-13-2-milk\"><span class=\"tx\"><span class=\"it\">2% milk<\/span><span class=\"am\">Buy: 1 quart · Recipe uses: 1 cup<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p12-13-nonfat-plain-greek-yogurt\"><span class=\"tx\"><span class=\"it\">Nonfat plain Greek yogurt<\/span><span class=\"am\">Buy: 1 tub (32 oz) · Recipe uses: 1 cup<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p12-13-grated-parmesan\"><span class=\"tx\"><span class=\"it\">Grated Parmesan<\/span><span class=\"am\">Buy: 1 small container · Recipe uses: 1/2 cup<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p12-13-dijon-mustard\"><span class=\"tx\"><span class=\"it\">Dijon mustard<\/span><span class=\"am\">Buy: 1 jar · Recipe uses: 1 tbsp<\/span><\/span><\/label><\/li><\/ul>\n<p><b>From the pantry:<\/b> olive oil (2 tbsp), garlic powder, dried thyme, black pepper.<\/p>\n<h2 id=\"p12-14\">Pantry Staples (buy once)<\/h2>\n<ul class=\"check\"><li><label><input type=\"checkbox\" data-k=\"p12-14-olive-oil-and-cooking-spray\"><span class=\"tx\"><span class=\"it\">Olive oil and cooking spray<\/span><span class=\"am\">Buy: 1 each · Used in: Most recipes<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p12-14-salt-free-cajun-or-creole-seasoning\"><span class=\"tx\"><span class=\"it\">Salt-free Cajun or Creole seasoning<\/span><span class=\"am\">Buy: 1 jar · Used in: Cajun shrimp<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p12-14-curry-powder\"><span class=\"tx\"><span class=\"it\">Curry powder<\/span><span class=\"am\">Buy: 1 jar · Used in: Shrimp curry<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p12-14-cumin-paprika-chili-powder-ground-ginger\"><span class=\"tx\"><span class=\"it\">Cumin, paprika, chili powder, ground ginger, cinnamon<\/span><span class=\"am\">Buy: 1 jar each · Used in: Moroccan salmon, curry, tilapia bowls<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p12-14-dried-dill-oregano-thyme\"><span class=\"tx\"><span class=\"it\">Dried dill, oregano, thyme<\/span><span class=\"am\">Buy: 1 jar each · Used in: Lemon-dill salmon, cod, chowder, casserole<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p12-14-garlic-powder-bay-leaves-black-pepper\"><span class=\"tx\"><span class=\"it\">Garlic powder, bay leaves, black pepper<\/span><span class=\"am\">Buy: 1 jar each · Used in: Most recipes<\/span><\/span><\/label><\/li><\/ul>\n<h2 id=\"p12-15\">Buying Fish<\/h2>\n<ul><li><b>Seafood counter:<\/b> ask for skinless fillets and peeled, deveined shrimp. Cook within 1 to 2 days.<\/li><li><b>Frozen:<\/b> store-brand bags of individually wrapped skinless fillets are the cheapest option. For shrimp, pick the lowest-sodium bag.<\/li><li><b>Where:<\/b> Kroger, Publix and Whole Foods usually have a full seafood counter. Aldi and Walmart are best for low-cost frozen bags, cans and pouches.<\/li><\/ul>", "heads": [{"id": "p12-1", "t": "How to Use This List", "l": 2}, {"id": "p12-2", "t": "Salmon", "l": 2}, {"id": "p12-3", "t": "Lemon-Dill Salmon with Barley and White Beans", "l": 3}, {"id": "p12-4", "t": "Moroccan Salmon with Sweet Potatoes and Chickpeas", "l": 3}, {"id": "p12-5", "t": "Shrimp", "l": 2}, {"id": "p12-6", "t": "Cajun Shrimp and Brown Rice with Red Beans", "l": 3}, {"id": "p12-7", "t": "Shrimp and Red Lentil Curry", "l": 3}, {"id": "p12-8", "t": "White Fish", "l": 2}, {"id": "p12-9", "t": "Mediterranean Cod with Potatoes and Chickpeas", "l": 3}, {"id": "p12-10", "t": "Salsa Verde Tilapia Burrito Bowls", "l": 3}, {"id": "p12-11", "t": "Canned and Pouch Fish", "l": 2}, {"id": "p12-12", "t": "Creamy Salmon and Potato Chowder", "l": 3}, {"id": "p12-13", "t": "Tuna and Brown Rice Casserole", "l": 3}, {"id": "p12-14", "t": "Pantry Staples (buy once)", "l": 2}, {"id": "p12-15", "t": "Buying Fish", "l": 2}]}, {"id": "p13", "kicker": "Reference", "title": "Your Fiber Takeaway", "sub": "November 19, 2026", "kind": "ref", "html": "<p>Fiber is a type of carbohydrate from plant foods that your body can't break down. Instead of being digested, it passes through and does important work along the way. Most foods contain a mix, but they tend to be richer in one type.<\/p>\n<h2 id=\"p13-1\">Two Types of Fiber<\/h2>\n<h3 id=\"p13-2\">Soluble Fiber: \"Swell &amp; Gel\" (slow movers)<\/h3>\n<p>Dissolves in water and forms a gel-like substance in your stomach, slowing digestion.<\/p>\n<p class=\"lead\"><b>What it does:<\/b><\/p>\n<ul><li>Lowers LDL (bad) cholesterol by binding to it so your body can remove it<\/li><li>Slows digestion so blood sugar rises more gently after meals<\/li><li>Keeps you feeling fuller longer, helping with weight management<\/li><\/ul>\n<p class=\"lead\"><b>Best sources:<\/b><\/p>\n<ul><li>Oats and oat bran<\/li><li>Beans, lentils, peas (black beans, lima beans)<\/li><li>Berries, apples, bananas<\/li><li>Avocado<\/li><\/ul>\n<h3 id=\"p13-3\">Insoluble Fiber: \"Fast Movers\" (greens &amp; skins)<\/h3>\n<p>Doesn't dissolve in water. Acts like a scrub brush, adding bulk and keeping things moving.<\/p>\n<p class=\"lead\"><b>What it does:<\/b><\/p>\n<ul><li>Promotes regular bowel movements<\/li><li>Improves insulin sensitivity<\/li><li>Supports gut health and may reduce colon cancer risk<\/li><\/ul>\n<p class=\"lead\"><b>Best sources:<\/b><\/p>\n<ul><li>Whole wheat, bran, whole grain bread/pasta<\/li><li>Greens and vegetables<\/li><li>Skins of fruits and vegetables (apple skins, potato skins)<\/li><li>Nuts and seeds<\/li><\/ul>\n<h2 id=\"p13-4\">Easy Memory Trick: BBGG<\/h2>\n<ul><li><b>B<\/b>eans<\/li><li><b>B<\/b>erries<\/li><li><b>G<\/b>reens<\/li><li><b>G<\/b>rains<\/li><\/ul>\n<h2 id=\"p13-5\">How Much Fiber Do You Need?<\/h2>\n<p>Adults should aim for <b>25 to 34 grams per day<\/b>. About <b>6 to 8 grams<\/b> of that should come from soluble fiber. Most Americans get only about half of this.<\/p>\n<h2 id=\"p13-6\">Fiber and Blood Sugar<\/h2>\n<ul><li>High-fiber diets help keep blood sugar steadier over time<\/li><li>Fiber doesn't cause a blood sugar spike the way other carbs do<\/li><li>Fiber helps protect against heart disease<\/li><li>Ground flaxseed is an easy way to add fiber every day. Keep it up!<\/li><\/ul>\n<h2 id=\"p13-7\">Putting It Into Practice<\/h2>\n<ul><li>Spread fiber across your day (breakfast, lunch, dinner)<\/li><li>Choose whole grains over refined grains at most meals<\/li><li>Use refined carbs (white toast, honey) strategically <b>before<\/b> a workout when you want quick fuel. They're not \"bad,\" just timing-dependent<\/li><li>Increase fiber <b>gradually<\/b> and drink plenty of water to avoid bloating or GI discomfort<\/li><\/ul>", "heads": [{"id": "p13-1", "t": "Two Types of Fiber", "l": 2}, {"id": "p13-2", "t": "Soluble Fiber: \"Swell & Gel\" (slow movers)", "l": 3}, {"id": "p13-3", "t": "Insoluble Fiber: \"Fast Movers\" (greens & skins)", "l": 3}, {"id": "p13-4", "t": "Easy Memory Trick: BBGG", "l": 2}, {"id": "p13-5", "t": "How Much Fiber Do You Need?", "l": 2}, {"id": "p13-6", "t": "Fiber and Blood Sugar", "l": 2}, {"id": "p13-7", "t": "Putting It Into Practice", "l": 2}]}]</script>
<main id="app"><p style="padding:40px 0">Loading your meal plans…</p></main>
<script>
{
const app=document.getElementById('app'),nav=document.getElementById('nav'),drawer=document.getElementById('drawer');
let D=[],Q='';
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}};
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const plans=()=>{const g=[];D.forEach((p,i)=>{if(p.kind==='plan')g.push({n:p.kicker.split(' · ')[0],plan:p,gro:D[i+1]})});return g};

function buildNav(cur){
  nav.innerHTML='<a href="#home"'+(cur==='home'?' class="on"':'')+'>Home</a><a href="#search">Search everything</a>'+
  plans().map(g=>`<h4>${g.n}</h4><a href="#${g.plan.id}"${cur===g.plan.id?' class="on"':''}>${esc(g.plan.title)}<span class="tag">Plan</span></a><a href="#${g.gro.id}"${cur===g.gro.id?' class="on"':''}>Grocery list<span class="tag">List</span></a>`).join('')+
  `<h4>Reference</h4>`+D.filter(p=>p.kind==='ref').map(p=>`<a href="#${p.id}"${cur===p.id?' class="on"':''}>${esc(p.title)}</a>`).join('');
}
const openNav=o=>{drawer.classList.toggle('open',o)};
document.getElementById('menuBtn').addEventListener('click',()=>openNav(true));
document.getElementById('shade').addEventListener('click',()=>openNav(false));
nav.addEventListener('click',e=>{if(e.target.closest('a'))openNav(false)});

function home(){
  app.innerHTML=`<section class="hero">
    <h1>Your 40-40-20 plans, in one place</h1>
    <p>2,100 calories a day across 3 meals. Each plan has its grocery list right behind it, and the checklists remember what you've already bought on this device.</p>
    <div class="plate" role="img" aria-label="Calories split 40% protein, 40% carbs, 20% fat">
      <div class="pp">40%<small>Protein</small></div><div class="pc">40%<small>Carbs</small></div><div class="pf">20%<small>Fat</small></div></div>
    <div class="stats"><div class="stat"><b>700</b><span>calories per meal</span></div><div class="stat"><b>70 g</b><span>protein per meal</span></div><div class="stat"><b>70 g</b><span>carbs per meal</span></div><div class="stat"><b>16 g</b><span>fat per meal</span></div><div class="stat"><b>35 g+</b><span>fiber per day</span></div></div>
  </section>
  <form class="search" id="hs"><input id="hq" type="search" placeholder="Search recipes, foods or nutrients (try salmon, zinc, Sheetz)" aria-label="Search"></form>
  <div class="grid">${plans().map(g=>`<article class="card"><div class="k">${g.n}</div><h3>${esc(g.plan.title)}</h3>
    <div class="row"><a class="btn p" href="#${g.plan.id}">Meal plan</a><a class="btn s" href="#${g.gro.id}">Grocery list${count(g.gro)}</a></div></article>`).join('')}
    ${D.filter(p=>p.kind==='ref').map(p=>`<article class="card"><div class="k">Reference</div><h3>${esc(p.title)}</h3><div class="row"><a class="btn p" href="#${p.id}">Open</a></div></article>`).join('')}
  </div>
  <p class="note"><a href="downloads/40-40-20-Complete-Meal-Plan-Collection.docx">Download the full collection as a Word file</a>. Checked grocery items are saved in this browser only. Talk with your doctor before adding supplements.</p>`;
  document.getElementById('hs').addEventListener('submit',e=>{e.preventDefault();Q=document.getElementById('hq').value;location.hash='search';if(location.hash==='#search')route()});
}
function count(g){const n=(g.html.match(/data-k="/g)||[]).length;if(!n)return'';const done=[...g.html.matchAll(/data-k="([^"]+)"/g)].filter(m=>store.get('ck:'+m[1])).length;return done?` (${done}/${n})`:''}

function section(id,anchor){
  const i=D.findIndex(p=>p.id===id),p=D[i];
  const prev=D[i-1],next=D[i+1];
  const h2=p.kind==='grocery'?p.heads.filter(h=>h.l===3||!/How to Use|Store Brands/.test(h.t)).filter((h,i,a)=>h.l===3||!a.some((x,j)=>j>i&&x.l===3&&a.slice(i+1,j).every(y=>y.l===3))):p.heads.filter(h=>h.l===2);
  app.innerHTML=`<article class="sec"><div class="kick">${esc(p.kicker)}</div><h1>${esc(p.title)}</h1>${p.sub?`<p class="sub">${esc(p.sub)}</p>`:'<div class="sub"></div>'}
   ${h2.length>2?`<nav class="jump" aria-label="Jump to">${h2.map(h=>`<a href="#${h.id}">${esc(h.t)}</a>`).join('')}</nav>`:''}
   ${p.kind==='grocery'?`<div class="prog"><span id="pc"></span><div class="bar"><i id="pb"></i></div><button class="btn s" id="clr">Clear</button></div>`:''}
   <div class="body">${p.html}</div>
   <div class="pager">${prev?`<a class="btn s" href="#${prev.id}">← ${esc(prev.kind==='grocery'?prev.kicker:prev.title)}</a>`:'<span></span>'}${next?`<a class="btn p" href="#${next.id}">${esc(next.kind==='grocery'?'Grocery list':next.title)} →</a>`:''}</div></article>`;
  if(p.kind==='grocery'){
    const boxes=[...app.querySelectorAll('input[data-k]')];
    const upd=()=>{const d=boxes.filter(b=>b.checked).length;document.getElementById('pc').textContent=`${d} of ${boxes.length}`;document.getElementById('pb').style.width=(boxes.length?d/boxes.length*100:0)+'%'};
    boxes.forEach(b=>{b.checked=!!store.get('ck:'+b.dataset.k);b.addEventListener('change',()=>{store.set('ck:'+b.dataset.k,b.checked?'1':null);upd()})});
    const clr=document.getElementById('clr');let armed=false;
    clr.addEventListener('click',()=>{if(!armed){armed=true;clr.textContent='Tap again to clear';setTimeout(()=>{armed=false;clr.textContent='Clear'},3000);return}
      boxes.forEach(b=>{b.checked=false;store.set('ck:'+b.dataset.k,null)});armed=false;clr.textContent='Clear';upd()});
    upd();
  }
  if(anchor){const el=document.getElementById(anchor);if(el){el.scrollIntoView();el.classList.add('flash')}}else window.scrollTo(0,0);
}

let chunks=null;
function buildChunks(){chunks=[];const tmp=document.createElement('div');
  D.forEach(p=>{tmp.innerHTML=p.html;let cur={p,id:p.id,t:p.title,txt:''};chunks.push(cur);
    for(const n of tmp.children){if(/^H[23]$/.test(n.tagName)){cur={p,id:n.id,t:n.textContent,txt:''};chunks.push(cur)}else cur.txt+=' '+n.innerHTML.replace(/<[^>]+>/g,' ').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>')}})}
function search(){
  if(!chunks)buildChunks();
  app.innerHTML=`<form class="search" id="sf"><input id="q" type="search" placeholder="Search recipes, foods or nutrients" aria-label="Search" value="${esc(Q)}"></form><div id="out"></div>`;
  const q=document.getElementById('q'),out=document.getElementById('out');
  const run=()=>{Q=q.value.trim();const w=Q.toLowerCase();if(w.length<2){out.innerHTML='<p class="note">Type at least 2 letters. Results come from every plan, grocery list and the Fiber Takeaway.</p>';return}
    const re=new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'ig');
    const hits=chunks.filter(c=>(c.t+' '+c.txt).toLowerCase().includes(w)).sort((a,b)=>b.t.toLowerCase().includes(w)-a.t.toLowerCase().includes(w)).slice(0,60);
    out.innerHTML=`<p class="note">${hits.length} result${hits.length===1?'':'s'}${hits.length===60?' (showing the first 60)':''}</p>`+hits.map(c=>{
      const s=c.txt.replace(/\s+/g,' '),k=s.toLowerCase().indexOf(w),snip=k<0?s.slice(0,120):(k>50?'…':'')+s.slice(Math.max(0,k-50),k+90)+'…';
      return `<a class="res" href="#${c.id}"><small>${esc(c.p.kicker)} · ${esc(c.p.title)}</small><b>${esc(c.t).replace(re,m=>`<mark>${m}</mark>`)}</b><span>${esc(snip).replace(re,m=>`<mark>${m}</mark>`)}</span></a>`}).join('')};
  q.addEventListener('input',run);document.getElementById('sf').addEventListener('submit',e=>{e.preventDefault();q.blur()});
  run();q.focus();window.scrollTo(0,0);
}

function route(){
  const h=location.hash.slice(1)||'home';
  const m=h.match(/^(p\d+)(?:-\d+)?$/);
  if(m&&D.some(p=>p.id===m[1])){buildNav(m[1]);section(m[1],h.includes('-')?h:null);document.title=D.find(p=>p.id===m[1]).title+' · 40-40-20'}
  else if(h==='search'){buildNav('search');search();document.title='Search · 40-40-20'}
  else{buildNav('home');home();document.title='40-40-20 Meal Plans';window.scrollTo(0,0)}
}
window.addEventListener('hashchange',route);
D=JSON.parse(document.getElementById('data').textContent);route();
}
</script>
<script>if('serviceWorker' in navigator){addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}</script>
