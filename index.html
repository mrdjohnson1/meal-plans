e=\"checkbox\" data-k=\"p12-13-brown-rice\"><span class=\"tx\"><span class=\"it\">Brown rice<\/span><span class=\"am\">Buy: 1 bag (2 lb) · Recipe uses: 1 1/4 cups uncooked<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p12-13-sliced-mushrooms\"><span class=\"tx\"><span class=\"it\">Sliced mushrooms<\/span><span class=\"am\">Buy: 8 oz · Recipe uses: 8 oz<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p12-13-onion\"><span class=\"tx\"><span class=\"it\">Onion<\/span><span class=\"am\">Buy: 1 · Recipe uses: 1, diced<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p12-13-low-sodium-broth\"><span class=\"tx\"><span class=\"it\">Low-sodium broth<\/span><span class=\"am\">Buy: 1 carton (32 oz) · Recipe uses: 3 cups<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p12-13-frozen-broccoli-florets\"><span class=\"tx\"><span class=\"it\">Frozen broccoli florets<\/span><span class=\"am\">Buy: 2 bags (12 oz) · Recipe uses: 2 bags<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p12-13-frozen-peas\"><span class=\"tx\"><span class=\"it\">Frozen peas<\/span><span class=\"am\">Buy: 1 bag · Recipe uses: 2 cups<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p12-13-2-milk\"><span class=\"tx\"><span class=\"it\">2% milk<\/span><span class=\"am\">Buy: 1 quart · Recipe uses: 1 cup<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p12-13-nonfat-plain-greek-yogurt\"><span class=\"tx\"><span class=\"it\">Nonfat plain Greek yogurt<\/span><span class=\"am\">Buy: 1 tub (32 oz) · Recipe uses: 1 cup<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p12-13-grated-parmesan\"><span class=\"tx\"><span class=\"it\">Grated Parmesan<\/span><span class=\"am\">Buy: 1 small container · Recipe uses: 1/2 cup<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p12-13-dijon-mustard\"><span class=\"tx\"><span class=\"it\">Dijon mustard<\/span><span class=\"am\">Buy: 1 jar · Recipe uses: 1 tbsp<\/span><\/span><\/label><\/li><\/ul>\n<p><b>From the pantry:<\/b> olive oil (2 tbsp), garlic powder, dried thyme, black pepper.<\/p>\n<h2 id=\"p12-14\">Pantry Staples (buy once)<\/h2>\n<ul class=\"check\"><li><label><input type=\"checkbox\" data-k=\"p12-14-olive-oil-and-cooking-spray\"><span class=\"tx\"><span class=\"it\">Olive oil and cooking spray<\/span><span class=\"am\">Buy: 1 each · Used in: Most recipes<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p12-14-salt-free-cajun-or-creole-seasoning\"><span class=\"tx\"><span class=\"it\">Salt-free Cajun or Creole seasoning<\/span><span class=\"am\">Buy: 1 jar · Used in: Cajun shrimp<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p12-14-curry-powder\"><span class=\"tx\"><span class=\"it\">Curry powder<\/span><span class=\"am\">Buy: 1 jar · Used in: Shrimp curry<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p12-14-cumin-paprika-chili-powder-ground-ginger\"><span class=\"tx\"><span class=\"it\">Cumin, paprika, chili powder, ground ginger, cinnamon<\/span><span class=\"am\">Buy: 1 jar each · Used in: Moroccan salmon, curry, tilapia bowls<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p12-14-dried-dill-oregano-thyme\"><span class=\"tx\"><span class=\"it\">Dried dill, oregano, thyme<\/span><span class=\"am\">Buy: 1 jar each · Used in: Lemon-dill salmon, cod, chowder, casserole<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p12-14-garlic-powder-bay-leaves-black-pepper\"><span class=\"tx\"><span class=\"it\">Garlic powder, bay leaves, black pepper<\/span><span class=\"am\">Buy: 1 jar each · Used in: Most recipes<\/span><\/span><\/label><\/li><\/ul>\n<h2 id=\"p12-15\">Buying Fish<\/h2>\n<ul><li><b>Seafood counter:<\/b> ask for skinless fillets and peeled, deveined shrimp. Cook within 1 to 2 days.<\/li><li><b>Frozen:<\/b> store-brand bags of individually wrapped skinless fillets are the cheapest option. For shrimp, pick the lowest-sodium bag.<\/li><li><b>Where:<\/b> Kroger, Publix and Whole Foods usually have a full seafood counter. Aldi and Walmart are best for low-cost frozen bags, cans and pouches.<\/li><\/ul>", "heads": [{"id": "p12-1", "t": "How to Use This List", "l": 2}, {"id": "p12-2", "t": "Salmon", "l": 2}, {"id": "p12-3", "t": "Lemon-Dill Salmon with Barley and White Beans", "l": 3}, {"id": "p12-4", "t": "Moroccan Salmon with Sweet Potatoes and Chickpeas", "l": 3}, {"id": "p12-5", "t": "Shrimp", "l": 2}, {"id": "p12-6", "t": "Cajun Shrimp and Brown Rice with Red Beans", "l": 3}, {"id": "p12-7", "t": "Shrimp and Red Lentil Curry", "l": 3}, {"id": "p12-8", "t": "White Fish", "l": 2}, {"id": "p12-9", "t": "Mediterranean Cod with Potatoes and Chickpeas", "l": 3}, {"id": "p12-10", "t": "Salsa Verde Tilapia Burrito Bowls", "l": 3}, {"id": "p12-11", "t": "Canned and Pouch Fish", "l": 2}, {"id": "p12-12", "t": "Creamy Salmon and Potato Chowder", "l": 3}, {"id": "p12-13", "t": "Tuna and Brown Rice Casserole", "l": 3}, {"id": "p12-14", "t": "Pantry Staples (buy once)", "l": 2}, {"id": "p12-15", "t": "Buying Fish", "l": 2}]}, {"id": "p13", "kicker": "Plan 7 · Meal Plan", "title": "More 40-40-20 Recipes", "sub": "Asian stir-fry, Italian, sheet-pan, American, Mexican and crockpot · about 700 calories each · 11 to 19 g fiber · key nutrients · November 20, 2026", "kind": "plan", "html": "<h2 id=\"p13-1\">How It Works<\/h2>\n<p>Each recipe is one full meal of about 670 to 760 calories, with roughly 40% protein, 40% carbs and 15 to 24% fat. Every one has a lean protein, a whole grain or potato, beans or edamame, and vegetables.<\/p>\n<ul><li><b>Stir-fry, Italian, American and Mexican recipes make 1 serving<\/b> and take 15 to 30 minutes. Multiply them to cook for more people or to meal prep.<\/li><li><b>Sheet-pan recipes make 4 servings<\/b> with one pan and about 10 minutes of hands-on time.<\/li><li><b>Crockpot recipes make 5 portions,<\/b> like your Crockpot Meal Plan. Meat goes in whole and gets shredded after cooking.<\/li><li><b>Low sodium:<\/b> use low-sodium soy sauce and broth, no-salt-added canned goods and salt-free seasonings.<\/li><li><b>No pork<\/b> in any recipe.<\/li><li><b>Safe cooking temperatures:<\/b> chicken 165°F, ground beef 160°F, fish and shrimp 145°F.<\/li><li><b>Numbers<\/b> are estimates from standard USDA values. Brands and exact portions vary.<\/li><\/ul>\n<h2 id=\"p13-2\">Recipes at a Glance<\/h2>\n<div class=\"scroll\"><table class=\"\"><thead><tr><th>Style<\/th><th>Recipe<\/th><th>Cal<\/th><th>Protein (g)<\/th><th>Carbs (g)<\/th><th>Fat (g)<\/th><th>Fiber (g)<\/th><\/tr><\/thead><tbody><tr><td>Stir-fry<\/td><td>Chicken and Broccoli Stir-Fry<\/td><td class=n>731<\/td><td class=n>71<\/td><td class=n>72<\/td><td class=n>18<\/td><td class=n>12<\/td><\/tr><tr><td>Stir-fry<\/td><td>Korean Beef Rice Bowl<\/td><td class=n>758<\/td><td class=n>75<\/td><td class=n>70<\/td><td class=n>20<\/td><td class=n>11<\/td><\/tr><tr><td>Stir-fry<\/td><td>Shrimp Fried Rice<\/td><td class=n>726<\/td><td class=n>76<\/td><td class=n>71<\/td><td class=n>15<\/td><td class=n>11<\/td><\/tr><tr><td>Italian<\/td><td>Spaghetti Bolognese with White Beans<\/td><td class=n>718<\/td><td class=n>69<\/td><td class=n>71<\/td><td class=n>18<\/td><td class=n>13<\/td><\/tr><tr><td>Italian<\/td><td>Baked Chicken Parmesan<\/td><td class=n>701<\/td><td class=n>72<\/td><td class=n>72<\/td><td class=n>15<\/td><td class=n>13<\/td><\/tr><tr><td>Italian<\/td><td>Tuscan Shrimp and White Bean Pasta<\/td><td class=n>704<\/td><td class=n>72<\/td><td class=n>76<\/td><td class=n>16<\/td><td class=n>15<\/td><\/tr><tr><td>Sheet-pan<\/td><td>Lemon Herb Chicken, Potatoes and Chickpeas (serves 4)<\/td><td class=n>743<\/td><td class=n>74<\/td><td class=n>75<\/td><td class=n>17<\/td><td class=n>16<\/td><\/tr><tr><td>Sheet-pan<\/td><td>Salmon, Sweet Potatoes and Broccoli (serves 4)<\/td><td class=n>700<\/td><td class=n>68<\/td><td class=n>74<\/td><td class=n>17<\/td><td class=n>16<\/td><\/tr><tr><td>Sheet-pan<\/td><td>Cajun Shrimp Bake (serves 4)<\/td><td class=n>668<\/td><td class=n>71<\/td><td class=n>70<\/td><td class=n>15<\/td><td class=n>13<\/td><\/tr><tr><td>American<\/td><td>Burger and Sweet Potato Fries<\/td><td class=n>730<\/td><td class=n>73<\/td><td class=n>75<\/td><td class=n>14<\/td><td class=n>11<\/td><\/tr><tr><td>American<\/td><td>BBQ Chicken Plate with Black-Eyed Peas and Greens<\/td><td class=n>705<\/td><td class=n>73<\/td><td class=n>76<\/td><td class=n>12<\/td><td class=n>16<\/td><\/tr><tr><td>American<\/td><td>Lentil Sloppy Joe<\/td><td class=n>702<\/td><td class=n>70<\/td><td class=n>76<\/td><td class=n>14<\/td><td class=n>19<\/td><\/tr><tr><td>Mexican<\/td><td>Chicken Enchilada Skillet<\/td><td class=n>710<\/td><td class=n>76<\/td><td class=n>74<\/td><td class=n>12<\/td><td class=n>17<\/td><\/tr><tr><td>Mexican<\/td><td>Shrimp Tacos with Mango Slaw<\/td><td class=n>710<\/td><td class=n>71<\/td><td class=n>76<\/td><td class=n>16<\/td><td class=n>18<\/td><\/tr><tr><td>Mexican<\/td><td>Beef Taco Salad<\/td><td class=n>724<\/td><td class=n>70<\/td><td class=n>73<\/td><td class=n>18<\/td><td class=n>18<\/td><\/tr><tr><td>Crockpot<\/td><td>Chicken Tikka Masala with Chickpeas (serves 5)<\/td><td class=n>731<\/td><td class=n>75<\/td><td class=n>72<\/td><td class=n>16<\/td><td class=n>13<\/td><\/tr><tr><td>Crockpot<\/td><td>Beef and Barley Stew (serves 5)<\/td><td class=n>688<\/td><td class=n>73<\/td><td class=n>69<\/td><td class=n>13<\/td><td class=n>14<\/td><\/tr><tr><td>Crockpot<\/td><td>Teriyaki Chicken with Brown Rice and Broccoli (serves 5)<\/td><td class=n>693<\/td><td class=n>69<\/td><td class=n>68<\/td><td class=n>16<\/td><td class=n>10<\/td><\/tr><\/tbody><\/table><\/div>\n<h2 id=\"p13-3\">Asian Stir-Fry<\/h2>\n<h3 id=\"p13-4\">Chicken and Broccoli Stir-Fry<\/h3>\n<div class=\"macro\">731 calories · 71 g protein · 72 g carbs · 18 g fat · 12 g fiber · 20 minutes<\/div>\n<p><b>Nutrient highlights:<\/b> vitamin C and folate (broccoli), selenium (chicken), ALA and folate (edamame)<\/p>\n<ul><li>8 oz boneless skinless chicken breast (or pre-cut stir-fry strips)<\/li><li>3/4 cup cooked brown rice (a microwave cup works)<\/li><li>2 cups broccoli florets, fresh or frozen<\/li><li>1/2 cup shelled edamame<\/li><li>Sauce: 1 tbsp low-sodium soy sauce, 1 tsp honey, 1 tsp cornstarch, 2 tbsp water, 1/2 tsp garlic, 1/2 tsp ginger<\/li><li>1 tsp toasted sesame oil and 1 tsp sesame seeds<\/li><\/ul>\n<ol class=\"steps\"><li>Whisk the sauce in a small bowl.<\/li><li>Slice the chicken into thin strips, or buy pre-cut strips to skip the cutting.<\/li><li>Heat the sesame oil in a large nonstick skillet over medium-high. Cook the chicken 5 to 6 minutes, until it reaches 165°F. Move it to a plate.<\/li><li>Add the broccoli, edamame and 2 tbsp water. Cover and steam 3 to 4 minutes.<\/li><li>Return the chicken, pour in the sauce and stir 1 minute until glossy. Serve over the rice with sesame seeds.<\/li><\/ol>\n<h3 id=\"p13-5\">Korean Beef Rice Bowl<\/h3>\n<div class=\"macro\">758 calories · 75 g protein · 70 g carbs · 20 g fat · 11 g fiber · 15 minutes<\/div>\n<p><b>Nutrient highlights:<\/b> zinc (beef), folate (spinach, edamame), vitamin A (carrots)<\/p>\n<ul><li>8 oz 95% lean ground beef<\/li><li>3/4 cup cooked brown rice<\/li><li>2/3 cup shelled edamame<\/li><li>1/2 cup shredded carrots and 1/2 cup sliced cucumber<\/li><li>2 cups baby spinach<\/li><li>Sauce: 1 tbsp low-sodium soy sauce, 1 1/2 tsp honey, 1/2 tsp garlic, 1/2 tsp ginger, pinch of red pepper flakes<\/li><li>1/4 cup nonfat plain Greek yogurt with a squeeze of sriracha<\/li><li>1 tsp sesame seeds<\/li><\/ul>\n<ol class=\"steps\"><li>Brown the beef in a nonstick skillet over medium-high for 6 to 8 minutes, breaking it up, until it reaches 160°F.<\/li><li>Stir in the sauce and cook 1 minute.<\/li><li>Add the spinach and stir until it wilts. Warm the edamame in the microwave.<\/li><li>Build the bowl: rice, beef and spinach, edamame, carrots and cucumber. Top with the sriracha yogurt and sesame seeds.<\/li><\/ol>\n<h3 id=\"p13-6\">Shrimp Fried Rice<\/h3>\n<div class=\"macro\">726 calories · 76 g protein · 71 g carbs · 15 g fat · 11 g fiber · 15 minutes<\/div>\n<p><b>Nutrient highlights:<\/b> selenium (shrimp, eggs), folate (peas, edamame), vitamin A (carrots)<\/p>\n<ul><li>7 oz raw shrimp, peeled and deveined<\/li><li>3/4 cup plus 2 tbsp cooked brown rice, cold (day-old or microwave cups)<\/li><li>1/2 cup liquid egg whites and 1 whole egg<\/li><li>1/2 cup frozen peas and 1/2 cup diced carrots (or 1 cup frozen peas and carrots)<\/li><li>1/3 cup shelled edamame<\/li><li>1/4 cup diced onion and sliced green onions<\/li><li>1 tbsp low-sodium soy sauce, 1/2 tsp garlic<\/li><li>1 tsp oil<\/li><\/ul>\n<ol class=\"steps\"><li>Heat the oil in a large nonstick skillet over medium-high. Cook the shrimp 2 to 3 minutes until pink. Move them to a plate.<\/li><li>Add the onion, peas, carrots and edamame. Cook 3 minutes.<\/li><li>Push the vegetables aside, pour in the egg whites and egg, and scramble 1 to 2 minutes.<\/li><li>Add the cold rice, soy sauce and garlic. Stir-fry 2 to 3 minutes, pressing the rice against the pan so it crisps.<\/li><li>Stir the shrimp back in and top with green onions.<\/li><\/ol>\n<h2 id=\"p13-7\">Italian<\/h2>\n<h3 id=\"p13-8\">Spaghetti Bolognese with White Beans<\/h3>\n<div class=\"macro\">718 calories · 69 g protein · 71 g carbs · 18 g fat · 13 g fiber · 20 minutes<\/div>\n<p><b>Nutrient highlights:<\/b> zinc (beef), lycopene (marinara), folate (white beans, spinach)<\/p>\n<ul><li>1 3/4 oz dry whole wheat spaghetti (about 3/4 cup cooked)<\/li><li>8 oz 95% lean ground beef<\/li><li>3/4 cup low-sodium marinara sauce<\/li><li>1/3 cup no-salt-added cannellini beans, rinsed<\/li><li>2 cups baby spinach<\/li><li>1/4 cup diced onion, 1/2 tsp garlic, Italian seasoning<\/li><li>1 1/2 tbsp grated Parmesan<\/li><\/ul>\n<ol class=\"steps\"><li>Cook the spaghetti following the package directions.<\/li><li>Brown the beef and onion in a nonstick skillet for 6 to 8 minutes, until the beef reaches 160°F.<\/li><li>Add the marinara, beans, garlic and Italian seasoning. Mash a few beans to thicken the sauce. Simmer 5 minutes.<\/li><li>Stir in the spinach until it wilts. Serve over the spaghetti with Parmesan.<\/li><\/ol>\n<h3 id=\"p13-9\">Baked Chicken Parmesan<\/h3>\n<div class=\"macro\">701 calories · 72 g protein · 72 g carbs · 15 g fat · 13 g fiber · 30 minutes<\/div>\n<p><b>Nutrient highlights:<\/b> selenium (chicken), lycopene (marinara), vitamin C (broccoli)<\/p>\n<ul><li>7 oz boneless skinless chicken breast (1 breast)<\/li><li>1/4 cup whole wheat panko and 2 tbsp liquid egg whites<\/li><li>1/2 cup low-sodium marinara sauce<\/li><li>3 tbsp shredded part-skim mozzarella<\/li><li>1 1/2 oz dry whole wheat spaghetti (about 3/4 cup cooked)<\/li><li>1 1/2 cups broccoli florets<\/li><li>3 tbsp no-salt-added cannellini beans, mashed into the marinara<\/li><li>1 tbsp grated Parmesan, Italian seasoning, cooking spray<\/li><\/ul>\n<ol class=\"steps\"><li>Heat the oven to 425°F. Dip the whole chicken breast in the egg whites, then press it into the panko mixed with Italian seasoning.<\/li><li>Bake on a sprayed sheet pan for 18 to 20 minutes, with the broccoli on the same pan for the last 12 minutes.<\/li><li>Top the chicken with 1/4 cup marinara and the mozzarella. Bake 3 to 5 minutes more, until the cheese melts and the chicken reaches 165°F.<\/li><li>Cook the spaghetti. Warm the rest of the marinara with the mashed beans and toss it with the pasta. Serve with the chicken, broccoli and Parmesan.<\/li><\/ol>\n<h3 id=\"p13-10\">Tuscan Shrimp and White Bean Pasta<\/h3>\n<div class=\"macro\">704 calories · 72 g protein · 76 g carbs · 16 g fat · 15 g fiber · 20 minutes<\/div>\n<p><b>Nutrient highlights:<\/b> selenium (shrimp), lycopene (tomatoes), folate (white beans, spinach), vitamin E (olive oil)<\/p>\n<ul><li>8 to 9 oz raw shrimp, peeled and deveined<\/li><li>2 oz dry whole wheat penne (about 1 cup cooked)<\/li><li>1/2 cup no-salt-added cannellini beans, rinsed<\/li><li>1 cup cherry tomatoes, halved<\/li><li>2 cups baby spinach<\/li><li>2 tsp olive oil, 1/2 tsp garlic, pinch of red pepper flakes, Italian seasoning, juice of 1/2 lemon<\/li><li>1 1/2 tbsp grated Parmesan<\/li><\/ul>\n<ol class=\"steps\"><li>Cook the penne. Save 1/4 cup of the pasta water.<\/li><li>Heat the oil in a skillet over medium-high. Cook the tomatoes and garlic 3 minutes, until the tomatoes burst.<\/li><li>Add the shrimp and seasonings and cook 2 to 3 minutes, until pink.<\/li><li>Stir in the beans, spinach, pasta and a splash of pasta water. Toss 1 minute. Finish with lemon and Parmesan.<\/li><\/ol>\n<h2 id=\"p13-11\">Sheet-Pan Meals (4 servings each)<\/h2>\n<h3 id=\"p13-12\">Lemon Herb Chicken, Potatoes and Chickpeas<\/h3>\n<div class=\"macro\">Per serving: 743 calories · 74 g protein · 75 g carbs · 17 g fat · 16 g fiber · 10 minutes hands-on, 35 minutes in the oven<\/div>\n<p><b>Nutrient highlights:<\/b> selenium (chicken), folate (chickpeas, green beans), vitamin C (potatoes, lemon), vitamin E (olive oil)<\/p>\n<ul><li>2 lb boneless skinless chicken breasts, whole<\/li><li>1 1/2 lb baby potatoes, halved<\/li><li>1 lb green beans, fresh or frozen<\/li><li>2 cans (15 oz) no-salt-added chickpeas, drained, rinsed and patted dry<\/li><li>2 tbsp olive oil, juice and zest of 1 lemon, 1 tsp garlic powder, 1 tsp oregano, 1 tsp thyme, black pepper<\/li><li>Sauce: 1 cup nonfat plain Greek yogurt, lemon juice, dill and garlic<\/li><\/ul>\n<ol class=\"steps\"><li>Heat the oven to 425°F. Toss the potatoes and chickpeas with 1 tbsp oil and half the seasoning on a large sheet pan. Roast 15 minutes.<\/li><li>Rub the chicken with the rest of the oil, seasoning and lemon zest. Push the potatoes aside and add the chicken and green beans.<\/li><li>Roast 20 to 25 minutes more, until the chicken reaches 165°F.<\/li><li>Rest the chicken 5 minutes, then slice it. Squeeze the lemon over the pan and divide into 4 containers with 1/4 cup sauce each.<\/li><\/ol>\n<h3 id=\"p13-13\">Salmon, Sweet Potatoes and Broccoli<\/h3>\n<div class=\"macro\">Per serving: 700 calories · 68 g protein · 74 g carbs · 17 g fat · 16 g fiber · 10 minutes hands-on, 35 minutes in the oven · counts as a fish meal<\/div>\n<p><b>Nutrient highlights:<\/b> omega-3 EPA and DHA (salmon), vitamin A and C (sweet potatoes, broccoli), folate (chickpeas)<\/p>\n<ul><li>2 lb skinless salmon fillets, fresh or thawed (wild sockeye or coho is leanest)<\/li><li>2 lb sweet potatoes, cut into 1-inch cubes (or frozen cubed)<\/li><li>1 1/4 lb broccoli florets (or 2 bags, 12 oz, frozen)<\/li><li>1 can (15 oz) no-salt-added chickpeas, drained and patted dry<\/li><li>1 tbsp olive oil, 1 tsp smoked paprika, 1 tsp garlic powder, black pepper<\/li><li>Sauce: 2/3 cup nonfat plain Greek yogurt, 1 tbsp Dijon mustard, lemon juice<\/li><\/ul>\n<ol class=\"steps\"><li>Heat the oven to 425°F. Toss the sweet potatoes and chickpeas with half the oil and seasoning. Roast 20 minutes.<\/li><li>Add the broccoli to the pan and lay the salmon on top. Brush the salmon with the rest of the oil and seasoning.<\/li><li>Roast 12 to 15 minutes more, until the salmon flakes and reaches 145°F.<\/li><li>Divide into 4 containers. Serve each with about 2 1/2 tbsp sauce.<\/li><\/ol>\n<h3 id=\"p13-14\">Cajun Shrimp Bake<\/h3>\n<div class=\"macro\">Per serving: 668 calories · 71 g protein · 70 g carbs · 15 g fat · 13 g fiber · 10 minutes hands-on, 30 minutes in the oven<\/div>\n<p><b>Nutrient highlights:<\/b> selenium (shrimp), folate (kidney beans, green beans), vitamin C (potatoes)<\/p>\n<ul><li>2 1/2 lb raw shrimp, peeled and deveined (thawed if frozen)<\/li><li>1 1/2 lb baby potatoes, halved<\/li><li>2 1/2 cups frozen corn (or 4 small ears, cut into rounds)<\/li><li>1 lb green beans<\/li><li>1 can (15 oz) no-salt-added kidney beans, drained and patted dry<\/li><li>3 tbsp olive oil, 2 tbsp salt-free Cajun seasoning, 1 tsp garlic powder, 1 lemon<\/li><\/ul>\n<ol class=\"steps\"><li>Heat the oven to 425°F. Toss the potatoes with 1 tbsp oil and some seasoning. Roast 15 minutes.<\/li><li>Add the corn, green beans and kidney beans with 1 tbsp oil and more seasoning. Roast 8 minutes.<\/li><li>Toss the shrimp with the last 1 tbsp oil and seasoning and spread it over the pan. Roast 6 to 8 minutes, until pink.<\/li><li>Squeeze the lemon over everything and divide into 4 containers.<\/li><\/ol>\n<h2 id=\"p13-15\">American<\/h2>\n<h3 id=\"p13-16\">Burger and Sweet Potato Fries<\/h3>\n<div class=\"macro\">730 calories · 73 g protein · 75 g carbs · 14 g fat · 11 g fiber · 30 minutes<\/div>\n<p><b>Nutrient highlights:<\/b> zinc and selenium (beef), vitamin A (sweet potato), lycopene (tomato)<\/p>\n<ul><li>8 oz 95% lean ground beef<\/li><li>1 100% whole wheat bun (or 2 slices whole wheat bread)<\/li><li>1 medium sweet potato, cut into fries<\/li><li>Lettuce and tomato slices<\/li><li>1/2 cup nonfat plain Greek yogurt mixed with mustard and dill relish (burger sauce and fry dip)<\/li><li>Salt-free burger seasoning or garlic and onion powder, cooking spray<\/li><\/ul>\n<ol class=\"steps\"><li>Heat the oven to 425°F. Spray the fries, sprinkle with paprika and bake 25 minutes, flipping once.<\/li><li>Shape the beef into a patty and season it. Cook in a skillet or on a grill 4 to 5 minutes per side, until it reaches 160°F.<\/li><li>Build the burger with lettuce, tomato and 2 tbsp sauce. Use the rest as a fry dip.<\/li><\/ol>\n<h3 id=\"p13-17\">BBQ Chicken Plate with Black-Eyed Peas and Greens<\/h3>\n<div class=\"macro\">705 calories · 73 g protein · 76 g carbs · 12 g fat · 16 g fiber · 30 minutes<\/div>\n<p><b>Nutrient highlights:<\/b> folate (black-eyed peas, collards), vitamin C (potato, collards), selenium (chicken)<\/p>\n<ul><li>8 oz boneless skinless chicken breast<\/li><li>2 tbsp BBQ sauce (lowest sugar and sodium you can find)<\/li><li>1 medium potato (about 7 oz)<\/li><li>1/2 cup no-salt-added black-eyed peas, rinsed<\/li><li>1 cup frozen chopped collard greens<\/li><li>1/4 cup nonfat plain Greek yogurt (for the potato)<\/li><li>1 tsp olive oil, 1 tsp vinegar, garlic powder, red pepper flakes, black pepper<\/li><\/ul>\n<ol class=\"steps\"><li>Pierce the potato and microwave it 6 to 8 minutes, until soft.<\/li><li>Season the whole chicken breast and cook it on a grill or grill pan 6 to 7 minutes per side. Brush with BBQ sauce for the last 2 minutes. Cook to 165°F.<\/li><li>Cook the collards in the oil with garlic and red pepper flakes for 5 minutes. Stir in the black-eyed peas and vinegar and heat through.<\/li><li>Split the potato and top it with the yogurt. Slice the chicken and serve with the greens and peas.<\/li><\/ol>\n<h3 id=\"p13-18\">Lentil Sloppy Joe<\/h3>\n<div class=\"macro\">702 calories · 70 g protein · 76 g carbs · 14 g fat · 19 g fiber · 20 minutes<\/div>\n<p><b>Nutrient highlights:<\/b> zinc (beef), folate and L-arginine (lentils), lycopene (tomato sauce), vitamin A (carrots)<\/p>\n<ul><li>7 oz 95% lean ground beef<\/li><li>1/2 cup cooked lentils (canned, rinsed)<\/li><li>1/2 cup no-salt-added tomato sauce and 1 tbsp tomato paste<\/li><li>1/4 cup diced onion and 1/2 cup diced bell pepper<\/li><li>1 100% whole wheat bun<\/li><li>3/4 cup baby carrots<\/li><li>1/4 cup nonfat plain Greek yogurt with dill and garlic powder (dip)<\/li><li>1 tsp Dijon mustard, 1 tsp vinegar, 1/2 tsp chili powder, garlic powder<\/li><\/ul>\n<ol class=\"steps\"><li>Brown the beef with the onion and pepper for 6 to 8 minutes, until the beef reaches 160°F.<\/li><li>Stir in the lentils, tomato sauce, paste, mustard, vinegar and spices. Simmer 5 minutes.<\/li><li>Spoon onto the bun. Serve with the carrots and yogurt dip.<\/li><\/ol>\n<h2 id=\"p13-19\">Mexican<\/h2>\n<h3 id=\"p13-20\">Chicken Enchilada Skillet<\/h3>\n<div class=\"macro\">710 calories · 76 g protein · 74 g carbs · 12 g fat · 17 g fiber · 25 minutes<\/div>\n<p><b>Nutrient highlights:<\/b> folate (black beans), vitamin C (peppers), lycopene (tomato sauce), selenium (chicken)<\/p>\n<ul><li>8 oz boneless skinless chicken breast<\/li><li>3 corn tortillas, torn into strips<\/li><li>1/2 cup no-salt-added black beans, rinsed<\/li><li>1/2 cup no-salt-added tomato sauce + 1 tsp chili powder, 1/2 tsp cumin, 1/2 tsp garlic powder (enchilada sauce)<\/li><li>1/4 cup diced onion and 1/2 cup diced bell pepper<\/li><li>2 tbsp shredded reduced-fat cheddar<\/li><li>1/4 cup nonfat plain Greek yogurt and 2 tbsp salsa<\/li><\/ul>\n<ol class=\"steps\"><li>Cook the whole chicken breast in a covered nonstick skillet with a splash of water for 6 to 7 minutes per side, until it reaches 165°F. Shred it with two forks.<\/li><li>Add the onion and pepper to the pan and cook 3 minutes.<\/li><li>Stir in the sauce, beans, chicken and tortilla strips. Simmer 5 minutes.<\/li><li>Sprinkle the cheese, cover 1 minute to melt, and top with yogurt and salsa.<\/li><\/ol>\n<h3 id=\"p13-21\">Shrimp Tacos with Mango Slaw<\/h3>\n<div class=\"macro\">710 calories · 71 g protein · 76 g carbs · 16 g fat · 18 g fiber · 15 minutes<\/div>\n<p><b>Nutrient highlights:<\/b> selenium (shrimp), vitamin C (mango, cabbage), folate (pinto beans, avocado)<\/p>\n<ul><li>9 oz raw shrimp, peeled and deveined<\/li><li>3 corn tortillas<\/li><li>1/3 cup no-salt-added pinto beans, warmed<\/li><li>1 cup coleslaw mix and 1/3 cup diced mango (fresh or thawed frozen)<\/li><li>1/3 avocado, sliced<\/li><li>1/4 cup nonfat plain Greek yogurt with lime juice (crema)<\/li><li>1 tsp oil, salt-free chili-lime or taco seasoning, 1 lime<\/li><\/ul>\n<ol class=\"steps\"><li>Toss the slaw and mango with a squeeze of lime.<\/li><li>Season the shrimp. Cook in the oil over medium-high 2 to 3 minutes, until pink.<\/li><li>Warm the tortillas in a dry skillet. Fill with shrimp, slaw and avocado, and top with crema.<\/li><li>Serve the pinto beans on the side.<\/li><\/ol>\n<h3 id=\"p13-22\">Beef Taco Salad<\/h3>\n<div class=\"macro\">724 calories · 70 g protein · 73 g carbs · 18 g fat · 18 g fiber · 20 minutes<\/div>\n<p><b>Nutrient highlights:<\/b> zinc (beef), folate (black beans, romaine), lycopene (tomatoes, salsa), vitamin E (avocado)<\/p>\n<ul><li>7 to 8 oz 95% lean ground beef<\/li><li>2 cups chopped romaine<\/li><li>1/2 cup no-salt-added black beans, rinsed<\/li><li>1/2 cup corn and 1/2 cup cherry tomatoes<\/li><li>2 corn tortillas, cut into strips and baked<\/li><li>1/4 cup salsa<\/li><li>1/3 cup nonfat plain Greek yogurt<\/li><li>2 tbsp mashed avocado or guacamole<\/li><li>Salt-free taco seasoning, cooking spray<\/li><\/ul>\n<ol class=\"steps\"><li>Heat the oven to 400°F. Spray the tortilla strips and bake 8 to 10 minutes until crisp.<\/li><li>Brown the beef with taco seasoning and a splash of water for 6 to 8 minutes, until it reaches 160°F.<\/li><li>Warm the beans and corn.<\/li><li>Top the romaine with beef, beans, corn, tomatoes and tortilla strips. Mix the yogurt with half the salsa for dressing and add the avocado.<\/li><\/ol>\n<h2 id=\"p13-23\">Crockpot (5 portions each)<\/h2>\n<p class=\"lead\"><b>Faster cooking options<\/b><\/p>\n<p>Every crockpot recipe below has its standard steps first, then faster methods, each listed separately. Recipes that already cook on HIGH list only the Instant Pot and stovetop versions.<\/p>\n<table class=\"stack\"><thead><tr><th>Method<\/th><th>Typical time<\/th><th>Best for<\/th><\/tr><\/thead><tbody><tr><td>Crockpot, all on HIGH<\/td><td>About half to two-thirds of the LOW time<\/td><td>Same pot and steps, just sooner<\/td><\/tr><tr><td>Instant Pot (6-quart)<\/td><td>About 25 minutes to 2 1/2 hours, including time to come to pressure<\/td><td>The fastest hands-off option<\/td><\/tr><tr><td>Stovetop Dutch oven<\/td><td>About 30 minutes to 3 1/2 hours<\/td><td>No special equipment<\/td><\/tr><\/tbody><\/table>\n<ul><li><b>Instant Pot liquid:<\/b> pressure cookers lose almost no liquid, so some recipes use less broth. Use the amount listed in the Instant Pot steps.<\/li><li><b>Avoid the \"burn\" warning:<\/b> put thin liquid on the bottom and spoon tomatoes, tomato paste or salsa on top without stirring. Add cornstarch, yogurt and milk only after pressure cooking.<\/li><li><b>Do not fill past the 2/3 line<\/b> in an Instant Pot. A doubled batch will not fit.<\/li><li><b>Time to pressure:<\/b> the Instant Pot times include about 10 to 15 minutes to come to pressure.<\/li><li><b>Frozen meat:<\/b> thaw it first for the crockpot. In the Instant Pot, frozen boneless chicken needs about 5 more minutes under pressure.<\/li><li><b>Always check doneness:<\/b> chicken 165°F, beef and lamb fork-tender, fish 145°F, shrimp pink.<\/li><\/ul>\n<h3 id=\"p13-24\">Chicken Tikka Masala with Chickpeas<\/h3>\n<div class=\"macro\">Per portion: 731 calories · 75 g protein · 72 g carbs · 16 g fat · 13 g fiber · LOW 5 to 6 hr, then HIGH 2 to 2 1/2 hr<\/div>\n<p><b>Nutrient highlights:<\/b> lycopene (tomatoes, paste), folate (chickpeas, spinach), selenium (chicken thighs)<\/p>\n<ul><li>3 lb boneless skinless chicken thighs, whole<\/li><li>2 cans (15 oz) no-salt-added chickpeas, rinsed<\/li><li>2 cans (14.5 oz) no-salt-added diced tomatoes<\/li><li>2 tbsp tomato paste<\/li><li>1 cup frozen diced onion<\/li><li>1 cup uncooked brown rice and 2 1/2 cups low-sodium chicken broth<\/li><li>1 box or bag (10 oz) frozen chopped spinach<\/li><li>1 1/4 cups nonfat plain Greek yogurt<\/li><li>2 tbsp garam masala, 1 tsp cumin, 1 tsp paprika, 1 tsp ginger, 1 tbsp jarred garlic<\/li><\/ul>\n<p class=\"lead\"><b>Standard: crockpot, LOW then HIGH (about 7 to 8 1/2 hours)<\/b><\/p>\n<ol class=\"steps\"><li>Add the tomatoes, paste, onion, chickpeas, garlic and spices to the crockpot. Stir, then lay the thighs on top.<\/li><li>Cook on LOW 5 to 6 hours. Shred the chicken in the pot.<\/li><li>Stir in the rice, broth and frozen spinach. Switch to HIGH and cook 2 to 2 1/2 hours, until the rice is tender. Stir once halfway.<\/li><li>Turn off the heat and stir in the yogurt. Divide into 5 containers.<\/li><\/ol>\n<p class=\"lead\"><b>Faster: crockpot, all on HIGH (about 4 1/2 to 5 1/2 hours)<\/b><\/p>\n<ol class=\"steps\"><li>Load the pot the same way as the standard steps.<\/li><li>Cook on HIGH 2 1/2 to 3 hours. Shred the chicken.<\/li><li>Stir in the rice, broth and spinach. Cook on HIGH 2 to 2 1/2 hours more, stirring once halfway. Turn off the heat and stir in the yogurt.<\/li><\/ol>\n<p class=\"lead\"><b>Fastest: Instant Pot (about 50 minutes)<\/b><\/p>\n<ol class=\"steps\"><li>Add 1 1/4 cups broth, the rice, chickpeas, onion, garlic and spices. Lay the thighs on top. Spoon the tomatoes and tomato paste over the chicken and do not stir.<\/li><li>Pressure cook on HIGH 22 minutes, then let the pressure release naturally for 10 minutes.<\/li><li>Shred the chicken and stir in the frozen spinach on Sauté for 3 to 4 minutes. Turn off the heat and stir in the yogurt.<\/li><\/ol>\n<p class=\"lead\"><b>Fast: stovetop Dutch oven (about 1 hour)<\/b><\/p>\n<ol class=\"steps\"><li>Bring 2 1/2 cups broth, the tomatoes, paste, chickpeas, onion, garlic and spices to a boil. Stir in the rice, cover and simmer on low 20 minutes.<\/li><li>Nestle the thighs into the rice. Cover and simmer 20 to 25 minutes more, until the rice is tender and the chicken reaches 165°F.<\/li><li>Shred the chicken and stir in the spinach. Turn off the heat and stir in the yogurt.<\/li><\/ol>\n<h3 id=\"p13-25\">Beef and Barley Stew<\/h3>\n<div class=\"macro\">Per portion: 688 calories · 73 g protein · 69 g carbs · 13 g fat · 14 g fiber · LOW 8 to 9 hr, then HIGH 1 1/2 to 2 hr<\/div>\n<p><b>Nutrient highlights:<\/b> zinc and selenium (beef), very high fiber (barley), vitamin A (carrots)<\/p>\n<ul><li>3 lb bottom round roast, whole<\/li><li>1 cup pearled barley<\/li><li>1 lb baby carrots and 1 lb potatoes, cut into chunks<\/li><li>8 oz sliced mushrooms<\/li><li>1 cup frozen diced onion<\/li><li>2 cups frozen peas<\/li><li>3 tbsp tomato paste<\/li><li>6 cups low-sodium beef broth<\/li><li>1 tbsp jarred garlic, 1 tsp thyme, 1 tsp rosemary, 2 bay leaves, black pepper<\/li><\/ul>\n<p class=\"lead\"><b>Standard: crockpot, LOW then HIGH (about 9 1/2 to 11 hours)<\/b><\/p>\n<ol class=\"steps\"><li>Put the potatoes, carrots, mushrooms and onion in the crockpot. Set the roast on top.<\/li><li>Whisk the tomato paste into 3 cups of broth with the garlic and herbs and pour it over. Cook on LOW 8 to 9 hours, until the roast pulls apart.<\/li><li>Lift out the roast, shred it and return it. Stir in the barley and the last 3 cups of broth.<\/li><li>Switch to HIGH and cook 1 1/2 to 2 hours, until the barley is tender. Stir in the peas for the last 15 minutes. Remove the bay leaves and divide into 5 containers.<\/li><\/ol>\n<p class=\"lead\"><b>Faster: crockpot, all on HIGH (about 6 1/2 to 8 hours)<\/b><\/p>\n<ol class=\"steps\"><li>Load the pot the same way as the standard steps.<\/li><li>Cook on HIGH 5 to 6 hours, until the roast pulls apart. Shred it.<\/li><li>Stir in the barley and the last 3 cups of broth. Cook on HIGH 1 1/2 to 2 hours more. Add the peas for the last 15 minutes.<\/li><\/ol>\n<p class=\"lead\"><b>Fastest: Instant Pot (about 2 1/2 hours)<\/b><\/p>\n<ol class=\"steps\"><li>Pour in 3 cups broth whisked with the tomato paste, garlic and herbs. Set the roast in the pot.<\/li><li>Pressure cook on HIGH 70 minutes, then let the pressure release naturally for 15 minutes. Lift out the roast and shred it.<\/li><li>Add the barley, potatoes, carrots, mushrooms, onion and the last 3 cups of broth. Pressure cook 25 minutes, then release naturally for 10 minutes.<\/li><li>Stir in the beef and peas on Sauté for 3 to 4 minutes. Remove the bay leaves.<\/li><\/ol>\n<p class=\"lead\"><b>Fast: stovetop Dutch oven or oven (about 3 1/2 hours)<\/b><\/p>\n<ol class=\"steps\"><li>Set the roast in a Dutch oven with 3 cups broth, the tomato paste, garlic and herbs. Cover and simmer on low, or bake at 325°F, for 2 1/2 to 3 hours.<\/li><li>Shred the roast. Add the barley, potatoes, carrots, mushrooms, onion and the last 3 cups of broth. Cover and simmer 40 to 45 minutes, until the barley is tender.<\/li><li>Stir in the peas for the last 5 minutes and remove the bay leaves.<\/li><\/ol>\n<h3 id=\"p13-26\">Teriyaki Chicken with Brown Rice and Broccoli<\/h3>\n<div class=\"macro\">Per portion: 693 calories · 69 g protein · 68 g carbs · 16 g fat · 10 g fiber · LOW 4 to 5 hr, then HIGH 2 to 2 1/2 hr<\/div>\n<p><b>Nutrient highlights:<\/b> folate and ALA (edamame), vitamin C (broccoli, pineapple), selenium (chicken thighs)<\/p>\n<ul><li>3 lb boneless skinless chicken thighs, whole<\/li><li>1 1/4 cups uncooked brown rice and 2 1/2 cups low-sodium chicken broth<\/li><li>2 bags (12 oz) frozen broccoli florets<\/li><li>2 cups frozen shelled edamame<\/li><li>1 can (20 oz) pineapple tidbits in juice, drained (about 1 1/2 cups)<\/li><li>2 cups shredded carrots<\/li><li>Sauce: 1/4 cup low-sodium soy sauce, 2 tbsp honey, 2 tbsp cornstarch, 1 tbsp jarred garlic, 1 tsp ginger<\/li><\/ul>\n<p class=\"lead\"><b>Standard: crockpot, LOW then HIGH (about 6 to 7 1/2 hours)<\/b><\/p>\n<ol class=\"steps\"><li>Whisk the sauce. Lay the thighs in the crockpot, add the carrots and pour the sauce over.<\/li><li>Cook on LOW 4 to 5 hours. Shred the chicken in the pot.<\/li><li>Stir in the rice, broth and edamame. Switch to HIGH and cook 2 to 2 1/2 hours, until the rice is tender. Stir once halfway.<\/li><li>Add the frozen broccoli and pineapple for the last 30 to 45 minutes. Divide into 5 containers.<\/li><\/ol>\n<p class=\"lead\"><b>Faster: crockpot, all on HIGH (about 4 to 5 hours)<\/b><\/p>\n<ol class=\"steps\"><li>Load the pot the same way as the standard steps.<\/li><li>Cook on HIGH 2 to 2 1/2 hours. Shred the chicken.<\/li><li>Stir in the rice, broth and edamame. Cook on HIGH 2 to 2 1/2 hours more, stirring once halfway. Add the broccoli and pineapple for the last 30 to 45 minutes.<\/li><\/ol>\n<p class=\"lead\"><b>Fastest: Instant Pot (about 55 minutes)<\/b><\/p>\n<ol class=\"steps\"><li>Add 1 1/4 cups broth, the rice, edamame and carrots. Lay the thighs on top and pour the soy sauce, honey, garlic and ginger over them. Leave out the cornstarch for now.<\/li><li>Pressure cook on HIGH 22 minutes, then let the pressure release naturally for 10 minutes. Shred the chicken.<\/li><li>Switch to Sauté. Add the broccoli and pineapple and cook 4 to 5 minutes. Stir in the cornstarch mixed with 2 tbsp cold water and cook 1 minute until glossy.<\/li><\/ol>\n<p class=\"lead\"><b>Fast: stovetop Dutch oven (about 1 hour)<\/b><\/p>\n<ol class=\"steps\"><li>Bring 2 1/2 cups broth, the soy sauce, honey, garlic, ginger and carrots to a boil. Stir in the rice and edamame, cover and simmer on low 20 minutes.<\/li><li>Nestle the thighs into the rice. Cover and simmer 20 to 25 minutes more, until the rice is tender and the chicken reaches 165°F.<\/li><li>Shred the chicken. Add the broccoli and pineapple for 5 minutes, then stir in the cornstarch mixed with 2 tbsp cold water until glossy.<\/li><\/ol>\n<h2 id=\"p13-27\">Key Nutrients<\/h2>\n<table class=\"stack\"><thead><tr><th>Nutrient<\/th><th>Best recipes for it<\/th><th>Notes<\/th><\/tr><\/thead><tbody><tr><td>Zinc (11 mg a day)<\/td><td>Korean beef, bolognese, burger, sloppy joe, taco salad, beef and barley stew<\/td><td>Beef is your richest zinc source<\/td><\/tr><tr><td>Selenium (55 mcg a day)<\/td><td>Every recipe, especially shrimp and chicken<\/td><td>No need for Brazil nuts or a supplement<\/td><\/tr><tr><td>Folate (400 mcg a day)<\/td><td>All, from beans, lentils, edamame, spinach and broccoli<\/td><td>Lentil sloppy joe and the taco salad are highest<\/td><\/tr><tr><td>Vitamin C (90 mg a day)<\/td><td>Stir-fries, sheet-pan meals, enchilada skillet, shrimp tacos<\/td><td>Peppers, broccoli, potatoes and mango<\/td><\/tr><tr><td>Vitamin E (15 mg a day)<\/td><td>Tuscan shrimp, sheet-pan chicken, shrimp tacos, taco salad<\/td><td>Olive oil, avocado and spinach; add sunflower seeds for more<\/td><\/tr><tr><td>Lycopene<\/td><td>All tomato-based recipes<\/td><td>Marinara, tomato sauce and paste are concentrated sources<\/td><\/tr><tr><td>Omega-3 EPA and DHA<\/td><td>Sheet-pan salmon<\/td><td>Counts as one of your 2 fish meals a week<\/td><\/tr><tr><td>Omega-3 ALA (1.6 g a day)<\/td><td>Edamame recipes give a little<\/td><td>Keep chia or flaxseed at breakfast<\/td><\/tr><tr><td>L-arginine and amino acids<\/td><td>All<\/td><td>68 to 76 g complete protein per meal<\/td><\/tr><\/tbody><\/table>\n<p><b>Supplement notes:<\/b> talk with your doctor before adding fish oil, vitamin E, zinc, selenium or L-arginine supplements. Fish oil can interact with blood thinners. Keep total zinc under 40 mg and selenium under 400 mcg a day.<\/p>\n<h2 id=\"p13-28\">Sources<\/h2>\n<ul><li>Safe cooking temperatures: <a href=\"https://www.foodsafety.gov/food-safety-charts/safe-minimum-internal-temperatures\" target=\"_blank\" rel=\"noopener\">FoodSafety.gov<\/a><\/li><li>Nutrient targets and upper limits: NIH Office of Dietary Supplements fact sheets for <a href=\"https://ods.od.nih.gov/factsheets/Zinc-HealthProfessional/\" target=\"_blank\" rel=\"noopener\">zinc<\/a> and <a href=\"https://ods.od.nih.gov/factsheets/Selenium-HealthProfessional/\" target=\"_blank\" rel=\"noopener\">selenium<\/a><\/li><li>Meats, seafood, grains, beans, vegetables, dairy and sauces: standard USDA values<\/li><\/ul>", "heads": [{"id": "p13-1", "t": "How It Works", "l": 2}, {"id": "p13-2", "t": "Recipes at a Glance", "l": 2}, {"id": "p13-3", "t": "Asian Stir-Fry", "l": 2}, {"id": "p13-4", "t": "Chicken and Broccoli Stir-Fry", "l": 3}, {"id": "p13-5", "t": "Korean Beef Rice Bowl", "l": 3}, {"id": "p13-6", "t": "Shrimp Fried Rice", "l": 3}, {"id": "p13-7", "t": "Italian", "l": 2}, {"id": "p13-8", "t": "Spaghetti Bolognese with White Beans", "l": 3}, {"id": "p13-9", "t": "Baked Chicken Parmesan", "l": 3}, {"id": "p13-10", "t": "Tuscan Shrimp and White Bean Pasta", "l": 3}, {"id": "p13-11", "t": "Sheet-Pan Meals (4 servings each)", "l": 2}, {"id": "p13-12", "t": "Lemon Herb Chicken, Potatoes and Chickpeas", "l": 3}, {"id": "p13-13", "t": "Salmon, Sweet Potatoes and Broccoli", "l": 3}, {"id": "p13-14", "t": "Cajun Shrimp Bake", "l": 3}, {"id": "p13-15", "t": "American", "l": 2}, {"id": "p13-16", "t": "Burger and Sweet Potato Fries", "l": 3}, {"id": "p13-17", "t": "BBQ Chicken Plate with Black-Eyed Peas and Greens", "l": 3}, {"id": "p13-18", "t": "Lentil Sloppy Joe", "l": 3}, {"id": "p13-19", "t": "Mexican", "l": 2}, {"id": "p13-20", "t": "Chicken Enchilada Skillet", "l": 3}, {"id": "p13-21", "t": "Shrimp Tacos with Mango Slaw", "l": 3}, {"id": "p13-22", "t": "Beef Taco Salad", "l": 3}, {"id": "p13-23", "t": "Crockpot (5 portions each)", "l": 2}, {"id": "p13-24", "t": "Chicken Tikka Masala with Chickpeas", "l": 3}, {"id": "p13-25", "t": "Beef and Barley Stew", "l": 3}, {"id": "p13-26", "t": "Teriyaki Chicken with Brown Rice and Broccoli", "l": 3}, {"id": "p13-27", "t": "Key Nutrients", "l": 2}, {"id": "p13-28", "t": "Sources", "l": 2}]}, {"id": "p14", "kicker": "Plan 7 · Grocery List", "title": "More 40-40-20 Recipes Grocery List", "sub": "One list per recipe · stir-fry, Italian, sheet-pan, American, Mexican and crockpot · November 20, 2026", "kind": "grocery", "html": "<h2 id=\"p14-1\">How to Use This List<\/h2>\n<ul><li><b>Shop by meal.<\/b> Each recipe has its own complete list. Stir-fry, Italian, American and Mexican recipes make 1 serving; sheet-pan recipes make 4 and crockpot recipes make 5.<\/li><li><b>\"Buy\" is the package size. \"Recipe uses\" is how much goes in the meal.<\/b> Opened packages carry over to the next recipe.<\/li><li><b>Some items repeat across recipes,<\/b> like brown rice, Greek yogurt and beans. Check your pantry before buying them again.<\/li><li><b>Spices, oils and cooking spray<\/b> are in Pantry Staples at the end.<\/li><\/ul>\n<h2 id=\"p14-2\">Asian Stir-Fry<\/h2>\n<h3 id=\"p14-3\">Chicken and Broccoli Stir-Fry<\/h3>\n<ul class=\"check\"><li><label><input type=\"checkbox\" data-k=\"p14-3-boneless-skinless-chicken-breast-or-stir\"><span class=\"tx\"><span class=\"it\">Boneless skinless chicken breast or stir-fry strips<\/span><span class=\"am\">Buy: 1 pack · Recipe uses: 8 oz<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p14-3-microwave-brown-rice-cups-or-brown-rice-\"><span class=\"tx\"><span class=\"it\">Microwave brown rice cups (or brown rice)<\/span><span class=\"am\">Buy: 1 · Recipe uses: 3/4 cup cooked<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p14-3-broccoli-florets-fresh-or-frozen\"><span class=\"tx\"><span class=\"it\">Broccoli florets, fresh or frozen<\/span><span class=\"am\">Buy: 1 bag (12 oz) · Recipe uses: 2 cups<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p14-3-shelled-edamame-frozen\"><span class=\"tx\"><span class=\"it\">Shelled edamame, frozen<\/span><span class=\"am\">Buy: 1 bag (12 oz) · Recipe uses: 1/2 cup<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p14-3-low-sodium-soy-sauce\"><span class=\"tx\"><span class=\"it\">Low-sodium soy sauce<\/span><span class=\"am\">Buy: 1 bottle · Recipe uses: 1 tbsp<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p14-3-honey\"><span class=\"tx\"><span class=\"it\">Honey<\/span><span class=\"am\">Buy: 1 bottle · Recipe uses: 1 tsp<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p14-3-cornstarch\"><span class=\"tx\"><span class=\"it\">Cornstarch<\/span><span class=\"am\">Buy: 1 box · Recipe uses: 1 tsp<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p14-3-toasted-sesame-oil\"><span class=\"tx\"><span class=\"it\">Toasted sesame oil<\/span><span class=\"am\">Buy: 1 bottle · Recipe uses: 1 tsp<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p14-3-sesame-seeds\"><span class=\"tx\"><span class=\"it\">Sesame seeds<\/span><span class=\"am\">Buy: 1 small jar · Recipe uses: 1 tsp<\/span><\/span><\/label><\/li><\/ul>\n<p><b>From the pantry:<\/b> garlic, ground ginger.<\/p>\n<h3 id=\"p14-4\">Korean Beef Rice Bowl<\/h3>\n<ul class=\"check\"><li><label><input type=\"checkbox\" data-k=\"p14-4-95-lean-ground-beef\"><span class=\"tx\"><span class=\"it\">95% lean ground beef<\/span><span class=\"am\">Buy: 1 lb · Recipe uses: 8 oz<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p14-4-microwave-brown-rice-cups-or-brown-rice-\"><span class=\"tx\"><span class=\"it\">Microwave brown rice cups (or brown rice)<\/span><span class=\"am\">Buy: 1 · Recipe uses: 3/4 cup cooked<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p14-4-shelled-edamame-frozen\"><span class=\"tx\"><span class=\"it\">Shelled edamame, frozen<\/span><span class=\"am\">Buy: 1 bag (12 oz) · Recipe uses: 2/3 cup<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p14-4-shredded-carrots\"><span class=\"tx\"><span class=\"it\">Shredded carrots<\/span><span class=\"am\">Buy: 1 bag (10 oz) · Recipe uses: 1/2 cup<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p14-4-cucumber\"><span class=\"tx\"><span class=\"it\">Cucumber<\/span><span class=\"am\">Buy: 1 · Recipe uses: 1/2 cup sliced<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p14-4-baby-spinach\"><span class=\"tx\"><span class=\"it\">Baby spinach<\/span><span class=\"am\">Buy: 1 bag (5 oz) · Recipe uses: 2 cups<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p14-4-low-sodium-soy-sauce\"><span class=\"tx\"><span class=\"it\">Low-sodium soy sauce<\/span><span class=\"am\">Buy: 1 bottle · Recipe uses: 1 tbsp<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p14-4-honey\"><span class=\"tx\"><span class=\"it\">Honey<\/span><span class=\"am\">Buy: 1 bottle · Recipe uses: 1 1/2 tsp<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p14-4-nonfat-plain-greek-yogurt\"><span class=\"tx\"><span class=\"it\">Nonfat plain Greek yogurt<\/span><span class=\"am\">Buy: 1 tub (32 oz) · Recipe uses: 1/4 cup<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p14-4-sriracha\"><span class=\"tx\"><span class=\"it\">Sriracha<\/span><span class=\"am\">Buy: 1 bottle · Recipe uses: A squeeze<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p14-4-sesame-seeds\"><span class=\"tx\"><span class=\"it\">Sesame seeds<\/span><span class=\"am\">Buy: 1 small jar · Recipe uses: 1 tsp<\/span><\/span><\/label><\/li><\/ul>\n<p><b>From the pantry:<\/b> garlic, ground ginger, red pepper flakes.<\/p>\n<h3 id=\"p14-5\">Shrimp Fried Rice<\/h3>\n<ul class=\"check\"><li><label><input type=\"checkbox\" data-k=\"p14-5-raw-shrimp-peeled-and-deveined-fresh-or-\"><span class=\"tx\"><span class=\"it\">Raw shrimp, peeled and deveined (fresh or frozen)<\/span><span class=\"am\">Buy: 1 lb bag · Recipe uses: 7 oz<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p14-5-microwave-brown-rice-cups-or-day-old-bro\"><span class=\"tx\"><span class=\"it\">Microwave brown rice cups (or day-old brown rice)<\/span><span class=\"am\">Buy: 1 to 2 · Recipe uses: 3/4 cup plus 2 tbsp cooked<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p14-5-liquid-egg-whites\"><span class=\"tx\"><span class=\"it\">Liquid egg whites<\/span><span class=\"am\">Buy: 1 carton (32 oz) · Recipe uses: 1/2 cup<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p14-5-eggs\"><span class=\"tx\"><span class=\"it\">Eggs<\/span><span class=\"am\">Buy: 1 dozen · Recipe uses: 1<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p14-5-frozen-peas-and-carrots\"><span class=\"tx\"><span class=\"it\">Frozen peas and carrots<\/span><span class=\"am\">Buy: 1 bag · Recipe uses: 1 cup<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p14-5-shelled-edamame-frozen\"><span class=\"tx\"><span class=\"it\">Shelled edamame, frozen<\/span><span class=\"am\">Buy: 1 bag (12 oz) · Recipe uses: 1/3 cup<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p14-5-onion-and-green-onions\"><span class=\"tx\"><span class=\"it\">Onion and green onions<\/span><span class=\"am\">Buy: 1 each · Recipe uses: 1/4 cup diced, plus green onion to top<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p14-5-low-sodium-soy-sauce\"><span class=\"tx\"><span class=\"it\">Low-sodium soy sauce<\/span><span class=\"am\">Buy: 1 bottle · Recipe uses: 1 tbsp<\/span><\/span><\/label><\/li><\/ul>\n<p><b>From the pantry:<\/b> oil, garlic.<\/p>\n<h2 id=\"p14-6\">Italian<\/h2>\n<h3 id=\"p14-7\">Spaghetti Bolognese with White Beans<\/h3>\n<ul class=\"check\"><li><label><input type=\"checkbox\" data-k=\"p14-7-whole-wheat-spaghetti\"><span class=\"tx\"><span class=\"it\">Whole wheat spaghetti<\/span><span class=\"am\">Buy: 1 box · Recipe uses: 1 3/4 oz dry<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p14-7-95-lean-ground-beef\"><span class=\"tx\"><span class=\"it\">95% lean ground beef<\/span><span class=\"am\">Buy: 1 lb · Recipe uses: 8 oz<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p14-7-low-sodium-marinara-sauce\"><span class=\"tx\"><span class=\"it\">Low-sodium marinara sauce<\/span><span class=\"am\">Buy: 1 jar · Recipe uses: 3/4 cup<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p14-7-no-salt-added-cannellini-beans\"><span class=\"tx\"><span class=\"it\">No-salt-added cannellini beans<\/span><span class=\"am\">Buy: 1 can (15 oz) · Recipe uses: 1/3 cup<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p14-7-baby-spinach\"><span class=\"tx\"><span class=\"it\">Baby spinach<\/span><span class=\"am\">Buy: 1 bag (5 oz) · Recipe uses: 2 cups<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p14-7-onion\"><span class=\"tx\"><span class=\"it\">Onion<\/span><span class=\"am\">Buy: 1 · Recipe uses: 1/4 cup diced<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p14-7-grated-parmesan\"><span class=\"tx\"><span class=\"it\">Grated Parmesan<\/span><span class=\"am\">Buy: 1 small container · Recipe uses: 1 1/2 tbsp<\/span><\/span><\/label><\/li><\/ul>\n<p><b>From the pantry:<\/b> garlic, Italian seasoning.<\/p>\n<h3 id=\"p14-8\">Baked Chicken Parmesan<\/h3>\n<ul class=\"check\"><li><label><input type=\"checkbox\" data-k=\"p14-8-boneless-skinless-chicken-breast\"><span class=\"tx\"><span class=\"it\">Boneless skinless chicken breast<\/span><span class=\"am\">Buy: 1 pack · Recipe uses: 7 oz (1 breast)<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p14-8-whole-wheat-panko\"><span class=\"tx\"><span class=\"it\">Whole wheat panko<\/span><span class=\"am\">Buy: 1 canister · Recipe uses: 1/4 cup<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p14-8-liquid-egg-whites\"><span class=\"tx\"><span class=\"it\">Liquid egg whites<\/span><span class=\"am\">Buy: 1 carton (32 oz) · Recipe uses: 2 tbsp<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p14-8-low-sodium-marinara-sauce\"><span class=\"tx\"><span class=\"it\">Low-sodium marinara sauce<\/span><span class=\"am\">Buy: 1 jar · Recipe uses: 1/2 cup<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p14-8-shredded-part-skim-mozzarella\"><span class=\"tx\"><span class=\"it\">Shredded part-skim mozzarella<\/span><span class=\"am\">Buy: 1 bag · Recipe uses: 3 tbsp<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p14-8-whole-wheat-spaghe ><\/li><li><label><input type=\"checkbox\" data-k=\"p14-9-baby-spinach\"><span class=\"tx\"><span class=\"it\">Baby spinach<\/span><span class=\"am\">Buy: 1 bag (5 oz) · Recipe uses: 2 cups<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p14-9-lemon\"><span class=\"tx\"><span class=\"it\">Lemon<\/span><span class=\"am\">Buy: 1 · Recipe uses: Juice of 1/2<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p14-9-grated-parmesan\"><span class=\"tx\"><span class=\"it\">Grated Parmesan<\/span><span class=\"am\">Buy: 1 small container · Recipe uses: 1 1/2 tbsp<\/span><\/span><\/label><\/li><\/ul>\n<p><b>From the pantry:<\/b> olive oil, garlic, red pepper flakes, Italian seasoning.<\/p>\n<h2 id=\"p14-10\">Sheet-Pan Meals (4 servings each)<\/h2>\n<h3 id=\"p14-11\">Lemon Herb Chicken, Potatoes and Chickpeas<\/h3>\n<ul class=\"check\"><li><label><input type=\"checkbox\" data-k=\"p14-11-boneless-skinless-chicken-breasts\"><span class=\"tx\"><span class=\"it\">Boneless skinless chicken breasts<\/span><span class=\"am\">Buy: 2 lb · Recipe uses: 2 lb, whole<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p14-11-baby-potatoes\"><span class=\"tx\"><span class=\"it\">Baby potatoes<\/span><span class=\"am\">Buy: 1 1/2 lb bag · Recipe uses: 1 1/2 lb<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p14-11-green-beans-fresh-or-frozen\"><span class=\"tx\"><span class=\"it\">Green beans, fresh or frozen<\/span><span class=\"am\">Buy: 1 lb · Recipe uses: 1 lb<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p14-11-no-salt-added-chickpeas\"><span class=\"tx\"><span class=\"it\">No-salt-added chickpeas<\/span><span class=\"am\">Buy: 2 cans (15 oz) · Recipe uses: 2 cans<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p14-11-lemons\"><span class=\"tx\"><span class=\"it\">Lemons<\/span><span class=\"am\">Buy: 2 · Recipe uses: Zest and juice <span class=\"it\">Low-sodium soy sauce<\/span><span class=\"am\">Buy: 1 bottle · Recipe uses: 1/4 cup<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p14-25-honey\"><span class=\"tx\"><span class=\"it\">Honey<\/span><span class=\"am\">Buy: 1 bottle · Recipe uses: 2 tbsp<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p14-25-cornstarch\"><span class=\"tx\"><span class=\"it\">Cornstarch<\/span><span class=\"am\">Buy: 1 box · Recipe uses: 2 tbsp<\/span><\/span><\/label><\/li><\/ul>\n<p><b>From the pantry:<\/b> jarred garlic, ground ginger.<\/p>\n<h2 id=\"p14-26\">Pantry Staples (buy once)<\/h2>\n<ul class=\"check\"><li><label><input type=\"checkbox\" data-k=\"p14-26-olive-oil-any-cooking-oil-and-cooking-sp\"><span class=\"tx\"><span class=\"it\">Olive oil, any cooking oil and cooking spray<\/span><span class=\"am\">Buy: 1 each · Used in: Most recipes<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p14-26-jarred-minced-garlic-and-garlic-powder\"><span class=\"tx\"><span class=\"it\">Jarred minced garlic and garlic powder<\/span><span class=\"am\">Buy: 1 each · Used in: Most recipes<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p14-26-ground-ginger\"><span class=\"tx\"><span class=\"it\">Ground ginger<\/span><span class=\"am\">Buy: 1 jar · Used in: Stir-fries, tikka masala, teriyaki<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p14-26-italian-seasoning-oregano-thyme-rosemary\"><span class=\"tx\"><span class=\"it\">Italian seasoning, oregano, thyme, rosemary, dill<\/span><span class=\"am\">Buy: 1 jar each · Used in: Italian and sheet-pan recipes, stew<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p14-26-salt-free-cajun-taco-and-burger-seasonin\"><span class=\"tx\"><span class=\"it\">Salt-free Cajun, taco and burger seasonings<\/span><span class=\"am\">Buy: 1 jar each · Used in: Shrimp bake, Mexican recipes, burger<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p14-26-chili-powder-cumin-paprika-smoked-paprik\"><span class=\"tx\"><span class=\"it\">Chili powder, cumin, paprika, smoked paprika<\/span><span class=\"am\">Buy: 1 jar each · Used in: Mexican recipes, sheet-pan salmon, tikka masala<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p14-26-red-pepper-flakes-black-pepper-bay-leave\"><span class=\"tx\"><span class=\"it\">Red pepper flakes, black pepper, bay leaves<\/span><span class=\"am\">Buy: 1 jar each · Used in: Several recipes<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p14-26-vinegar-white-or-cider-\"><span class=\"tx\"><span class=\"it\">Vinegar (white or cider)<\/span><span class=\"am\">Buy: 1 bottle · Used in: BBQ plate, sloppy joe<\/span><\/span><\/label><\/li><\/ul>", "heads": [{"id": "p14-1", "t": "How to Use This List", "l": 2}, {"id": "p14-2", "t": "Asian Stir-Fry", "l": 2}, {"id": "p14-3", "t": "Chicken and Broccoli Stir-Fry", "l": 3}, {"id": "p14-4", "t": "Korean Beef Rice Bowl", "l": 3}, {"id": "p14-5", "t": "Shrimp Fried Rice", "l": 3}, {"id": "p14-6", "t": "Italian", "l": 2}, {"id": "p14-7", "t": "Spaghetti Bolognese with White Beans", "l": 3}, {"id": "p14-8", "t": "Baked Chicken Parmesan", "l": 3}, {"id": "p14-9", "t": "Tuscan Shrimp and White Bean Pasta", "l": 3}, {"id": "p14-10", "t": "Sheet-Pan Meals (4 servings each)", "l": 2}, {"id": "p14-11", "t": "Lemon Herb Chicken, Potatoes and Chickpeas", "l": 3}, {"id": "p14-12", "t": "Salmon, Sweet Potatoes and Broccoli", "l": 3}, {"id": "p14-13", "t": "Cajun Shrimp Bake", "l": 3}, {"id": "p14-14", "t": "American", "l": 2}, {"id": "p14-15", "t": "Burger and Sweet Potato Fries", "l": 3}, {"id": "p14-16", "t": "BBQ Chicken Plate with Black-Eyed Peas and Greens", "l": 3}, {"id": "p14-17", "t": "Lentil Sloppy Joe", "l": 3}, {"id": "p14-18", "t": "Mexican", "l": 2}, {"id": "p14-19", "t": "Chicken Enchilada Skillet", "l": 3}, {"id": "p14-20", "t": "Shrimp Tacos with Mango Slaw", "l": 3}, {"id": "p14-21", "t": "Beef Taco Salad", "l": 3}, {"id": "p14-22", "t": "Crockpot (5 portions each)", "l": 2}, {"id": "p14-23", "t": "Chicken Tikka Masala with Chickpeas", "l": 3}, {"id": "p14-24", "t": "Beef and Barley Stew", "l": 3}, {"id": "p14-25", "t": "Teriyaki Chicken with Brown Rice and Broccoli", "l": 3}, {"id": "p14-26", "t": "Pantry Staples (buy once)", "l": 2}]}, {"id": "p15", "kicker": "Reference", "title": "Coffee and Dessert", "sub": "Flavored black coffee · Publix chocolate chip cookies, either size · fits inside 2,100 calories · November 20, 2026", "kind": "ref", "html": "<h2 id=\"p15-1\">How It Works<\/h2>\n<ul><li><b>Coffee is free.<\/b> Flavored black coffee has about 5 calories a cup, with no sugar, creamer or sweeteners.<\/li><li><b>Cookies get a 400-calorie daily allowance<\/b> inside your 2,100 calories.<\/li><li><b>Pay for the cookies by trimming about 130 calories from each meal.<\/b> The trims come from carbs and fat, so protein stays at about 70 g per meal.<\/li><li><b>Either cookie size works.<\/b> Use whichever one Publix has in stock, or mix them.<\/li><\/ul>\n<h2 id=\"p15-2\">The Coffee<\/h2>\n<table class=\"stack\"><thead><tr><th>Coffee<\/th><th>Size<\/th><th>Calories<\/th><th>Sugar<\/th><\/tr><\/thead><tbody><tr><td>Flavored K-cup, black (morning)<\/td><td>12 oz<\/td><td>About 5<\/td><td>0 g<\/td><\/tr><tr><td>Wawa or gas station flavored brew, black<\/td><td>20 oz<\/td><td>About 5 to 10<\/td><td>0 g<\/td><\/tr><tr><td>Flavored decaf K-cup, black (after dinner)<\/td><td>12 oz<\/td><td>About 5<\/td><td>0 g<\/td><\/tr><\/tbody><\/table>\n<ul><li><b>Buy flavored roast coffee,<\/b> like French vanilla, hazelnut or caramel K-cups or ground coffee. The flavor comes from the beans, not from sugar.<\/li><li><b>Skip cappuccino, latte and café pods.<\/b> They are drink mixes with sugar and milk powder, often 50 to 100 calories or more.<\/li><li><b>At Wawa and other gas stations,<\/b> pick a flavored brew if they have one, and skip the flavor syrup shots and creamer.<\/li><li><b>Drink decaf after dinner<\/b> so caffeine does not cut into your sleep. Good sleep helps you keep muscle while you lose fat.<\/li><li><b>Flavored coffee is not sweet.<\/b> It smells and tastes like vanilla or hazelnut, but without sugar. Most people adjust within a week or two.<\/li><\/ul>\n<h2 id=\"p15-3\">The Cookies<\/h2>\n<p>Publix chocolate chip cookies come in two sizes. Check the serving size on the package, because recipes and sizes can change.<\/p>\n<table class=\"stack\"><thead><tr><th>Publix chocolate chip cookie<\/th><th>Weight<\/th><th>Calories<\/th><th>Carbs<\/th><th>Fat<\/th><\/tr><\/thead><tbody><tr><td>Large<\/td><td>34 g<\/td><td class=n>160<\/td><td>21 g<\/td><td>8 g<\/td><\/tr><tr><td>Small<\/td><td>19 g<\/td><td class=n>90<\/td><td>About 12 g<\/td><td>About 4.5 g<\/td><\/tr><\/tbody><\/table>\n<h2 id=\"p15-4\">Your Nightly Portion (fits the 400 allowance)<\/h2>\n<table class=\"stack\"><thead><tr><th>If the store has...<\/th><th>Your portion<\/th><th>Calories<\/th><\/tr><\/thead><tbody><tr><td>Large cookies only<\/td><td>2 large<\/td><td class=n>320<\/td><\/tr><tr><td>Small cookies only<\/td><td>3 to 4 small<\/td><td>270 to 360<\/td><\/tr><tr><td>Both sizes at home<\/td><td>1 large + 2 small<\/td><td class=n>340<\/td><\/tr><tr><td>Both sizes, lighter night<\/td><td>1 large + 1 small<\/td><td class=n>250<\/td><\/tr><\/tbody><\/table>\n<p>Add about 10 to 15 calories for your flavored black coffee. Every option stays under 400.<\/p>\n<p><b>Lighter nights pay off.<\/b> On a 250-calorie night, trim only about 85 calories per meal instead of 130.<\/p>\n<h2 id=\"p15-5\">How to Trim About 130 Calories per Meal<\/h2>\n<p class=\"lead\"><b>Breakfast<\/b><\/p>\n<table class=\"stack\"><thead><tr><th>Breakfast<\/th><th>Trim<\/th><\/tr><\/thead><tbody><tr><td>Protein overnight oats<\/td><td>1/2 cup oats instead of 3/4; skip the sunflower seeds<\/td><\/tr><tr><td>Egg white scramble and toast<\/td><td>2 slices of toast instead of 3; skip the banana<\/td><\/tr><tr><td>Greek yogurt parfait<\/td><td>Skip the almonds; use 1/4 cup oats instead of 1/2<\/td><\/tr><tr><td>Green protein smoothie<\/td><td>Skip the sunflower seeds; use 1/2 banana<\/td><\/tr><tr><td>Veggie omelet and oatmeal<\/td><td>1 whole egg instead of 2; 1/2 cup oats instead of 3/4<\/td><\/tr><tr><td>Road or fast food breakfast<\/td><td>Skip one fruit cup or banana<\/td><\/tr><\/tbody><\/table>\n<p class=\"lead\"><b>Lunch and dinner<\/b><\/p>\n<table class=\"stack\"><thead><tr><th>Meal type<\/th><th>Trim<\/th><\/tr><\/thead><tbody><tr><td>Bowls, burritos and Plan 7 recipes<\/td><td>Skip the fat item (avocado, oil, seeds or nuts) and eat about 3/4 of the rice, potato, pasta or tortilla<\/td><\/tr><tr><td>Crockpot meals<\/td><td>Leave about 1/4 of the rice, potatoes or barley in your container<\/td><\/tr><tr><td>Fish crockpot meals<\/td><td>Skip the avocado, almonds or sunflower seed topping and leave a few bites of the grain or potato<\/td><\/tr><tr><td>Meal builder<\/td><td>Turn on \"Save room for coffee and cookies\"; it lowers the meal target for you<\/td><\/tr><tr><td>Fast food<\/td><td>Skip the fruit cup or banana, or the sauce<\/td><\/tr><\/tbody><\/table>\n<h2 id=\"p15-6\">Tips<\/h2>\n<ul><li><b>Eat the cookies with or right after dinner,<\/b> not on their own later in the evening. Protein and fiber already in your stomach soften the blood sugar rise.<\/li><li><b>Evening workout?<\/b> 1 large or 2 small cookies 30 to 60 minutes before training can replace your pre-workout snack, since they give about the same 20 to 25 g of carbs.<\/li><li><b>Plate them.<\/b> Put your portion on a plate and close the package. It is much easier to stop at 2.<\/li><li><b>Extra cookie nights happen.<\/b> Count it, and trim a little more the next day.<\/li><\/ul>\n<h2 id=\"p15-7\">Shopping List<\/h2>\n<ul class=\"check\"><li><label><input type=\"checkbox\" data-k=\"p15-7-flavored-roast-k-cups-regular\"><span class=\"tx\"><span class=\"it\">Flavored roast K-cups, regular<\/span><span class=\"am\">Buy: 1 box · Note: French vanilla, hazelnut or caramel; not cappuccino or latte pods<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p15-7-flavored-roast-k-cups-decaf\"><span class=\"tx\"><span class=\"it\">Flavored roast K-cups, decaf<\/span><span class=\"am\">Buy: 1 box · Note: For after dinner<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p15-7-publix-chocolate-chip-cookies-large-34-g\"><span class=\"tx\"><span class=\"it\">Publix chocolate chip cookies, large (34 g)<\/span><span class=\"am\">Buy: 1 package · Note: Either size works<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p15-7-publix-chocolate-chip-cookies-small-19-g\"><span class=\"tx\"><span class=\"it\">Publix chocolate chip cookies, small (19 g)<\/span><span class=\"am\">Buy: 1 package · Note: Buy if the large size is out<\/span><\/span><\/label><\/li><\/ul>\n<h2 id=\"p15-8\">Sources<\/h2>\n<ul><li>Publix chocolate chip cookie, large (34 g): <a href=\"https://android.fatsecret.com/calories-nutrition/publix/chocolate-chip-cookies\" target=\"_blank\" rel=\"noopener\">FatSecret<\/a><\/li><li>Publix chocolate chip cookie, small (19 g): <a href=\"https://android.fatsecret.com/calories-nutrition/publix/chocolate-chip-cookies-(19g\" target=\"_blank\" rel=\"noopener\">FatSecret<\/a>); carbs and fat estimated from its listed calorie breakdown<\/li><\/ul>", "heads": [{"id": "p15-1", "t": "How It Works", "l": 2}, {"id": "p15-2", "t": "The Coffee", "l": 2}, {"id": "p15-3", "t": "The Cookies", "l": 2}, {"id": "p15-4", "t": "Your Nightly Portion (fits the 400 allowance)", "l": 2}, {"id": "p15-5", "t": "How to Trim About 130 Calories per Meal", "l": 2}, {"id": "p15-6", "t": "Tips", "l": 2}, {"id": "p15-7", "t": "Shopping List", "l": 2}, {"id": "p15-8", "t": "Sources", "l": 2}]}, {"id": "p16", "kicker": "Reference", "title": "Smart Snacks", "sub": "Low-calorie, low-fat snacks for when you get hungry · no pork, low sodium · November 20, 2026", "kind": "ref", "html": "<h2 id=\"p16-1\">How It Works<\/h2>\n<ul><li><b>Vegetables and broth are nearly free.<\/b> Eat them whenever you are hungry.<\/li><li><b>Protein snacks keep you full the longest.<\/b><\/li><li><b>Count anything over about 100 calories.<\/b> Take it from your cookie allowance that night, or trim a meal slightly.<\/li><li><b>Drink water or unsweetened sparkling water first.<\/b> Thirst often feels like hunger.<\/li><li><b>Numbers are estimates<\/b> from standard USDA values and package labels.<\/li><\/ul>\n<h2 id=\"p16-2\">Nearly Free (under 50 calories, almost no fat)<\/h2>\n<table class=\"stack\"><thead><tr><th>Snack<\/th><th>Portion<\/th><th>Calories<\/th><\/tr><\/thead><tbody><tr><td>Cucumber slices<\/td><td>1 cup<\/td><td>About 15<\/td><\/tr><tr><td>Celery sticks<\/td><td>2 stalks<\/td><td>About 15<\/td><\/tr><tr><td>Cherry tomatoes<\/td><td>1 cup<\/td><td>About 25<\/td><\/tr><tr><td>Bell pepper strips<\/td><td>1 cup<\/td><td>About 30<\/td><\/tr><tr><td>Raw broccoli or cauliflower<\/td><td>1 cup<\/td><td>25 to 30<\/td><\/tr><tr><td>Sugar snap peas<\/td><td>1 cup<\/td><td>30 to 40<\/td><\/tr><tr><td>Baby carrots<\/td><td>1 cup<\/td><td>About 45<\/td><\/tr><tr><td>Low-sodium broth, warmed in a mug<\/td><td>1 cup<\/td><td>10 to 15<\/td><\/tr><tr><td>Salsa as a veggie dip<\/td><td>2 tbsp<\/td><td>About 10<\/td><\/tr><\/tbody><\/table>\n<h2 id=\"p16-3\">Protein Snacks (keep you full longest)<\/h2>\n<table class=\"stack\"><thead><tr><th>Snack<\/th><th>Portion<\/th><th>Calories<\/th><th>Protein<\/th><\/tr><\/thead><tbody><tr><td>Hard-boiled egg whites<\/td><td class=n>2<\/td><td>About 35<\/td><td>7 g<\/td><\/tr><tr><td>Salmon, tuna or chicken pouch<\/td><td>1 (2.6 oz)<\/td><td>70 to 80<\/td><td>13 to 17 g<\/td><\/tr><tr><td>Nonfat plain Greek yogurt<\/td><td>3/4 cup<\/td><td>About 100<\/td><td>17 g<\/td><\/tr><tr><td>Greek yogurt dip with dill and garlic powder<\/td><td>1/4 cup<\/td><td>About 35<\/td><td>6 g<\/td><\/tr><tr><td>Shelled edamame<\/td><td>1/2 cup<\/td><td>About 95<\/td><td>9 g<\/td><\/tr><\/tbody><\/table>\n<h2 id=\"p16-4\">Fruit (sweet, with fiber)<\/h2>\n<table class=\"stack\"><thead><tr><th>Snack<\/th><th>Portion<\/th><th>Calories<\/th><\/tr><\/thead><tbody><tr><td>Clementine<\/td><td class=n>1<\/td><td>About 35<\/td><\/tr><tr><td>Watermelon<\/td><td>1 cup<\/td><td>About 45<\/td><\/tr><tr><td>Strawberries<\/td><td>1 cup<\/td><td>About 50<\/td><\/tr><tr><td>Orange<\/td><td>1 medium<\/td><td>About 60<\/td><\/tr><tr><td>Apple<\/td><td>1 medium<\/td><td>About 95<\/td><\/tr><\/tbody><\/table>\n<h2 id=\"p16-5\">Best Combos<\/h2>\n<table class=\"stack\"><thead><tr><th>Combo<\/th><th>Calories<\/th><th>Why it works<\/th><\/tr><\/thead><tbody><tr><td>Cucumber, peppers and carrots with 1/4 cup Greek yogurt dip<\/td><td>About 100<\/td><td>Crunchy, filling, 6 g protein<\/td><\/tr><tr><td>1 salmon pouch with cucumber slices<\/td><td>About 90<\/td><td>15 g protein; counts toward omega-3s<\/td><\/tr><tr><td>3/4 cup Greek yogurt with 1 cup strawberries<\/td><td>About 150<\/td><td>17 g protein, sweet, vitamin C<\/td><\/tr><tr><td>3 cups air-popped popcorn<\/td><td>About 90<\/td><td>Crunchy evening swap for a cookie, 3 g fiber<\/td><\/tr><tr><td>1 mug low-sodium broth with 2 egg whites<\/td><td>About 50<\/td><td>Warm and filling before bed<\/td><\/tr><\/tbody><\/table>\n<h2 id=\"p16-6\">Skip as Everyday Snacks<\/h2>\n<ul><li><b>Pickles, jerky and regular cottage cheese:<\/b> low in calories but high in sodium.<\/li><li><b>Chips, crackers and granola bars:<\/b> easy to overeat and low in protein.<\/li><li><b>Juice and sweet tea:<\/b> liquid sugar that does not fill you up.<\/li><\/ul>\n<h2 id=\"p16-7\">Hunger Check<\/h2>\n<ul><li><b>If hunger comes with shakiness, sweating or lightheadedness,<\/b> it can be low blood sugar, not true hunger. Check your glucose and treat a low as your doctor advised before reaching for a snack.<\/li><li><b>If you are hungry often, especially on training days,<\/b> you may need more food at meals rather than more snacks. Add a little more protein or carbs to the meal before your workout.<\/li><\/ul>\n<h2 id=\"p16-8\">Shopping List<\/h2>\n<ul class=\"check\"><li><label><input type=\"checkbox\" data-k=\"p16-8-cucumbers-celery-bell-peppers\"><span class=\"tx\"><span class=\"it\">Cucumbers, celery, bell peppers<\/span><span class=\"am\">Buy: A few each · Note: Or pre-cut veggie trays<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p16-8-baby-carrots-and-sugar-snap-peas\"><span class=\"tx\"><span class=\"it\">Baby carrots and sugar snap peas<\/span><span class=\"am\">Buy: 1 bag each · Note: Ready to eat<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p16-8-cherry-tomatoes\"><span class=\"tx\"><span class=\"it\">Cherry tomatoes<\/span><span class=\"am\">Buy: 1 pint<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p16-8-low-sodium-broth\"><span class=\"tx\"><span class=\"it\">Low-sodium broth<\/span><span class=\"am\">Buy: 1 carton (32 oz) · Note: Chicken, beef or vegetable<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p16-8-salsa-lowest-sodium\"><span class=\"tx\"><span class=\"it\">Salsa, lowest sodium<\/span><span class=\"am\">Buy: 1 jar · Note: Veggie dip<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p16-8-eggs\"><span class=\"tx\"><span class=\"it\">Eggs<\/span><span class=\"am\">Buy: 1 dozen · Note: Hard-boil a batch for the week<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p16-8-salmon-tuna-or-chicken-pouches-2-6-oz-\"><span class=\"tx\"><span class=\"it\">Salmon, tuna or chicken pouches (2.6 oz)<\/span><span class=\"am\">Buy: A few · Note: Shelf-stable<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p16-8-nonfat-plain-greek-yogurt\"><span class=\"tx\"><span class=\"it\">Nonfat plain Greek yogurt<\/span><span class=\"am\">Buy: 1 tub (32 oz) · Note: Snacks and dip<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p16-8-shelled-edamame-frozen\"><span class=\"tx\"><span class=\"it\">Shelled edamame, frozen<\/span><span class=\"am\">Buy: 1 bag · Note: Microwave 1 to 2 minutes<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p16-8-clementines-strawberries-apples-or-orang\"><span class=\"tx\"><span class=\"it\">Clementines, strawberries, apples or oranges<\/span><span class=\"am\">Buy: As you like · Note: Fresh or frozen berries<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p16-8-popcorn-kernels-for-air-popping-\"><span class=\"tx\"><span class=\"it\">Popcorn kernels (for air-popping)<\/span><span class=\"am\">Buy: 1 bag · Note: Or plain microwave popcorn with no butter<\/span><\/span><\/label><\/li><\/ul>", "heads": [{"id": "p16-1", "t": "How It Works", "l": 2}, {"id": "p16-2", "t": "Nearly Free (under 50 calories, almost no fat)", "l": 2}, {"id": "p16-3", "t": "Protein Snacks (keep you full longest)", "l": 2}, {"id": "p16-4", "t": "Fruit (sweet, with fiber)", "l": 2}, {"id": "p16-5", "t": "Best Combos", "l": 2}, {"id": "p16-6", "t": "Skip as Everyday Snacks", "l": 2}, {"id": "p16-7", "t": "Hunger Check", "l": 2}, {"id": "p16-8", "t": "Shopping List", "l": 2}]}, {"id": "p17", "kicker": "Reference", "title": "Your Fiber Takeaway", "sub": "November 19, 2026", "kind": "ref", "html": "<p>Fiber is a type of carbohydrate from plant foods that your body can't break down. Instead of being digested, it passes through and does important work along the way. Most foods contain a mix, but they tend to be richer in one type.<\/p>\n<h2 id=\"p17-1\">Two Types of Fiber<\/h2>\n<h3 id=\"p17-2\">Soluble Fiber: \"Swell &amp; Gel\" (slow movers)<\/h3>\n<p>Dissolves in water and forms a gel-like substance in your stomach, slowing digestion.<\/p>\n<p class=\"lead\"><b>What it does:<\/b><\/p>\n<ul><li>Lowers LDL (bad) cholesterol by binding to it so your body can remove it<\/li><li>Slows digestion so blood sugar rises more gently after meals<\/li><li>Keeps you feeling fuller longer, helping with weight management<\/li><\/ul>\n<p class=\"lead\"><b>Best sources:<\/b><\/p>\n<ul><li>Oats and oat bran<\/li><li>Beans, lentils, peas (black beans, lima beans)<\/li><li>Berries, apples, bananas<\/li><li>Avocado<\/li><\/ul>\n<h3 id=\"p17-3\">Insoluble Fiber: \"Fast Movers\" (greens &amp; skins)<\/h3>\n<p>Doesn't dissolve in water. Acts like a scrub brush, adding bulk and keeping things moving.<\/p>\n<p class=\"lead\"><b>What it does:<\/b><\/p>\n<ul><li>Promotes regular bowel movements<\/li><li>Improves insulin sensitivity<\/li><li>Supports gut health and may reduce colon cancer risk<\/li><\/ul>\n<p class=\"lead\"><b>Best sources:<\/b><\/p>\n<ul><li>Whole wheat, bran, whole grain bread/pasta<\/li><li>Greens and vegetables<\/li><li>Skins of fruits and vegetables (apple skins, potato skins)<\/li><li>Nuts and seeds<\/li><\/ul>\n<h2 id=\"p17-4\">Easy Memory Trick: BBGG<\/h2>\n<ul><li><b>B<\/b>eans<\/li><li><b>B<\/b>erries<\/li><li><b>G<\/b>reens<\/li><li><b>G<\/b>rains<\/li><\/ul>\n<h2 id=\"p17-5\">How Much Fiber Do You Need?<\/h2>\n<p>Adults should aim for <b>25 to 34 grams per day<\/b>. About <b>6 to 8 grams<\/b> of that should come from soluble fiber. Most Americans get only about half of this.<\/p>\n<h2 id=\"p17-6\">Fiber and Blood Sugar<\/h2>\n<ul><li>High-fiber diets help keep blood sugar steadier over time<\/li><li>Fiber doesn't cause a blood sugar spike the way other carbs do<\/li><li>Fiber helps protect against heart disease<\/li><li>Ground flaxseed is an easy way to add fiber every day. Keep it up!<\/li><\/ul>\n<h2 id=\"p17-7\">Putting It Into Practice<\/h2>\n<ul><li>Spread fiber across your day (breakfast, lunch, dinner)<\/li><li>Choose whole grains over refined grains at most meals<\/li><li>Use refined carbs (white toast, honey) strategically <b>before<\/b> a workout when you want quick fuel. They're not \"bad,\" just timing-dependent<\/li><li>Increase fiber <b>gradually<\/b> and drink plenty of water to avoid bloating or GI discomfort<\/li><\/ul>", "heads": [{"id": "p17-1", "t": "Two Types of Fiber", "l": 2}, {"id": "p17-2", "t": "Soluble Fiber: \"Swell & Gel\" (slow movers)", "l": 3}, {"id": "p17-3", "t": "Insoluble Fiber: \"Fast Movers\" (greens & skins)", "l": 3}, {"id": "p17-4", "t": "Easy Memory Trick: BBGG", "l": 2}, {"id": "p17-5", "t": "How Much Fiber Do You Need?", "l": 2}, {"id": "p17-6", "t": "Fiber and Blood Sugar", "l": 2}, {"id": "p17-7", "t": "Putting It Into Practice", "l": 2}]}], "meals": [{"id": "m-p1-1", "plan": "p1", "cat": "Breakfasts", "title": "Protein Overnight Oats", "html": "<div class=\"macro\">713 calories · 67 g protein · 71 g carbs · 18 g fat · 15.5 g fiber · mix at night<\/div>\n<ul><li>3/4 cup rolled oats<\/li><li>1.5 scoops whey protein<\/li><li>3/4 cup nonfat plain Greek yogurt<\/li><li>1 tbsp chia seeds<\/li><li>1.5 tbsp unsalted sunflower seeds<\/li><li>3/4 cup strawberries or mixed berries (frozen is fine)<\/li><li>Water or unsweetened almond milk to thin<\/li><\/ul>\n<ol class=\"steps\"><li>Stir the oats, whey, yogurt, chia and sunflower seeds together in a jar or container.<\/li><li>Add water or almond milk a splash at a time until it is as thick as you like.<\/li><li>Top with the berries, cover and refrigerate overnight, or at least 4 hours.<\/li><li>Eat it cold, or microwave 1 to 2 minutes if you like it warm.<\/li><\/ol>", "gro": "p2-10", "groT": "protein overnight oats", "src": null, "macro": "713 calories · 67 g protein · 71 g carbs · 18 g fat · 15.5 g fiber · mix at night"}, {"id": "m-p1-2", "plan": "p1", "cat": "Breakfasts", "title": "Egg White Scramble and Toast", "html": "<div class=\"macro\">About 700 calories · 71 g protein · 71 g carbs · 17 g fat · 13 g fiber · 5 minutes<\/div>\n<ul><li>2 whole eggs<\/li><li>1 2/3 cups liquid egg whites<\/li><li>1 tbsp ground flaxseed<\/li><li>3 slices whole wheat bread<\/li><li>3/4 cup strawberries or mixed berries<\/li><li>1/2 small banana<\/li><li>Nonstick cooking spray<\/li><\/ul>\n<ol class=\"steps\"><li>Whisk the eggs, egg whites and flaxseed in a bowl.<\/li><li>Spray a nonstick skillet and heat it over medium. Pour in the eggs and stir gently for 3 to 4 minutes, until set.<\/li><li>Toast the bread while the eggs cook.<\/li><li>Serve with the berries and banana.<\/li><\/ol>", "gro": "p2-11", "groT": "egg white scramble and toast", "src": null, "macro": "About 700 calories · 71 g protein · 71 g carbs · 17 g fat · 13 g fiber · 5 minutes"}, {"id": "m-p1-3", "plan": "p1", "cat": "Breakfasts", "title": "Greek Yogurt Parfait", "html": "<div class=\"macro\">741 calories · 71 g protein · 72 g carbs · 19 g fat · 16 g fiber · 2 minutes<\/div>\n<ul><li>2.5 cups nonfat plain Greek yogurt<\/li><li>1/2 cup rolled oats<\/li><li>1 cup strawberries or mixed berries<\/li><li>17 almonds<\/li><li>1 tbsp chia seeds<\/li><\/ul>\n<ol class=\"steps\"><li>If the berries are frozen, thaw them in the fridge overnight or microwave them for 30 to 45 seconds.<\/li><li>Layer half the yogurt, half the oats and half the berries in a bowl or jar. Repeat.<\/li><li>Top with the almonds and chia seeds.<\/li><\/ol>", "gro": "p2-12", "groT": "greek yogurt parfait", "src": null, "macro": "741 calories · 71 g protein · 72 g carbs · 19 g fat · 16 g fiber · 2 minutes"}, {"id": "m-p1-4", "plan": "p1", "cat": "Breakfasts", "title": "Green Protein Smoothie", "html": "<div class=\"macro\">753 calories · 73 g protein · 72 g carbs · 19 g fat · 14.5 g fiber · 3 minutes<\/div>\n<ul><li>1 cup unsweetened almond milk with added vitamin E<\/li><li>1 cup nonfat plain Greek yogurt<\/li><li>1.5 scoops whey protein<\/li><li>1 medium banana<\/li><li>1/3 cup rolled oats<\/li><li>1.5 tbsp unsalted sunflower seeds<\/li><li>1 tbsp chia seeds<\/li><li>1/2 cup frozen spinach<\/li><li>Ice<\/li
