n class=\"it\">Nonfat plain Greek yogurt<\/span><span class=\"am\">Buy: 1 tub (32 oz) · Recipe uses: 1/2 cup, for tzatziki<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p10-13-lemon\"><span class=\"tx\"><span class=\"it\">Lemon<\/span><span class=\"am\">Buy: 1 · Recipe uses: Juice for tzatziki<\/span><\/span><\/label><\/li><\/ul>\n<p><b>From the pantry:<\/b> garlic, dried oregano, cumin, black pepper, dried dill, cooking spray.<\/p>\n<h2 id=\"p10-14\">Pantry Staples (buy once)<\/h2>\n<ul class=\"check\"><li><label><input type=\"checkbox\" data-k=\"p10-14-chipotle-powder\"><span class=\"tx\"><span class=\"it\">Chipotle powder<\/span><span class=\"am\">Buy: 1 jar · Used in: Salmon, Southwest chicken and Tex-Mex beef burritos<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p10-14-chili-powder-cumin-garlic-powder\"><span class=\"tx\"><span class=\"it\">Chili powder, cumin, garlic powder<\/span><span class=\"am\">Buy: 1 jar each · Used in: Baja salmon, Tex-Mex beef, lamb burritos<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p10-14-salt-free-taco-or-fajita-seasoning\"><span class=\"tx\"><span class=\"it\">Salt-free taco or fajita seasoning<\/span><span class=\"am\">Buy: 1 jar · Used in: Chicken fajita and shredded beef burritos<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p10-14-salt-free-chili-lime-or-cajun-seasoning\"><span class=\"tx\"><span class=\"it\">Salt-free chili-lime or Cajun seasoning<\/span><span class=\"am\">Buy: 1 jar · Used in: Baja salmon<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p10-14-dried-oregano-and-dried-dill\"><span class=\"tx\"><span class=\"it\">Dried oregano and dried dill<\/span><span class=\"am\">Buy: 1 jar each · Used in: Both lamb burritos<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p10-14-fresh-garlic-or-jarred-minced-garlic\"><span class=\"tx\"><span class=\"it\">Fresh garlic or jarred minced garlic<\/span><span class=\"am\">Buy: 1 · Used in: Tzatziki<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p10-14-nonstick-cooking-spray\"><span class=\"tx\"><span class=\"it\">Nonstick cooking spray<\/span><span class=\"am\">Buy: 1 can · Used in: All cooked burritos<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p10-14-foil\"><span class=\"tx\"><span class=\"it\">Foil<\/span><span class=\"am\">Buy: 1 roll · Used in: Wrapping burritos for the road<\/span><\/span><\/label><\/li><\/ul>\n<p><b>Tortilla tip:<\/b> pick a large (10-inch) whole wheat tortilla with about 200 calories, 35 g carbs and at least 4 g fiber, and check the sodium.<\/p>", "heads": [{"id": "p10-1", "t": "How to Use This List", "l": 2}, {"id": "p10-2", "t": "Fish", "l": 2}, {"id": "p10-3", "t": "No-Cook Salmon and Black Bean Burrito", "l": 3}, {"id": "p10-4", "t": "Cooked Baja Salmon Burrito with Mango Slaw", "l": 3}, {"id": "p10-5", "t": "Chicken", "l": 2}, {"id": "p10-6", "t": "No-Cook Southwest Chicken Burrito", "l": 3}, {"id": "p10-7", "t": "Cooked Chicken Thigh Fajita Burrito", "l": 3}, {"id": "p10-8", "t": "Beef", "l": 2}, {"id": "p10-9", "t": "No-Cook Shredded Beef and Black Bean Burrito", "l": 3}, {"id": "p10-10", "t": "Cooked Tex-Mex Ground Beef Burrito", "l": 3}, {"id": "p10-11", "t": "Lamb", "l": 2}, {"id": "p10-12", "t": "No-Cook Greek Lamb and Chickpea Burrito", "l": 3}, {"id": "p10-13", "t": "Cooked Seared Lamb Gyro Burrito", "l": 3}, {"id": "p10-14", "t": "Pantry Staples (buy once)", "l": 2}]}, {"id": "p11", "kicker": "Plan 6 · Meal Plan", "title": "40-40-20 Fish Crockpot Meals", "sub": "Salmon, white fish, shrimp and canned fish · fresh or packaged · about 700 calories per bowl · 10 to 16 g fiber · key nutrients · November 19, 2026", "kind": "plan", "html": "<h2 id=\"p11-1\">How It Works<\/h2>\n<p>Fish cooks in minutes and dries out over hours, so every recipe works the same way. The grains, beans and vegetables cook first. The fish goes on top for the last 15 to 60 minutes.<\/p>\n<ul><li><b>Step 1:<\/b> Load the base (grain or potato, beans, vegetables, broth and spices). Cook on LOW 5 to 6 hours or HIGH 2 1/2 to 4 hours.<\/li><li><b>Step 2:<\/b> Switch to HIGH. Lay the fish on top, cover and cook until done (see the times below).<\/li><li><b>Step 3:<\/b> Flake or stir, add the finishing toppings and portion into 4 bowls.<\/li><li><b>Each recipe makes 4 servings<\/b> in a 6-quart crockpot. Each bowl is a full meal of about 660 to 715 calories, 67 to 73 g protein, 68 to 76 g carbs and 13 to 18 g fat.<\/li><li><b>Fiber:<\/b> every bowl has beans or lentils, a whole grain or potato, and vegetables or greens. Get your berries at breakfast or as a snack to round out the day.<\/li><li><b>Low sodium:<\/b> use low-sodium broth, no-salt-added canned beans and tomatoes, and salt-free seasoning blends.<\/li><li><b>No pork<\/b> in any recipe.<\/li><li><b>Numbers<\/b> are estimates from standard USDA values and package labels.<\/li><\/ul>\n<h2 id=\"p11-2\">Fresh or Packaged: Fish Timing<\/h2>\n<p>Add fish only after the base is hot and the crockpot is on HIGH. Fish is done at 145°F, when it turns opaque and flakes easily with a fork. Shrimp is done when it is pink and curled.<\/p>\n<table class=\"stack\"><thead><tr><th>Fish<\/th><th>Fresh or thawed<\/th><th>Frozen<\/th><\/tr><\/thead><tbody><tr><td>Salmon fillets (1 inch thick)<\/td><td>20 to 30 min<\/td><td>45 to 60 min<\/td><\/tr><tr><td>Cod, tilapia or pollock fillets<\/td><td>15 to 25 min<\/td><td>40 to 50 min<\/td><\/tr><tr><td>Raw shrimp, peeled<\/td><td>15 to 20 min<\/td><td>30 to 40 min<\/td><\/tr><tr><td>Canned or pouch tuna or salmon<\/td><td>Stir in for the last 10 to 15 min to heat through<\/td><td>Not needed<\/td><\/tr><\/tbody><\/table>\n<p><b>Quick thaw:<\/b> to cut the time, put frozen fillets or shrimp in a sealed bag in cold water for 15 to 30 minutes while the base finishes.<\/p>\n<h2 id=\"p11-3\">Buying Fish<\/h2>\n<p class=\"lead\"><b>From the seafood counter<\/b><\/p>\n<ul><li>Ask for skinless fillets, or ask the counter to remove the skin. Ask for shrimp peeled and deveined.<\/li><li>Look for firm flesh and a clean, mild smell.<\/li><li>Ask whether the fish was previously frozen. Either way, keep it cold and cook it within 1 to 2 days.<\/li><li>Bring your cooler on the way home in warm weather.<\/li><\/ul>\n<p class=\"lead\"><b>Packaged<\/b><\/p>\n<ul><li><b>Frozen fillets:<\/b> store-brand bags of individually wrapped skinless salmon, cod, tilapia or pollock are the cheapest option. Wild sockeye, coho or pink salmon is leaner than farmed Atlantic.<\/li><li><b>Frozen shrimp:<\/b> buy raw, peeled and deveined, tail-off. Check the sodium. Some bags have added salt or sodium-based additives, so pick the lowest-sodium bag you can find.<\/li><li><b>Canned and pouch fish:<\/b> pink salmon pouches and canned light tuna in water. Choose lower-sodium versions when your store has them.<\/li><\/ul>\n<p><b>Where:<\/b> Kroger, Publix and Whole Foods usually have a full seafood counter. Aldi and Walmart are best for low-cost frozen bags, cans and pouches.<\/p>\n<h2 id=\"p11-4\">Meals at a Glance<\/h2>\n<div class=\"scroll\"><table class=\"\"><thead><tr><th>Recipe<\/th><th>Fish<\/th><th>Cal<\/th><th>Protein (g)<\/th><th>Carbs (g)<\/th><th>Fat (g)<\/th><th>Fiber (g)<\/th><th>Prep<\/th><\/tr><\/thead><tbody><tr><td>Lemon-Dill Salmon with Barley and White Beans<\/td><td>Salmon<\/td><td class=n>684<\/td><td class=n>72<\/td><td class=n>68<\/td><td class=n>16<\/td><td class=n>15<\/td><td>10 min<\/td><\/tr><tr><td>Moroccan Salmon with Sweet Potatoes and Chickpeas<\/td><td>Salmon<\/td><td class=n>708<\/td><td class=n>70<\/td><td class=n>72<\/td><td class=n>17<\/td><td class=n>14<\/td><td>15 min<\/td><\/tr><tr><td>Cajun Shrimp and Brown Rice with Red Beans<\/td><td>Shrimp<\/td><td class=n>693<\/td><td class=n>71<\/td><td class=n>69<\/td><td class=n>16<\/td><td class=n>14<\/td><td>10 min<\/td><\/tr><tr><td>Shrimp and Red Lentil Curry<\/td><td>Shrimp<\/td><td class=n>683<\/td><td class=n>73<\/td><td class=n>70<\/td><td class=n>15<\/td><td class=n>13<\/td><td>15 min<\/td><\/tr><tr><td>Mediterranean Cod with Potatoes and Chickpeas<\/td><td>Cod<\/td><td class=n>714<\/td><td class=n>67<\/td><td class=n>76<\/td><td class=n>16<\/td><td class=n>15<\/td><td>10 min<\/td><\/tr><tr><td>Salsa Verde Tilapia Burrito Bowls<\/td><td>Tilapia<\/td><td class=n>685<\/td><td class=n>70<\/td><td class=n>71<\/td><td class=n>15<\/td><td class=n>16<\/td><td>10 min<\/td><\/tr><tr><td>Creamy Salmon and Potato Chowder<\/td><td>Canned salmon<\/td><td class=n>690<\/td><td class=n>70<\/td><td class=n>76<\/td><td class=n>15<\/td><td class=n>12<\/td><td>15 min<\/td><\/tr><tr><td>Tuna and Brown Rice Casserole<\/td><td>Canned tuna<\/td><td class=n>697<\/td><td class=n>70<\/td><td class=n>72<\/td><td class=n>16<\/td><td class=n>10<\/td><td>10 min<\/td><\/tr><\/tbody><\/table><\/div>\n<h2 id=\"p11-5\">Faster Cooking Options<\/h2>\n<p>Every crockpot recipe below has its standard steps first, then faster methods, each listed separately. Recipes that already cook on HIGH list only the Instant Pot and stovetop versions.<\/p>\n<table class=\"stack\"><thead><tr><th>Method<\/th><th>Typical time<\/th><th>Best for<\/th><\/tr><\/thead><tbody><tr><td>Crockpot, all on HIGH<\/td><td>About half to two-thirds of the LOW time<\/td><td>Same pot and steps, just sooner<\/td><\/tr><tr><td>Instant Pot (6-quart)<\/td><td>About 25 minutes to 2 1/2 hours, including time to come to pressure<\/td><td>The fastest hands-off option<\/td><\/tr><tr><td>Stovetop Dutch oven<\/td><td>About 30 minutes to 3 1/2 hours<\/td><td>No special equipment<\/td><\/tr><\/tbody><\/table>\n<ul><li><b>Instant Pot liquid:<\/b> pressure cookers lose almost no liquid, so some recipes use less broth. Use the amount listed in the Instant Pot steps.<\/li><li><b>Avoid the \"burn\" warning:<\/b> put thin liquid on the bottom and spoon tomatoes, tomato paste or salsa on top without stirring. Add cornstarch, yogurt and milk only after pressure cooking.<\/li><li><b>Do not fill past the 2/3 line<\/b> in an Instant Pot. A doubled batch will not fit.<\/li><li><b>Time to pressure:<\/b> the Instant Pot times include about 10 to 15 minutes to come to pressure.<\/li><li><b>Frozen meat:<\/b> thaw it first for the crockpot. In the Instant Pot, frozen boneless chicken needs about 5 more minutes under pressure.<\/li><li><b>Always check doneness:<\/b> chicken 165°F, beef and lamb fork-tender, fish 145°F, shrimp pink.<\/li><\/ul>\n<h2 id=\"p11-6\">Salmon<\/h2>\n<h3 id=\"p11-7\">Lemon-Dill Salmon with Barley and White Beans<\/h3>\n<div class=\"macro\">Per bowl: 684 calories · 72 g protein · 68 g carbs · 16 g fat · 15 g fiber · LOW 5 to 6 hr or HIGH 3 hr<\/div>\n<p><b>Nutrient highlights:<\/b> omega-3 EPA and DHA and selenium (salmon), folate (white beans, spinach), lycopene (tomatoes), very high fiber (barley)<\/p>\n<p><b>Fish:<\/b> 2 lb skinless salmon fillets, fresh from the counter or frozen<\/p>\n<ul><li>1 cup pearled barley<\/li><li>2 cans (15 oz) no-salt-added cannellini beans, drained and rinsed (use about 2 cups)<\/li><li>1 can (14.5 oz) no-salt-added diced tomatoes<\/li><li>1 onion, diced, and 3 cloves garlic (or 1 tsp garlic powder)<\/li><li>3 cups low-sodium chicken or vegetable broth<\/li><li>1 tbsp olive oil, 1 tsp dried dill, zest and juice of 1 lemon, black pepper<\/li><li>1 bag (7 oz) baby spinach, or 2 cups frozen spinach<\/li><li>1 cup nonfat plain Greek yogurt mixed with 1 tsp dill and a squeeze of lemon (sauce)<\/li><\/ul>\n<p class=\"lead\"><b>Standard: crockpot on LOW (about 5 1/2 to 7 hours)<\/b><\/p>\n<ol class=\"steps\"><li>Add the barley, beans, tomatoes, onion, garlic, broth, oil, dill, lemon zest and pepper. Stir.<\/li><li>Cook on LOW 5 to 6 hours or HIGH 3 hours, until the barley is tender.<\/li><li>Switch to HIGH. Stir in the spinach. Lay the salmon on top and sprinkle with dill and pepper. Cover and cook until it flakes (see the timing table).<\/li><li>Squeeze the lemon over it, break the salmon into chunks and portion into 4 bowls. Top each with 1/4 cup dill yogurt sauce.<\/li><\/ol>\n<p class=\"lead\"><b>Faster: crockpot, all on HIGH (about 3 1/2 to 4 hours)<\/b><\/p>\n<ol class=\"steps\"><li>Load the base the same way as the standard steps.<\/li><li>Cook on HIGH 3 hours, until the barley is tender.<\/li><li>Stir in the spinach, add the salmon and cook on HIGH until it flakes (see the timing table). Finish with lemon and the dill sauce.<\/li><\/ol>\n<p class=\"lead\"><b>Fastest: Instant Pot (about 1 hour)<\/b><\/p>\n<ol class=\"steps\"><li>Add the barley, beans, tomatoes, onion, garlic, broth, oil, dill, lemon zest and pepper. Stir.<\/li><li>Pressure cook on HIGH 25 minutes, then let the pressure release naturally for 10 minutes.<\/li><li>Stir in the spinach. Switch to Sauté on Low. Lay the salmon on top, cover with the lid set to Venting, and cook 8 to 12 minutes for fresh or thawed, or 15 to 20 minutes for frozen, until it flakes at 145°F.<\/li><\/ol>\n<p class=\"lead\"><b>Fast: stovetop Dutch oven (about 1 hour)<\/b><\/p>\n<ol class=\"steps\"><li>Bring the barley, beans, tomatoes, onion, garlic, broth, oil and seasonings to a boil. Cover and simmer on low 40 to 45 minutes, until the barley is tender.<\/li><li>Stir in the spinach. Lay the salmon on top, cover and simmer 8 to 12 minutes for fresh or thawed, or 15 to 20 minutes for frozen, until it flakes at 145°F.<\/li><li>Finish with lemon and the dill sauce.<\/li><\/ol>\n<h3 id=\"p11-8\">Moroccan Salmon with Sweet Potatoes and Chickpeas<\/h3>\n<div class=\"macro\">Per bowl: 708 calories · 70 g protein · 72 g carbs · 17 g fat · 14 g fiber · LOW 6 hr or HIGH 3 to 4 hr<\/div>\n<p><b>Nutrient highlights:<\/b> omega-3s (salmon), vitamin E (almonds), vitamin C (sweet potatoes, tomatoes), lycopene (tomato paste), folate (chickpeas)<\/p>\n<p><b>Fish:<\/b> 2 lb skinless salmon fillets, fresh or frozen<\/p>\n<ul><li>2 medium sweet potatoes (about 1 1/4 lb), cut into 1-inch cubes<\/li><li>1 can (15 oz) no-salt-added chickpeas, drained and rinsed<\/li><li>1 can (14.5 oz) no-salt-added diced tomatoes and 2 tbsp tomato paste<\/li><li>1 onion, diced<\/li><li>3 tbsp raisins<\/li><li>1 cup low-sodium broth<\/li><li>2 tsp cumin, 1 tsp paprika, 1 tsp ground ginger, 1/2 tsp cinnamon, 1 tsp garlic powder<\/li><li>1 cup nonfat plain Greek yogurt with lemon juice (sauce)<\/li><li>1/3 cup sliced almonds<\/li><\/ul>\n<p class=\"lead\"><b>Standard: crockpot on LOW (about 6 1/2 to 7 hours)<\/b><\/p>\n<ol class=\"steps\"><li>Add the sweet potatoes, chickpeas, tomatoes, tomato paste, onion, raisins, broth and spices. Stir.<\/li><li>Cook on LOW 6 hours or HIGH 3 to 4 hours, until the sweet potatoes are tender.<\/li><li>Switch to HIGH. Season the salmon with a pinch of cumin and paprika and lay it on top. Cook until it flakes.<\/li><li>Portion into 4 bowls. Top each with 1/4 cup lemon yogurt and a sprinkle of almonds.<\/li><\/ol>\n<p class=\"lead\"><b>Faster: crockpot, all on HIGH (about 3 1/2 to 4 1/2 hours)<\/b><\/p>\n<ol class=\"steps\"><li>Load the base the same way as the standard steps.<\/li><li>Cook on HIGH 3 to 4 hours, until the sweet potatoes are tender.<\/li><li>Add the salmon and cook on HIGH until it flakes (see the timing table). Top with yogurt and almonds.<\/li><\/ol>\n<p class=\"lead\"><b>Fastest: Instant Pot (about 30 minutes)<\/b><\/p>\n<ol class=\"steps\"><li>Add the broth, sweet potatoes, chickpeas, onion, raisins and spices. Spoon the tomatoes and tomato paste on top and do not stir.<\/li><li>Pressure cook on HIGH 4 minutes and quick release.<\/li><li>Switch to Sauté on Low. Lay the salmon on top, cover with the lid set to Venting, and cook 8 to 12 minutes for fresh or thawed, or 15 to 20 minutes for frozen, until it flakes at 145°F.<\/li><\/ol>\n<p class=\"lead\"><b>Fast: stovetop Dutch oven (about 35 minutes)<\/b><\/p>\n<ol class=\"steps\"><li>Bring everything except the salmon, yogurt and almonds to a boil. Cover and simmer 15 to 20 minutes, until the sweet potatoes are tender.<\/li><li>Lay the salmon on top, cover and simmer 8 to 12 minutes for fresh or thawed, or 15 to 20 minutes for frozen, until it flakes at 145°F.<\/li><li>Top with lemon yogurt and almonds.<\/li><\/ol>\n<h2 id=\"p11-9\">Shrimp<\/h2>\n<h3 id=\"p11-10\">Cajun Shrimp and Brown Rice with Red Beans<\/h3>\n<div class=\"macro\">Per bowl: 693 calories · 71 g protein · 69 g carbs · 16 g fat · 14 g fiber · HIGH 2 1/2 to 3 hr<\/div>\n<p><b>Nutrient highlights:<\/b> selenium and zinc (shrimp), vitamin C (bell peppers), vitamin E (avocado), folate (kidney beans), lycopene (tomatoes)<\/p>\n<p><b>Fish:<\/b> 2 1/2 lb raw peeled and deveined shrimp, fresh or frozen<\/p>\n<ul><li>1 cup uncooked brown rice<\/li><li>1 can (15 oz) no-salt-added red kidney beans, drained and rinsed<\/li><li>1 can (14.5 oz) no-salt-added diced tomatoes<\/li><li>2 bell peppers, 1 onion and 2 celery stalks, diced (or 3 cups frozen pepper and onion strips)<\/li><li>2 1/2 cups low-sodium chicken broth<\/li><li>2 tbsp olive oil (1 tbsp to grease the crock, 1 tbsp in the pot)<\/li><li>1 tbsp salt-free Cajun or Creole seasoning, 1 tsp garlic powder, 1 bay leaf<\/li><li>1 1/2 avocados, diced, and hot sauce to serve<\/li><\/ul>\n<p class=\"lead\"><b>Standard: crockpot on HIGH (about 3 to 3 1/2 hours; this recipe already uses HIGH)<\/b><\/p>\n<ol class=\"steps\"><li>Rub the crock with 1 tbsp oil. Add the rice, beans, tomatoes, vegetables, broth, the rest of the oil and the seasoning. Stir.<\/li><li>Cook on HIGH 2 1/2 to 3 hours, until the rice is tender and most of the liquid is absorbed. Crockpots vary, so check at 2 hours.<\/li><li>Stir the shrimp into the top of the rice. Cover and cook until pink (see the timing table).<\/li><li>Remove the bay leaf. Portion into 4 bowls and top with avocado and hot sauce.<\/li><\/ol>\n<p class=\"lead\"><b>Fastest: Instant Pot (about 50 minutes)<\/b><\/p>\n<ol class=\"steps\"><li>Add 1 1/4 cups broth (not 2 1/2), the rice, beans, vegetables, oil and seasoning. Spoon the tomatoes on top and do not stir.<\/li><li>Pressure cook on HIGH 22 minutes, then let the pressure release naturally for 10 minutes.<\/li><li>Switch to Sauté. Stir in the shrimp and cook 3 to 5 minutes for fresh or thawed, or 6 to 8 minutes for frozen, until pink. Top with avocado and hot sauce.<\/li><\/ol>\n<p class=\"lead\"><b>Fast: stovetop Dutch oven (about 55 minutes)<\/b><\/p>\n<ol class=\"steps\"><li>Bring 2 1/2 cups broth, the tomatoes, beans, vegetables, oil and seasoning to a boil. Stir in the rice, cover and simmer on low 40 to 45 minutes, until tender.<\/li><li>Stir in the shrimp, cover and cook 3 to 5 minutes for fresh or thawed, or 6 to 8 minutes for frozen, until pink.<\/li><li>Top with avocado and hot sauce.<\/li><\/ol>\n<h3 id=\"p11-11\">Shrimp and Red Lentil Curry<\/h3>\n<div class=\"macro\">Per bowl: 683 calories · 73 g protein · 70 g carbs · 15 g fat · 13 g fiber · LOW 6 hr or HIGH 3 hr<\/div>\n<p><b>Nutrient highlights:<\/b> folate and L-arginine (lentils), vitamin E and zinc (sunflower seeds), selenium (shrimp), vitamin C (sweet potato, tomatoes)<\/p>\n<p><b>Fish:<\/b> 2 lb raw peeled and deveined shrimp, fresh or frozen<\/p>\n<ul><li>1 cup red lentils, rinsed<\/li><li>1 large sweet potato (about 1 lb), cut into 1-inch cubes<\/li><li>1 can (14.5 oz) no-salt-added diced tomatoes<\/li><li>1 onion, diced<\/li><li>3 cups low-sodium broth<\/li><li>1 tbsp olive oil, 2 tbsp curry powder, 1 tsp ground ginger, 1 tsp garlic powder<\/li><li>1 bag (10 oz) frozen chopped spinach<\/li><li>1 cup nonfat plain Greek yogurt<\/li><li>1/2 cup unsalted sunflower seeds and lime wedges to serve<\/li><\/ul>\n<p class=\"lead\"><b>Standard: crockpot on LOW (about 6 1/2 hours)<\/b><\/p>\n<ol class=\"steps\"><li>Add the lentils, sweet potato, tomatoes, onion, broth, oil and spices. Stir.<\/li><li>Cook on LOW 6 hours or HIGH 3 hours, until the lentils break down and thicken.<\/li><li>Switch to HIGH. Stir in the frozen spinach and shrimp. Cover and cook until the shrimp is pink.<\/li><li>Turn off the heat and stir in the yogurt (adding it off the heat keeps it from curdling). Portion into 4 bowls and top with sunflower seeds and lime.<\/li><\/ol>\n<p class=\"lead\"><b>Faster: crockpot, all on HIGH (about 3 1/2 hours)<\/b><\/p>\n<ol class=\"steps\"><li>Load the base the same way as the standard steps.<\/li><li>Cook on HIGH 3 hours, until the lentils break down.<\/li><li>Stir in the spinach and shrimp and cook on HIGH until pink. Turn off the heat and stir in the yogurt.<\/li><\/ol>\n<p class=\"lead\"><b>Fastest: Instant Pot (about 35 minutes)<\/b><\/p>\n<ol class=\"steps\"><li>Add the broth, lentils, sweet potato, onion, oil and spices. Spoon the tomatoes on top and do not stir.<\/li><li>Pressure cook on HIGH 6 minutes, then let the pressure release naturally for 10 minutes.<\/li><li>Stir in the frozen spinach. Switch to Sauté. Stir in the shrimp and cook 3 to 5 minutes for fresh or thawed, or 6 to 8 minutes for frozen, until pink. Turn off the heat and stir in the yogurt.<\/li><\/ol>\n<p class=\"lead\"><b>Fast: stovetop Dutch oven (about 35 minutes)<\/b><\/p>\n<ol class=\"steps\"><li>Bring the broth, lentils, sweet potato, tomatoes, onion, oil and spices to a boil. Cover and simmer 20 to 25 minutes, until the lentils break down.<\/li><li>Stir in the spinach. Stir in the shrimp, cover and cook 3 to 5 minutes for fresh or thawed, or 6 to 8 minutes for frozen, until pink.<\/li><li>Turn off the heat and stir in the yogurt.<\/li><\/ol>\n<h2 id=\"p11-12\">White Fish<\/h2>\n<h3 id=\"p11-13\">Mediterranean Cod with Potatoes and Chickpeas<\/h3>\n<div class=\"macro\">Per bowl: 714 calories · 67 g protein · 76 g carbs · 16 g fat · 15 g fiber · LOW 6 hr or HIGH 3 to 4 hr<\/div>\n<p><b>Nutrient highlights:<\/b> selenium (cod), vitamin C (potatoes, tomatoes, green beans), vitamin E (olive oil), lycopene (tomatoes), folate (chickpeas, green beans)<\/p>\n<p><b>Fish:<\/b> 2 1/2 lb cod fillets, fresh or frozen (pollock, haddock or tilapia also work)<\/p>\n<ul><li>2 lb baby potatoes, whole (halve any larger than a golf ball)<\/li><li>1 can (15 oz) no-salt-added chickpeas, drained and rinsed<\/li><li>1 can (14.5 oz) no-salt-added diced tomatoes<\/li><li>1 onion, sliced, and 4 cloves garlic (or 1 tsp garlic powder)<\/li><li>1 bag (12 oz) frozen cut green beans<\/li><li>3 tbsp olive oil<\/li><li>2 tsp dried oregano, 1 tsp paprika, black pepper and 1 lemon<\/li><li>1/4 cup grated Parmesan<\/li><\/ul>\n<p class=\"lead\"><b>Standard: crockpot on LOW (about 6 1/2 hours)<\/b><\/p>\n<ol class=\"steps\"><li>Add the potatoes, chickpeas, tomatoes, onion, garlic, green beans, 2 tbsp of the oil, the oregano and pepper. Stir.<\/li><li>Cook on LOW 6 hours or HIGH 3 to 4 hours, until the potatoes are fork-tender.<\/li><li>Switch to HIGH. Lay the cod on top, brush with the last 1 tbsp oil, and sprinkle with paprika and pepper. Cook until it flakes.<\/li><li>Squeeze the lemon over it. Portion into 4 bowls and top with Parmesan.<\/li><\/ol>\n<p class=\"lead\"><b>Faster: crockpot, all on HIGH (about 3 1/2 to 4 1/2 hours)<\/b><\/p>\n<ol class=\"steps\"><li>Load the base the same way as the standard steps.<\/li><li>Cook on HIGH 3 to 4 hours, until the potatoes are tender.<\/li><li>Add the cod and cook on HIGH until it flakes (see the timing table). Finish with lemon and Parmesan.<\/li><\/ol>\n<p class=\"lead\"><b>Fastest: Instant Pot (about 35 minutes)<\/b><\/p>\n<ol class=\"steps\"><li>Add 1/2 cup water, the potatoes, chickpeas, onion, garlic, green beans, 2 tbsp oil and seasonings. Spoon the tomatoes on top and do not stir.<\/li><li>Pressure cook on HIGH 8 minutes and quick release.<\/li><li>Switch to Sauté on Low. Lay the fish on top, cover with the lid set to Venting, and cook 6 to 10 minutes for fresh or thawed, or 12 to 15 minutes for frozen, until it flakes at 145°F. Finish with lemon and Parmesan.<\/li><\/ol>\n<p class=\"lead\"><b>Fast: stovetop Dutch oven (about 40 minutes)<\/b><\/p>\n<ol class=\"steps\"><li>Bring the potatoes, chickpeas, tomatoes, onion, garlic, 2 tbsp oil, seasonings and 1/2 cup water to a boil. Cover and simmer 20 to 25 minutes, until the potatoes are tender. Add the green beans for the last 8 minutes.<\/li><li>Lay the fish on top, cover and simmer 6 to 10 minutes for fresh or thawed, or 12 to 15 minutes for frozen, until it flakes at 145°F.<\/li><li>Finish with lemon and Parmesan.<\/li><\/ol>\n<h3 id=\"p11-14\">Salsa Verde Tilapia Burrito Bowls<\/h3>\n<div class=\"macro\">Per bowl: 685 calories · 70 g protein · 71 g carbs · 15 g fat · 16 g fiber · HIGH 2 1/2 to 3 hr<\/div>\n<p><b>Nutrient highlights:<\/b> selenium (tilapia), folate (black beans, avocado), vitamin C (peppers, salsa verde), vitamin E (avocado)<\/p>\n<p><b>Fish:<\/b> 2 1/4 lb tilapia fillets, fresh or frozen (cod or pollock also work)<\/p>\n<ul><li>3/4 cup uncooked brown rice<\/li><li>1 can (15 oz) no-salt-added black beans, drained and rinsed<\/li><li>1 cup frozen corn<\/li><li>1 cup salsa verde (lowest sodium you can find)<\/li><li>2 bell peppers and 1 onion, diced (or 3 cups frozen pepper and onion strips)<\/li><li>2 cups low-sodium broth<\/li><li>2 tsp cumin, 1 tsp chili powder, 1 tsp garlic powder<\/li><li>1 1/2 avocados, diced<\/li><li>2/3 cup nonfat plain Greek yogurt mixed with lime juice (crema)<\/li><\/ul>\n<p class=\"lead\"><b>Standard: crockpot on HIGH (about 3 to 3 1/2 hours; this recipe already uses HIGH)<\/b><\/p>\n<ol class=\"steps\"><li>Lightly spray the crock with cooking spray. Add the rice, beans, corn, salsa verde, vegetables, broth and spices. Stir.<\/li><li>Cook on HIGH 2 1/2 to 3 hours, until the rice is tender. Check at 2 hours.<\/li><li>Lay the tilapia on top and sprinkle with cumin and chili powder. Cook until it flakes, then break it into chunks.<\/li><li>Portion into 4 bowls. Top with avocado and lime crema.<\/li><\/ol>\n<p class=\"lead\"><b>Fastest: Instant Pot (about 50 minutes)<\/b><\/p>\n<ol class=\"steps\"><li>Add 1 1/4 cups broth (not 2), the rice, beans, corn, vegetables and spices. Pour the salsa verde on top and do not stir.<\/li><li>Pressure cook on HIGH 22 minutes, then let the pressure release naturally for 10 minutes.<\/li><li>Switch to Sauté on Low. Lay the fish on top, cover with the lid set to Venting, and cook 6 to 10 minutes for fresh or thawed, or 12 to 15 minutes for frozen, until it flakes at 145°F. Top with avocado and lime crema.<\/li><\/ol>\n<p class=\"lead\"><b>Fast: stovetop Dutch oven (about 55 minutes)<\/b><\/p>\n<ol class=\"steps\"><li>Bring 2 cups broth, the salsa verde, beans, corn, vegetables and spices to a boil. Stir in the rice, cover and simmer on low 40 to 45 minutes, until tender.<\/li><li>Lay the fish on top, cover and simmer 6 to 10 minutes for fresh or thawed, or 12 to 15 minutes for frozen, until it flakes at 145°F.<\/li><li>Top with avocado and lime crema.<\/li><\/ol>\n<h2 id=\"p11-15\">Canned and Pouch Fish<\/h2>\n<h3 id=\"p11-16\">Creamy Salmon and Potato Chowder<\/h3>\n<div class=\"macro\">Per bowl: 690 calories · 70 g protein · 76 g carbs · 15 g fat · 12 g fiber · about 0.9 g EPA and DHA · LOW 6 hr or HIGH 3 to 4 hr<\/div>\n<p><b>Nutrient highlights:<\/b> omega-3 EPA and DHA (salmon), vitamin E (sunflower seeds), vitamin A and C (carrots, potatoes), folate (white beans)<\/p>\n<p><b>Fish:<\/b> 12 pouches (2.6 oz) pink salmon<\/p>\n<ul><li>1 1/2 lb potatoes, cut into 1-inch cubes<\/li><li>2 carrots and 3 celery stalks, sliced<\/li><li>1 onion, diced<\/li><li>1 cup frozen corn<\/li><li>2 cans (15 oz) no-salt-added cannellini beans, drained and rinsed (use about 2 cups)<\/li><li>3 cups low-sodium broth<\/li><li>1 tbsp olive oil, 1 tsp dried thyme, 1 tsp garlic powder, 1 bay leaf, black pepper<\/li><li>2 cups 2% milk<\/li><li>1 cup nonfat plain Greek yogurt<\/li><li>1/4 cup unsalted sunflower seeds<\/li><\/ul>\n<p class=\"lead\"><b>Standard: crockpot on LOW (about 6 1/2 hours)<\/b><\/p>\n<ol class=\"steps\"><li>Add the potatoes, carrots, celery, onion, corn, beans, broth, oil and seasonings. Stir.<\/li><li>Cook on LOW 6 hours or HIGH 3 to 4 hours, until the potatoes are tender.<\/li><li>Remove the bay leaf. Mash about a third of the potatoes and beans against the side of the crock to thicken it.<\/li><li>Switch to HIGH. Stir in the milk and the salmon from the pouches. Heat for 10 to 15 minutes.<\/li><li>Turn off the heat and stir in the yogurt. Portion into 4 bowls and top with sunflower seeds.<\/li><\/ol>\n<p class=\"lead\"><b>Faster: crockpot, all on HIGH (about 3 1/2 to 4 1/2 hours)<\/b><\/p>\n<ol class=\"steps\"><li>Load the base the same way as the standard steps.<\/li><li>Cook on HIGH 3 to 4 hours, until the potatoes are tender.<\/li><li>Mash some of the potatoes and beans, stir in the milk and salmon, and heat 10 to 15 minutes. Turn off the heat and stir in the yogurt.<\/li><\/ol>\n<p class=\"lead\"><b>Fastest: Instant Pot (about 25 minutes)<\/b><\/p>\n<ol class=\"steps\"><li>Add the broth, potatoes, carrots, celery, onion, corn, beans, oil and seasonings.<\/li><li>Pressure cook on HIGH 5 minutes and quick release. Remove the bay leaf and mash some of the potatoes and beans.<\/li><li>Switch to Sauté on Low. Stir in the milk and salmon and heat 3 to 5 minutes without boiling. Turn off the heat and stir in the yogurt.<\/li><\/ol>\n<p class=\"lead\"><b>Fast: stovetop soup pot (about 30 minutes)<\/b><\/p>\n<ol class=\"steps\"><li>Bring the broth, potatoes, carrots, celery, onion, corn, beans, oil and seasonings to a boil. Cover and simmer 15 to 20 minutes, until the potatoes are tender.<\/li><li>Mash some of the potatoes and beans. Stir in the milk and salmon and heat 3 to 5 minutes without boiling.<\/li><li>Turn off the heat and stir in the yogurt. Top with sunflower seeds.<\/li><\/ol>\n<p><b>Fresh swap:<\/b> lay 1 3/4 lb fresh or frozen skinless salmon on top at step 4 of the standard steps instead of the pouches. Cook it until it flakes, then break it into the chowder. This adds about 6 g fat per bowl. You could also use 2 lb cod, which gives about 5 g less protein per bowl.<\/p>\n<h3 id=\"p11-17\">Tuna and Brown Rice Casserole<\/h3>\n<div class=\"macro\">Per bowl: 697 calories · 70 g protein · 72 g carbs · 16 g fat · 10 g fiber · HIGH 2 1/2 to 3 hr<\/div>\n<p><b>Nutrient highlights:<\/b> selenium (tuna, very high), folate (broccoli, peas), vitamin C (broccoli), L-arginine (tuna, peas)<\/p>\n<p><b>Fish:<\/b> 8 cans (5 oz) light tuna in water, drained<\/p>\n<ul><li>1 1/4 cups uncooked brown rice<\/li><li>8 oz sliced mushrooms<\/li><li>1 onion, diced<\/li><li>3 cups low-sodium broth<\/li><li>2 tbsp olive oil (1 tbsp to grease the crock, 1 tbsp in the pot)<\/li><li>1 tsp garlic powder, 1 tsp dried thyme, 1 tbsp Dijon mustard, black pepper<\/li><li>2 bags (12 oz) frozen broccoli florets and 2 cups frozen peas<\/li><li>1 cup 2% milk<\/li><li>1 cup nonfat plain Greek yogurt<\/li><li>1/2 cup grated Parmesan<\/li><\/ul>\n<p class=\"lead\"><b>Standard: crockpot on HIGH (about 3 hours; this recipe already uses HIGH)<\/b><\/p>\n<ol class=\"steps\"><li>Rub the crock with 1 tbsp oil. Add the rice, mushrooms, onion, broth, the rest of the oil and the seasonings. Stir.<\/li><li>Cook on HIGH 2 hours.<\/li><li>Stir in the frozen broccoli and peas. Cook 30 to 45 minutes more, until the rice is tender.<\/li><li>Stir in the tuna and milk and heat for 10 to 15 minutes.<\/li><li>Turn off the heat and stir in the yogurt and Parmesan. Portion into 4 bowls.<\/li><\/ol>\n<p class=\"lead\"><b>Fastest: Instant Pot (about 50 minutes)<\/b><\/p>\n<ol class=\"steps\"><li>Add 1 1/2 cups broth (not 3), the rice, mushrooms, onion, oil and seasonings.<\/li><li>Pressure cook on HIGH 22 minutes, then let the pressure release naturally for 10 minutes.<\/li><li>Switch to Sauté. Stir in the frozen broccoli and peas and cook 4 to 5 minutes. Stir in the tuna and milk and heat 2 to 3 minutes. Turn off the heat and stir in the yogurt and Parmesan.<\/li><\/ol>\n<p class=\"lead\"><b>Fast: stovetop Dutch oven (about 55 minutes)<\/b><\/p>\n<ol class=\"steps\"><li>Bring 3 cups broth, the mushrooms, onion, oil and seasonings to a boil. Stir in the rice, cover and simmer on low 30 minutes.<\/li><li>Stir in the broccoli and peas, cover and cook 10 to 15 minutes more, until the rice is tender.<\/li><li>Stir in the tuna and milk and heat through. Turn off the heat and stir in the yogurt and Parmesan.<\/li><\/ol>\n<p><b>Fresh swap:<\/b> use 2 lb fresh or frozen cod or pollock. Lay it on top at step 4 of the standard steps, cook until it flakes, and break it in. This gives about 4 g less protein per bowl.<\/p>\n<h2 id=\"p11-18\">Storing Leftovers<\/h2>\n<ul><li><b>Fridge:<\/b> cooked fish bowls keep 3 to 4 days in sealed containers. Reheat until steaming hot, or eat the cold-friendly ones (the burrito bowls and the Moroccan salmon) as they are.<\/li><li><b>Freezer:<\/b> the shrimp curry, Cajun shrimp and rice, and burrito bowls freeze well for up to 2 months. The chowder and casserole get grainy when frozen because of the milk and yogurt, so eat those within 4 days.<\/li><li><b>On the road:<\/b> pack bowls in your cooler at 40°F or below and reheat in the hotel microwave.<\/li><li><b>Mix it up:<\/b> a batch is 4 bowls of one fish. Freeze 2 bowls and rotate with other meals so you are not eating the same fish all week.<\/li><\/ul>\n<h2 id=\"p11-19\">Key Nutrients<\/h2>\n<table class=\"stack\"><thead><tr><th>Nutrient<\/th><th>Best recipes for it<\/th><th>Notes<\/th><\/tr><\/thead><tbody><tr><td>Omega-3 EPA and DHA<\/td><td>All three salmon recipes<\/td><td>Count any of them as a fish meal; aim for 2 a week<\/td><\/tr><tr><td>Selenium (55 mcg a day)<\/td><td>All, especially tuna and shrimp<\/td><td>The tuna casserole is very high in selenium, so skip any selenium supplement that day<\/td><\/tr><tr><td>Zinc (11 mg a day)<\/td><td>Shrimp curry and Cajun shrimp<\/td><td>Lentils, beans and sunflower seeds add more; beef and lamb meals are still your best zinc sources<\/td><\/tr><tr><td>Folate (400 mcg a day)<\/td><td>All, from beans, lentils, spinach and broccoli<\/td><td>Lentil curry and white bean recipes are the strongest<\/td><\/tr><tr><td>Vitamin C (90 mg a day)<\/td><td>Cajun shrimp, tilapia bowls, Moroccan salmon, tuna casserole<\/td><td>Peppers, broccoli, tomatoes and sweet potatoes<\/td><\/tr><tr><td>Vitamin E (15 mg a day)<\/td><td>Shrimp curry, chowder, Moroccan salmon<\/td><td>Sunflower seeds and almonds are the main sources<\/td><\/tr><tr><td>Lycopene<\/td><td>All tomato-based recipes<\/td><td>Add 1 to 2 tbsp more tomato paste to any of them<\/td><\/tr><tr><td>Omega-3 ALA (1.6 g a day)<\/td><td>Not a strong source<\/td><td>Keep chia or flaxseed at breakfast<\/td><\/tr><tr><td>L-arginine and amino acids<\/td><td>All<\/td><td>67 to 73 g complete protein per bowl<\/td><\/tr><\/tbody><\/table>\n<p><b>Supplement notes:<\/b> talk with your doctor before adding fish oil, vitamin E, zinc, selenium or L-arginine supplements. Fish oil can interact with blood thinners. Keep total zinc under 40 mg and selenium under 400 mcg a day. No Brazil nuts.<\/p>\n<h2 id=\"p11-20\">Sources<\/h2>\n<ul><li>Pink salmon pouch nutrition and EPA and DHA: <a href=\"https://starkist.com/?p=9738\" target=\"_blank\" rel=\"noopener\">StarKist<\/a><\/li><li>Safe cooking temperature for fish (145°F): <a href=\"https://www.foodsafety.gov/food-safety-charts/safe-minimum-internal-temperatures\" target=\"_blank\" rel=\"noopener\">FoodSafety.gov<\/a><\/li><li>Nutrient targets and upper limits: NIH Office of Dietary Supplements fact sheets for <a href=\"https://ods.od.nih.gov/factsheets/Zinc-HealthProfessional/\" target=\"_blank\" rel=\"noopener\">zinc<\/a> and <a href=\"https://ods.od.nih.gov/factsheets/Selenium-HealthProfessional/\" target=\"_blank\" rel=\"noopener\">selenium<\/a><\/li><li>Fish fillets, shrimp, canned tuna, grains, beans, vegetables, dairy and nuts: standard USDA values<\/li><\/ul>", "heads": [{"id": "p11-1", "t": "How It Works", "l": 2}, {"id": "p11-2", "t": "Fresh or Packaged: Fish Timing", "l": 2}, {"id": "p11-3", "t": "Buying Fish", "l": 2}, {"id": "p11-4", "t": "Meals at a Glance", "l": 2}, {"id": "p11-5", "t": "Faster Cooking Options", "l": 2}, {"id": "p11-6", "t": "Salmon", "l": 2}, {"id": "p11-7", "t": "Lemon-Dill Salmon with Barley and White Beans", "l": 3}, {"id": "p11-8", "t": "Moroccan Salmon with Sweet Potatoes and Chickpeas", "l": 3}, {"id": "p11-9", "t": "Shrimp", "l": 2}, {"id": "p11-10", "t": "Cajun Shrimp and Brown Rice with Red Beans", "l": 3}, {"id": "p11-11", "t": "Shrimp and Red Lentil Curry", "l": 3}, {"id": "p11-12", "t": "White Fish", "l": 2}, {"id": "p11-13", "t": "Mediterranean Cod with Potatoes and Chickpeas", "l": 3}, {"id": "p11-14", "t": "Salsa Verde Tilapia Burrito Bowls", "l": 3}, {"id": "p11-15", "t": "Canned and Pouch Fish", "l": 2}, {"id": "p11-16", "t": "Creamy Salmon and Potato Chowder", "l": 3}, {"id": "p11-17", "t": "Tuna and Brown Rice Casserole", "l": 3}, {"id": "p11-18", "t": "Storing Leftovers", "l": 2}, {"id": "p11-19", "t": "Key Nutrients", "l": 2}, {"id": "p11-20", "t": "Sources", "l": 2}]}, {"id": "p12", "kicker": "Plan 6 · Grocery List", "title": "40-40-20 Fish Crockpot Meals Grocery List", "sub": "One list per recipe · 4 bowls each · fresh or packaged fish · November 20, 2026", "kind": "grocery", "html": "<h2 id=\"p12-1\">How to Use This List<\/h2>\n<ul><li><b>Shop by meal.<\/b> Each recipe has its own complete list for a 4-bowl batch.<\/li><li><b>Pick fresh or packaged fish.<\/b> The first row of each list gives both options. Use the seafood counter where your store has one, or frozen bags, cans and pouches.<\/li><li><b>\"Buy\" is the package size. \"Recipe uses\" is how much goes in the batch.<\/b> Opened cartons and bags carry over to the next recipe.<\/li><li><b>Some items repeat across recipes,<\/b> like broth, diced tomatoes, Greek yogurt and onions. Check your pantry before buying them again.<\/li><li><b>Spices and olive oil<\/b> are in Pantry Staples at the end.<\/li><\/ul>\n<h2 id=\"p12-2\">Salmon<\/h2>\n<h3 id=\"p12-3\">Lemon-Dill Salmon with Barley and White Beans<\/h3>\n<ul class=\"check\"><li><label><input type=\"checkbox\" data-k=\"p12-3-skinless-salmon-fillets\"><span class=\"tx\"><span class=\"it\">Skinless salmon fillets<\/span><span class=\"am\">Buy: 2 lb fresh from the counter, or 2 lb frozen · Recipe uses: 2 lb<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p12-3-pearled-barley\"><span class=\"tx\"><span class=\"it\">Pearled barley<\/span><span class=\"am\">Buy: 1 bag · Recipe uses: 1 cup<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p12-3-no-salt-added-cannellini-beans\"><span class=\"tx\"><span class=\"it\">No-salt-added cannellini beans<\/span><span class=\"am\">Buy: 2 cans (15 oz) · Recipe uses: About 2 cups<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p12-3-no-salt-added-diced-tomatoes\"><span class=\"tx\"><span class=\"it\">No-salt-added diced tomatoes<\/span><span class=\"am\">Buy: 1 can (14.5 oz) · Recipe uses: 1 can<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p12-3-onion\"><span class=\"tx\"><span class=\"it\">Onion<\/span><span class=\"am\">Buy: 1 · Recipe uses: 1, diced<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p12-3-garlic-or-garlic-powder-\"><span class=\"tx\"><span class=\"it\">Garlic (or garlic powder)<\/span><span class=\"am\">Buy: 1 head · Recipe uses: 3 cloves<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p12-3-low-sodium-chicken-or-vegetable-broth\"><span class=\"tx\"><span class=\"it\">Low-sodium chicken or vegetable broth<\/span><span class=\"am\">Buy: 1 carton (32 oz) · Recipe uses: 3 cups<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p12-3-baby-spinach-or-frozen-spinach-\"><span class=\"tx\"><span class=\"it\">Baby spinach (or frozen spinach)<\/span><span class=\"am\">Buy: 1 bag (7 oz) · Recipe uses: 1 bag (or 2 cups frozen)<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p12-3-lemon\"><span class=\"tx\"><span class=\"it\">Lemon<\/span><span class=\"am\">Buy: 1 · Recipe uses: Zest and juice<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p12-3-nonfat-plain-greek-yogurt\"><span class=\"tx\"><span class=\"it\">Nonfat plain Greek yogurt<\/span><span class=\"am\">Buy: 1 tub (32 oz) · Recipe uses: 1 cup, for dill sauce<\/span><\/span><\/label><\/li><\/ul>\n<p><b>From the pantry:<\/b> olive oil, dried dill, black pepper.<\/p>\n<h3 id=\"p12-4\">Moroccan Salmon with Sweet Potatoes and Chickpeas<\/h3>\n<ul class=\"check\"><li><label><input type=\"checkbox\" data-k=\"p12-4-skinless-salmon-fillets\"><span class=\"tx\"><span class=\"it\">Skinless salmon fillets<\/span><span class=\"am\">Buy: 2 lb fresh from the counter, or 2 lb frozen · Recipe uses: 2 lb<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p12-4-sweet-potatoes\"><span class=\"tx\"><span class=\"it\">Sweet potatoes<\/span><span class=\"am\">Buy: 2 medium (about 1 1/4 lb) · Recipe uses: 2, cubed<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p12-4-no-salt-added-chickpeas\"><span class=\"tx\"><span class=\"it\">No-salt-added chickpeas<\/span><span class=\"am\">Buy: 1 can (15 oz) · Recipe uses: 1 can<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p12-4-no-salt-added-diced-tomatoes\"><span class=\"tx\"><span class=\"it\">No-salt-added diced tomatoes<\/span><span class=\"am\">Buy: 1 can (14.5 oz) · Recipe uses: 1 can<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p12-4-tomato-paste\"><span class=\"tx\"><span class=\"it\">Tomato paste<\/span><span class=\"am\">Buy: 1 small can (6 oz) · Recipe uses: 2 tbsp<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=
