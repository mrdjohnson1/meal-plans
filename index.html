<style>
/* VOICE: practical kitchen reference, calm and quick to scan on a phone
   IDEA: a recipe binder with colored tabs: one tab per plan, grocery list right behind it
   PICTURE: the daily 40-40-20 plate split as a big bar, with the per-meal targets beside it
   COLOUR and TYPE: deep herb green ground, white pages, tomato red accent; Figtree throughout
   LAYOUT: sticky top bar with menu and search, home grid of plan tabs, one section per view */
:root{color-scheme:light dark;
--bg:light-dark(#f4f6f3,#0f1714);--page:light-dark(#ffffff,#16211c);--ink:light-dark(#18211d,#e7efe9);
--mute:light-dark(#5b6b63,#9fb2a8);--line:light-dark(#dfe6e1,#2a3a33);--green:#1f4a3c;--green2:light-dark(#2e6b56,#5fb08f);
--tint:light-dark(#e8f1ec,#1d2d26);--red:#d9472b;--gold:#e8a33d;--blue:#3c7fb8}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:136px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Figtree,system-ui,sans-serif;overflow-x:clip}
a{color:var(--green2)}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.top{position:sticky;top:0;z-index:20;background:var(--green);color:#fff;display:flex;align-items:center;gap:8px;padding:8px max(3vw,10px);box-shadow:0 2px 10px #0003}
.top .brand{font-weight:800;font-size:18px;color:#fff;text-decoration:none;margin-right:auto;white-space:nowrap}
.ib{min-width:44px;height:44px;border:0;border-radius:10px;background:#ffffff1a;color:#fff;font-weight:700;padding:0 12px}
.ib:hover{background:#ffffff33}
.drawer{position:fixed;inset:0;z-index:30;display:none}
.drawer.open{display:block}
.drawer .shade{position:absolute;inset:0;background:#0007}
.drawer nav{position:absolute;top:0;left:0;bottom:0;width:min(340px,88vw);background:var(--page);overflow-y:auto;padding:16px;box-shadow:4px 0 20px #0004}
.drawer h4{margin:16px 0 6px;font-size:13px;color:var(--mute)}
.drawer a{display:flex;align-items:center;min-height:44px;padding:0 12px;border-radius:10px;text-decoration:none;color:var(--ink);font-weight:600}
.drawer a:hover,.drawer a.on{background:var(--tint)}
.drawer a .tag{margin-left:auto;font-size:12px;color:var(--mute);font-weight:600}
main{max-width:900px;margin:0 auto;padding:0 max(3vw,12px) 80px}
.hero{background:var(--green);color:#fff;margin:0 calc(-1*max(3vw,12px));padding:28px max(5vw,18px) 34px}
.hero h1{font-size:clamp(30px,6vw,46px);line-height:1.05;margin:0 0 6px;text-wrap:balance}
.hero p{margin:0 0 20px;color:#d7e7df;max-width:60ch}
.plate{display:flex;height:64px;border-radius:14px;overflow:hidden;box-shadow:0 6px 0 #0003}
.plate div{display:flex;flex-direction:column;justify-content:center;padding:0 14px;color:#fff;font-weight:800;line-height:1.15}
.plate small{font-weight:600;font-size:13px;opacity:.9}
.pp{background:var(--red);flex:40}.pc{background:var(--gold);flex:40;color:#2b1d05!important}.pf{background:var(--blue);flex:20}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:16px}
.stat{background:#ffffff14;border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:22px}.stat span{font-size:13px;color:#d7e7df}
.search{position:relative;margin:18px 0 6px}
.search input{width:100%;height:50px;border-radius:12px;border:2px solid var(--line);background:var(--page);color:var(--ink);font:inherit;font-size:16px;padding:0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:12px;margin-top:14px}
.card{background:var(--page);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.card .k{font-size:13px;font-weight:700;color:var(--red)}
.card h3{margin:0;font-size:19px;line-height:1.2}
.card .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 14px;border-radius:10px;font-weight:700;text-decoration:none;border:0}
.btn.p{background:var(--green);color:#fff}.btn.s{background:var(--tint);color:var(--ink)}
.sec{background:var(--page);border:1px solid var(--line);border-radius:16px;padding:clamp(16px,4vw,32px);margin-top:16px}
.kick{font-size:13px;font-weight:700;color:var(--red)}
.sec h1{font-size:clamp(28px,5vw,40px);line-height:1.08;margin:4px 0 6px;text-wrap:balance}
.sub{color:var(--mute);margin:0 0 12px;padding-bottom:12px;border-bottom:2px solid var(--green2)}
.jump{display:flex;gap:6px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:thin}
.jump a{flex:none;white-space:nowrap;padding:8px 12px;border-radius:999px;background:var(--tint);color:var(--ink);text-decoration:none;font-size:14px;font-weight:600}
.body h2{font-size:24px;line-height:1.2;color:var(--green2);margin:28px 0 8px}
.body h3{font-size:19px;margin:22px 0 6px}
.body p,.body li{max-width:70ch}
.body ul,.body ol{padding-left:22px}.body li{margin:4px 0}
.macro{background:var(--tint);border-left:4px solid var(--green2);border-radius:8px;padding:8px 12px;font-weight:700;color:var(--green2);margin:8px 0}
.lead{font-weight:700}
table{width:100%;border-collapse:collapse;font-size:15px;margin:8px 0 14px}
th{background:var(--green);color:#fff;text-align:left;padding:8px;font-size:14px}
td{border-bottom:1px solid var(--line);padding:8px;vertical-align:top}
tbody tr:nth-child(even) td{background:var(--tint)}
td.n{text-align:right;white-space:nowrap}
.scroll{overflow-x:auto}.scroll table{min-width:560px}
.check{list-style:none;padding:0!important;margin:6px 0 16px}
.check li{margin:0!important;border-bottom:1px solid var(--line)}
.check label{display:flex;gap:12px;align-items:flex-start;padding:10px 4px;min-height:48px;cursor:pointer}
.check input{width:24px;height:24px;flex:none;accent-color:var(--green2);margin-top:1px}
.check .tx{flex:1;display:flex;flex-direction:column}.check .it{font-weight:600}.check .am{color:var(--mute);font-size:14px}
.check input:checked~.tx{text-decoration:line-through;opacity:.5}
.prog{position:sticky;top:60px;z-index:5;display:flex;align-items:center;gap:10px;background:var(--page);padding:10px 0;border-bottom:1px solid var(--line)}
.bar{flex:1;height:10px;border-radius:9px;background:var(--tint);overflow:hidden}.bar i{display:block;height:100%;background:var(--green2);width:0;transition:width .3s}
.pager{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;margin-top:24px}
.res{background:var(--page);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0;display:block;text-decoration:none;color:var(--ink)}
.res b{display:block}.res small{color:var(--red);font-weight:700}.res span{display:block;color:var(--mute);font-size:14px}
mark{background:#f7d774;color:#000;border-radius:3px}
.note{color:var(--mute);font-size:14px;margin-top:22px}
.flash{animation:fl 1.6s ease}@keyframes fl{0%{background:#f7d77488}100%{background:transparent}}
@media(prefers-reduced-motion:reduce){.flash{animation:none}.bar i{transition:none}}
@media(max-width:600px){table{font-size:14px}.stack thead{display:none}.stack tr{display:grid;padding-block:8px;border-bottom:1px solid var(--line)}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:7.5em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7em;margin-inline-start:-7.5em;font-weight:700;color:var(--mute);font-size:13px;white-space:normal}.stack td:empty{display:none}.stack tbody tr:nth-child(even) td{background:none}
.top .brand{font-size:16px}.plate div{padding:0 8px}}
</style>
<script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script>

<script type="application/json" id="data">[{"id": "p1", "kicker": "Plan 1 · Meal Plan", "title": "40-40-20 Crockpot Meal Plan", "sub": "2,100 calories per day · 35 g+ fiber · key vitamins and minerals · 3 meals · 2 crockpots per cook day · November 19, 2026", "kind": "plan", "html": "<h2 id=\"p1-1\">How the Plan Works<\/h2>\n<p>The daily target is 2,100 calories: 40% protein (210 g), 40% carbs (210 g) and 20% fat (about 47 g). Split evenly across 3 meals, each meal is about 700 calories with 70 g protein, 70 g carbs and 16 g fat. The crockpot meals run a little over on fat (18 to 25 g) because they use chicken thighs, beef and lamb. Every meal also carries 11 to 16 g of fiber, so each day lands at about 38 to 42 g.<\/p>\n<ul><li><b>Two cook days, rotate them:<\/b> Each cook day fills two 6-quart crockpots with 5 portions apiece. That covers lunch and dinner for 5 days. Cook Day A (chicken burrito bowl + beef pot roast), then Cook Day B (Moroccan lamb + lemon chicken, white beans and brown rice), gives 10 days before a meal repeats.<\/li><li><b>Easy prep:<\/b> Meat goes in whole and gets shredded in the pot after cooking. Rice and potatoes cook in the same crockpot. Frozen greens and vegetables get stirred in near the end, so knife work is close to none.<\/li><li><b>Portioning:<\/b> Divide each pot into 5 equal containers. A food scale makes this exact: weigh the full pot contents, subtract the empty pot, divide by 5.<\/li><li><b>Storage:<\/b> Refrigerate the portions for days 1 to 3. Freeze the portions for days 4 and 5 the same day you cook. Cooked leftovers keep 3 to 4 days in the fridge.<\/li><li><b>Accuracy:<\/b> Macros and fiber were calculated from standard nutrition values for the raw ingredients. Thigh, roast and lamb fat varies by brand and trim, so check labels and skim visible fat from the top of the pot.<\/li><li><b>Low sodium:<\/b> Every canned item is no-salt-added, broth is low sodium, and seasoning comes from salt-free blends, garlic, citrus and herbs.<\/li><li><b>Key nutrients:<\/b> Zinc, vitamins C and E, lycopene, amino acids including L-arginine, omega-3s, selenium and folate are built into the meals. See the Key Nutrients section for targets and sources.<\/li><li><b>Fish twice a week:<\/b> Swap one crockpot meal for the Salmon Bowl twice a week and freeze the spare portion for later.<\/li><li><b>Shopping:<\/b> See the separate grocery list for store-brand picks, frozen swaps and cost-saving tips.<\/li><\/ul>\n<h2 id=\"p1-2\">Fiber Plan: Beans, Greens, Berries and Grains<\/h2>\n<p>All four groups show up every day. Together they give a mix of soluble fiber, which forms a gel that softens stool and slows how fast sugar enters the blood, and insoluble fiber, which adds bulk and keeps things moving.<\/p>\n<table class=\"stack\"><thead><tr><th>Group<\/th><th>Where it shows up<\/th><th>Main fiber type<\/th><\/tr><\/thead><tbody><tr><td>Beans<\/td><td>Black beans (burrito bowl), chickpeas (lamb), white beans (lemon chicken), peas<\/td><td>Both; strong soluble source<\/td><\/tr><tr><td>Greens<\/td><td>Frozen spinach in 3 of 4 crockpots, broccoli in the pot roast, spinach in the smoothie and omelet, salad greens in the Salmon Bowl<\/td><td>Mostly insoluble<\/td><\/tr><tr><td>Berries<\/td><td>Every breakfast<\/td><td>Both; pectin is soluble<\/td><\/tr><tr><td>Grains<\/td><td>Brown rice (2 crockpots), oats (4 breakfasts), whole wheat bread<\/td><td>Oats are soluble (beta-glucan); brown rice and whole wheat are insoluble<\/td><\/tr><tr><td>Bonus<\/td><td>Sweet potatoes, potatoes with skin, carrots, chia seeds, almonds<\/td><td>Chia, sweet potato and carrots add soluble; skins and nuts add insoluble<\/td><\/tr><\/tbody><\/table>\n<p class=\"lead\"><b>Making fiber work for constipation and blood sugar<\/b><\/p>\n<ul><li><b>Drink more water.<\/b> Fiber pulls water into the gut. Without enough fluid, more fiber can make constipation worse.<\/li><li><b>Ramp up over 1 to 2 weeks<\/b> if you currently eat much less fiber. A sudden jump can cause gas and bloating.<\/li><li><b>Eat the fiber with the protein.<\/b> Every meal pairs both, which slows digestion and keeps blood sugar steadier than carbs eaten alone.<\/li><li><b>The pre-workout snack is the exception.<\/b> It is refined carbs on purpose, timed right before training when your muscles use the sugar quickly.<\/li><li><b>Check with your doctor<\/b> if constipation lasts more than a few weeks, comes with pain or blood, or if you take medication for blood sugar, since more fiber can change how your numbers respond.<\/li><\/ul>\n<h2 id=\"p1-3\">Key Nutrients<\/h2>\n<p>Targets are the daily recommendations for adult men from the NIH Office of Dietary Supplements. Daily amounts are estimates from standard USDA food values; actual amounts vary by brand and cooking.<\/p>\n<table class=\"stack\"><thead><tr><th>Nutrient<\/th><th>Daily target<\/th><th>Main sources in this plan<\/th><th>Typical day<\/th><\/tr><\/thead><tbody><tr><td>Zinc<\/td><td>11 mg (upper limit 40 mg)<\/td><td>Beef pot roast, lamb, chicken thighs, oats, chia, sunflower seeds, Greek yogurt<\/td><td>About 17 to 27 mg<\/td><\/tr><tr><td>Selenium<\/td><td>55 mcg (upper limit 400 mcg)<\/td><td>Beef, chicken, lamb, salmon, eggs, oats, brown rice, whole wheat bread<\/td><td>About 230 to 320 mcg<\/td><\/tr><tr><td>Folate<\/td><td>400 mcg<\/td><td>Spinach, black and white beans, chickpeas, peas, broccoli, avocado, sunflower seeds<\/td><td>About 465 to 700 mcg<\/td><\/tr><tr><td>Vitamin C<\/td><td>90 mg<\/td><td>Peppers, broccoli, potatoes, strawberries, tomatoes, lemon and lime<\/td><td>About 130 to 220 mg<\/td><\/tr><tr><td>Vitamin E<\/td><td>15 mg<\/td><td>Sunflower seeds, almonds, spinach, broccoli, avocado, tomato paste<\/td><td>About 8 to 12 mg from meals; 15 mg or more with the add-on below<\/td><\/tr><tr><td>Lycopene<\/td><td>No official target<\/td><td>Canned tomatoes and tomato paste in all four crockpots, cherry tomatoes<\/td><td>About 4 to 7 mg<\/td><\/tr><tr><td>Omega-3 EPA and DHA<\/td><td>No official target; 1 to 2 seafood meals a week is the common advice<\/td><td>Salmon Bowl twice a week<\/td><td>About 1.2 g per Salmon Bowl<\/td><\/tr><tr><td>Omega-3 ALA<\/td><td>1.6 g<\/td><td>Chia or ground flaxseed at every breakfast<\/td><td>About 2.5 to 3 g<\/td><\/tr><tr><td>L-arginine and other amino acids<\/td><td>No official target<\/td><td>70 g or more of complete protein per meal from chicken, beef, lamb, salmon, eggs and dairy, plus beans, nuts and seeds<\/td><td>Well covered<\/td><\/tr><\/tbody><\/table>\n<p class=\"lead\"><b>Closing the vitamin E gap<\/b><\/p>\n<p>Vitamin E is the one nutrient the meals fall short on. That is common: the NIH notes most American diets provide less than the recommended amount. Pick one:<\/p>\n<ul><li><b>Add 1/2 to 1 oz unsalted sunflower seeds a day<\/b> (about 80 to 165 calories, 3.7 to 7.4 mg vitamin E). Sprinkle them on a crockpot bowl or eat them as a snack.<\/li><li><b>Use unsweetened almond milk with added vitamin E<\/b> in oatmeal, overnight oats or the smoothie. Check the label; many brands add it.<\/li><\/ul>\n<p class=\"lead\"><b>Getting the most from these nutrients<\/b><\/p>\n<ul><li><b>Tomatoes are cooked with the meat<\/b> in every crockpot. Cooking and a little fat help your body absorb lycopene.<\/li><li><b>Skip Brazil nuts as a daily habit.<\/b> One ounce has about 544 mcg of selenium, above the 400 mcg upper limit, and this plan already covers selenium.<\/li><li><b>Keep the fish twice a week.<\/b> It is the only meaningful source of EPA and DHA in the plan.<\/li><\/ul>\n<h2 id=\"p1-4\">Supplement Notes<\/h2>\n<p>Food covers most of these nutrients. If you consider supplements, talk with your doctor first, especially if you take any medications.<\/p>\n<ul><li><b>Fish oil:<\/b> worth discussing if you eat fewer than 2 fish meals a week. Ask about dose; fish oil can interact with blood-thinning medications.<\/li><li><b>Vitamin E:<\/b> food sources and the add-on above come first. Ask your doctor before taking a vitamin E supplement.<\/li><li><b>Multivitamin:<\/b> check the zinc and selenium amounts. This plan already provides about 17 to 27 mg zinc and 230 to 320 mcg selenium, and the upper limits are 40 mg and 400 mcg a day.<\/li><li><b>L-arginine:<\/b> the plan's protein supplies it from food. Ask your doctor before adding an L-arginine supplement.<\/li><\/ul>\n<h2 id=\"p1-5\">Cook Day A<\/h2>\n<h3 id=\"p1-6\">Crockpot 1: Chicken Thigh Burrito Bowl with Brown Rice and Spinach (5 portions)<\/h3>\n<div class=\"macro\">Per portion: 71 g protein · 71 g carbs · 20 g fat · 13 g fiber · about 750 calories<\/div>\n<p class=\"lead\"><b>Ingredients<\/b><\/p>\n<ul><li>3 lb boneless skinless chicken thighs, whole<\/li><li>2 cans (15 oz) no-salt-added black beans, drained and rinsed<\/li><li>1.5 cups frozen corn<\/li><li>1 can (14.5 oz) no-salt-added diced tomatoes with their juice<\/li><li>1 bag (10 oz) frozen pepper and onion blend (one with red peppers has the most vitamin C)<\/li><li>2 tbsp tomato paste (no salt added)<\/li><li>3/4 cup plus 2 tbsp uncooked long-grain brown rice<\/li><li>1 box or bag (10 oz) frozen chopped spinach<\/li><li>2 cups low-sodium chicken broth<\/li><li>2 tbsp salt-free taco seasoning, 1 tsp cumin, 1 tbsp jarred minced garlic<\/li><li>Juice of 2 limes (or 3 tbsp bottled lime juice)<\/li><li>Topping, split across 5 portions: 3/4 cup nonfat plain Greek yogurt<\/li><\/ul>\n<p class=\"lead\"><b>Steps<\/b><\/p>\n<ol><li>Dump the beans, corn, tomatoes, tomato paste, pepper and onion blend, garlic and seasoning into the crockpot. Stir, then lay the thighs on top.<\/li><li>Cook on LOW 5 to 6 hours.<\/li><li>Shred the chicken in the pot with two forks.<\/li><li>Stir in the brown rice, broth and frozen spinach (no need to thaw). Switch to HIGH and cook 2 to 2.5 hours, until the rice is tender. Stir once halfway.<\/li><li>Stir in lime juice. Divide into 5 containers and top each with about 2.5 tbsp Greek yogurt when serving.<\/li><\/ol>\n<h3 id=\"p1-7\">Crockpot 2: Shredded Beef Pot Roast with Potatoes, Carrots and Broccoli (5 portions)<\/h3>\n<div class=\"macro\">Per portion: 72 g protein · 69 g carbs · 18 g fat · 12.5 g fiber · about 730 calories<\/div>\n<p class=\"lead\"><b>Ingredients<\/b><\/p>\n<ul><li>3.25 lb bottom round or rump roast, whole<\/li><li>3.5 lb baby gold potatoes, whole (leave the skins on for fiber)<\/li><li>1 lb baby carrots<\/li><li>1 cup frozen diced onion<\/li><li>1 bag (16 oz) frozen broccoli florets<\/li><li>3 tbsp tomato paste (no salt added)<\/li><li>1 cup low-sodium beef broth<\/li><li>1 tbsp jarred minced garlic, 1 tsp dried thyme, 1 tsp rosemary, 1 tsp onion powder, black pepper<\/li><li>1 tbsp balsamic vinegar or Worcestershire (Worcestershire adds some sodium)<\/li><\/ul>\n<p class=\"lead\"><b>Steps<\/b><\/p>\n<ol><li>Put the potatoes, carrots and onion in the bottom of the crockpot.<\/li><li>Rub the roast with the garlic, herbs and pepper. Set it on the vegetables. Whisk the tomato paste into the broth and vinegar and pour it around the roast.<\/li><li>Cook on LOW 9 to 10 hours, until the roast pulls apart easily. Round roasts need the full time to get tender.<\/li><li>For the last 45 to 60 minutes, add the frozen broccoli on top.<\/li><li>Lift out the roast, shred it with two forks, and return it to the pot. Skim fat off the top if you see any. Divide into 5 containers by weight.<\/li><\/ol>\n<h2 id=\"p1-8\">Cook Day B<\/h2>\n<h3 id=\"p1-9\">Crockpot 1: Moroccan Shredded Lamb with Chickpeas, Sweet Potatoes and Spinach (5 portions)<\/h3>\n<div class=\"macro\">Per portion: 70 g protein · 71 g carbs · 25 g fat · 16 g fiber · about 790 calories<\/div>\n<p>This is the highest-fat meal in the plan. Skimming the fat after cooking brings it down.<\/p>\n<p class=\"lead\"><b>Ingredients<\/b><\/p>\n<ul><li>2.75 lb boneless leg of lamb, whole (remove the netting, leave it in one piece)<\/li><li>3 cans (15 oz) no-salt-added chickpeas, drained and rinsed<\/li><li>1.5 lb sweet potatoes, peeled and cut into large chunks (or frozen cubed sweet potatoes)<\/li><li>1 can (14.5 oz) no-salt-added diced tomatoes with their juice<\/li><li>2 tbsp tomato paste (no salt added)<\/li><li>1 cup frozen diced onion<\/li><li>1 box or bag (10 oz) frozen chopped spinach<\/li><li>1 cup low-sodium chicken broth<\/li><li>1 tbsp jarred minced garlic, 2 tsp cumin, 1 tsp cinnamon, 1 tsp smoked paprika, 1 tsp ground ginger, black pepper<\/li><li>Juice of 1 lemon<\/li><li>Topping, split across 5 portions: 1 cup nonfat plain Greek yogurt<\/li><\/ul>\n<p class=\"lead\"><b>Steps<\/b><\/p>\n<ol><li>Put the sweet potatoes, chickpeas, tomatoes, tomato paste and onion in the crockpot and stir.<\/li><li>Rub the lamb with the garlic and spices. Set it on top and pour the broth around it.<\/li><li>Cook on LOW 8 to 9 hours, until the lamb pulls apart.<\/li><li>Lift out the lamb, shred it, and return it to the pot. Spoon off the fat that pools on top.<\/li><li>Stir in the frozen spinach and lemon juice and cook 20 to 30 minutes more. Divide into 5 containers and top each with about 3 tbsp Greek yogurt when serving.<\/li><\/ol>\n<h3 id=\"p1-10\">Crockpot 2: Lemon Garlic Chicken with White Beans, Tomatoes and Brown Rice (5 portions)<\/h3>\n<div class=\"macro\">Per portion: 70 g protein · 71 g carbs · 20 g fat · 15 g fiber · about 740 calories<\/div>\n<p class=\"lead\"><b>Ingredients<\/b><\/p>\n<ul><li>3 lb boneless skinless chicken thighs, whole<\/li><li>2 cans (15 oz) no-salt-added white beans (cannellini or great northern), drained and rinsed<\/li><li>3/4 cup plus 2 tbsp uncooked long-grain brown rice<\/li><li>1 can (14.5 oz) no-salt-added diced tomatoes with their juice<\/li><li>1 bag (10 oz) frozen pepper and onion blend<\/li><li>3 cups low-sodium chicken broth<\/li><li>1 bag (16 oz) frozen peas<\/li><li>1 box or bag (10 oz) frozen chopped spinach<\/li><li>1 cup frozen diced onion<\/li><li>2 tbsp jarred minced garlic, zest and juice of 2 lemons (or 1/4 cup bottled lemon juice)<\/li><li>2 tsp salt-free lemon pepper or Italian seasoning, 1 tsp paprika, black pepper<\/li><\/ul>\n<p class=\"lead\"><b>Steps<\/b><\/p>\n<ol><li>Put the onion, white beans, tomatoes and pepper blend in the crockpot. Rub the thighs with the garlic and seasonings and lay them on top. Add 1/2 cup of the broth.<\/li><li>Cook on LOW 4 to 5 hours.<\/li><li>Shred the chicken in the pot with two forks.<\/li><li>Stir in the brown rice, frozen spinach and the remaining 2.5 cups of broth. Switch to HIGH and cook 2 to 2.5 hours, until the rice is tender. Stir once halfway.<\/li><li>Stir in the frozen peas and lemon juice for the last 15 minutes. Divide into 5 containers.<\/li><\/ol>\n<h3 id=\"p1-11\">Twice a Week: Omega-3 Salmon Bowl (1 portion, no cooking)<\/h3>\n<div class=\"macro\">Per bowl: 74 g protein · 69 g carbs · 18 g fat · 19 g fiber · about 700 calories · 1.2 g EPA and DHA<\/div>\n<p>Swap this in for one crockpot lunch or dinner twice a week. Freeze the crockpot portion it replaces.<\/p>\n<p class=\"lead\"><b>Ingredients<\/b><\/p>\n<ul><li>4 pouches (2.6 oz each) pink salmon in water, skinless and boneless<\/li><li>1/2 cup cooked brown rice (a microwave cup, or rice saved from a crockpot batch)<\/li><li>1/2 cup no-salt-added chickpeas, drained and rinsed<\/li><li>1/3 avocado, sliced<\/li><li>2 cups salad greens or baby spinach<\/li><li>1/2 cup cherry tomatoes and 1/2 cup sliced red bell pepper<\/li><li>Juice of 1/2 lemon, black pepper, dried dill or salt-free seasoning<\/li><\/ul>\n<p class=\"lead\"><b>Steps<\/b><\/p>\n<ol><li>Warm the rice if you like. Do not microwave the salmon in its pouch.<\/li><li>Layer the greens, rice, chickpeas, tomatoes and pepper in a bowl.<\/li><li>Top with the salmon and avocado, then squeeze the lemon over everything.<\/li><\/ol>\n<h2 id=\"p1-12\">5-Day Schedule<\/h2>\n<p>Alternate the two pots so lunch and dinner are never the same meal. Move frozen portions to the fridge the night before days 4 and 5.<\/p>\n<table class=\"stack\"><thead><tr><th>Day<\/th><th>Cook Day A: Lunch<\/th><th>Cook Day A: Dinner<\/th><th>Cook Day B: Lunch<\/th><th>Cook Day B: Dinner<\/th><th>Storage<\/th><\/tr><\/thead><tbody><tr><td class=n>1<\/td><td>Burrito Bowl<\/td><td>Beef Pot Roast<\/td><td>Moroccan Lamb<\/td><td>Lemon Chicken and Beans<\/td><td>Fridge<\/td><\/tr><tr><td class=n>2<\/td><td>Beef Pot Roast<\/td><td>Burrito Bowl<\/td><td>Lemon Chicken and Beans<\/td><td>Moroccan Lamb<\/td><td>Fridge<\/td><\/tr><tr><td class=n>3<\/td><td>Burrito Bowl<\/td><td>Beef Pot Roast<\/td><td>Moroccan Lamb<\/td><td>Lemon Chicken and Beans<\/td><td>Fridge<\/td><\/tr><tr><td class=n>4<\/td><td>Beef Pot Roast<\/td><td>Burrito Bowl<\/td><td>Lemon Chicken and Beans<\/td><td>Moroccan Lamb<\/td><td>Freezer, thaw night before<\/td><\/tr><tr><td class=n>5<\/td><td>Burrito Bowl<\/td><td>Beef Pot Roast<\/td><td>Moroccan Lamb<\/td><td>Lemon Chicken and Beans<\/td><td>Freezer, thaw night before<\/td><\/tr><\/tbody><\/table>\n<p>Daily totals with breakfast: about 2,200 calories, 56 g fat and 40 g fiber on Cook Day A meals, and about 2,250 calories, 63 g fat and 45 g fiber on Cook Day B meals. Twice a week, swap one crockpot portion for the Salmon Bowl and freeze the spare portion; it covers a later day. Protein and carbs stay near 210 g each. On training days, the pre-workout snack adds about 120 to 150 calories and 30 g carbs.<\/p>\n<h2 id=\"p1-13\">Quick 40-40-20 Breakfasts (700 calories)<\/h2>\n<p>Each option lands near 70 g protein, 70 g carbs and 17 to 19 g fat with at least 13 g fiber. Every breakfast includes chia or flaxseed for plant omega-3s, and strawberries add the most vitamin C of the berries, and takes 10 minutes or less. Frozen berries work in every one. Protein powder values assume a 30 g scoop with 24 g protein; adjust for your brand.<\/p>\n<div class=\"scroll\"><table class=\"\"><thead><tr><th>Breakfast<\/th><th>What goes in it<\/th><th>Protein (g)<\/th><th>Carbs (g)<\/th><th>Fat (g)<\/th><th>Fiber (g)<\/th><th>Prep<\/th><\/tr><\/thead><tbody><tr><td>Protein overnight oats<\/td><td>3/4 cup rolled oats, 1.5 scoops whey, 3/4 cup nonfat Greek yogurt, 1 tbsp chia seeds, 1.5 tbsp unsalted sunflower seeds, 3/4 cup strawberries or mixed berries, water or almond milk to thin<\/td><td class=n>67<\/td><td class=n>71<\/td><td class=n>18<\/td><td class=n>15.5<\/td><td>Mix at night<\/td><\/tr><tr><td>Egg white scramble and toast<\/td><td>2 whole eggs, 1 2/3 cups liquid egg whites, 1 tbsp ground flaxseed stirred into the eggs, 3 slices whole wheat bread, 3/4 cup strawberries or mixed berries, 1/2 small banana; cook in nonstick spray<\/td><td class=n>71<\/td><td class=n>71<\/td><td class=n>17<\/td><td class=n>13<\/td><td>5 min<\/td><\/tr><tr><td>Greek yogurt parfait<\/td><td>2.5 cups nonfat plain Greek yogurt, 1/2 cup rolled oats, 1 cup strawberries or mixed berries, 17 almonds, 1 tbsp chia seeds<\/td><td class=n>71<\/td><td class=n>72<\/td><td class=n>19<\/td><td class=n>16<\/td><td>2 min<\/td><\/tr><tr><td>Green protein smoothie<\/td><td>1.5 scoops whey, 1 medium banana, 1/3 cup rolled oats, 1.5 tbsp unsalted sunflower seeds, 1 tbsp chia seeds, 1/2 cup frozen spinach, 1 cup unsweetened almond milk (with added vitamin E), 1 cup nonfat Greek yogurt, ice<\/td><td class=n>73<\/td><td class=n>72<\/td><td class=n>19<\/td><td class=n>14.5<\/td><td>3 min<\/td><\/tr><tr><td>Veggie omelet and oatmeal<\/td><td>2 whole eggs, 1 1/3 cups liquid egg whites, 1 cup spinach, 1/3 cup diced red pepper; 3/4 cup rolled oats cooked in water with 1/2 cup nonfat Greek yogurt and 1 tbsp ground flaxseed stirred in, 1 cup strawberries or mixed berries<\/td><td class=n>72<\/td><td class=n>69<\/td><td class=n>18<\/td><td class=n>15<\/td><td>10 min<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Whole wheat bread and protein powder can carry more sodium than you expect. Compare labels and pick the lower option.<\/p>\n<h2 id=\"p1-14\">Pre-Workout Snacks (Training Days)<\/h2>\n<p>Eat one snack 30 to 60 minutes before training, 5 to 6 days a week. Each is about 30 g of fast-digesting refined carbs with little fat or fiber, so it sits light. The snack is extra on top of the 2,100 calories, adding about 120 to 150 calories on training days. Carb counts are typical label values; check yours.<\/p>\n<table class=\"stack\"><thead><tr><th>Snack<\/th><th>Portion<\/th><th>Carbs (g)<\/th><th>Fat (g)<\/th><th>Notes<\/th><\/tr><\/thead><tbody><tr><td>Rice cakes and honey<\/td><td>2 plain unsalted rice cakes + 1 tbsp honey<\/td><td class=n>31<\/td><td>0 to 1<\/td><td>Fastest option; no prep<\/td><\/tr><tr><td>Plain rice cakes<\/td><td>4 plain unsalted rice cakes<\/td><td>28 to 30<\/td><td>0 to 1<\/td><td>Add cinnamon for flavor<\/td><\/tr><tr><td>White toast and jam<\/td><td>1 slice white bread + 1.5 tbsp jam or jelly<\/td><td>30 to 32<\/td><td class=n>1<\/td><td>Toast is optional<\/td><\/tr><tr><td>Unsalted pretzels<\/td><td>1.25 oz (about a heaping handful)<\/td><td>28 to 30<\/td><td class=n>1<\/td><td>Use unsalted; regular pretzels are high in sodium<\/td><\/tr><tr><td>Graham crackers<\/td><td>3 full sheets<\/td><td>30 to 33<\/td><td>3 to 4<\/td><td>Slightly more fat; still fine pre-workout<\/td><\/tr><tr><td>Fruit snacks or gummies<\/td><td>Enough for 30 g carbs per the label (often about 1.5 pouches)<\/td><td class=n>30<\/td><td class=n>0<\/td><td>Easy to carry to the gym<\/td><\/tr><\/tbody><\/table>\n<p>Pick 2 or 3 favorites per week instead of buying all six, so nothing goes stale.<\/p>\n<h2 id=\"p1-15\">Frozen Produce Alternatives<\/h2>\n<p>Frozen produce is picked and frozen at peak ripeness, keeps its fiber, costs less per serving and does not spoil. Buy plain bags with no added sauce, butter or salt. Add frozen vegetables in the last 30 to 60 minutes of cooking so they do not turn to mush. Meat is the exception: thaw it in the fridge first, because frozen meat in a slow cooker can sit too long at unsafe temperatures.<\/p>\n<p class=\"lead\"><b>Direct swaps for what is already in the plan<\/b><\/p>\n<table class=\"stack\"><thead><tr><th>Fresh item in the plan<\/th><th>Frozen alternative<\/th><th>How to use it<\/th><\/tr><\/thead><tbody><tr><td>Onion<\/td><td>Frozen diced onion<\/td><td>Already in the plan; add at the start.<\/td><\/tr><tr><td>Bell peppers<\/td><td>Frozen pepper strips or pepper and onion blend<\/td><td>Add at the start.<\/td><\/tr><tr><td>Baby carrots<\/td><td>Frozen sliced or crinkle-cut carrots<\/td><td>Add at the start with the potatoes.<\/td><\/tr><tr><td>Baby gold potatoes<\/td><td>Frozen diced potatoes or potato chunks (plain, no oil or seasoning)<\/td><td>Add in the last 2 hours on HIGH; they cook faster than raw.<\/td><\/tr><tr><td>Sweet potatoes<\/td><td>Frozen cubed sweet potatoes<\/td><td>Add in the last 2 hours on HIGH.<\/td><\/tr><tr><td>Fresh spinach (omelet)<\/td><td>Frozen chopped spinach<\/td><td>Microwave 1 minute and squeeze dry before adding to eggs.<\/td><\/tr><tr><td>Fresh broccoli<\/td><td>Frozen broccoli florets<\/td><td>Already in the plan; add in the last 45 to 60 minutes.<\/td><\/tr><tr><td>Fresh berries<\/td><td>Frozen mixed berries, blueberries, strawberries, raspberries or blackberries<\/td><td>Thaw overnight in the oats or yogurt, or blend straight from frozen. Raspberries and blackberries have the most fiber.<\/td><\/tr><tr><td>Banana<\/td><td>Frozen banana slices (buy or freeze your own ripe ones)<\/td><td>Best in the smoothie; makes it thick and cold.<\/td><\/tr><tr><td>Garlic<\/td><td>Frozen crushed garlic cubes<\/td><td>1 cube is about 1 clove.<\/td><\/tr><tr><td>Fresh herbs and cilantro<\/td><td>Frozen herb cubes or dried herbs<\/td><td>Stir in at the end.<\/td><\/tr><tr><td>Limes and lemons<\/td><td>Bottled juice or frozen juice cubes<\/td><td>1 tbsp juice is about half a lime.<\/td><\/tr><\/tbody><\/table>\n<p class=\"lead\"><b>More frozen options to rotate in for variety<\/b><\/p>\n<table class=\"stack\"><thead><tr><th>Frozen item<\/th><th>Fiber group<\/th><th>Where it fits<\/th><\/tr><\/thead><tbody><tr><td>Chopped kale or collard greens<\/td><td>Greens<\/td><td>Swap for spinach in any crockpot; add in the last 30 minutes.<\/td><\/tr><tr><td>Cut green beans<\/td><td>Greens<\/td><td>Swap for the broccoli in the pot roast, last 45 to 60 minutes.<\/td><\/tr><tr><td>Brussels sprouts<\/td><td>Greens<\/td><td>Pot roast, last hour.<\/td><\/tr><tr><td>Okra<\/td><td>Greens<\/td><td>Lamb or burrito bowl; high in soluble fiber and thickens the sauce.<\/td><\/tr><tr><td>Shelled edamame<\/td><td>Beans<\/td><td>Stir into the lemon chicken for extra protein and fiber.<\/td><\/tr><tr><td>Lima beans or black-eyed peas<\/td><td>Beans<\/td><td>Swap for one can of beans in any recipe; add at the start.<\/td><\/tr><tr><td>Mixed vegetables (peas, carrots, corn, green beans)<\/td><td>Greens and grains<\/td><td>Swap for peas or corn in any recipe.<\/td><\/tr><tr><td>Butternut squash cubes<\/td><td>Bonus<\/td><td>Swap for half the sweet potato in the lamb.<\/td><\/tr><tr><td>Cauliflower florets<\/td><td>Bonus<\/td><td>Add to the lamb or pot roast for more volume with few carbs.<\/td><\/tr><tr><td>Cherries, mango or pineapple chunks<\/td><td>Berries alternative<\/td><td>Smoothie or parfait; lower in fiber than berries, so use half and half.<\/td><\/tr><\/tbody><\/table>\n<h2 id=\"p1-16\">Low Sodium Tips and Swaps<\/h2>\n<ul><li><b>Rinse canned beans<\/b> even when they are no-salt-added. It also cuts some of the starch that thickens the pot.<\/li><li><b>Check \"salt-free\" on seasoning blends.<\/b> Many taco and chili packets carry 300 mg or more sodium per serving.<\/li><li><b>Avoid \"enhanced\" or \"solution added\" meat.<\/b> Some chicken is injected with a salt brine; the label will say so.<\/li><li><b>Read frozen vegetable labels.<\/b> Plain frozen vegetables have little sodium, but \"seasoned\" or \"in sauce\" versions can carry a lot.<\/li><li><b>Add flavor at the end<\/b> with lime, lemon, vinegar, fresh herbs or hot sauce in small amounts. Acid brightens food the way salt does.<\/li><li><b>Swaps that keep the macros close:<\/b> sweet potato for gold potato, white potato for sweet potato, pinto or kidney beans for black or white beans, beef bottom round for lamb. Lamb shoulder and beef chuck are much fattier; expect 10 g or more extra fat per portion.<\/li><\/ul>\n<h2 id=\"p1-17\">Sources<\/h2>\n<ul><li>Zinc targets and food values: <a href=\"https://ods.od.nih.gov/factsheets/Zinc-HealthProfessional/\" target=\"_blank\" rel=\"noopener\">NIH Office of Dietary Supplements<\/a><\/li><li>Selenium targets and food values, including Brazil nuts: <a href=\"https://ods.od.nih.gov/factsheets/Selenium-HealthProfessional/\" target=\"_blank\" rel=\"noopener\">NIH Office of Dietary Supplements<\/a><\/li><li>Folate food values: <a href=\"https://ods.od.nih.gov/factsheets/Folate-HealthProfessional\" target=\"_blank\" rel=\"noopener\">NIH Office of Dietary Supplements<\/a> and target: <a href=\"https://ods.od.nih.gov/factsheets/Folate-Consumer/\" target=\"_blank\" rel=\"noopener\">NIH ODS consumer fact sheet<\/a><\/li><li>Vitamin C target and food values: <a href=\"https://ods.od.nih.gov/factsheets/VitaminC-HealthProfessional/\" target=\"_blank\" rel=\"noopener\">NIH Office of Dietary Supplements<\/a><\/li><li>Vitamin E target and intake note: <a href=\"https://ods.od.nih.gov/factsheets/VitaminE-Consumer/\" target=\"_blank\" rel=\"noopener\">NIH Office of Dietary Supplements<\/a>; food values: <a href=\"https://www.todaysdietitian.com/newarchives/images/VitaminE_Table.pdf\" target=\"_blank\" rel=\"noopener\">Today's Dietitian table from NIH data<\/a><\/li><li>Omega-3 ALA target and seafood guidance: <a href=\"https://ods.od.nih.gov/factsheets/Omega3FattyAcids-Consumer/\" target=\"_blank\" rel=\"noopener\">NIH Office of Dietary Supplements<\/a><\/li><li>Lycopene in tomato products: <a href=\"https://nal.usda.gov/sites/default/files/page-files/Lycopene.pdf\" target=\"_blank\" rel=\"noopener\">USDA National Agricultural Library<\/a><\/li><li>Pink salmon pouch nutrition and EPA and DHA: <a href=\"https://starkist.com/?p=9738\" target=\"_blank\" rel=\"noopener\">StarKist<\/a><\/li><\/ul>", "heads": [{"id": "p1-1", "t": "How the Plan Works", "l": 2}, {"id": "p1-2", "t": "Fiber Plan: Beans, Greens, Berries and Grains", "l": 2}, {"id": "p1-3", "t": "Key Nutrients", "l": 2}, {"id": "p1-4", "t": "Supplement Notes", "l": 2}, {"id": "p1-5", "t": "Cook Day A", "l": 2}, {"id": "p1-6", "t": "Crockpot 1: Chicken Thigh Burrito Bowl with Brown Rice and Spinach (5 portions)", "l": 3}, {"id": "p1-7", "t": "Crockpot 2: Shredded Beef Pot Roast with Potatoes, Carrots and Broccoli (5 portions)", "l": 3}, {"id": "p1-8", "t": "Cook Day B", "l": 2}, {"id": "p1-9", "t": "Crockpot 1: Moroccan Shredded Lamb with Chickpeas, Sweet Potatoes and Spinach (5 portions)", "l": 3}, {"id": "p1-10", "t": "Crockpot 2: Lemon Garlic Chicken with White Beans, Tomatoes and Brown Rice (5 portions)", "l": 3}, {"id": "p1-11", "t": "Twice a Week: Omega-3 Salmon Bowl (1 portion, no cooking)", "l": 3}, {"id": "p1-12", "t": "5-Day Schedule", "l": 2}, {"id": "p1-13", "t": "Quick 40-40-20 Breakfasts (700 calories)", "l": 2}, {"id": "p1-14", "t": "Pre-Workout Snacks (Training Days)", "l": 2}, {"id": "p1-15", "t": "Frozen Produce Alternatives", "l": 2}, {"id": "p1-16", "t": "Low Sodium Tips and Swaps", "l": 2}, {"id": "p1-17", "t": "Sources", "l": 2}]}, {"id": "p2", "kicker": "Plan 1 · Grocery List", "title": "40-40-20 Crockpot Grocery List", "sub": "One list per meal · store-brand picks to keep costs low · Walmart, Aldi, Kroger, Food Lion · November 20, 2026", "kind": "grocery", "html": "<h2 id=\"p2-1\">How to Use This List<\/h2>\n<ul><li><b>Shop by meal.<\/b> Each meal has its own complete list, so you can buy only what you need for the meal you plan to cook.<\/li><li><b>\"Buy\" is the package size. \"Recipe uses\" is how much goes in the meal.<\/b> Leftovers from a can, carton or bag carry over to the next meal that uses them.<\/li><li><b>Some items repeat across meals,<\/b> like broth, tomato paste, brown rice and frozen onion. Check your pantry before buying them again.<\/li><li><b>Spices, garlic and oils<\/b> are in Pantry Staples at the end. Buy them once and they last many cycles.<\/li><\/ul>\n<h2 id=\"p2-2\">Store Brands to Look For<\/h2>\n<p>Buy the store brand for everything except fresh meat cuts, where the cheapest per-pound family or value pack wins. Not every store stocks a no-salt-added or salt-free version. When it is missing, buy the regular store brand and drain and rinse canned beans well.<\/p>\n<table class=\"stack\"><thead><tr><th>Store<\/th><th>Store brand<\/th><\/tr><\/thead><tbody><tr><td>Walmart<\/td><td>Great Value (pantry, canned, frozen, dairy, spices)<\/td><\/tr><tr><td>Aldi<\/td><td>House brands: Kirkwood (chicken), Season's Choice (frozen produce), Happy Harvest (canned vegetables), Dakota's Pride (beans), Chef's Cupboard (broth), Stonemill (spices), Earthly Grains (rice), Friendly Farms (yogurt, almond milk), Millville (oats), Goldhen (eggs), L'oven Fresh (bread), Southern Grove (nuts, seeds), Elevation (protein powder)<\/td><\/tr><tr><td>Kroger<\/td><td>Kroger brand (skip Simple Truth unless it is on sale; it usually costs more)<\/td><\/tr><tr><td>Food Lion<\/td><td>Food Lion brand<\/td><\/tr><tr><td>Publix (occasional)<\/td><td>Publix brand<\/td><\/tr><tr><td>Whole Foods (occasional)<\/td><td>365 by Whole Foods Market<\/td><\/tr><\/tbody><\/table>\n<h2 id=\"p2-3\">Crockpot Meals (5 portions each)<\/h2>\n<h3 id=\"p2-4\">Chicken Thigh Burrito Bowl with Brown Rice and Spinach<\/h3>\n<ul class=\"check\"><li><label><input type=\"checkbox\" data-k=\"p2-4-boneless-skinless-chicken-thighs\"><span class=\"tx\"><span class=\"it\">Boneless skinless chicken thighs<\/span><span class=\"am\">Buy: 3 lb · Recipe uses: 3 lb, whole<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p2-4-no-salt-added-black-beans\"><span class=\"tx\"><span class=\"it\">No-salt-added black beans<\/span><span class=\"am\">Buy: 2 cans (15 oz) · Recipe uses: 2 cans<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p2-4-frozen-corn\"><span class=\"tx\"><span class=\"it\">Frozen corn<\/span><span class=\"am\">Buy: 1 bag · Recipe uses: 1.5 cups<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p2-4-no-salt-added-diced-tomatoes\"><span class=\"tx\"><span class=\"it\">No-salt-added diced tomatoes<\/span><span class=\"am\">Buy: 1 can (14.5 oz) · Recipe uses: 1 can<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p2-4-frozen-pepper-and-onion-blend\"><span class=\"tx\"><span class=\"it\">Frozen pepper and onion blend<\/span><span class=\"am\">Buy: 1 bag (10 oz) · Recipe uses: 1 bag<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p2-4-tomato-paste-no-salt-added\"><span class=\"tx\"><span class=\"it\">Tomato paste, no salt added<\/span><span class=\"am\">Buy: 1 can (6 oz) · Recipe uses: 2 tbsp<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p2-4-long-grain-brown-rice\"><span class=\"tx\"><span class=\"it\">Long-grain brown rice<\/span><span class=\"am\">Buy: 1 bag (2 lb) · Recipe uses: 3/4 cup plus 2 tbsp<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p2-4-frozen-chopped-spinach\"><span class=\"tx\"><span class=\"it\">Frozen chopped spinach<\/span><span class=\"am\">Buy: 1 box or bag (10 oz) · Recipe uses: 1 box or bag<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p2-4-low-sodium-chicken-broth\"><span class=\"tx\"><span class=\"it\">Low-sodium chicken broth<\/span><span class=\"am\">Buy: 1 carton (32 oz) · Recipe uses: 2 cups<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p2-4-limes\"><span class=\"tx\"><span class=\"it\">Limes<\/span><span class=\"am\">Buy: 2 · Recipe uses: Juice of 2 (or 3 tbsp bottled)<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p2-4-nonfat-plain-greek-yogurt\"><span class=\"tx\"><span class=\"it\">Nonfat plain Greek yogurt<\/span><span class=\"am\">Buy: 1 tub (32 oz) · Recipe uses: 3/4 cup, for topping<\/span><\/span><\/label><\/li><\/ul>\n<p><b>From the pantry:<\/b> salt-free taco seasoning, cumin, jarred minced garlic.<\/p>\n<h3 id=\"p2-5\">Shredded Beef Pot Roast with Potatoes, Carrots and Broccoli<\/h3>\n<ul class=\"check\"><li><label><input type=\"checkbox\" data-k=\"p2-5-bottom-round-or-rump-roast\"><span class=\"tx\"><span class=\"it\">Bottom round or rump roast<\/span><span class=\"am\">Buy: 3.25 lb roast · Recipe uses: 3.25 lb, whole<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p2-5-baby-gold-potatoes\"><span class=\"tx\"><span class=\"it\">Baby gold potatoes<\/span><span class=\"am\">Buy: 3.5 lb · Recipe uses: 3.5 lb, skins on<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p2-5-baby-carrots\"><span class=\"tx\"><span class=\"it\">Baby carrots<\/span><span class=\"am\">Buy: 1 lb bag · Recipe uses: 1 lb<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p2-5-frozen-diced-onion\"><span class=\"tx\"><span class=\"it\">Frozen diced onion<\/span><span class=\"am\">Buy: 1 bag · Recipe uses: 1 cup<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p2-5-frozen-broccoli-florets\"><span class=\"tx\"><span class=\"it\">Frozen broccoli florets<\/span><span class=\"am\">Buy: 1 bag (16 oz) · Recipe uses: 1 bag<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p2-5-tomato-paste-no-salt-added\"><span class=\"tx\"><span class=\"it\">Tomato paste, no salt added<\/span><span class=\"am\">Buy: 1 can (6 oz) · Recipe uses: 3 tbsp<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p2-5-low-sodium-beef-broth\"><span class=\"tx\"><span class=\"it\">Low-sodium beef broth<\/span><span class=\"am\">Buy: 1 carton (32 oz) · Recipe uses: 1 cup<\/span><\/span><\/label><\/li><\/ul>\n<p><b>From the pantry:<\/b> jarred minced garlic, dried thyme, rosemary, onion powder, black pepper, balsamic vinegar.<\/p>\n<h3 id=\"p2-6\">Moroccan Shredded Lamb with Chickpeas, Sweet Potatoes and Spinach<\/h3>\n<ul class=\"check\"><li><label><input type=\"checkbox\" data-k=\"p2-6-boneless-leg-of-lamb\"><span class=\"tx\"><span class=\"it\">Boneless leg of lamb<\/span><span class=\"am\">Buy: 2.75 lb · Recipe uses: 2.75 lb, whole<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p2-6-no-salt-added-chickpeas\"><span class=\"tx\"><span class=\"it\">No-salt-added chickpeas<\/span><span class=\"am\">Buy: 3 cans (15 oz) · Recipe uses: 3 cans<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p2-6-sweet-potatoes-or-frozen-cubed-\"><span class=\"tx\"><span class=\"it\">Sweet potatoes (or frozen cubed)<\/span><span class=\"am\">Buy: 1.5 lb · Recipe uses: 1.5 lb<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p2-6-no-salt-added-diced-tomatoes\"><span class=\"tx\"><span class=\"it\">No-salt-added diced tomatoes<\/span><span class=\"am\">Buy: 1 can (14.5 oz) · Recipe uses: 1 can<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p2-6-tomato-paste-no-salt-added\"><span class=\"tx\"><span class=\"it\">Tomato paste, no salt added<\/span><span class=\"am\">Buy: 1 can (6 oz) · Recipe uses: 2 tbsp<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p2-6-frozen-diced-onion\"><span class=\"tx\"><span class=\"it\">Frozen diced onion<\/span><span class=\"am\">Buy: 1 bag · Recipe uses: 1 cup<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p2-6-frozen-chopped-spinach\"><span class=\"tx\"><span class=\"it\">Frozen chopped spinach<\/span><span class=\"am\">Buy: 1 box or bag (10 oz) · Recipe uses: 1 box or bag<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p2-6-low-sodium-chicken-broth\"><span class=\"tx\"><span class=\"it\">Low-sodium chicken broth<\/span><span class=\"am\">Buy: 1 carton (32 oz) · Recipe uses: 1 cup<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p2-6-lemon\"><span class=\"tx\"><span class=\"it\">Lemon<\/span><span class=\"am\">Buy: 1 · Recipe uses: Juice of 1<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p2-6-nonfat-plain-greek-yogurt\"><span class=\"tx\"><span class=\"it\">Nonfat plain Greek yogurt<\/span><span class=\"am\">Buy: 1 tub (32 oz) · Recipe uses: 1 cup, for topping<\/span><\/span><\/label><\/li><\/ul>\n<p><b>From the pantry:<\/b> jarred minced garlic, cumin, cinnamon, smoked paprika, ground ginger, black pepper.<\/p>\n<h3 id=\"p2-7\">Lemon Garlic Chicken with White Beans, Tomatoes and Brown Rice<\/h3>\n<ul class=\"check\"><li><label><input type=\"checkbox\" data-k=\"p2-7-boneless-skinless-chicken-thighs\"><span class=\"tx\"><span class=\"it\">Boneless skinless chicken thighs<\/span><span class=\"am\">Buy: 3 lb · Recipe uses: 3 lb, whole<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p2-7-no-salt-added-white-beans-cannellini-or-\"><span class=\"tx\"><span class=\"it\">No-salt-added white beans (cannellini or great northern)<\/span><span class=\"am\">Buy: 2 cans (15 oz) · Recipe uses: 2 cans<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p2-7-long-grain-brown-rice\"><span class=\"tx\"><span class=\"it\">Long-grain brown rice<\/span><span class=\"am\">Buy: 1 bag (2 lb) · Recipe uses: 3/4 cup plus 2 tbsp<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p2-7-no-salt-added-diced-tomatoes\"><span class=\"tx\"><span class=\"it\">No-salt-added diced tomatoes<\/span><span class=\"am\">Buy: 1 can (14.5 oz) · Recipe uses: 1 can<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p2-7-frozen-pepper-and-onion-blend\"><span class=\"tx\"><span class=\"it\">Frozen pepper and onion blend<\/span><span class=\"am\">Buy: 1 bag (10 oz) · Recipe uses: 1 bag<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p2-7-low-sodium-chicken-broth\"><span class=\"tx\"><span class=\"it\">Low-sodium chicken broth<\/span><span class=\"am\">Buy: 1 carton (32 oz) · Recipe uses: 3 cups<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p2-7-frozen-peas\"><span class=\"tx\"><span class=\"it\">Frozen peas<\/span><span class=\"am\">Buy: 1 bag (16 oz) · Recipe uses: 1 bag<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p2-7-frozen-chopped-spinach\"><span class=\"tx\"><span class=\"it\">Frozen chopped spinach<\/span><span class=\"am\">Buy: 1 box or bag (10 oz) · Recipe uses: 1 box or bag<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p2-7-frozen-diced-onion\"><span class=\"tx\"><span class=\"it\">Frozen diced onion<\/span><span class=\"am\">Buy: 1 bag · Recipe uses: 1 cup<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p2-7-lemons\"><span class=\"tx\"><span class=\"it\">Lemons<\/span><span class=\"am\">Buy: 2 · Recipe uses: Zest and juice of 2 (or 1/4 cup bottled)<\/span><\/span><\/label><\/li><\/ul>\n<p><b>From the pantry:<\/b> jarred minced garlic, salt-free lemon pepper or Italian seasoning, paprika, black pepper.<\/p>\n<h2 id=\"p2-8\">Omega-3 Salmon Bowl (1 bowl, twice a week)<\/h2>\n<ul class=\"check\"><li><label><input type=\"checkbox\" data-k=\"p2-8-pink-salmon-in-water-pouches-2-6-oz-\"><span class=\"tx\"><span class=\"it\">Pink salmon in water, pouches (2.6 oz)<\/span><span class=\"am\">Buy: 4 pouches · Recipe uses: 4 pouches<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p2-8-microwave-brown-rice-cup\"><span class=\"tx\"><span class=\"it\">Microwave brown rice cup<\/span><span class=\"am\">Buy: 1 cup · Recipe uses: 1/2 cup cooked<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p2-8-no-salt-added-chickpeas\"><span class=\"tx\"><span class=\"it\">No-salt-added chickpeas<\/span><span class=\"am\">Buy: 1 can (15 oz) · Recipe uses: 1/2 cup<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p2-8-avocado\"><span class=\"tx\"><span class=\"it\">Avocado<\/span><span class=\"am\">Buy: 1 · Recipe uses: 1/3<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p2-8-salad-greens-or-baby-spinach\"><span class=\"tx\"><span class=\"it\">Salad greens or baby spinach<\/span><span class=\"am\">Buy: 1 bag · Recipe uses: 2 cups<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p2-8-cherry-tomatoes\"><span class=\"tx\"><span class=\"it\">Cherry tomatoes<\/span><span class=\"am\">Buy: 1 pint · Recipe uses: 1/2 cup<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p2-8-red-bell-pepper-or-frozen-strips-\"><span class=\"tx\"><span class=\"it\">Red bell pepper (or frozen strips)<\/span><span class=\"am\">Buy: 1 · Recipe uses: 1/2 cup sliced<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p2-8-lemon\"><span class=\"tx\"><span class=\"it\">Lemon<\/span><span class=\"am\">Buy: 1 · Recipe uses: Juice of 1/2<\/span><\/span><\/label><\/li><\/ul>\n<p><b>From the pantry:<\/b> black pepper, dried dill or salt-free seasoning.<\/p>\n<h2 id=\"p2-9\">Breakfasts (1 serving each)<\/h2>\n<h3 id=\"p2-10\">Protein Overnight Oats<\/h3>\n<ul class=\"check\"><li><label><input type=\"checkbox\" data-k=\"p2-10-old-fashioned-rolled-oats\"><span class=\"tx\"><span class=\"it\">Old-fashioned rolled oats<\/span><span class=\"am\">Buy: 1 canister (42 oz) · Recipe uses: 3/4 cup<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p2-10-whey-protein-powder\"><span class=\"tx\"><span class=\"it\">Whey protein powder<\/span><span class=\"am\">Buy: 1 tub · Recipe uses: 1.5 scoops<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p2-10-nonfat-plain-greek-yogurt\"><span class=\"tx\"><span class=\"it\">Nonfat plain Greek yogurt<\/span><span class=\"am\">Buy: 1 tub (32 oz) · Recipe uses: 3/4 cup<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p2-10-chia-seeds\"><span class=\"tx\"><span class=\"it\">Chia seeds<\/span><span class=\"am\">Buy: 1 bag · Recipe uses: 1 tbsp<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p2-10-unsalted-sunflower-seeds-kernels-\"><span class=\"tx\"><span class=\"it\">Unsalted sunflower seeds (kernels)<\/span><span class=\"am\">Buy: 1 bag · Recipe uses: 1.5 tbsp<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p2-10-frozen-strawberries-or-mixed-berries\"><span class=\"tx\"><span class=\"it\">Frozen strawberries or mixed berries<\/span><span class=\"am\">Buy: 1 bag · Recipe uses: 3/4 cup<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p2-10-unsweetened-almond-milk-with-added-vitam\"><span class=\"tx\"><span class=\"it\">Unsweetened almond milk with added vitamin E (optional)<\/span><span class=\"am\">Buy: 1 half gallon · Recipe uses: A splash to thin<\/span><\/span><\/label><\/li><\/ul>\n<h3 id=\"p2-11\">Egg White Scramble and Toast<\/h3>\n<ul class=\"check\"><li><label><input type=\"checkbox\" data-k=\"p2-11-eggs\"><span class=\"tx\"><span class=\"it\">Eggs<\/span><span class=\"am\">Buy: 1 dozen · Recipe uses: 2<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p2-11-liquid-egg-whites\"><span class=\"tx\"><span class=\"it\">Liquid egg whites<\/span><span class=\"am\">Buy: 1 carton (32 oz) · Recipe uses: 1 2/3 cups<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p2-11-ground-flaxseed\"><span class=\"tx\"><span class=\"it\">Ground flaxseed<\/span><span class=\"am\">Buy: 1 bag · Recipe uses: 1 tbsp<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p2-11-whole-wheat-bread\"><span class=\"tx\"><span class=\"it\">Whole wheat bread<\/span><span class=\"am\">Buy: 1 loaf · Recipe uses: 3 slices<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p2-11-frozen-strawberries-or-mixed-berries\"><span class=\"tx\"><span class=\"it\">Frozen strawberries or mixed berries<\/span><span class=\"am\">Buy: 1 bag · Recipe uses: 3/4 cup<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p2-11-banana\"><span class=\"tx\"><span class=\"it\">Banana<\/span><span class=\"am\">Buy: 1 · Recipe uses: 1/2 small<\/span><\/span><\/label><\/li><\/ul>\n<p><b>From the pantry:<\/b> nonstick cooking spray.<\/p>\n<h3 id=\"p2-12\">Greek Yogurt Parfait<\/h3>\n<ul class=\"check\"><li><label><input type=\"checkbox\" data-k=\"p2-12-nonfat-plain-greek-yogurt\"><span class=\"tx\"><span class=\"it\">Nonfat plain Greek yogurt<\/span><span class=\"am\">Buy: 1 tub (32 oz) · Recipe uses: 2.5 cups<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p2-12-old-fashioned-rolled-oats\"><span class=\"tx\"><span class=\"it\">Old-fashioned rolled oats<\/span><span class=\"am\">Buy: 1 canister (42 oz) · Recipe uses: 1/2 cup<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p2-12-frozen-strawberries-or-mixed-berries\"><span class=\"tx\"><span class=\"it\">Frozen strawberries or mixed berries<\/span><span class=\"am\">Buy: 1 bag · Recipe uses: 1 cup<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p2-12-almonds-unsalted\"><span class=\"tx\"><span class=\"it\">Almonds, unsalted<\/span><span class=\"am\">Buy: 1 bag · Recipe uses: 17 almonds<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p2-12-chia-seeds\"><span class=\"tx\"><span class=\"it\">Chia seeds<\/span><span class=\"am\">Buy: 1 bag · Recipe uses: 1 tbsp<\/span><\/span><\/label><\/li><\/ul>\n<h3 id=\"p2-13\">Green Protein Smoothie<\/h3>\n<ul class=\"check\"><li><label><input type=\"checkbox\" data-k=\"p2-13-whey-protein-powder\"><span class=\"tx\"><span class=\"it\">Whey protein powder<\/span><span class=\"am\">Buy: 1 tub · Recipe uses: 1.5 scoops<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p2-13-banana\"><span class=\"tx\"><span class=\"it\">Banana<\/span><span class=\"am\">Buy: 1 · Recipe uses: 1 medium<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p2-13-old-fashioned-rolled-oats\"><span class=\"tx\"><span class=\"it\">Old-fashioned rolled oats<\/span><span class=\"am\">Buy: 1 canister (42 oz) · Recipe uses: 1/3 cup<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p2-13-unsalted-sunflower-seeds-kernels-\"><span class=\"tx\"><span class=\"it\">Unsalted sunflower seeds (kernels)<\/span><span class=\"am\">Buy: 1 bag · Recipe uses: 1.5 tbsp<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p2-13-chia-seeds\"><span class=\"tx\"><span class=\"it\">Chia seeds<\/span><span class=\"am\">Buy: 1 bag · Recipe uses: 1 tbsp<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p2-13-frozen-chopped-spinach\"><span class=\"tx\"><span class=\"it\">Frozen chopped spinach<\/span><span class=\"am\">Buy: 1 bag · Recipe uses: 1/2 cup<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p2-13-unsweetened-almond-milk-with-added-vitam\"><span class=\"tx\"><span class=\"it\">Unsweetened almond milk with added vitamin E<\/span><span class=\"am\">Buy: 1 half gallon · Recipe uses: 1 cup<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p2-13-nonfat-plain-greek-yogurt\"><span class=\"tx\"><span class=\"it\">Nonfat plain Greek yogurt<\/span><span class=\"am\">Buy: 1 tub (32 oz) · Recipe uses: 1 cup<\/span><\/span><\/label><\/li><\/ul>\n<h3 id=\"p2-14\">Veggie Omelet and Oatmeal<\/h3>\n<ul class=\"check\"><li><label><input type=\"checkbox\" data-k=\"p2-14-eggs\"><span class=\"tx\"><span class=\"it\">Eggs<\/span><span class=\"am\">Buy: 1 dozen · Recipe uses: 2<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p2-14-liquid-egg-whites\"><span class=\"tx\"><span class=\"it\">Liquid egg whites<\/span><span class=\"am\">Buy: 1 carton (32 oz) · Recipe uses: 1 1/3 cups<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p2-14-fresh-spinach-or-frozen-chopped-\"><span class=\"tx\"><span class=\"it\">Fresh spinach (or frozen chopped)<\/span><span class=\"am\">Buy: 1 bag (5 oz) · Recipe uses: 1 cup<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p2-14-red-bell-pepper-or-frozen-strips-\"><span class=\"tx\"><span class=\"it\">Red bell pepper (or frozen strips)<\/span><span class=\"am\">Buy: 1 · Recipe uses: 1/3 cup diced<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p2-14-old-fashioned-rolled-oats\"><span class=\"tx\"><span class=\"it\">Old-fashioned rolled oats<\/span><span class=\"am\">Buy: 1 canister (42 oz) · Recipe uses: 3/4 cup<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p2-14-nonfat-plain-greek-yogurt\"><span class=\"tx\"><span class=\"it\">Nonfat plain Greek yogurt<\/span><span class=\"am\">Buy: 1 tub (32 oz) · Recipe uses: 1/2 cup<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p2-14-ground-flaxseed\"><span class=\"tx\"><span class=\"it\">Ground flaxseed<\/span><span class=\"am\">Buy: 1 bag · Recipe uses: 1 tbsp<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p2-14-frozen-strawberries-or-mixed-berries\"><span class=\"tx\"><span class=\"it\">Frozen strawberries or mixed berries<\/span><span class=\"am\">Buy: 1 bag · Recipe uses: 1 cup<\/span><\/span><\/label><\/li><\/ul>\n<p><b>From the pantry:<\/b> nonstick cooking spray.<\/p>\n<h2 id=\"p2-15\">Pre-Workout Snacks (1 snack each)<\/h2>\n<p>Pick 2 or 3 favorites per week so nothing goes stale.<\/p>\n<ul class=\"check\"><li><label><input type=\"checkbox\" data-k=\"p2-15-rice-cakes-and-honey\"><span class=\"tx\"><span class=\"it\">Rice cakes and honey<\/span><span class=\"am\">Buy: 1 sleeve plain unsalted rice cakes, 1 bottle honey (12 oz) · Each snack uses: 2 rice cakes + 1 tbsp honey<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p2-15-plain-rice-cakes\"><span class=\"tx\"><span class=\"it\">Plain rice cakes<\/span><span class=\"am\">Buy: 1 sleeve plain unsalted rice cakes · Each snack uses: 4 rice cakes<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p2-15-white-toast-and-jam\"><span class=\"tx\"><span class=\"it\">White toast and jam<\/span><span class=\"am\">Buy: 1 loaf white bread, 1 jar regular jam or jelly · Each snack uses: 1 slice + 1.5 tbsp jam<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p2-15-unsalted-pretzels\"><span class=\"tx\"><span class=\"it\">Unsalted pretzels<\/span><span class=\"am\">Buy: 1 bag (about 8 oz) · Each snack uses: 1.25 oz<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p2-15-graham-crackers\"><span class=\"tx\"><span class=\"it\">Graham crackers<\/span><span class=\"am\">Buy: 1 box · Each snack uses: 3 full sheets<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p2-15-fruit-snacks-or-gummies\"><span class=\"tx\"><span class=\"it\">Fruit snacks or gummies<\/span><span class=\"am\">Buy: 1 box of pouches · Each snack uses: About 1.5 pouches (30 g carbs)<\/span><\/span><\/label><\/li><\/ul>\n<h2 id=\"p2-16\">Pantry Staples (buy once, lasts many cycles)<\/h2>\n<ul class=\"check\"><li><label><input type=\"checkbox\" data-k=\"p2-16-jarred-minced-garlic\"><span class=\"tx\"><span class=\"it\">Jarred minced garlic<\/span><span class=\"am\">Buy: 1 jar · Used in: All four crockpot meals<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p2-16-salt-free-taco-seasoning\"><span class=\"tx\"><span class=\"it\">Salt-free taco seasoning<\/span><span class=\"am\">Buy: 1 jar · Used in: Burrito bowl. Fallback: mix chili powder, cumin, garlic powder, onion powder and paprika.<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p2-16-salt-free-lemon-pepper-or-italian-season\"><span class=\"tx\"><span class=\"it\">Salt-free lemon pepper or Italian seasoning<\/span><span class=\"am\">Buy: 1 jar · Used in: Lemon garlic chicken<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p2-16-ground-cumin-cinnamon-ground-ginger-smok\"><span class=\"tx\"><span class=\"it\">Ground cumin, cinnamon, ground ginger, smoked paprika, paprika<\/span><span class=\"am\">Buy: 1 jar each · Used in: Burrito bowl, lamb, lemon chicken<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p2-16-dried-thyme-rosemary-onion-powder-garlic\"><span class=\"tx\"><span class=\"it\">Dried thyme, rosemary, onion powder, garlic powder, black pepper<\/span><span class=\"am\">Buy: 1 jar each · Used in: Pot roast, all meals<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p2-16-dried-dill\"><span class=\"tx\"><span class=\"it\">Dried dill<\/span><span class=\"am\">Buy: 1 jar · Used in: Salmon bowl<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p2-16-balsamic-vinegar\"><span class=\"tx\"><span class=\"it\">Balsamic vinegar<\/span><span class=\"am\">Buy: 1 bottle · Used in: Pot roast<\/span><\/span><\/label><\/li><li><label><input type=\"checkbox\" data-k=\"p2-16-nonstick-cooking-spray\"><span class=\"tx\"><span class=\"it\">Nonstick cooking spray<\/span><span class=\"am\">Buy: 1 can · Used in: Egg breakfasts<\/span><\/span><\/label><\/li><\/ul>\n<h2 id=\"p2-17\">Shopping Tips by Item<\/h2>\n<ul><li><b>Chicken thighs:<\/b> buy the family or value pack. Avoid packs labeled \"enhanced\" or \"solution added,\" which add sodium.<\/li><li><b>Beef roast:<\/b> pick whichever round roast is lowest per pound, and check the manager's special or markdown case.<\/li><li><b>Lamb:<\/b> the most expensive item. If the price is high, swap in a second bottom round roast.<\/li><li><b>Brown rice:<\/b> any brown rice works. Pearled barley is the best swap if your store is out.<\/li><li><b>Frozen pepper and onion blend:<\/b> pick one with red peppers for the most vitamin C.<\/li><li><b>Greek yogurt:<\/b> the 32 oz tub is cheaper per ounce than single cups. Buy plain only.<\/li><li><b>Whole wheat bread and protein powder:<\/b> compare sodium on the labels and pick the lower one.<\/li><li><b>Almond milk:<\/b> pick one that lists added vitamin E.<\/li><\/ul>\n<h2 id=\"p2-18\">Frozen Swaps (buy instead of fresh)<\/h2>\n<p>Any fresh produce on these lists can be swapped for frozen. Buy plain bags with no sauce, butter or salt. Store-brand frozen bags are usually the cheapest option per pound.<\/p>\n<table class=\"stack\"><thead><tr><th>Instead of fresh<\/th><th>Buy frozen<\/th><th>Tip<\/th><\/tr><\/thead><tbody><tr><td>Bell peppers<\/td><td>Pepper strips or pepper and onion blend<\/td><td>Same amount by weight<\/td><\/tr><tr><td>Baby carrots<\/td><td>Sliced or crinkle-cut carrots (16 oz)<\/td><td>Same amount by weight<\/td><\/tr><tr><td>Baby gold potatoes<\/td><td>Plain diced potatoes or potato chunks<\/td><td>Check the label for no oil or seasoning; add later in cooking<\/td><\/tr><tr><td>Sweet potatoes<\/td><td>Cubed sweet potatoes<\/td><td>Skips the peeling and cutting<\/td><\/tr><tr><td>Fresh spinach<\/td><td>Chopped spinach<\/td><td>Squeeze dry before adding to eggs<\/td><\/tr><tr><td>Fresh berries<\/td><td>Mixed berries, blueberries, raspberries or blackberries<\/td><td>Large bags are the best value<\/td><\/tr><tr><td>Bananas<\/td><td>Banana slices, or freeze your own ripe ones<\/td><td>Best for smoothies<\/td><\/tr><tr><td>Fresh garlic<\/td><td>Crushed garlic cubes<\/td><td>1 cube is about 1 clove<\/td><\/tr><tr><td>Lemons and limes<\/td><td>Bottled juice<\/td><td>1 tbsp is about half a lime<\/td><\/tr><\/tbody><\/table>\n<p><b>Extra frozen options to rotate in for variety:<\/b> chopped kale or collard greens, broccoli florets, Brussels sprouts, okra, shelled edamame, lima beans, black-eyed peas, mixed vegetables, butternut squash cubes, cauliflower florets, and cherries, mango or pineapple for breakfasts. The meal plan says where each one fits.<\/p>\n<h2 id=\"p2-19\">Ways to Keep the Bill Down<\/h2>\n<ul><li><b>Compare unit prices, not package prices.<\/b> The shelf tag shows price per pound or per ounce; use it to pick between sizes and brands.<\/li><li><b>Buy meat in family packs and freeze it.<\/b> Chicken thighs and roasts freeze well, so stock up when they are on sale.<\/li><li><b>Use frozen produce.<\/b> Frozen onions, peppers, corn, peas and berries cost less per serving and do not spoil before you use them.<\/li><li><b>Swap lamb for beef when lamb is pricey.<\/b> Bottom round keeps the macros close and usually costs much less.<\/li><li><b>Use store apps and digital coupons.<\/b> Kroger and Food Lion both run loyalty programs with weekly digital deals on store brands.<\/li><li><b>Shop the cheapest store for staples.<\/b> Buy pantry items, canned goods and dairy wherever the store brand is lowest for you, and buy meat wherever the weekly sale is best.<\/li><\/ul>", "heads": [{"id": "p2-1", "t": "How to Use This List", "l": 2}, {"id": "p2-2", "t": "Store Brands to Look For", "l": 2}, {"id": "p2-3", "t": "Crockpot Meals (5 portions each)", "l": 2}, {"id": "p2-4", "t": "Chicken Thigh Burrito Bowl with Brown Rice and Spinach", "l": 3}, {"id": "p2-5", "t": "Shredded Beef Pot Roast with Potatoes, Carrots and Broccoli", "l": 3}, {"id": "p2-6", "t": "Moroccan Shredded Lamb with Chickpeas, Sweet Potatoes and Spinach", "l": 3}, {"id": "p2-7", "t": "Lemon Garlic Chicken with White Beans, Tomatoes and Brown Rice", "l": 3}, {"id": "p2-8", "t": "Omega-3 Salmon Bowl (1 bowl, twice a week)", "l": 2}, {"id": "p2-9", "t": "Breakfasts (1 serving each)", "l": 2}, {"id": "p2-10", "t": "Protein Overnight Oats", "l": 3}, {"id": "p2-11", "t": "Egg White Scramble and Toast", "l": 3}, {"id": "p2-12", "t": "Greek Yogurt Parfait", "l": 3}, {"id": "p2-13", "t": "Green Protein Smoothie", "l": 3}, {"id": "p2-14", "t": "Veggie Omelet and Oatmeal", "l": 3}, {"id": "p2-15", "t": "Pre-Workout Snacks (1 snack each)", "l": 2}, {"id": "p2-16", "t": "Pantry Staples (buy once, lasts many cycles)", "l": 2}, {"id": "p2-17", "t": "Shopping Tips by Item", "l": 2}, {"id": "p2-18", "t": "Frozen Swaps (buy instead of fresh)", "l": 2}, {"id": "p2-19", "t": "Ways to Keep the Bill Down", "l": 2}]}, {"id": "p3", "kicker": "Plan 2 · Meal Plan", "title": "40-40-20 Road Meal Plan", "sub": "2,100 calories per day · 3 meals of about 700 calories · fast food, gas station and grocery picks · key nutrients · November 19, 2026", "kind": "plan", "html": "<h2 id=\"p3-1\">How to Use This Plan<\/h2>\n<p>Pick one breakfast and two lunch or dinner meals from the tables below, including the grocery store meals for the drive to or from home. Each meal lands near 700 calories with roughly 40% protein, 40% carbs and 20 to 27% fat. Any three meals make a full road day of about 2,000 to 2,150 calories and 195 to 215 g protein.<\/p>\n<ul><li><b>Numbers come from each chain's published nutrition or the product label.<\/b> Restaurants change recipes, so check the chain's app if a number looks off.<\/li><li><b>Fast food runs high in sodium and low in fiber.<\/b> These meals pick the lower-sodium, higher-fiber options where possible. Drink extra water on road days and get back to the home plan when you can.<\/li><li><b>No pork:<\/b> skip sausage, bacon, ham, Canadian bacon and Chipotle carnitas. Subway's Club and Italian subs contain ham.<\/li><li><b>Key nutrients still count on the road.<\/b> Eat salmon twice a week (Salmon rice bowl or salmon pouches) and carry the Road Nutrient Kit below to cover zinc, vitamins C and E, lycopene, omega-3s, selenium and folate.<\/li><li><b>The protein shake is the secret weapon.<\/b> Most fast food is low in protein for the calories. A Core Power or Premier Protein shake from any gas station fills the gap.<\/li><\/ul>\n<h2 id=\"p3-2\">Breakfasts<\/h2>\n<div class=\"scroll\"><table class=\"\"><thead><tr><th>Meal<\/th><th>What to get<\/th><th>Cal<\/th><th>Protein (g)<\/th><th>Carbs (g)<\/th><th>Fat (g)<\/th><th>Fiber (g)<\/th><\/tr><\/thead><tbody><tr><td>Chick-fil-A<\/td><td>Egg White Grill + 2 medium fruit cups + 1 Core Power 42g shake (gas station)<\/td><td class=n>670<\/td><td class=n>71<\/td><td class=n>69<\/td><td class=n>12<\/td><td class=n>5<\/td><\/tr><tr><td>McDonald's<\/td><td>Fruit and Maple Oatmeal + 1 Core Power 42g shake + 1 Oikos Pro yogurt cup (gas station; needs cooler or eat right away)<\/td><td class=n>680<\/td><td class=n>68<\/td><td class=n>78<\/td><td class=n>11<\/td><td class=n>4<\/td><\/tr><tr><td>Hotel or gas station oatmeal<\/td><td>2 packets Quaker Original instant oatmeal (hotel microwave or gas station hot water) + 1 banana + 1 Core Power 42g shake + 2 hard-boiled eggs<\/td><td class=n>690<\/td><td class=n>64<\/td><td class=n>74<\/td><td class=n>19<\/td><td class=n>9<\/td><\/tr><tr><td>Nothing needed<\/td><td>2 Premier Protein shakes + 2 bananas + 1 oz almonds (no cooler, fridge or microwave)<\/td><td class=n>695<\/td><td class=n>69<\/td><td class=n>68<\/td><td class=n>21<\/td><td class=n>12<\/td><\/tr><\/tbody><\/table><\/div>\n<h2 id=\"p3-3\">Lunches and Dinners<\/h2>\n<div class=\"scroll\"><table class=\"\"><thead><tr><th>Meal<\/th><th>What to get<\/th><th>Cal<\/th><th>Protein (g)<\/th><th>Carbs (g)<\/th><th>Fat (g)<\/th><th>Fiber (g)<\/th><\/tr><\/thead><tbody><tr><td>Chipotle<\/td><td>Bowl: double chicken, brown rice, black beans, fajita veggies, fresh tomato salsa, romaine. No cheese, sour cream, queso or guac.<\/td><td class=n>745<\/td><td class=n>77<\/td><td class=n>67<\/td><td class=n>22<\/td><td class=n>11<\/td><\/tr><tr><td>Chick-fil-A<\/td><td>Grilled Chicken Sandwich + 12 ct Grilled Nuggets + medium fruit cup. Use Zesty Buffalo sauce (25 calories) if you want one.<\/td><td class=n>660<\/td><td class=n>67<\/td><td class=n>62<\/td><td class=n>17<\/td><td class=n>5<\/td><\/tr><tr><td>Subway<\/td><td>6-inch Fresh Fit Grilled Chicken on multigrain with all veggies (make sure you get spinach, tomatoes and green peppers) + Grilled Chicken Protein Bowl + 1 banana (gas station). No cheese or mayo; mustard or vinegar is fine.<\/td><td class=n>605<\/td><td class=n>62<\/td><td class=n>76<\/td><td class=n>9<\/td><td class=n>10<\/td><\/tr><tr><td>McDonald's<\/td><td>2 plain Hamburgers + 1 Core Power 42g shake (gas station)<\/td><td class=n>730<\/td><td class=n>66<\/td><td class=n>70<\/td><td class=n>22<\/td><td class=n>2<\/td><\/tr><tr><td>Wendy's<\/td><td>Large Chili (no cheese or crackers) + 1 Core Power 42g shake + 1 banana (gas station)<\/td><td class=n>675<\/td><td class=n>65<\/td><td class=n>66<\/td><td class=n>19<\/td><td class=n>11<\/td><\/tr><tr><td>Gas station, cooler<\/td><td>1 Core Power 42g shake + 1 Oikos Pro yogurt cup + 2 bananas + 1 oz almonds<\/td><td class=n>735<\/td><td class=n>71<\/td><td class=n>74<\/td><td class=n>21<\/td><td class=n>10<\/td><\/tr><tr><td>Gas station, no cooler<\/td><td>2 Premier Protein shakes + 2 bananas + 1 oz almonds<\/td><td class=n>695<\/td><td class=n>69<\/td><td class=n>68<\/td><td class=n>21<\/td><td class=n>12<\/td><\/tr><\/tbody><\/table><\/div>\n<p class=\"lead\"><b>Notes on specific meals<\/b><\/p>\n<ul><li><b>Subway<\/b> runs low on fat. Asking for smashed avocado on the bowl adds a little healthy fat if you want it.<\/li><li><b>McDonald's lunch<\/b> is the lowest in fiber. Pair it with the oatmeal breakfast or the Wendy's or Chipotle meal on the same day.<\/li><li><b>Wendy's chili<\/b> numbers differ between published sources. Wendy's lists the large chili at 25 g protein; this plan uses the more conservative 22 g. A plain baked potato (270 calories, 61 g carbs, 7 g fiber, no fat) can replace the banana, but it adds about 165 calories and 34 g carbs.<\/li><\/ul>\n<h2 id=\"p3-4\">Sample Road Days<\/h2>\n<table class=\"stack\"><thead><tr><th>Day<\/th><th>Breakfast<\/th><th>Lunch<\/th><th>Dinner<\/th><th>Day total<\/th><\/tr><\/thead><tbody><tr><td class=n>1<\/td><td>Chick-fil-A<\/td><td>Chipotle<\/td><td>Wendy's<\/td><td>2,090 calories · 213 g protein · 202 g carbs · 52 g fat · 27 g fiber<\/td><\/tr><tr><td class=n>2<\/td><td>Hotel oatmeal<\/td><td>Chick-fil-A<\/td><td>Subway<\/td><td>1,955 calories · 193 g protein · 212 g carbs · 44 g fat · 24 g fiber<\/td><\/tr><tr><td class=n>3<\/td><td>McDonald's<\/td><td>Gas station, cooler<\/td><td>McDonald's<\/td><td>2,145 calories · 205 g protein · 222 g carbs · 54 g fat · 16 g fiber<\/td><\/tr><\/tbody><\/table>\n<p>Day 2 runs about 150 calories light. Add 1 oz almonds or a banana if you are hungry. Day 3 is the lowest in fiber, so use it only when options are limited.<\/p>\n<h2 id=\"p3-5\">Gas Station Made-to-Order Counters<\/h2>\n<p>Sheetz, Wawa, QuickTrip and RaceTrac all have made-to-order food, but nutrition depends on how you build it, and reliable numbers are hard to find. Use these rules and check the chain's app for numbers before you order.<\/p>\n<ul><li><b>Order grilled chicken<\/b>, not breaded or fried.<\/li><li><b>Choose a bowl, salad or wrap<\/b> over a hoagie or sub roll to keep carbs from overshooting.<\/li><li><b>Skip creamy sauces, cheese and bacon.<\/b> These push fat well past 20%.<\/li><li><b>Add carbs on the side:<\/b> a banana, fruit cup or oatmeal cup.<\/li><li><b>Add a shake<\/b> if the protein shown in the app is under 50 g for the meal.<\/li><\/ul>\n<h2 id=\"p3-6\">Grocery Store Ready-to-Eat Meals<\/h2>\n<p>For the drive to or from home, or near your destination, a grocery store beats fast food on sodium, fiber and cost. Walmart, Kroger, Food Lion, Publix and Whole Foods carry everything below; Aldi carries most of it, though hot rotisserie chicken is not available at every store. Nothing here needs cooking; the rice only needs a microwave.<\/p>\n<div class=\"scroll\"><table class=\"\"><thead><tr><th>Meal<\/th><th>What to get<\/th><th>Cal<\/th><th>Protein (g)<\/th><th>Carbs (g)<\/th><th>Fat (g)<\/th><th>Fiber (g)<\/th><\/tr><\/thead><tbody><tr><td>Rotisserie chicken bowl<\/td><td>6 oz rotisserie chicken breast meat, skin removed + 3/4 cup microwave brown rice + 1/2 cup no-salt-added black beans, rinsed + 1/4 avocado + 2 tbsp salsa + 2 cups bagged salad greens<\/td><td class=n>685<\/td><td class=n>67<\/td><td class=n>69<\/td><td class=n>16<\/td><td class=n>16<\/td><\/tr><tr><td>Salmon rice bowl (eat 2 a week)<\/td><td>4 pouches (2.6 oz) pink salmon in water + 1 cup microwave brown rice + 1/4 avocado + 2 cups bagged salad greens + 1/2 cup cherry tomatoes<\/td><td class=n>640<\/td><td class=n>68<\/td><td class=n>66<\/td><td class=n>14<\/td><td class=n>12<\/td><\/tr><tr><td>Yogurt bowl (breakfast)<\/td><td>2 Oikos Pro cups + 1 cup plain nonfat Greek yogurt + 1 cup blueberries + 1 banana + 1/2 oz almonds<\/td><td class=n>665<\/td><td class=n>69<\/td><td class=n>72<\/td><td class=n>15<\/td><td class=n>8<\/td><\/tr><tr><td>No-heat chicken plate<\/td><td>5 oz rotisserie chicken breast meat, skin removed + 1 cup shelled edamame (refrigerated, ready to eat) + 1 banana + 1 apple + 1/2 oz almonds<\/td><td class=n>705<\/td><td class=n>67<\/td><td class=n>69<\/td><td class=n>21<\/td><td class=n>17<\/td><\/tr><\/tbody><\/table><\/div>\n<p class=\"lead\"><b>Notes on grocery store meals<\/b><\/p>\n<ul><li><b>Rotisserie chicken:<\/b> one breast half, skin removed, is usually about 6 to 8 oz. Rotisserie chickens are often brined, so they carry more sodium than chicken cooked at home. Eat it within 2 hours or keep it in the cooler.<\/li><li><b>Microwave rice:<\/b> heat it in the hotel or store microwave. A single-serve cup is often close to 1 cup; check the label and adjust.<\/li><li><b>Salmon rice bowl:<\/b> 4 salmon pouches give about 1.2 g of the omega-3s EPA and DHA. If the store only has tuna, use 3 pouches of light tuna plus 1 Oikos Pro cup; light tuna has far less omega-3, so get salmon at the next stop.<\/li><li><b>Leftovers:<\/b> a whole rotisserie chicken covers 2 to 3 meals. Pull the breast meat, toss the skin, and keep it in the cooler for the next day.<\/li><\/ul>\n<p><b>Other ready-to-eat grocery items for swaps:<\/b> pre-cooked grilled chicken strips (check sodium), hard-boiled eggs, cottage cheese cups (check sodium), hummus cups, baby carrots, snap peas, cherry tomatoes, pre-cut fruit cups, clementines, grapes, whole wheat bread or tortillas, plain rice cakes and unsalted nuts.<\/p>\n<h2 id=\"p3-7\">Road Nutrient Kit<\/h2>\n<p>Pack these from home. They are shelf-stable except the fruit, and they cover the nutrients fast food tends to miss.<\/p>\n<table class=\"stack\"><thead><tr><th>Item<\/th><th>Amount<\/th><th>What it covers<\/th><th>How to use it<\/th><\/tr><\/thead><tbody><tr><td>Pink salmon pouches (2.6 oz)<\/td><td>8 per week<\/td><td>Omega-3 EPA and DHA, selenium, protein<\/td><td>Two Salmon rice bowls a week, or eat 4 pouches straight from the pouch with a rice cup<\/td><\/tr><tr><td>Unsalted sunflower seeds<\/td><td>1/2 to 1 oz a day, pre-portioned<\/td><td>Vitamin E, zinc, selenium, folate, L-arginine<\/td><td>Snack or sprinkle on a bowl; adds about 80 to 165 calories<\/td><\/tr><tr><td>Chia seeds<\/td><td>1 tbsp a day<\/td><td>Omega-3 ALA, fiber<\/td><td>Stir into an Oikos Pro or Greek yogurt cup<\/td><\/tr><tr><td>Oranges or clementines<\/td><td>1 a day<\/td><td>Vitamin C, folate<\/td><td>Swap for a banana in any meal; check carbs<\/td><\/tr><tr><td>Low-sodium tomato juice or vegetable juice, small cans<\/td><td>A few per trip<\/td><td>Lycopene, vitamin C<\/td><td>Drink with a meal; check the label for sodium and carbs<\/td><\/tr><\/tbody><\/table>\n<h2 id=\"p3-8\">How Road Meals Cover Key Nutrients<\/h2>\n<table class=\"stack\"><thead><tr><th>Nutrient<\/th><th>Best road sources<\/th><\/tr><\/thead><tbody><tr><td>
